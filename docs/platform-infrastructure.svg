<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Helvetica, Arial, sans-serif">
  <!-- Gennext platform — infrastructure overview (hand-drawn, simplified top-level view).
       Central country node manages many edge nodes; sensitive genomic data rests at the
       edge and is pulled only on request; file transfers are P2P-first with relay fallback. -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,3 L8,6 Z" fill="#555"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4E6B2C"/>
    </marker>
    <marker id="arrTeal" markerWidth="12" markerHeight="12" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#13768F"/>
    </marker>
    <marker id="arrLight" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa6bb"/>
    </marker>
    <style>
      .title  { font-size: 24px; font-weight: 700; fill: #1f1f1f; }
      .sub    { font-size: 13px; fill: #666; }
      .ztitle { font-size: 14px; font-weight: 700; }
      .zsub   { font-size: 11px; }
      .role   { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .comp   { font-size: 12px; fill: #333; }
      .qual   { font-size: 10px; fill: #5a5a5a; }
      .quali  { font-size: 10px; fill: #5a5a5a; font-style: italic; }
      .elab   { font-size: 10px; fill: #444; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
      .elabg  { font-size: 10px; fill: #3c5520; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
      .elabt  { font-size: 11px; font-weight: 700; fill: #13768F; paint-order: stroke; stroke: #fff; stroke-width: 3.5px; stroke-linejoin: round; }
      .leg    { font-size: 11px; fill: #444; }
    </style>
  </defs>

  <!-- ===== Title ===== -->
  <text class="title" x="620" y="40" text-anchor="middle">Gennext — Platform Infrastructure</text>
  <text class="sub" x="620" y="64" text-anchor="middle">A central country node manages many edge nodes · sensitive data stays at the edge · file transfers are peer-to-peer first, relay as fallback</text>

  <!-- ===== User ===== -->
  <ellipse cx="120" cy="201" rx="80" ry="50" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  <text class="role" x="120" y="193" text-anchor="middle">Clinician /</text>
  <text class="role" x="120" y="209" text-anchor="middle">researcher</text>
  <text class="qual" x="120" y="227" text-anchor="middle">web browser</text>

  <!-- ===== Central country node ===== -->
  <rect x="250" y="120" width="420" height="448" rx="18" fill="#F4F8FC" stroke="#9DB7D6" stroke-width="2"/>
  <text class="ztitle" x="460" y="143" text-anchor="middle" fill="#2F5496">Central country node</text>
  <text class="zsub" x="460" y="159" text-anchor="middle" fill="#6b86b0">gennext + argo</text>

  <!-- internal control-chain connectors -->
  <line x1="460" y1="230" x2="460" y2="246" stroke="#9aa6bb" stroke-width="1.2" marker-end="url(#arrLight)"/>
  <line x1="460" y1="324" x2="460" y2="340" stroke="#9aa6bb" stroke-width="1.2" marker-end="url(#arrLight)"/>
  <line x1="460" y1="398" x2="460" y2="414" stroke="#9aa6bb" stroke-width="1.2" marker-end="url(#arrLight)"/>
  <line x1="460" y1="472" x2="460" y2="488" stroke="#9aa6bb" stroke-width="1.2" marker-end="url(#arrLight)"/>

  <!-- Web UI -->
  <rect x="300" y="172" width="320" height="58" rx="10" fill="#DCE6F2" stroke="#7FA0C8" stroke-width="1.2"/>
  <text class="role" x="460" y="197" text-anchor="middle">Web UI</text>
  <text class="comp" x="460" y="215" text-anchor="middle">Frontend <tspan class="qual">(React)</tspan></text>

  <!-- Central API -->
  <rect x="300" y="246" width="320" height="78" rx="10" fill="#DCE6F2" stroke="#7FA0C8" stroke-width="1.2"/>
  <text class="role" x="460" y="270" text-anchor="middle">Central API</text>
  <text class="comp" x="460" y="288" text-anchor="middle">Backend <tspan class="qual">(Rust)</tspan></text>
  <text class="qual" x="460" y="305" text-anchor="middle">+ PostgreSQL — users, runs, samples</text>

  <!-- Orchestrator -->
  <rect x="300" y="340" width="320" height="58" rx="10" fill="#E2EFDA" stroke="#9BBF7E" stroke-width="1.2"/>
  <text class="role" x="460" y="365" text-anchor="middle">Batch orchestrator</text>
  <text class="comp" x="460" y="383" text-anchor="middle">Orchestrator <tspan class="qual">(Go)</tspan></text>

  <!-- Argo -->
  <rect x="300" y="414" width="320" height="58" rx="10" fill="#E2EFDA" stroke="#9BBF7E" stroke-width="1.2"/>
  <text class="role" x="460" y="439" text-anchor="middle">Workflow engine</text>
  <text class="comp" x="460" y="457" text-anchor="middle">Argo Workflows + Events</text>

  <!-- Relay -->
  <rect x="300" y="488" width="320" height="58" rx="10" fill="#DAEEF3" stroke="#84B8C8" stroke-width="1.2"/>
  <text class="role" x="460" y="513" text-anchor="middle">File-transfer relay</text>
  <text class="comp" x="460" y="531" text-anchor="middle">libp2p circuit relay</text>

  <!-- ===== Edge node (stacked to imply × N) ===== -->
  <rect x="836" y="136" width="380" height="448" rx="18" fill="#FBF4E4" stroke="#D8C690" stroke-width="1.5"/>
  <rect x="828" y="128" width="380" height="448" rx="18" fill="#FCF6E8" stroke="#D2BE7E" stroke-width="1.5"/>
  <rect x="820" y="120" width="380" height="448" rx="18" fill="#FFFBF0" stroke="#C9A24B" stroke-width="2"/>
  <text class="ztitle" x="1010" y="143" text-anchor="middle" fill="#7A5A12">Edge node</text>
  <text class="zsub" x="1010" y="159" text-anchor="middle" fill="#9a7a30">one per lab / tenant site  (× N)</text>

  <!-- Edge API -->
  <rect x="850" y="178" width="320" height="58" rx="10" fill="#FFF2CC" stroke="#D9BF6F" stroke-width="1.2"/>
  <text class="role" x="1010" y="203" text-anchor="middle">Edge API</text>
  <text class="comp" x="1010" y="221" text-anchor="middle">api-edge <tspan class="qual">(Rust)</tspan></text>

  <!-- Analysis pipelines -->
  <rect x="850" y="246" width="320" height="64" rx="10" fill="#FFF2CC" stroke="#D9BF6F" stroke-width="1.2"/>
  <text class="role" x="1010" y="271" text-anchor="middle">Analysis pipelines</text>
  <text class="comp" x="1010" y="289" text-anchor="middle">Argo pods <tspan class="qual">— somatic / germline</tspan></text>

  <!-- FT peer -->
  <rect x="850" y="322" width="320" height="58" rx="10" fill="#DAEEF3" stroke="#84B8C8" stroke-width="1.2"/>
  <text class="role" x="1010" y="347" text-anchor="middle">File-transfer peer</text>
  <text class="comp" x="1010" y="365" text-anchor="middle">ft-edge <tspan class="qual">(libp2p)</tspan></text>

  <!-- Local genomic data (cylinder) -->
  <path d="M900,404 v76 a110,12 0 0 0 220,0 v-76" fill="#D9D2E9" stroke="#B0A4CF" stroke-width="1.5"/>
  <ellipse cx="1010" cy="404" rx="110" ry="12" fill="#CFC6E3" stroke="#B0A4CF" stroke-width="1.5"/>
  <text class="role" x="1010" y="432" text-anchor="middle">Local genomic data</text>
  <text class="comp" x="1010" y="450" text-anchor="middle">BAM · VCF · CNV</text>
  <text class="quali" x="1010" y="467" text-anchor="middle">sensitive — pulled only on request</text>

  <!-- ===== Cross-boundary flows ===== -->
  <!-- user -> Web UI -->
  <line x1="200" y1="201" x2="300" y2="201" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text class="elab" x="250" y="194" text-anchor="middle">HTTPS</text>

  <!-- Backend <-> Edge API (on request) -->
  <line x1="620" y1="275" x2="850" y2="200" stroke="#555" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)" marker-start="url(#arrStart)"/>
  <text class="elab" x="735" y="231" text-anchor="middle">variant query · auth (on request)</text>

  <!-- Argo -> Analysis pods (schedule, data stays at edge) -->
  <line x1="620" y1="443" x2="850" y2="280" stroke="#4E6B2C" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <text class="elabg" x="738" y="356" text-anchor="middle">schedule analysis pods</text>
  <text class="elabg" x="738" y="369" text-anchor="middle">(data stays at edge)</text>

  <!-- Relay <-> FT peer (fallback) -->
  <line x1="620" y1="517" x2="850" y2="352" stroke="#13768F" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrTeal)" marker-start="url(#arrStart)"/>
  <text class="elab" x="735" y="447" text-anchor="middle">relay fallback (circuit relay)</text>

  <!-- P2P direct: browser <-> edge ft peer, bypassing central -->
  <path d="M120,251 C 150,720 700,725 850,366" fill="none" stroke="#13768F" stroke-width="2.4" marker-end="url(#arrTeal)"/>
  <text class="elabt" x="470" y="716" text-anchor="middle">peer-to-peer file stream — browser ↔ edge (direct)</text>

  <!-- External annotation -->
  <line x1="460" y1="568" x2="460" y2="598" stroke="#555" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text class="elab" x="500" y="585" text-anchor="start">annotation lookups</text>
  <rect x="320" y="600" width="280" height="44" rx="8" fill="#FFFDE7" stroke="#C9A24B" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text class="role" x="460" y="619" text-anchor="middle">External annotation</text>
  <text class="qual" x="460" y="635" text-anchor="middle">OncoKB · Varsome · COSMIC · …</text>

  <!-- ===== Legend (line styles) ===== -->
  <text class="ztitle" x="60" y="612" fill="#444" font-size="11">Connections</text>
  <line x1="60" y1="630" x2="104" y2="630" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text class="leg" x="112" y="634">request / control</text>
  <line x1="60" y1="654" x2="104" y2="654" stroke="#555" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text class="leg" x="112" y="658">on request / fallback</text>
  <line x1="60" y1="678" x2="104" y2="678" stroke="#13768F" stroke-width="2.4" marker-end="url(#arrTeal)"/>
  <text class="leg" x="112" y="682">P2P direct (browser ↔ edge)</text>
</svg>
