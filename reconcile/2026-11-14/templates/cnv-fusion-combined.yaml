apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cnv-fusion-combined
  namespace: argo
  labels:
    pipeline: cnv-fusion-combined
  annotations:
    workflows.argoproj.io/description: Combined pipeline that runs CNV calling and fusion detection in parallel as child workflows. Orchestrates cnv-calling and fusion-detection-ffpe WorkflowTemplates using the workflow-of-workflows pattern.
spec:
  arguments:
    parameters:
    - name: sample-id
    - name: sample-base
    - name: output-base
    - name: ref-base
      value: /runspace/gennext/data/ref/hg38
    - name: node-selector
      value: acurare-01
  entrypoint: combined-pipeline
  serviceAccountName: gennext
  templates:
  - dag:
      tasks:
      - name: cnv-calling
        template: submit-cnv-calling
      - name: fusion-detection
        template: submit-fusion-detection
    name: combined-pipeline
  - name: submit-cnv-calling
    resource:
      action: create
      failureCondition: status.phase in (Failed, Error)
      manifest: |
        apiVersion: argoproj.io/v1alpha1
        kind: Workflow
        metadata:
          generateName: cnv-calling-child-
          namespace: argo
        spec:
          workflowTemplateRef:
            name: cnv-calling
          arguments:
            parameters:
              - name: sample-id
                value: "{{workflow.parameters.sample-id}}"
              - name: sample-base
                value: "{{workflow.parameters.sample-base}}"
              - name: output-base
                value: "{{workflow.parameters.output-base}}"
              - name: ref-base
                value: "{{workflow.parameters.ref-base}}"
              - name: node-selector
                value: "{{workflow.parameters.node-selector}}"
      successCondition: status.phase == Succeeded
  - name: submit-fusion-detection
    resource:
      action: create
      failureCondition: status.phase in (Failed, Error)
      manifest: |
        apiVersion: argoproj.io/v1alpha1
        kind: Workflow
        metadata:
          generateName: fusion-detection-child-
          namespace: argo
        spec:
          workflowTemplateRef:
            name: fusion-detection-ffpe
          arguments:
            parameters:
              - name: sample-id
                value: "{{workflow.parameters.sample-id}}"
              - name: sample-base
                value: "{{workflow.parameters.sample-base}}"
              - name: output-base
                value: "{{workflow.parameters.output-base}}"
              - name: ref-base
                value: "{{workflow.parameters.ref-base}}"
              - name: node-selector
                value: "{{workflow.parameters.node-selector}}"
      successCondition: status.phase == Succeeded
