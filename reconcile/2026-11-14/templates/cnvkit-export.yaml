apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cnvkit-export
  namespace: argo
  labels:
    pipeline: cnv-calling
    tool: cnvkit
spec:
  templates:
  - container:
      args:
      - |
        set -euo pipefail

        SAMPLE_ID="{{inputs.parameters.sample-id}}"
        BAM_STEM="${SAMPLE_ID}_recal"

        echo "=== CNVkit Export VCF ==="
        echo "  Sample: ${SAMPLE_ID}"
        echo "  Input:  /mnt/output/${BAM_STEM}.call.cns"
        echo "  Output: /mnt/output/${SAMPLE_ID}.cnv.vcf"

        cnvkit.py export vcf \
            "/mnt/output/${BAM_STEM}.call.cns" \
            -i "$SAMPLE_ID" \
            -o "/mnt/output/${SAMPLE_ID}.cnv.vcf"

        echo "=== Export complete ==="
        ls -la /mnt/output/${SAMPLE_ID}.cnv.vcf
      command:
      - bash
      - -euo
      - pipefail
      - -c
      image: quay.io/biocontainers/cnvkit:0.9.12--pyhdfd78af_1
      resources:
        requests:
          cpu: '1'
          memory: 2Gi
      volumeMounts:
      - mountPath: /mnt/output
        name: output-data
    inputs:
      parameters:
      - name: sample-id
    name: run-cnvkit-export
