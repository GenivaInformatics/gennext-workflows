apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: change-sample-state-template
spec:
  templates:
    - name: change-sample-state
      inputs:
        parameters:
          - name: run-id
          - name: sample-uuid
          - name: sample-state

      script:
        name: "change-sample-state"
        image: blairy/requests
        command: [python]
        source: |
          import os
          token = os.environ["GENNEXT_CLUSTER_TOKEN"]
          addr = "gennext-backend.gennext-dev.svc.cluster.local:3030"
          url = f"http://{addr}/api/v0/runs/{{inputs.parameters.run-id}}/samples/{{inputs.parameters.sample-uuid}}/state"
          import requests
          res = requests.post(url, json={"state": "{{inputs.parameters.sample-state}}", "token": token })
          if res.status_code != 200:
            raise Exception(res.text)
        env:
          - name: GENNEXT_CLUSTER_TOKEN
            valueFrom:
              secretKeyRef:
                name: gennext-cluster-secrets
                key: gennext_cluster_token
