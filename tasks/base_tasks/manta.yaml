apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: manta-template
  namespace: argo
spec:
  entrypoint: manta
  templates:
    - name: manta
      inputs:
        parameters:
          - name: sample-id
          - name: normal-bam
            value: "."
          - name: tumor-bam
            value: "."
          - name: regions-file
            value: "."
          - name: ref-genome-f
          - name: output-dir
          - name: scratch-dir
          - name: thread-count
            value: "10"
          # placeholder: on failure write empty VCFs marked ##MantaStatus=FAILED and succeed
          # fail: write the same placeholders, then exit non-zero
          - name: on-failure
            value: "placeholder"
      outputs:
        parameters:
          - name: output-dir
            value: "{{inputs.parameters.output-dir}}"
          - name: output-tumor-vcf-f
            value: "{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}_tumorSV.vcf.gz"
          - name: output-diploid-vcf-f
            value: "{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}_diploidSV.vcf.gz"
          # ok | ok_clipstats | failed (details in stats/<sample>_manta_status.json)
          - name: manta-status
            valueFrom:
              path: /tmp/manta_status
              default: "unknown"
      volumes:
        - name: normal-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['normal-bam'])}}"
            type: Directory
        - name: tumor-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['tumor-bam'])}}"
            type: Directory
        - name: ref-genome-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['ref-genome-f'])}}"
            type: Directory
        - name: regions-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['regions-file'])}}"
            type: Directory
        - name: output-dir
          hostPath:
            path: "{{inputs.parameters.output-dir}}"
            type: DirectoryOrCreate
        - name: scratch-dir
          hostPath:
            path: "{{inputs.parameters.scratch-dir}}"
            type: DirectoryOrCreate
      script:
        name: "manta"
        image: quay.io/biocontainers/manta:1.6.0--h9ee0642_2
        command: [bash]
        volumeMounts:
          - name: normal-bam
            mountPath: "/mnt/input/normal_bam/"
          - name: tumor-bam
            mountPath: "/mnt/input/tumor_bam/"
          - name: ref-genome-f
            mountPath: "/ref/genome/"
          - name: regions-file
            mountPath: "/mnt/ref/regions/"
          - name: output-dir
            mountPath: "/mnt/output/"
          - name: scratch-dir
            mountPath: "/mnt/scratch/"
        source: |
          set -euo pipefail

          # Manta tumor-only/paired SV calling.
          #
          # Status is always recorded in /mnt/output/stats/${sampleId}_manta_status.json
          # and in the `manta-status` output parameter:
          #   ok            Manta ran with its own alignment stats.
          #   ok_clipstats  Manta's alignment-stats step found too few unclipped
          #                 read pairs (UMI kits mask the inline UMI to N, so every
          #                 read is soft-clipped). Stats were estimated on a 10%
          #                 subsample with soft clips stripped and passed to Manta
          #                 as --existingAlignStatsFile; SV calling still uses the
          #                 real BAM.
          #   failed        Manta did not complete. With on-failure=placeholder the
          #                 step writes empty VCFs (marked ##MantaStatus=FAILED) so
          #                 the downstream SV chain can still run; with on-failure=fail
          #                 the step exits non-zero after writing them.

          MANTA_HOME=/usr/local/share/manta-1.6.0-2
          SAMTOOLS=$MANTA_HOME/libexec/samtools

          sampleId="{{inputs.parameters.sample-id}}"
          normalBam="{{=sprig.osBase(inputs.parameters['normal-bam'])}}"
          tumorBam="{{=sprig.osBase(inputs.parameters['tumor-bam'])}}"
          regionsFile="{{=sprig.osBase(inputs.parameters['regions-file'])}}"
          refGenomeFile="{{=sprig.osBase(inputs.parameters['ref-genome-f'])}}"
          onFailure="{{inputs.parameters.on-failure}}"
          threads="{{inputs.parameters.thread-count}}"
          REF=/ref/genome/$refGenomeFile

          options=""
          statsBams=()
          # sprig.osBase returns "." if the path is empty
          # mind the whitespace before '--'
          if [ ! "." = "$normalBam" ]; then options+=" --normalBam=/mnt/input/normal_bam/$normalBam"; statsBams+=("/mnt/input/normal_bam/$normalBam"); fi
          if [ ! "." = "$tumorBam" ]; then options+=" --tumorBam=/mnt/input/tumor_bam/$tumorBam"; statsBams+=("/mnt/input/tumor_bam/$tumorBam"); fi
          if [ ! "." = "$regionsFile" ]; then options+=" --exome --callRegions=/mnt/ref/regions/$regionsFile.gz"; fi

          echo "Sample ID: $sampleId"
          echo "Manta options: $options"
          echo "On failure: $onFailure"

          mkdir -p /mnt/output/stats
          MANTA_TMP_DIR=$(mktemp -p /mnt/scratch/ -d manta.XXXXXXXX)
          trap 'rm -rf "$MANTA_TMP_DIR"' EXIT
          LOG=$MANTA_TMP_DIR/manta.log

          run_manta() {  # $1 = run dir, rest = extra configManta.py args
            local runDir=$1; shift
            configManta.py --referenceFasta=$REF $options "$@" --runDir=$runDir \
              && $runDir/runWorkflow.py -m local -j $threads
          }

          # Alignment stats from a subsample with soft clips removed (POS and TLEN
          # are unchanged; only clipped bases are dropped from CIGAR/SEQ/QUAL).
          clip_stripped_stats() {
            local out=$1 i=0
            for bam in ${statsBams[@]+"${statsBams[@]}"}; do
              local sb=$MANTA_TMP_DIR/clipstats.$i.bam
              local region=()
              if [ ! "." = "$regionsFile" ] && [ -s "/mnt/ref/regions/$regionsFile" ]; then region=(-L "/mnt/ref/regions/$regionsFile"); fi
              $SAMTOOLS view -h -f 0x2 -F 0xF0C -s 7.10 ${region[@]+"${region[@]}"} "$bam" \
                | awk 'BEGIN { OFS = "\t" }
                       /^@/ { print; next }
                       {
                         c = $6
                         if (match(c, /^[0-9]+S/)) {
                           n = substr(c, 1, RLENGTH - 1) + 0; c = substr(c, RLENGTH + 1)
                           $10 = substr($10, n + 1); if ($11 != "*") $11 = substr($11, n + 1)
                         }
                         if (match(c, /[0-9]+S$/)) {
                           n = substr(c, RSTART, RLENGTH - 1) + 0; c = substr(c, 1, RSTART - 1)
                           $10 = substr($10, 1, length($10) - n); if ($11 != "*") $11 = substr($11, 1, length($11) - n)
                         }
                         $6 = c; print
                       }' \
                | $SAMTOOLS view -b -o "$sb" - || return 1
              $SAMTOOLS index "$sb" || return 1
              $MANTA_HOME/libexec/GetAlignmentStats --ref $REF --output-file $MANTA_TMP_DIR/clipstats.$i.xml --align-file "$sb" || return 1
              i=$((i + 1))
            done
            local merge=($MANTA_HOME/libexec/MergeAlignmentStats --output-file "$out")
            for ((j = 0; j < i; j++)); do merge+=(--align-stats-file $MANTA_TMP_DIR/clipstats.$j.xml); done
            "${merge[@]}"
          }

          write_status() {  # $1 = status, $2 = reason
            printf '{"sample_id": "%s", "status": "%s", "reason": "%s", "manta_version": "1.6.0"}\n' \
              "$sampleId" "$1" "$2" > "/mnt/output/stats/${sampleId}_manta_status.json"
            echo "$1" > /tmp/manta_status
          }

          create_empty_vcf() {
            local output_file="$1" reason="$2"
            {
              echo "##fileformat=VCFv4.2"
              echo "##source=Manta_empty_placeholder"
              echo "##MantaStatus=FAILED"
              echo "##MantaFailureReason=$reason"
              echo "##reference=file://$REF"
              echo "##SAMPLE=<ID=$sampleId>"
              echo "##contig=<ID=chr1>"
              echo "##INFO=<ID=SVTYPE,Number=1,Type=String,Description=\"Type of structural variant\">"
              echo "##FORMAT=<ID=GT,Number=1,Type=String,Description=\"Genotype\">"
              echo -e "#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\t$sampleId"
            } | $MANTA_HOME/libexec/bgzip > "$output_file"
          }

          status=failed
          reason=""
          runDir=$MANTA_TMP_DIR/run
          if run_manta $runDir 2>&1 | tee -a "$LOG"; then
            status=ok
          elif grep -rqs "Too few high-confidence read pairs" "$LOG" "$runDir/workspace/pyflow.data/logs"; then
            echo "Manta could not estimate alignment stats; retrying with clip-stripped stats"
            if clip_stripped_stats $MANTA_TMP_DIR/clipstats.xml 2>&1 | tee -a "$LOG" \
               && runDir=$MANTA_TMP_DIR/run_clipstats \
               && run_manta $runDir --existingAlignStatsFile=$MANTA_TMP_DIR/clipstats.xml 2>&1 | tee -a "$LOG"; then
              status=ok_clipstats
            else
              reason="alignment stats: too few high-confidence read pairs; clip-stripped retry failed"
            fi
          else
            reason=$(grep -hE "ERROR|Error|error" "$LOG" | grep -v "^\s*$" | tail -1 | tr -d '"\\' | cut -c1-300)
            reason=${reason:-"unknown (see step log)"}
          fi

          if [ "$status" != failed ]; then
            for f in $runDir/results/variants/*; do
              mv "$f" "$(dirname $f)/${sampleId}_$(basename $f)"
            done
            for f in $runDir/results/stats/*; do
              mv "$f" "$(dirname $f)/${sampleId}_$(basename $f)"
            done
            cp $runDir/results/variants/* /mnt/output/
            cp $runDir/results/stats/* /mnt/output/stats/
            write_status "$status" ""
            echo "Manta finished: $status"
            exit 0
          fi

          echo "MANTA FAILED: $reason"
          create_empty_vcf "/mnt/output/${sampleId}_tumorSV.vcf.gz" "$reason"
          create_empty_vcf "/mnt/output/${sampleId}_diploidSV.vcf.gz" "$reason"
          echo "Manta run failed - empty output files created: $reason" > "/mnt/output/stats/${sampleId}_manta_failed.txt"
          write_status failed "$reason"
          if [ "$onFailure" = "fail" ]; then exit 1; fi
    - name: manta-with-nodeSelector
      nodeSelector:
        kubernetes.io/hostname: "{{inputs.parameters.node-name}}"
      inputs:
        parameters:
          - name: sample-id
          - name: normal-bam
            value: "."
          - name: tumor-bam
            value: "."
          - name: regions-file
            value: "."
          - name: ref-genome-f
          - name: output-dir
          - name: scratch-dir
          - name: thread-count
            value: "10"
          # placeholder: on failure write empty VCFs marked ##MantaStatus=FAILED and succeed
          # fail: write the same placeholders, then exit non-zero
          - name: on-failure
            value: "placeholder"
          - name: node-name
      outputs:
        parameters:
          - name: output-dir
            value: "{{inputs.parameters.output-dir}}"
          - name: output-tumor-vcf-f
            value: "{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}_tumorSV.vcf.gz"
          - name: output-diploid-vcf-f
            value: "{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}_diploidSV.vcf.gz"
          # ok | ok_clipstats | failed (details in stats/<sample>_manta_status.json)
          - name: manta-status
            valueFrom:
              path: /tmp/manta_status
              default: "unknown"
      volumes:
        - name: normal-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['normal-bam'])}}"
            type: Directory
        - name: tumor-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['tumor-bam'])}}"
            type: Directory
        - name: ref-genome-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['ref-genome-f'])}}"
            type: Directory
        - name: regions-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['regions-file'])}}"
            type: Directory
        - name: output-dir
          hostPath:
            path: "{{inputs.parameters.output-dir}}"
            type: DirectoryOrCreate
        - name: scratch-dir
          hostPath:
            path: "{{inputs.parameters.scratch-dir}}"
            type: DirectoryOrCreate
      script:
