apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: manta-template
  namespace: argo
spec:
  entrypoint: manta
  templates:
    - name: manta
      inputs:
        parameters:
          - name: sample-id
          - name: normal-bam
            value: "."
          - name: tumor-bam
            value: "."
          - name: regions-file
            value: "."
          - name: ref-genome-f
          - name: output-dir
          - name: scratch-dir
          - name: thread-count
            value: "10"
          # placeholder: on failure write empty VCFs marked ##MantaStatus=FAILED and succeed
          # fail: write the same placeholders, then exit non-zero
          - name: on-failure
            value: "placeholder"
      outputs:
        parameters:
          - name: output-dir
            value: "{{inputs.parameters.output-dir}}"
          - name: output-tumor-vcf-f
            value: "{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}_tumorSV.vcf.gz"
          - name: output-diploid-vcf-f
            value: "{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}_diploidSV.vcf.gz"
          # ok | ok_clipstats | failed (details in stats/<sample>_manta_status.json)
          - name: manta-status
            valueFrom:
              path: /tmp/manta_status
              default: "unknown"
      volumes:
        - name: normal-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['normal-bam'])}}"
            type: Directory
        - name: tumor-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['tumor-bam'])}}"
            type: Directory
        - name: ref-genome-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['ref-genome-f'])}}"
            type: Directory
        - name: regions-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['regions-file'])}}"
            type: Directory
        - name: output-dir
          hostPath:
            path: "{{inputs.parameters.output-dir}}"
            type: DirectoryOrCreate
        - name: scratch-dir
          hostPath:
            path: "{{inputs.parameters.scratch-dir}}"
            type: DirectoryOrCreate
      script:
        name: "manta"
        image: quay.io/biocontainers/manta:1.6.0--h9ee0642_2@sha256:021aabe5f7314e02e60722c559f6f3c4bb6b1118c2e2ec0eb3095a8c7e431f26
        command: [bash]
        volumeMounts:
          - name: normal-bam
            mountPath: "/mnt/input/normal_bam/"
          - name: tumor-bam
            mountPath: "/mnt/input/tumor_bam/"
          - name: ref-genome-f
            mountPath: "/ref/genome/"
          - name: regions-file
            mountPath: "/mnt/ref/regions/"
          - name: output-dir
            mountPath: "/mnt/output/"
          - name: scratch-dir
            mountPath: "/mnt/scratch/"
        source: |
          set -euo pipefail

          # Manta tumor-only/paired SV calling.
          #
          # Status is always recorded in /mnt/output/stats/${sampleId}_manta_status.json
          # and in the `manta-status` output parameter:
          #   ok            Manta ran with its own alignment stats.
          #   ok_clipstats  Manta could not estimate alignment stats from the BAM
          #                 itself (UMI kits mask the inline UMI to N, so every read is
          #                 soft-clipped and Manta finds no high-confidence pairs) and
          #                 used fallback stats instead. The fallback is estimated here
          #                 from properly paired reads with soft clips stripped (a 10%
          #                 subsample, or all reads if that is too few) and passed as
          #                 --existingAlignStatsFile. In Manta 1.6.0 that file is only
          #                 --default-stats-file: Manta's own stats step always runs and
          #                 uses the file for read groups it cannot estimate. SV calling
          #                 always uses the real BAM.
          #   failed        Manta did not complete, or an input BAM is missing, empty,
          #                 unindexed or unreadable (checked before anything runs). With
          #                 on-failure=placeholder the step writes empty VCFs (marked
          #                 ##MantaStatus=FAILED) so the downstream SV chain can still
          #                 run; with on-failure=fail the step exits non-zero after
          #                 writing them.
          # The status JSON also records fallback_stats_supplied (true/false) and
          # fallback_stats_used (true/false, or null when not known: not supplied counts
          # as false; supplied but the run failed, or Manta's task log is missing, is null).

          MANTA_HOME=/usr/local/share/manta-1.6.0-2
          SAMTOOLS=$MANTA_HOME/libexec/samtools

          sampleId="{{inputs.parameters.sample-id}}"
          normalBam="{{=sprig.osBase(inputs.parameters['normal-bam'])}}"
          tumorBam="{{=sprig.osBase(inputs.parameters['tumor-bam'])}}"
          regionsFile="{{=sprig.osBase(inputs.parameters['regions-file'])}}"
          refGenomeFile="{{=sprig.osBase(inputs.parameters['ref-genome-f'])}}"
          onFailure="{{inputs.parameters.on-failure}}"
          threads="{{inputs.parameters.thread-count}}"
          REF=/ref/genome/$refGenomeFile

          options=""
          statsBams=()
          # sprig.osBase returns "." if the path is empty
          # mind the whitespace before '--'
          # Fallback stats: Manta applies the FIRST entry of the fallback file to every
          # read group it cannot estimate, so the tumor goes first. In a run with
          # both a tumor and a normal BAM where both fail, the normal would also get
          # the tumor's distribution. Live callers pass one BAM: a tumor (somatic) or
          # a normal (germline mode: wes, wgs, tps, germline-wgs-gpu); none passes both.
          if [ ! "." = "$tumorBam" ]; then statsBams+=("/mnt/input/tumor_bam/$tumorBam"); fi
          if [ ! "." = "$normalBam" ]; then options+=" --normalBam=/mnt/input/normal_bam/$normalBam"; statsBams+=("/mnt/input/normal_bam/$normalBam"); fi
          if [ ! "." = "$tumorBam" ]; then options+=" --tumorBam=/mnt/input/tumor_bam/$tumorBam"; fi
          if [ ! "." = "$regionsFile" ]; then options+=" --exome --callRegions=/mnt/ref/regions/$regionsFile.gz"; fi

          echo "Sample ID: $sampleId"
          echo "Manta options: $options"
          echo "On failure: $onFailure"
          case "$onFailure" in
            placeholder|fail) ;;
            *) echo "ERROR: on-failure must be placeholder or fail (got: $onFailure)"; exit 1 ;;
          esac

          mkdir -p /mnt/output/stats
          MANTA_TMP_DIR=$(mktemp -p /mnt/scratch/ -d manta.XXXXXXXX)
          trap 'rm -rf "$MANTA_TMP_DIR"' EXIT  # failure logs are copied to stats/ before exit
          LOG=$MANTA_TMP_DIR/manta.log

          run_manta() {  # $1 = run dir, rest = extra configManta.py args
            local runDir=$1; shift
            configManta.py --referenceFasta=$REF $options "$@" --runDir=$runDir \
              && $runDir/runWorkflow.py -m local -j $threads
          }

          # Alignment stats from properly paired reads with soft clips removed (POS
          # and TLEN are unchanged; only clipped bases are dropped from CIGAR/SEQ/QUAL).
          # A 10% subsample first; all reads if that has too few pairs (small panels).
          clip_stripped_stats() {
            local out=$1 i=0 frac ok
            for bam in ${statsBams[@]+"${statsBams[@]}"}; do
              ok=0
              for frac in 7.10 all; do
                if clip_stripped_stats_one "$bam" "$frac" "$i"; then ok=1; break; fi
                echo "Clip-stripped stats on $(basename $bam) failed with subsample '$frac'"
              done
              [ "$ok" = 1 ] || return 1
              i=$((i + 1))
            done
            local merge=($MANTA_HOME/libexec/MergeAlignmentStats --output-file "$out")
            for ((j = 0; j < i; j++)); do merge+=(--align-stats-file $MANTA_TMP_DIR/clipstats.$j.xml); done
            "${merge[@]}"
          }

          clip_stripped_stats_one() {  # $1 = bam, $2 = samtools -s value or "all", $3 = index
            local bam=$1 i=$3 sb=$MANTA_TMP_DIR/clipstats.$3.bam
            local region=() sub=()
            if [ ! "." = "$regionsFile" ] && [ -s "/mnt/ref/regions/$regionsFile" ]; then region=(-L "/mnt/ref/regions/$regionsFile"); fi
            if [ "$2" != all ]; then sub=(-s "$2"); fi
            $SAMTOOLS view -h -f 0x2 -F 0xF0C ${sub[@]+"${sub[@]}"} ${region[@]+"${region[@]}"} "$bam" \
              | awk -F'\t' -v OFS='\t' '
                     /^@/ { print; next }
                     {
                       c = $6
                       if (match(c, /^[0-9]+S/)) {
                         n = substr(c, 1, RLENGTH - 1) + 0; c = substr(c, RLENGTH + 1)
                         $10 = substr($10, n + 1); if ($11 != "*") $11 = substr($11, n + 1)
                       }
                       if (match(c, /[0-9]+S$/)) {
                         n = substr(c, RSTART, RLENGTH - 1) + 0; c = substr(c, 1, RSTART - 1)
                         $10 = substr($10, 1, length($10) - n); if ($11 != "*") $11 = substr($11, 1, length($11) - n)
                       }
                       $6 = c; print
                     }' \
              | $SAMTOOLS view -b -o "$sb" - || return 1
            $SAMTOOLS index "$sb" || return 1
            $MANTA_HOME/libexec/GetAlignmentStats --ref $REF --output-file $MANTA_TMP_DIR/clipstats.$i.xml --align-file "$sb" || return 1
          }

          json_safe() {  # drop quotes, backslashes and control characters (tabs, newlines)
            printf '%s' "$1" | tr -d '"\\\000-\037'
          }

          fallbackSupplied=false
          fallbackUsed=false  # true, false or null (not known)

          write_status() {  # $1 = status, $2 = reason
            printf '{"sample_id": "%s", "status": "%s", "reason": "%s", "fallback_stats_supplied": %s, "fallback_stats_used": %s, "manta_version": "1.6.0"}\n' \
              "$(json_safe "$sampleId")" "$1" "$(json_safe "$2")" "$fallbackSupplied" "$fallbackUsed" \
              > "/mnt/output/stats/${sampleId}_manta_status.json"
            echo "$1" > /tmp/manta_status
          }

          # After a successful run with fallback stats supplied: did Manta's own stats
          # step use them? GetAlignmentStats then prints "Using existing stats as
          # default" (pyflow collects task stderr); "Too few high-confidence read
          # pairs" is only printed when no fallback file is given. Used on both the
          # up-front and the retry path. If the log is missing, the fallback is
          # assumed used (it was only supplied because the BAM had no usable pairs)
          # and fallback_stats_used records null.
          label_fallback_run() {  # $1 = run dir; sets status and fallbackUsed
            local rc=0
            grep -qs "Using existing stats as default" "$1/workspace/pyflow.data/logs/pyflow_tasks_stderr_log.txt" || rc=$?
            case $rc in
              0) status=ok_clipstats; fallbackUsed=true ;;
              1) status=ok; fallbackUsed=false ;;
              *) status=ok_clipstats; fallbackUsed=null
                 echo "WARNING: Manta's task log is missing; assuming the fallback stats were used" ;;
            esac
          }

          # Missing, empty, unindexed or unreadable input BAMs: report them as such
          # instead of as an alignment-stats failure. Sets reason.
          check_inputs() {
            local bam
            if [ ${#statsBams[@]} -eq 0 ]; then reason="no tumor or normal BAM given"; return 1; fi
            for bam in "${statsBams[@]}"; do
              if [ ! -s "$bam" ]; then reason="input BAM missing or empty: $(basename "$bam")"; return 1; fi
              if [ ! -s "$bam.bai" ] && [ ! -s "${bam%.bam}.bai" ] && [ ! -s "$bam.csi" ]; then
                reason="input BAM has no index: $(basename "$bam")"; return 1
              fi
              if ! $SAMTOOLS quickcheck "$bam"; then reason="input BAM unreadable or truncated: $(basename "$bam")"; return 1; fi
              if [ -z "$( { $SAMTOOLS view "$bam" || true; } | head -n 1)" ]; then
                reason="input BAM has no reads: $(basename "$bam")"; return 1
              fi
            done
          }

          create_empty_vcf() {
            local output_file="$1" reason="$2"
            {
              echo "##fileformat=VCFv4.2"
              echo "##source=Manta_empty_placeholder"
              echo "##MantaStatus=FAILED"
              echo "##MantaFailureReason=$reason"
              echo "##reference=file://$REF"
              echo "##SAMPLE=<ID=$sampleId>"
              echo "##contig=<ID=chr1>"
              echo "##INFO=<ID=SVTYPE,Number=1,Type=String,Description=\"Type of structural variant\">"
              echo "##FORMAT=<ID=GT,Number=1,Type=String,Description=\"Genotype\">"
              echo -e "#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\t$sampleId"
            } | $MANTA_HOME/libexec/bgzip > "$output_file"
          }

          # UMI libraries with the inline UMI masked to N have no unclipped reads at
          # all, and Manta's own stats estimate then fails. Detect that up front from
          # the first 20k properly paired primary reads, so the fallback stats are
          # supplied on the first run instead of after a failed one.
          needs_clipstats() {
            local bam n
            for bam in ${statsBams[@]+"${statsBams[@]}"}; do
              n=$( { $SAMTOOLS view -f 0x2 -F 0xF0C "$bam" || true; } | head -n 20000 \
                   | awk -F'\t' '$6 != "*" && $6 !~ /[SH]/ { c++ } END { print c + 0 }')
              echo "Unclipped reads in first 20k of $(basename $bam): $n"
              if [ "$n" -eq 0 ]; then return 0; fi
            done
            return 1
          }

          status=failed
          reason=""
          extra=()
          runDir=$MANTA_TMP_DIR/run
          check_inputs || echo "Input check failed: $reason"
          if [ -z "$reason" ] && needs_clipstats; then
            echo "No unclipped read pairs; estimating fallback alignment stats on clip-stripped reads"
            if clip_stripped_stats $MANTA_TMP_DIR/clipstats.xml 2>&1 | tee -a "$LOG"; then
              extra=(--existingAlignStatsFile=$MANTA_TMP_DIR/clipstats.xml)
              fallbackSupplied=true; fallbackUsed=null
            else
              reason="clip-stripped alignment stats failed"
            fi
          fi

          if [ -z "$reason" ] && run_manta $runDir ${extra[@]+"${extra[@]}"} 2>&1 | tee -a "$LOG"; then
            status=ok
            if [ ${#extra[@]} -gt 0 ]; then label_fallback_run $runDir; fi
          elif [ -z "$reason" ] && [ ${#extra[@]} -eq 0 ] \
               && grep -rqsE "Too few high-confidence read pairs|Can't generate pair statistics" "$LOG" "$runDir/workspace/pyflow.data/logs"; then
            echo "Manta could not estimate alignment stats; retrying with clip-stripped stats"
            if clip_stripped_stats $MANTA_TMP_DIR/clipstats.xml 2>&1 | tee -a "$LOG" \
               && fallbackSupplied=true && fallbackUsed=null \
               && runDir=$MANTA_TMP_DIR/run_clipstats \
               && run_manta $runDir --existingAlignStatsFile=$MANTA_TMP_DIR/clipstats.xml 2>&1 | tee -a "$LOG"; then
              label_fallback_run $runDir
            else
              reason="alignment stats: too few high-confidence read pairs; clip-stripped retry failed"
            fi
          elif [ -z "$reason" ]; then
            # `|| true`: a log without an error line must not end the step under
            # set -e before the placeholders and the status are written.
            reason=$( { grep -hE "ERROR|Error|error" "$LOG" || true; } | awk 'NF { l = $0 } END { print l }' | cut -c1-300)
            reason=${reason:-"unknown (see step log)"}
          fi

          if [ "$status" != failed ]; then
            for f in $runDir/results/variants/*; do
              mv "$f" "$(dirname $f)/${sampleId}_$(basename $f)"
            done
            for f in $runDir/results/stats/*; do
              mv "$f" "$(dirname $f)/${sampleId}_$(basename $f)"
            done
            cp $runDir/results/variants/* /mnt/output/
            cp $runDir/results/stats/* /mnt/output/stats/
            write_status "$status" ""
            echo "Manta finished: $status"
            exit 0
          fi

          echo "MANTA FAILED: $reason"
          # Keep the logs: the EXIT trap removes the run directories.
          {
            echo "== manta.log (last 200 lines)"; tail -n 200 "$LOG" 2>/dev/null || true
            for f in $MANTA_TMP_DIR/run*/workspace/pyflow.data/logs/pyflow_log.txt; do
              [ -f "$f" ] || continue
              echo "== $(basename $(dirname $(dirname $(dirname $(dirname $f)))))/pyflow_log.txt (last 100 lines)"; tail -n 100 "$f" || true
            done
          } > "/mnt/output/stats/${sampleId}_manta_failure.log"
          create_empty_vcf "/mnt/output/${sampleId}_tumorSV.vcf.gz" "$reason"
          create_empty_vcf "/mnt/output/${sampleId}_diploidSV.vcf.gz" "$reason"
          echo "Manta run failed - empty output files created: $reason" > "/mnt/output/stats/${sampleId}_manta_failed.txt"
          write_status failed "$reason"
          if [ "$onFailure" = "fail" ]; then exit 1; fi
    - name: manta-with-nodeSelector
      nodeSelector:
        kubernetes.io/hostname: "{{inputs.parameters.node-name}}"
      inputs:
        parameters:
          - name: sample-id
          - name: normal-bam
            value: "."
          - name: tumor-bam
            value: "."
          - name: regions-file
            value: "."
          - name: ref-genome-f
          - name: output-dir
          - name: scratch-dir
          - name: thread-count
            value: "10"
          # placeholder: on failure write empty VCFs marked ##MantaStatus=FAILED and succeed
          # fail: write the same placeholders, then exit non-zero
          - name: on-failure
            value: "placeholder"
          - name: node-name
      outputs:
        parameters:
          - name: output-dir
            value: "{{inputs.parameters.output-dir}}"
          - name: output-tumor-vcf-f
            value: "{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}_tumorSV.vcf.gz"
          - name: output-diploid-vcf-f
            value: "{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}_diploidSV.vcf.gz"
          # ok | ok_clipstats | failed (details in stats/<sample>_manta_status.json)
          - name: manta-status
            valueFrom:
              path: /tmp/manta_status
              default: "unknown"
      volumes:
        - name: normal-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['normal-bam'])}}"
            type: Directory
        - name: tumor-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['tumor-bam'])}}"
            type: Directory
        - name: ref-genome-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['ref-genome-f'])}}"
            type: Directory
        - name: regions-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['regions-file'])}}"
            type: Directory
        - name: output-dir
          hostPath:
            path: "{{inputs.parameters.output-dir}}"
            type: DirectoryOrCreate
        - name: scratch-dir
          hostPath:
            path: "{{inputs.parameters.scratch-dir}}"
            type: DirectoryOrCreate
      script:
        name: "manta"
        image: quay.io/biocontainers/manta:1.6.0--h9ee0642_2@sha256:021aabe5f7314e02e60722c559f6f3c4bb6b1118c2e2ec0eb3095a8c7e431f26
        command: [bash]
        volumeMounts:
          - name: normal-bam
            mountPath: "/mnt/input/normal_bam/"
          - name: tumor-bam
            mountPath: "/mnt/input/tumor_bam/"
          - name: ref-genome-f
            mountPath: "/ref/genome/"
          - name: regions-file
            mountPath: "/mnt/ref/regions/"
          - name: output-dir
            mountPath: "/mnt/output/"
          - name: scratch-dir
            mountPath: "/mnt/scratch/"
        source: |
          set -euo pipefail

          # Manta tumor-only/paired SV calling.
          #
          # Status is always recorded in /mnt/output/stats/${sampleId}_manta_status.json
          # and in the `manta-status` output parameter:
          #   ok            Manta ran with its own alignment stats.
          #   ok_clipstats  Manta could not estimate alignment stats from the BAM
          #                 itself (UMI kits mask the inline UMI to N, so every read is
          #                 soft-clipped and Manta finds no high-confidence pairs) and
          #                 used fallback stats instead. The fallback is estimated here
          #                 from properly paired reads with soft clips stripped (a 10%
          #                 subsample, or all reads if that is too few) and passed as
          #                 --existingAlignStatsFile. In Manta 1.6.0 that file is only
          #                 --default-stats-file: Manta's own stats step always runs and
          #                 uses the file for read groups it cannot estimate. SV calling
          #                 always uses the real BAM.
          #   failed        Manta did not complete, or an input BAM is missing, empty,
          #                 unindexed or unreadable (checked before anything runs). With
          #                 on-failure=placeholder the step writes empty VCFs (marked
          #                 ##MantaStatus=FAILED) so the downstream SV chain can still
          #                 run; with on-failure=fail the step exits non-zero after
          #                 writing them.
          # The status JSON also records fallback_stats_supplied (true/false) and
          # fallback_stats_used (true/false, or null when not known: not supplied counts
          # as false; supplied but the run failed, or Manta's task log is missing, is null).

          MANTA_HOME=/usr/local/share/manta-1.6.0-2
          SAMTOOLS=$MANTA_HOME/libexec/samtools

          sampleId="{{inputs.parameters.sample-id}}"
          normalBam="{{=sprig.osBase(inputs.parameters['normal-bam'])}}"
          tumorBam="{{=sprig.osBase(inputs.parameters['tumor-bam'])}}"
          regionsFile="{{=sprig.osBase(inputs.parameters['regions-file'])}}"
          refGenomeFile="{{=sprig.osBase(inputs.parameters['ref-genome-f'])}}"
          onFailure="{{inputs.parameters.on-failure}}"
          threads="{{inputs.parameters.thread-count}}"
