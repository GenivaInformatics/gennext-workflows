apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mosdepth-template
  namespace: argo
spec:
  templates:
    - name: mosdepth-exome
      inputs:
        parameters:
          - name: sample-id
          - name: thresholds
            value: "1,5,10,30,50"
          - name: input-bam
          - name: regions-bed-f
          - name: output-dir
          # "true" keeps today's behaviour: mosdepth --fast-mode skips mate-overlap
          # correction, so bases covered by both reads of a pair count twice.
          # "false" counts each base once per fragment (coverage method v2).
          - name: fast-mode
            default: "true"
          # SAM flags to exclude. Empty = mosdepth default (1796: unmapped,
          # secondary, QC-fail, duplicate). "772" keeps duplicates (pre-dedup depth).
          - name: exclude-flags
            default: ""
          # Output file prefix. Empty = sample-id. Extra runs written next to the
          # main one need their own prefix (e.g. <sample-id>.padded) so MultiQC
          # keeps them apart from the main sample.
          - name: output-prefix
            default: ""
      outputs:
        parameters:
          - name: output-dir
            value: "{{inputs.parameters.output-dir}}"
      volumes:
        - name: input-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['input-bam'])}}"
            type: Directory
        - name: output-dir
          hostPath:
            path: "{{inputs.parameters.output-dir}}"
            type: DirectoryOrCreate
        - name: regions-bed-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['regions-bed-f'])}}"
            type: Directory
      script:
        name: mosdepth-exome-script
        image: quay.io/biocontainers/mosdepth:0.3.8--hd299d5a_0@sha256:2decf63be02007796b4d1ab8389e99564a8c2eebeb5bad6983bdb1d7a99a657f
        command: [sh]
        workingDir: /mnt/output
        source: |
          set -eu
          prefix="{{inputs.parameters.output-prefix}}"
          [ -n "$prefix" ] || prefix="{{inputs.parameters.sample-id}}"
          fastMode="{{inputs.parameters.fast-mode}}"
          excludeFlags="{{inputs.parameters.exclude-flags}}"
          opts=""
          case "$fastMode" in
            true)  opts="--fast-mode"; method="cov-v1-fastmode" ;;
            false) method="cov-v2-overlap" ;;
            *) echo "fast-mode must be true or false, got '$fastMode'" >&2; exit 2 ;;
          esac
          if [ -n "$excludeFlags" ]; then
            # Decimal, or 0x hex normalised to decimal so the method JSON stays valid.
            case "$excludeFlags" in
              0[xX]|0[xX]*[!0-9A-Fa-f]*) bad=1 ;;
              0[xX]*) bad=0; excludeFlags=$((excludeFlags)) ;;
              *[!0-9]*|0?*) bad=1 ;;
              *) bad=0 ;;
            esac
            if [ "$bad" = 1 ]; then
              echo "exclude-flags must be a decimal or 0x hex SAM flag, got '$excludeFlags'" >&2; exit 2
            fi
            opts="$opts -F $excludeFlags"
          else
            excludeFlags=1796
          fi
          bed="{{=sprig.osBase(inputs.parameters['regions-bed-f'])}}"

          mosdepth \
          -n $opts \
          --by /mnt/input/bed/$bed \
          --thresholds {{inputs.parameters.thresholds}} \
          "$prefix" \
          /mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}

          # Record how these numbers were produced; collect-qc-data-v2 posts it
          # as coverageMethodVersion.
          printf '{"coverageMethodVersion":"%s","tool":"%s","fastMode":%s,"excludeFlags":%s,"minMapq":0,"regions":"%s"}\n' \
            "$method" "$(mosdepth --version 2>&1 | head -n1)" "$fastMode" "$excludeFlags" "$bed" \
            > "$prefix.coverage-method.json"
          cat "$prefix.coverage-method.json"
        volumeMounts:
          - name: input-bam
            mountPath: "/mnt/input/bam/"
          - name: output-dir
            mountPath: "/mnt/output/"
          - name: regions-bed-f
            mountPath: "/mnt/input/bed/"
    - name: mosdepth-genome
      inputs:
        parameters:
          - name: sample-id
          - name: thresholds
            value: "1,5,10,30,50"
          - name: input-bam
          - name: output-dir
          # See mosdepth-exome. "true" keeps today's behaviour.
          - name: fast-mode
            default: "true"
      outputs:
        parameters:
          - name: output-dir
            value: "{{inputs.parameters.output-dir}}"
      volumes:
        - name: input-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['input-bam'])}}"
            type: Directory
        - name: output-dir
          hostPath:
            path: "{{inputs.parameters.output-dir}}"
            type: DirectoryOrCreate
      script:
        name: mosdepth-genome-script
        image: quay.io/biocontainers/mosdepth:0.3.8--hd299d5a_0@sha256:2decf63be02007796b4d1ab8389e99564a8c2eebeb5bad6983bdb1d7a99a657f
        command: [sh]
        workingDir: /mnt/output
        source: |
          set -eu
          fastMode="{{inputs.parameters.fast-mode}}"
          case "$fastMode" in
            true)  opts="--fast-mode"; method="cov-v1-fastmode" ;;
            false) opts=""; method="cov-v2-overlap" ;;
            *) echo "fast-mode must be true or false, got '$fastMode'" >&2; exit 2 ;;
          esac

          mosdepth \
          -n $opts \
          --by 500 \
          --thresholds {{inputs.parameters.thresholds}} \
          {{inputs.parameters.sample-id}} \
          /mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}

          printf '{"coverageMethodVersion":"%s","tool":"%s","fastMode":%s,"excludeFlags":1796,"minMapq":0,"regions":"500bp-windows"}\n' \
            "$method" "$(mosdepth --version 2>&1 | head -n1)" "$fastMode" \
            > "{{inputs.parameters.sample-id}}.coverage-method.json"
          cat "{{inputs.parameters.sample-id}}.coverage-method.json"
        volumeMounts:
          - name: input-bam
            mountPath: "/mnt/input/bam/"
          - name: output-dir
            mountPath: "/mnt/output/"
    - name: mosdepth
      inputs:
        parameters:
          - name: sample-id
          - name: input-bam
          - name: regions-bed-f
          - name: output-dir
          - name: fast-mode
            default: "true"
      steps:
      - - name: mosdepth-genome
          template: mosdepth-genome
          arguments:
            parameters:
              - name: sample-id
                value: "{{inputs.parameters.sample-id}}"
              - name: input-bam
                value: "{{inputs.parameters.input-bam}}"
              - name: output-dir
                value: "{{inputs.parameters.output-dir}}"
              - name: fast-mode
                value: "{{inputs.parameters.fast-mode}}"
          when: "\"{{inputs.parameters.regions-bed-f}}\" == \".\""
        - name: mosdepth-exome
          template: mosdepth-exome
          arguments:
            parameters:
              - name: sample-id
                value: "{{inputs.parameters.sample-id}}"
              - name: input-bam
                value: "{{inputs.parameters.input-bam}}"
              - name: regions-bed-f
                value: "{{inputs.parameters.regions-bed-f}}"
              - name: output-dir
                value: "{{inputs.parameters.output-dir}}"
              - name: fast-mode
                value: "{{inputs.parameters.fast-mode}}"
          when: "\"{{inputs.parameters.regions-bed-f}}\" != \".\""
    - name: mosdepth-exome-on-node
      nodeSelector:
        kubernetes.io/hostname: "{{inputs.parameters.node-name}}"
      inputs:
        parameters:
          - name: sample-id
          - name: input-bam
          - name: regions-bed-f
          - name: output-dir
          - name: node-name
          # See mosdepth-exome. "true" keeps today's behaviour.
          - name: fast-mode
            default: "true"
      outputs:
        parameters:
          - name: output-dir
            value: "{{inputs.parameters.output-dir}}"
      volumes:
        - name: input-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['input-bam'])}}"
            type: Directory
        - name: output-dir
          hostPath:
            path: "{{inputs.parameters.output-dir}}"
            type: DirectoryOrCreate
        - name: regions-bed-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['regions-bed-f'])}}"
            type: Directory
      script:
        name: mosdepth-exome-on-node-script
        image: quay.io/biocontainers/mosdepth:0.3.8--hd299d5a_0@sha256:2decf63be02007796b4d1ab8389e99564a8c2eebeb5bad6983bdb1d7a99a657f
        command: [sh]
        workingDir: /mnt/output
        source: |
          regionsFile="{{=sprig.osBase(inputs.parameters['regions-bed-f'])}}";
          options="";
          cat /mnt/input/bed/$regionsFile | head -n5;

          if [ -f  "/mnt/input/bed/$regionsFile" ]; then
            echo "found $regionsFile";
          else
            echo "did not find $regionsFile";
            echo "/mnt/input/bed/$regionsFile";
          fi

          if [ -f  "/mnt/input/bed/$regionsFile" ]; then
            options+=" --by /mnt/input/bed/$regionsFile"
          else
            options+=" --by 500"
           fi;
          case "{{inputs.parameters.fast-mode}}" in
            true)  options=" --fast-mode$options"; method="cov-v1-fastmode" ;;
            false) method="cov-v2-overlap" ;;
            *) echo "fast-mode must be true or false" >&2; exit 2 ;;
          esac
          echo $options;
          mosdepth \
          -n \
          $options \
          {{inputs.parameters.sample-id}} \
          /mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}} || exit $?
          if [ -f "/mnt/input/bed/$regionsFile" ]; then regions="$regionsFile"; else regions="500bp-windows"; fi
          printf '{"coverageMethodVersion":"%s","tool":"%s","fastMode":%s,"excludeFlags":1796,"minMapq":0,"regions":"%s"}\n' \
            "$method" "$(mosdepth --version 2>&1 | head -n1)" "{{inputs.parameters.fast-mode}}" "$regions" \
            > "{{inputs.parameters.sample-id}}.coverage-method.json"
        volumeMounts:
          - name: input-bam
            mountPath: "/mnt/input/bam/"
          - name: output-dir
            mountPath: "/mnt/output/"
          - name: regions-bed-f
            mountPath: "/mnt/input/bed/"
