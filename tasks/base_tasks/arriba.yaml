apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: arriba-fusion-detection-template
  namespace: argo
spec:
  templates:
    - name: arriba-fusion-detection
      inputs:
        parameters:
          - name: sample-id
          - name: input-bam
          - name: ref-genome-fa
          - name: gene-annotation-gtf
          - name: output-fusions-tsv
          - name: output-fusions-discarded-tsv
          - name: sensitivity
            default: max_sensitivity
          # auto: use the BAM's duplicate flags (-u) when it has any, otherwise
          # let Arriba mark duplicates itself. true/false force either way.
          - name: use-dup-flags
            default: auto
          - name: thread-count
            default: "20"
      outputs:
        parameters:
          - name: output-fusions-tsv
            value: "{{inputs.parameters.output-fusions-tsv}}"
          - name: output-fusions-discarded-tsv
            value: "{{inputs.parameters.output-fusions-discarded-tsv}}"
      volumes:
        - name: input-bam
          hostPath:
            path: "{{inputs.parameters.input-bam}}"
            type: File
        - name: ref-genome-fa
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['ref-genome-fa'])}}"
            type: Directory
        - name: gene-annotation-gtf
          hostPath:
            path: "{{inputs.parameters.gene-annotation-gtf}}"
            type: File
        - name: output-fusions-tsv
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['output-fusions-tsv'])}}"
            type: DirectoryOrCreate
        - name: output-fusions-discarded-tsv
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['output-fusions-discarded-tsv'])}}"
            type: DirectoryOrCreate
      script:
        name: arriba-fusion-detection
        image: quay.io/biocontainers/arriba:2.5.1--h87b9561_0@sha256:702a3e8db8a9f6e227c0154c460f54fc2dc4c46f16d9e3f53b82edf43f05e881
        command: [sh]
        source: |
          set -euo pipefail

          # Resolve bundled resource files dynamically (handles v2.5.0 vs v2.5.1)
          ARRIBA_DATA=/usr/local/var/lib/arriba
          BLACKLIST=$(ls ${ARRIBA_DATA}/blacklist_hg38_GRCh38_v2.5.*.tsv.gz 2>/dev/null | head -1)
          KNOWN_FUSIONS=$(ls ${ARRIBA_DATA}/known_fusions_hg38_GRCh38_v2.5.*.tsv.gz 2>/dev/null | head -1)
          PROTEIN_DOMAINS=$(ls ${ARRIBA_DATA}/protein_domains_hg38_GRCh38_v2.5.*.gff3 2>/dev/null | head -1)

          if [ -z "$BLACKLIST" ] || [ -z "$KNOWN_FUSIONS" ] || [ -z "$PROTEIN_DOMAINS" ]; then
            echo "ERROR: Could not find arriba bundled resource files in ${ARRIBA_DATA}"
            ls -la ${ARRIBA_DATA}/ || true
            exit 1
          fi

          echo "Resolved arriba resources:"
          echo "  Blacklist:        ${BLACKLIST}"
          echo "  Known fusions:    ${KNOWN_FUSIONS}"
          echo "  Protein domains:  ${PROTEIN_DOMAINS}"

          SAMPLE_ID="{{inputs.parameters.sample-id}}"
          SENSITIVITY="{{inputs.parameters.sensitivity}}"
          THREADS="{{inputs.parameters.thread-count}}"

          BAM="/mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}"
          GENOME="/mnt/ref/genome/{{=sprig.osBase(inputs.parameters['ref-genome-fa'])}}"
          GTF="/mnt/input/gtf/{{=sprig.osBase(inputs.parameters['gene-annotation-gtf'])}}"

          ARRIBA_ARGS="-x ${BAM}"
          ARRIBA_ARGS="${ARRIBA_ARGS} -o /mnt/output/fusions/{{=sprig.osBase(inputs.parameters['output-fusions-tsv'])}}"
          ARRIBA_ARGS="${ARRIBA_ARGS} -O /mnt/output/discarded/{{=sprig.osBase(inputs.parameters['output-fusions-discarded-tsv'])}}"
          ARRIBA_ARGS="${ARRIBA_ARGS} -a ${GENOME}"
          ARRIBA_ARGS="${ARRIBA_ARGS} -g ${GTF}"
          ARRIBA_ARGS="${ARRIBA_ARGS} -b ${BLACKLIST}"
          ARRIBA_ARGS="${ARRIBA_ARGS} -k ${KNOWN_FUSIONS}"
          ARRIBA_ARGS="${ARRIBA_ARGS} -t ${KNOWN_FUSIONS}"
          ARRIBA_ARGS="${ARRIBA_ARGS} -p ${PROTEIN_DOMAINS}"
          # Duplicates. Arriba's `duplicates` filter must stay ON, so
          # `duplicates` must never appear in the -f (disable filters) lists
          # below; disabling it counts every PCR duplicate as support.
          #
          # -u makes that filter trust the BAM's BAM_FDUP (0x400) flags
          # instead of Arriba's own coordinate-based marking. Only DAGs that
          # run `fgbio-mark-duplicates` (UMI-aware, = umi_tools "directional")
          # before Arriba have those flags: somatic-rna-fastq-v2 and
          # somatic-fusion-fastq-gpu-v2. somatic-fusion-fastq-v2 and
          # somatic-rna-bam-v2 pass a BAM without them, where -u would mean
          # no deduplication at all. `auto` therefore looks for 0x400 flags
          # in the first 1M primary records and uses -u only if it finds any.
          USE_DUP_FLAGS="{{inputs.parameters.use-dup-flags}}"
          if [ "${USE_DUP_FLAGS}" = "auto" ]; then
            # samtools is stopped by head after 1M records (SIGPIPE); only a
            # failure before that is worth a warning.
            PROBE_RC=$(mktemp)
            PROBE=$( { samtools view -F 0x900 "${BAM}" || echo $? > "${PROBE_RC}"; } | head -n 1000000 \
                     | awk -F'\t' '{ n++ } int($2 / 1024) % 2 == 1 { c++ } END { print n + 0, c + 0 }')
            NREC=${PROBE% *}; NDUP=${PROBE#* }
            if [ -s "${PROBE_RC}" ] && [ "${NREC}" -lt 1000000 ]; then
              echo "WARNING: samtools exited with $(cat "${PROBE_RC}") after ${NREC} records while probing for duplicate flags; the auto decision may be wrong (set use-dup-flags to true or false to force it)"
            fi
            rm -f "${PROBE_RC}"
            echo "Duplicate-flagged reads in the first 1M primary records: ${NDUP}"
            if [ "${NDUP}" -gt 0 ]; then USE_DUP_FLAGS=true; else USE_DUP_FLAGS=false; fi
          fi
          case "${USE_DUP_FLAGS}" in
            true)
              echo "Using the BAM's duplicate flags (-u)"
              ARRIBA_ARGS="${ARRIBA_ARGS} -u"
              ;;
            false)
              echo "No duplicate flags used: Arriba marks duplicates itself"
              ;;
            *)
              echo "ERROR: use-dup-flags must be auto, true or false (got: ${USE_DUP_FLAGS})"
              exit 1
              ;;
          esac

          case "${SENSITIVITY}" in
            ultra_sensitivity)
              echo "Using ultra_sensitivity mode"
              ARRIBA_ARGS="${ARRIBA_ARGS} -f blacklist,low_entropy,multimappers,small_insert_size,hairpin,homopolymer,mismatches,relative_support,homologs"
              ARRIBA_ARGS="${ARRIBA_ARGS} -S 1 -E 5.0 -V 0.2 -A 10 -K 0.95 -R 1000"
              ;;
            max_sensitivity)
              echo "Using max_sensitivity mode"
              ARRIBA_ARGS="${ARRIBA_ARGS} -f blacklist,low_entropy,multimappers"
              ARRIBA_ARGS="${ARRIBA_ARGS} -S 1 -E 1.0 -V 0.05 -A 15 -K 0.8 -R 5000"
              ;;
            standard)
              # Arriba's recommended defaults: every filter on.
              echo "Using standard mode (Arriba defaults)"
              ;;
            *)
              echo "ERROR: Unknown arriba sensitivity mode: ${SENSITIVITY}"
              echo "Valid modes: ultra_sensitivity, max_sensitivity, standard"
              exit 1
              ;;
          esac

          # Use -@ for threads (NOT -T which sets top_viral_contigs)
          ARRIBA_ARGS="${ARRIBA_ARGS} -@ ${THREADS}"

          echo "Running: arriba ${ARRIBA_ARGS}"
          arriba ${ARRIBA_ARGS}

          echo "arriba completed successfully"
          ls -la /mnt/output/fusions/
        volumeMounts:
          - name: input-bam
            mountPath: "/mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}"
          - name: ref-genome-fa
            mountPath: "/mnt/ref/genome/"
          - name: gene-annotation-gtf
            mountPath: "/mnt/input/gtf/{{=sprig.osBase(inputs.parameters['gene-annotation-gtf'])}}"
          - name: output-fusions-tsv
            mountPath: "/mnt/output/fusions/"
          - name: output-fusions-discarded-tsv
            mountPath: "/mnt/output/discarded/"
        resources:
          requests:
            memory: 8Gi
            cpu: "4"
