    #       pbrun bqsr \
    #         --ref "/mnt/ref/genome/{{=sprig.osBase(inputs.parameters['genome-ref'])}}" \
    #         --knownSites "/mnt/ref/known-sites/{{=sprig.osBase(inputs.parameters['known-sites'])}}" \
