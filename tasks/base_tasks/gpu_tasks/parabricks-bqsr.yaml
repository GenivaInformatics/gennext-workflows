          volumeMounts:
            - name: input-bam
              mountPath: /mnt/input/bam/
      script:
        name: "parabricks-apply-bqsr-script"
        image: nvcr.io/nvidia/clara/clara-parabricks:4.3.1-1
        resources:
          limits:
            nvidia.com/gpu: 1
        command: [bash]
        source: |
          set -euo pipefail

          REF="/mnt/ref/genome/{{=sprig.osBase(inputs.parameters['genome-ref'])}}"
          IN_BAM="/mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}"
          IN_RECAL="/mnt/input/recal/{{=sprig.osBase(inputs.parameters['input-recal-file'])}}"
          OUT_BAM="/mnt/output/bam/{{=sprig.osBase(inputs.parameters['output-bam'])}}"
          regionsFile="{{=sprig.osBase(inputs.parameters['regions-file'])}}"
          options=""

          if [ ! "." = "$regionsFile" ]; then
            options="$options --interval-file /mnt/input/regions/$regionsFile"
          fi

          pbrun applybqsr \
            --ref "${REF}" \
            --in-bam "${IN_BAM}" \
            --in-recal-file "${IN_RECAL}" \
            $options \
            --out-bam "${OUT_BAM}"

          # Fail loudly if pbrun exited 0 but produced no output BAM.
          if [ ! -s "${OUT_BAM}" ]; then
            echo "ERROR: output BAM ${OUT_BAM} missing or empty after pbrun applybqsr" >&2
            exit 1
          fi
          echo "=== Parabricks applyBQSR completed: $(wc -c < "${OUT_BAM}") bytes ==="
        volumeMounts:
          - name: genome-ref
            mountPath: /mnt/ref/genome/
