    # NOTE on the BAM index (all three active templates below):
    #   pbrun fq2bam can leave the .bai with an mtime that is not strictly
    #   newer than its BAM, and Parabricks then refuses to load it
    #   ("Loading index file ... failed"), which previously slipped through
    #   as a silent success and stalled downstream applybqsr. Each template
    #   regenerates the index in a dedicated initContainer (pinned samtools,
    #   not the parabricks-bundled one) before pbrun runs.
    - name: parabricks-bqsr-on-node
      nodeSelector:
        kubernetes.io/hostname: "{{inputs.parameters.node-name}}"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      inputs:
        parameters:
          - name: input-bam
          - name: genome-ref
          - name: known-sites
          - name: known-sites-gnomad # optional secondary known sites
            value: "."
          - name: output-recal-file
          - name: regions-file # optional
            value: "."
          - name: thread-count # threads for the pre-pbrun samtools index
            value: "4"
          - name: node-name
            value: "{{inputs.parameters.node-name}}"
      outputs:
        parameters:
          - name: output-recal-file
            value: "{{inputs.parameters.output-recal-file}}"
      volumes:
        - name: input-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['input-bam'])}}"
            type: Directory
        - name: genome-ref
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['genome-ref'])}}"
            type: Directory
        - name: known-sites
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['known-sites'])}}"
            type: Directory
        - name: known-sites-gnomad
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['known-sites-gnomad'])}}"
            type: Directory
        - name: regions-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['regions-file'])}}"
            type: Directory
        - name: output-recal-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['output-recal-file'])}}"
            type: DirectoryOrCreate
      initContainers:
        - name: reindex-bam
          image: quay.io/biocontainers/samtools:1.24--h9dcdb79_0
          command: [sh, -c]
          args:
            - |
              set -eu
              IN_BAM="/mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}"
              samtools --version | head -1
              rm -f "${IN_BAM}.bai" "${IN_BAM%.bam}.bai"
              samtools index -@ "{{inputs.parameters.thread-count}}" "${IN_BAM}"
              echo "Regenerated index: ${IN_BAM}.bai"
          volumeMounts:
            - name: input-bam
              mountPath: /mnt/input/bam/
      script:
        name: "parabricks-bqsr-script"
        image: nvcr.io/nvidia/clara/clara-parabricks:4.3.1-1
        resources:
          limits:
            nvidia.com/gpu: 1
        command: [bash]
        source: |
          set -euo pipefail

          REF="/mnt/ref/genome/{{=sprig.osBase(inputs.parameters['genome-ref'])}}"
          IN_BAM="/mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}"
          OUT_RECAL="/mnt/output/recal/{{=sprig.osBase(inputs.parameters['output-recal-file'])}}"
          regionsFile="{{=sprig.osBase(inputs.parameters['regions-file'])}}"
          gnomadFile="{{=sprig.osBase(inputs.parameters['known-sites-gnomad'])}}"
          dbsnpKnownSites="{{=sprig.osBase(inputs.parameters['known-sites'])}}"
          options=""

          echo "=== Parabricks BQSR Configuration ==="
          echo "Input BAM: ${IN_BAM}"
          echo "Genome reference: ${REF}"
          echo "dbSNP known sites: $dbsnpKnownSites"
          echo "gnomAD known sites: $gnomadFile"
          echo "Regions file: $regionsFile"
          echo "Output recal file: ${OUT_RECAL}"

          # Add regions file if provided
          if [ ! "." = "$regionsFile" ]; then
            echo "Adding regions file: /mnt/input/regions/$regionsFile"
            options="$options --interval-file /mnt/input/regions/$regionsFile"
          else
            echo "No regions file specified"
          fi

          # Set known sites - prefer gnomAD when present, else fall back to dbSNP
          knownSitesArg=""
          if [ ! "." = "$gnomadFile" ] && [ -f "/mnt/ref/known-sites-gnomad/$gnomadFile" ]; then
            echo "Using gnomAD known sites: /mnt/ref/known-sites-gnomad/$gnomadFile"
            knownSitesArg="--knownSites /mnt/ref/known-sites-gnomad/$gnomadFile"
          else
            echo "Using dbSNP known sites: /mnt/ref/known-sites/$dbsnpKnownSites"
            knownSitesArg="--knownSites /mnt/ref/known-sites/$dbsnpKnownSites"
          fi

          echo "=== Starting Parabricks BQSR ==="
          pbrun bqsr \
            --ref "${REF}" \
            $knownSitesArg \
            --in-bam "${IN_BAM}" \
            $options \
            --out-recal-file "${OUT_RECAL}"

          # Fail loudly if pbrun exited 0 but produced no recal table.
          if [ ! -s "${OUT_RECAL}" ]; then
            echo "ERROR: recal file ${OUT_RECAL} missing or empty after pbrun bqsr" >&2
            exit 1
          fi
          echo "=== Parabricks BQSR completed: $(wc -c < "${OUT_RECAL}") bytes ==="
        volumeMounts:
          - name: genome-ref
            mountPath: /mnt/ref/genome/
          - name: known-sites
            mountPath: /mnt/ref/known-sites/
          - name: known-sites-gnomad
            mountPath: /mnt/ref/known-sites-gnomad/
          - name: input-bam
            mountPath: /mnt/input/bam/
          - name: output-recal-file
            mountPath: /mnt/output/recal/
          - name: regions-file
            mountPath: /mnt/input/regions/
    - name: parabricks-bqsr
      # nodeSelector:
      #   kubernetes.io/hostname: "{{inputs.parameters.node-name}}"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      inputs:
        parameters:
          - name: input-bam
          - name: genome-ref
          - name: known-sites
          - name: known-sites-gnomad # optional secondary known sites
            value: "."
          - name: output-recal-file
          - name: regions-file # optional
            value: "."
          - name: thread-count # threads for the pre-pbrun samtools index
            value: "4"
      outputs:
        parameters:
          - name: output-recal-file
            value: "{{inputs.parameters.output-recal-file}}"
      volumes:
        - name: input-bam
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['input-bam'])}}"
            type: Directory
        - name: genome-ref
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['genome-ref'])}}"
            type: Directory
        - name: known-sites
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['known-sites'])}}"
            type: Directory
        - name: known-sites-gnomad
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['known-sites-gnomad'])}}"
            type: Directory
        - name: regions-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['regions-file'])}}"
            type: Directory
        - name: output-recal-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['output-recal-file'])}}"
            type: DirectoryOrCreate
      initContainers:
        - name: reindex-bam
          image: quay.io/biocontainers/samtools:1.24--h9dcdb79_0
          command: [sh, -c]
          args:
            - |
              set -eu
              IN_BAM="/mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}"
              samtools --version | head -1
              rm -f "${IN_BAM}.bai" "${IN_BAM%.bam}.bai"
              samtools index -@ "{{inputs.parameters.thread-count}}" "${IN_BAM}"
              echo "Regenerated index: ${IN_BAM}.bai"
          volumeMounts:
            - name: input-bam
              mountPath: /mnt/input/bam/
      script:
        name: "parabricks-bqsr-script"
        image: nvcr.io/nvidia/clara/clara-parabricks:4.3.1-1
        resources:
          limits:
            nvidia.com/gpu: 1
        command: [bash]
        source: |
          set -euo pipefail

          REF="/mnt/ref/genome/{{=sprig.osBase(inputs.parameters['genome-ref'])}}"
          IN_BAM="/mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}"
          OUT_RECAL="/mnt/output/recal/{{=sprig.osBase(inputs.parameters['output-recal-file'])}}"
          regionsFile="{{=sprig.osBase(inputs.parameters['regions-file'])}}"
          gnomadFile="{{=sprig.osBase(inputs.parameters['known-sites-gnomad'])}}"
          dbsnpKnownSites="{{=sprig.osBase(inputs.parameters['known-sites'])}}"
          options=""

          echo "=== Parabricks BQSR Configuration ==="
          echo "Input BAM: ${IN_BAM}"
          echo "Genome reference: ${REF}"
          echo "dbSNP known sites: $dbsnpKnownSites"
          echo "gnomAD known sites: $gnomadFile"
          echo "Regions file: $regionsFile"
          echo "Output recal file: ${OUT_RECAL}"

          # Add regions file if provided
          if [ ! "." = "$regionsFile" ]; then
            echo "Adding regions file: /mnt/input/regions/$regionsFile"
            options="$options --interval-file /mnt/input/regions/$regionsFile"
          else
            echo "No regions file specified"
          fi

          # Set known sites - prefer gnomAD when present, else fall back to dbSNP
