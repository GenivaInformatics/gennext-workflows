apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: star-fusion-from-junction-template
spec:
  templates:
    # CPU-only STAR-Fusion run that kickstarts from an existing
    # Chimeric.out.junction (produced upstream by pbrun rna_fq2bam, or by any
    # external STAR run). Skips STAR-Fusion's bundled STAR realignment so
    # alignment work stays on GPU; CPU only does the fusion-call inference.
    #
    # Sensitivity flags match tasks/base_tasks/star-fusion.yaml (full_Monty
    # mode by default). pbrun starfusion is intentionally NOT used here — its
    # stripped CLI doesn't expose any sensitivity tuning, which would silently
    # cost FFPE recall.
    - name: star-fusion-from-junction
      inputs:
        parameters:
          - name: sample-id
          - name: chimeric-junction-file
          - name: ctat-genome-lib-build-dir
          - name: output-fusions-tsv
          - name: scratch-dir
          - name: thread-count
          - name: sensitivity
            default: full_Monty
      outputs:
        parameters:
          - name: output-fusions-tsv
            value: "{{inputs.parameters.output-fusions-tsv}}"
      volumes:
        - name: chimeric-junction-file
          hostPath:
            path: "{{inputs.parameters.chimeric-junction-file}}"
            type: File
        - name: ctat-genome-lib-build-dir
          hostPath:
            path: "{{inputs.parameters.ctat-genome-lib-build-dir}}"
            type: Directory
        - name: output-fusions-tsv
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['output-fusions-tsv'])}}"
            type: DirectoryOrCreate
        - name: scratch-dir
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['scratch-dir'])}}"
            type: DirectoryOrCreate
      script:
        name: "star-fusion-from-junction"
        image: quay.io/biocontainers/star-fusion:1.15.1--hdfd78af_1
        command: [sh]
        source: |
          set -euo pipefail

          SENSITIVITY="{{inputs.parameters.sensitivity}}"
          JUNCTION_IN="/mnt/input/junction/{{=sprig.osBase(inputs.parameters['chimeric-junction-file'])}}"
          FUSION_OUT_FILE="/mnt/output/fusions/{{=sprig.osBase(inputs.parameters['output-fusions-tsv'])}}"

          rm -rf /mnt/scratch/*

          EMPTY_FUSION_HEADER="#FusionName\tJunctionReadCount\tSpanningFragCount\test_J\test_S\tSpliceType\tLeftGene\tLeftBreakpoint\tRightGene\tRightBreakpoint\tJunctionReads\tSpanningFrags\tLargeAnchorSupport\tFFPM\tLeftBreakDinuc\tLeftBreakEntropy\tRightBreakDinuc\tRightBreakEntropy\tannots"

          # Defense-in-depth: STAR-Fusion computes its FFPM denominator
          # by tail-reading the `# Nreads N\tNreadsUnique N\tNreadsMulti N`
          # footer that --chimOutJunctionFormat 1 appends. A junction
          # missing that footer (0-byte file, or a malformed/truncated
          # one) makes STAR-Fusion confess "doesn't have expected
          # formatting" and exit 255, failing the whole sample. A
          # degenerate library with zero surviving reads is a valid
          # outcome, not a pipeline error — so if the footer is absent
          # we emit the empty (header-only) fusion file and succeed.
          # The upstream filter (filter-chimeric-junction-by-bam) is
          # fixed to always preserve this footer; this guard also covers
          # junctions arriving from any other source.
          # NB: busybox grep (this biocontainer) does NOT expand \t in
          # the pattern, so we match on the `# Nreads <int>` prefix only
          # — sufficient to confirm STAR-Fusion's tail-parseable footer
          # is present.
          if ! tail -n1 "${JUNCTION_IN}" | grep -qE '^# Nreads [0-9]'; then
            echo "WARNING: ${JUNCTION_IN} has no valid '# Nreads' footer (empty or malformed junction); emitting empty fusion output."
            echo -e "${EMPTY_FUSION_HEADER}" > "${FUSION_OUT_FILE}"
            echo "STAR-Fusion kickstart completed (no chimeric evidence)"
            exit 0
          fi

          # Sensitivity flag set mirrors tasks/base_tasks/star-fusion.yaml.
          # NOTE: --skip_EM intentionally NOT included. The EM step
          # populates est_J / est_S, which the bundled
          # incorporate_FFPM_into_final_report.pl uses verbatim to
          # compute FFPM (= (est_J + est_S) * 1e6 / num_frags). With
          # --skip_EM, est_J/est_S are 'NA' → Perl coerces to 0 →
          # every row reports FFPM=0. We need real FFPM for the
          # frontend's FFPM-based filtering, so we pay the EM cost.
          SENSITIVITY_ARGS=""
          case "${SENSITIVITY}" in
            full_Monty)
              SENSITIVITY_ARGS="--min_junction_reads 0 --min_sum_frags 1 --require_LDAS 0 --min_spanning_frags_only 1 --min_novel_junction_support 1 --no_single_fusion_per_breakpoint --max_promiscuity 1000000 --min_pct_dom_promiscuity 1 --min_alt_pct_junction 1e-3 --no_annotation_filter --no_RT_artifact_filter --min_FFPM 0"
              ;;
            max_sensitivity)
              SENSITIVITY_ARGS="--min_junction_reads 0 --min_sum_frags 1 --require_LDAS 0 --min_spanning_frags_only 1 --min_novel_junction_support 1 --no_single_fusion_per_breakpoint --min_FFPM 0"
              ;;
            default)
              ;;
            *)
              echo "ERROR: Unknown sensitivity mode: ${SENSITIVITY}"
              exit 1
              ;;
          esac

          echo "Running STAR-Fusion kickstart from ${JUNCTION_IN} (sensitivity: ${SENSITIVITY})"
          # STAR-Fusion 1.15.1 doesn't have --no_FusionInspector; FI is opt-in
          # via --FusionInspector inspect, so we just don't pass it.
          /usr/local/lib/STAR-Fusion/STAR-Fusion \
            --genome_lib_dir /mnt/ref/ctat-lib/ \
            --chimeric_junction "${JUNCTION_IN}" \
            --output_dir /mnt/scratch/ \
            --CPU {{inputs.parameters.thread-count}} \
            $SENSITIVITY_ARGS

          if [ -f "/mnt/scratch/star-fusion.fusion_predictions.tsv" ]; then
            mv /mnt/scratch/star-fusion.fusion_predictions.tsv "${FUSION_OUT_FILE}"
          else
            echo -e "${EMPTY_FUSION_HEADER}" > "${FUSION_OUT_FILE}"
            echo "Created empty fusion file with header at ${FUSION_OUT_FILE}"
          fi

          echo "STAR-Fusion kickstart completed"
        volumeMounts:
          - name: chimeric-junction-file
            mountPath: "/mnt/input/junction/{{=sprig.osBase(inputs.parameters['chimeric-junction-file'])}}"
          - name: ctat-genome-lib-build-dir
            mountPath: "/mnt/ref/ctat-lib/"
          - name: output-fusions-tsv
            mountPath: "/mnt/output/fusions/"
          - name: scratch-dir
            mountPath: "/mnt/scratch/"
        resources:
          requests:
            memory: 16Gi
            cpu: "4"
