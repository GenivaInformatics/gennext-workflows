apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: oncokb-templates
  namespace: argo
spec:
  templates:
    - name: oncokb-snv
      inputs:
        parameters:
          - name: annovar-maf-f
          - name: annovar-oncokb-maf-f
          - name: ref-version
          - name: regions-file
            value: "."
          - name: tumor-type
            value: "."
          - name: max-attempts
            value: "3"
          - name: retry-delay-seconds
            value: "5"
      outputs:
        parameters:
          - name: annovar-oncokb-maf-f
            value: "{{inputs.parameters.annovar-oncokb-maf-f}}"
      volumes:
        - name: annovar-maf-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['annovar-maf-f'])}}"
            type: Directory
        - name: annovar-oncokb-maf-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['annovar-oncokb-maf-f'])}}"
            type: DirectoryOrCreate
      script:
        name: oncokb-snv-script
        image: bergun/oncokb-annotator:0.2.0-upstream-v3.4.2@sha256:c73fb7dd9228d282889d4965b695474526f36d2f8bbe7b4715cf9d7d4e9cebeb
        workingDir: /app/oncokb/
        command: [sh]
        source: |
          ref_version="{{inputs.parameters.ref-version}}"
          if [ "$ref_version" = "hg38" ]; then
              grch_ref_version="GRCh38"
          elif [ "$ref_version" = "hg19" ]; then
              grch_ref_version="GRCh37"
          else
              grch_ref_version=$ref_version
          fi;
          
          tumor_type="{{inputs.parameters.tumor-type}}"
          echo "OncoKB SNV: Using tumor type: '$tumor_type'"
          
          input_file="/mnt/input/{{=sprig.osBase(inputs.parameters['annovar-maf-f'])}}"
          output_file="/mnt/output/{{=sprig.osBase(inputs.parameters['annovar-oncokb-maf-f'])}}"
          
          # Function to run annotation
          run_annotation() {
              echo "Running OncoKB annotation (attempt $1)..."
              if [ "$tumor_type" != "." ]; then
                  echo "Using tumor type parameter: $tumor_type"
                  python ./filtered_maf_annotator.py --input "$input_file" --output "$output_file" --reference "$grch_ref_version" --regions-file "{{inputs.parameters.regions-file}}" --tumor-type "$tumor_type"
              else
                  echo "No tumor type specified (using default)"
                  python ./filtered_maf_annotator.py --input "$input_file" --output "$output_file" --reference "$grch_ref_version" --regions-file "{{inputs.parameters.regions-file}}"
              fi
              return $?
          }
          
          # Function to validate output
          validate_output() {
              echo "Waiting 10 seconds for output file creation..."
              sleep 10
              
              if [ -f "$output_file" ] && [ -s "$output_file" ]; then
                  echo "Output file validated successfully: $output_file"
                  return 0
              else
                  echo "Output file validation failed or file is empty: $output_file"
                  return 1
              fi
          }
          
          # Main execution with retry logic
          max_attempts="{{inputs.parameters.max-attempts}}"
          retry_delay_seconds="{{inputs.parameters.retry-delay-seconds}}"
          case "$max_attempts" in
              ''|*[!0-9]*)
                  echo "max-attempts must be a positive integer: $max_attempts" >&2
                  exit 2
                  ;;
          esac
          if [ "$max_attempts" -lt 1 ]; then
              echo "max-attempts must be at least 1" >&2
              exit 2
          fi
          case "$retry_delay_seconds" in
              ''|*[!0-9]*)
                  echo "retry-delay-seconds must be a non-negative integer: $retry_delay_seconds" >&2
                  exit 2
                  ;;
          esac
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
              echo "=== Attempt $attempt of $max_attempts ==="
              
              if run_annotation $attempt; then
                  echo "Annotation completed successfully"
                  
                  if validate_output; then
                      echo "Task completed successfully"
                      exit 0
                  else
                      echo "Output validation failed on attempt $attempt"
                  fi
              else
                  echo "Annotation failed on attempt $attempt"
              fi
              
              if [ $attempt -lt $max_attempts ]; then
                  echo "Retrying in $retry_delay_seconds seconds..."
                  sleep "$retry_delay_seconds"
              fi
              
              attempt=$((attempt + 1))
          done
          
          echo "All attempts failed. Task failed."
          exit 1
        volumeMounts:
          - name: annovar-maf-f
            mountPath: "/mnt/input/"
          - name: annovar-oncokb-maf-f
            mountPath: "/mnt/output/"
        env:
          - name: ONCOKB_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: oncokb-secrets
                key: oncokb_api_token

