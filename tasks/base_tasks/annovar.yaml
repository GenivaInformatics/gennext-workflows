apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: annovar-template
  namespace: argo
spec:
  templates:
    - name: annovar
      inputs:
        parameters:
          - name: sample-id
          - name: input-vcf-f
          - name: output-dir
          - name: ref-version
            value: "hg38"
          - name: annotators
            value: "refGene,ensGene,esp6500siv2_all,1000g2015aug_all,exac03,avsnp150,dbnsfp42c,dbscsnv11,dbnsfp31a_interpro,clinvar_20221231,cosmic91,icgc28,gnomad_genome"
          - name: annotator-opts
            value: "'-hgvs','-hgvs',,,,,,,,,,,"
          - name: annovardb-dir
          # oncokbGene (OncoKB's isoforms, ref-data/oncokb-gene-db): "auto" adds the
          # protocol where annovardb-dir has hg38_oncokbGene.txt and skips it where it
          # doesn't; "off" never adds it.
          - name: oncokb-gene-db
            value: "auto"
      outputs:
        parameters:
          - name: annovar-out-f
            value: "{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}.hg38_multianno.txt"
      volumes:
        - name: input-vcf-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['input-vcf-f'])}}"
            type: Directory
        - name: output-dir
          hostPath:
            path: "{{inputs.parameters.output-dir}}"
            type: DirectoryOrCreate
        - name: annovardb-dir
          hostPath:
            path: "{{inputs.parameters.annovardb-dir}}"
            type: Directory
      script:
        name: annovar-script
        image: bergun/cancervar:v0.0.1
        command: [sh]
        source: |
          annotators="{{inputs.parameters.annotators}}"

          # oncokbGene: an extra gene protocol, last, so it only adds
          # Func/Gene/GeneDetail/ExonicFunc/AAChange.oncokbGene columns before
          # Otherinfo. A node without the database runs without it. Its
          # isoform table and version go next to the multianno for annovar-to-maf.
          extra_opt=""
          okb_version=""
          case ",$annotators," in *,oncokbGene,*) ;; *)
              if [ "{{inputs.parameters.oncokb-gene-db}}" = "auto" ] \
                  && [ -s /mnt/annovardb/hg38_oncokbGene.txt ] \
                  && [ -s /mnt/annovardb/hg38_oncokbGeneMrna.fa ] \
                  && [ -s /mnt/annovardb/hg38_oncokbGene.isoforms.tsv ] \
                  && [ -s /mnt/annovardb/hg38_oncokbGene.version ]; then
                  okb_version=$(readlink /mnt/annovardb/hg38_oncokbGene.txt || echo hg38_oncokbGene.txt)
                  cp -L /mnt/annovardb/hg38_oncokbGene.isoforms.tsv "/mnt/output/{{inputs.parameters.sample-id}}.oncokbGene.isoforms.tsv"
                  cp -L /mnt/annovardb/hg38_oncokbGene.version "/mnt/output/{{inputs.parameters.sample-id}}.oncokbGene.version"
                  annotators="$annotators,oncokbGene"
                  extra_opt=",-hgvs"
                  echo "oncokbGene: $(grep '^version=' /mnt/annovardb/hg38_oncokbGene.version)"
              else
                  rm -f "/mnt/output/{{inputs.parameters.sample-id}}.oncokbGene.isoforms.tsv" \
                        "/mnt/output/{{inputs.parameters.sample-id}}.oncokbGene.version"
                  echo "oncokbGene: not used (oncokb-gene-db={{inputs.parameters.oncokb-gene-db}}, or no database in annovardb-dir)"
              fi ;;
          esac

          # Split the string by commas and set them as 'g' or 'f'
          operations=$(echo $annotators | tr ',' '\n' | while read -r part; do
              if echo "$part" | grep -q "Gene$"; then
                  echo -n "g,"
              else
                  echo -n "f,"
              fi
          done)

          # Remove the trailing comma
          operations=${operations%,}

          perl ./table_annovar.pl \
          /mnt/input/{{=sprig.osBase(inputs.parameters['input-vcf-f'])}} \
          /mnt/annovardb -buildver hg38 \
          --out "/mnt/output/{{inputs.parameters.sample-id}}" \
          --protocol $annotators  --operation  $operations \
          --nastring . --vcfinput --remove \
          --arg {{inputs.parameters.annotator-opts}}$extra_opt \
          --intronhgvs 20 --polish
          rc=$?
          [ "$rc" -eq 0 ] || exit "$rc"

          # The database was replaced while this ran: the isoform table copied
          # above may not match the annotation. Fail, so the step is retried.
          if [ -n "$okb_version" ] && [ "$(readlink /mnt/annovardb/hg38_oncokbGene.txt || echo hg38_oncokbGene.txt)" != "$okb_version" ]; then
              echo "oncokbGene changed during the run ($okb_version); failing so the step reruns" >&2
              exit 1
          fi
        volumeMounts:
          - name: input-vcf-f
            mountPath: "/mnt/input/"
          - name: output-dir
            mountPath: "/mnt/output/"
          - name: annovardb-dir
            mountPath: "/mnt/annovardb/"