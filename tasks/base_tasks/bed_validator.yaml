apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bed-validator-template
spec:
  templates:
    - name: validate-bed-file
      inputs:
        parameters:
          - name: input-bed-file
          - name: gtf-file
          - name: reference-fai-file
            value: "/tmp/unused-reference.fai"
          - name: chains-dir
          - name: output-dir
          - name: canonical-only
            value: "true"
          - name: padding
            value: "100"
          - name: generate-padded-artifacts
            value: "false"
      outputs:
        parameters:
          - name: validated-bed-file
            valueFrom:
              path: /tmp/validated_bed_file
          - name: validated-bed-gz-file
            valueFrom:
              path: /tmp/validated_bed_gz_file
          - name: validation-report
            valueFrom:
              path: /tmp/validation_report
          - name: validated-bed-cds-only-file
            valueFrom:
              path: /tmp/validated_bed_cds_only_file
          - name: validated-bed-analysis-file
            valueFrom:
              path: /tmp/validated_bed_analysis_file
          - name: validated-bed-igv-file
            valueFrom:
              path: /tmp/validated_bed_igv_file
      volumes:
        - name: input-bed-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['input-bed-file'])}}"
            type: Directory
        - name: gtf-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['gtf-file'])}}"
            type: Directory
        - name: reference-fai-file
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['reference-fai-file'])}}"
            type: Directory
        - name: chains-dir
          hostPath:
            path: "{{inputs.parameters.chains-dir}}"
            type: DirectoryOrCreate
        - name: output-dir
          hostPath:
            path: "{{inputs.parameters.output-dir}}"
            type: DirectoryOrCreate
      script:
        name: bed-validator-script
        image: bergun/gennext-bed-validator:0.2.1
        command: [sh]
        source: |
          set -e

          inputBedFile="{{=sprig.osBase(inputs.parameters['input-bed-file'])}}"
          canonicalOnly="{{inputs.parameters.canonical-only}}"
          padding="{{inputs.parameters.padding}}"
          generatePaddedArtifacts="{{inputs.parameters.generate-padded-artifacts}}"
          containerOutputDir="/mnt/output"
          hostOutputDir="{{inputs.parameters.output-dir}}"
          gtfFile="/mnt/gtf/{{=sprig.osBase(inputs.parameters['gtf-file'])}}"
          referenceFaiFile="/mnt/reference/{{=sprig.osBase(inputs.parameters['reference-fai-file'])}}"

          # Derive output filenames from input: {stem}.valid.bed
          stem="${inputBedFile%.*}"
          validBedName="${stem}.valid.bed"
          validCdsBedName="${stem}.valid.cds_only.bed"
          validAnalysisBedName="${stem}.valid.analysis.bed"
          validIgvBedName="${stem}.valid.igv.bed"

          # Check if input file is a placeholder (empty or ".")
          if [ "$inputBedFile" = "." ] || [ -z "$inputBedFile" ]; then
            echo "No BED file provided (placeholder detected). Skipping validation."
            touch "${containerOutputDir}/${validBedName}" "${containerOutputDir}/${validCdsBedName}" "${containerOutputDir}/${validAnalysisBedName}" "${containerOutputDir}/${validIgvBedName}"
            echo '{"skipped": true, "reason": "No input file provided"}' > "${containerOutputDir}/validation_report.json"
            # Write host output paths. Emit "." for validated-bed-file so
            # downstream copy-regions-file-to-scratch falls through to the
            # enrichment-kit / default regions BED instead of copying the
            # empty placeholder file.
            echo -n "." > /tmp/validated_bed_file
            echo -n "" > /tmp/validated_bed_gz_file
            echo -n "${hostOutputDir}/validation_report.json" > /tmp/validation_report
            echo -n "${hostOutputDir}/${validCdsBedName}" > /tmp/validated_bed_cds_only_file
            echo -n "." > /tmp/validated_bed_analysis_file
            echo -n "." > /tmp/validated_bed_igv_file
            exit 0
          fi

          # Build canonical flag
          canonicalFlag=""
          if [ "$canonicalOnly" = "true" ]; then
            canonicalFlag="--canonical-only"
          fi

          echo "Running BED validator on: $inputBedFile"

          python /app/main.py \
            /mnt/input/"$inputBedFile" \
            --gtf "$gtfFile" \
            --chains-dir /mnt/chains/ \
            --output "${containerOutputDir}/${validBedName}" \
            --output-report "${containerOutputDir}/validation_report.json" \
            --output-cds-bed "${containerOutputDir}/${validCdsBedName}" \
            $canonicalFlag || {
              exitCode=$?
              echo "WARNING: BED validation failed with exit code $exitCode"
              echo "Continuing workflow with original file..."
              cp /mnt/input/"$inputBedFile" "${containerOutputDir}/${validBedName}"
              # Fall back the CDS-only output to the full panel BED rather
              # than an empty file. Downstream mosdepth-exome runs against
              # this; an empty BED would silently produce zero-coverage
              # numbers that the QC collector posts to Gennext. Whole-panel
              # coverage (degraded from CDS-only) is far better than zeros.
              cp /mnt/input/"$inputBedFile" "${containerOutputDir}/${validCdsBedName}"
              echo "{\"error\": true, \"exit_code\": $exitCode, \"message\": \"Validation failed, using original file\"}" > "${containerOutputDir}/validation_report.json"
            }

          analysisBedOutput="."
          igvBedOutput="."

          if [ "$generatePaddedArtifacts" = "true" ]; then
            echo "Generating analysis and IGV BED artifacts with ${padding}bp padding..."
            if ! python3 - \
              "${containerOutputDir}/${validBedName}" \
              "$referenceFaiFile" \
              "${containerOutputDir}/${validAnalysisBedName}" \
              "${containerOutputDir}/${validIgvBedName}" \
              "$padding" <<'PYTHON_SCRIPT'
          # BEGIN PADDED_BED_PYTHON
          import sys


          def read_fai(fai_path):
              chrom_sizes = {}
              chrom_order = {}
              with open(fai_path, "r") as fai:
                  for line_number, line in enumerate(fai, 1):
                      fields = line.rstrip("\n").split("\t")
                      if len(fields) < 2:
                          raise ValueError(
                              f"Malformed FASTA index at {fai_path}:{line_number}"
                          )
                      chrom = fields[0]
                      length = int(fields[1])
                      if not chrom or length < 1:
                          raise ValueError(
                              f"Invalid FASTA index bounds at {fai_path}:{line_number}"
                          )
                      if chrom in chrom_sizes and chrom_sizes[chrom] != length:
                          raise ValueError(f"Conflicting lengths for {chrom} in {fai_path}")
                      if chrom not in chrom_order:
                          chrom_order[chrom] = len(chrom_order)
                      chrom_sizes[chrom] = length
              if not chrom_sizes:
                  raise ValueError(f"No contig bounds found in FASTA index {fai_path}")
              return chrom_sizes, chrom_order


          def read_bed3(path, chrom_sizes):
              intervals = []
              with open(path, "r") as bed:
                  for line_number, line in enumerate(bed, 1):
                      stripped = line.strip()
                      if not stripped or stripped.startswith("#") or stripped.startswith("track"):
                          continue
                      fields = stripped.split("\t")
                      if len(fields) < 3:
                          raise ValueError(f"Expected at least 3 BED columns at {path}:{line_number}")
                      chrom = fields[0]
                      try:
                          start = int(fields[1])
                          end = int(fields[2])
                      except ValueError as error:
                          raise ValueError(f"Non-integer BED coordinates at {path}:{line_number}") from error
                      if chrom not in chrom_sizes:
                          raise ValueError(f"BED contig {chrom} has no FASTA index entry")
                      if start < 0 or end <= start or end > chrom_sizes[chrom]:
                          raise ValueError(
                              f"Out-of-bounds BED interval at {path}:{line_number}: {chrom}:{start}-{end}"
                          )
                      intervals.append((chrom, start, end))
              if not intervals:
                  raise ValueError(f"No intervals found in {path}")
              return intervals


          def merge_intervals(intervals, chrom_order):
              ordered = sorted(intervals, key=lambda item: (chrom_order[item[0]], item[1], item[2]))
              merged = []
              for chrom, start, end in ordered:
                  if merged and chrom == merged[-1][0] and start <= merged[-1][2]:
                      previous_chrom, previous_start, previous_end = merged[-1]
                      merged[-1] = (previous_chrom, previous_start, max(previous_end, end))
                  else:
                      merged.append((chrom, start, end))
              return merged


          def subtract_intervals(analysis_intervals, target_intervals, chrom_order):
              targets_by_chrom = {}
              for chrom, start, end in target_intervals:
                  targets_by_chrom.setdefault(chrom, []).append((start, end))

              padding_only = []
              for chrom, analysis_start, analysis_end in analysis_intervals:
                  cursor = analysis_start
                  for target_start, target_end in targets_by_chrom.get(chrom, []):
                      if target_end <= cursor:
                          continue
                      if target_start >= analysis_end:
                          break
                      clipped_start = max(target_start, analysis_start)
                      clipped_end = min(target_end, analysis_end)
                      if cursor < clipped_start:
                          padding_only.append((chrom, cursor, clipped_start))
                      cursor = max(cursor, clipped_end)
                      if cursor >= analysis_end:
                          break
                  if cursor < analysis_end:
                      padding_only.append((chrom, cursor, analysis_end))
              return sorted(
                  padding_only,
                  key=lambda item: (chrom_order[item[0]], item[1], item[2]),
              )


          def main():
              if len(sys.argv) != 6:
                  raise ValueError(
                      "Usage: padding.py VALIDATED_BED REFERENCE_FAI ANALYSIS_BED IGV_BED PADDING"
                  )
              validated_bed, reference_fai, analysis_bed, igv_bed, padding_value = sys.argv[1:]
              padding = int(padding_value)
              if padding < 0:
                  raise ValueError("Padding must be non-negative")

              chrom_sizes, chrom_order = read_fai(reference_fai)
              targets = read_bed3(validated_bed, chrom_sizes)
              target_union = merge_intervals(targets, chrom_order)
              padded = [
                  (chrom, max(0, start - padding), min(chrom_sizes[chrom], end + padding))
                  for chrom, start, end in target_union
              ]
              analysis_union = merge_intervals(padded, chrom_order)
              padding_only = subtract_intervals(analysis_union, target_union, chrom_order)

              with open(analysis_bed, "w") as output:
                  for chrom, start, end in analysis_union:
                      output.write(f"{chrom}\t{start}\t{end}\n")

              features = [
                  (chrom, start, end, "targeted", "128,128,128")
                  for chrom, start, end in target_union
              ] + [
                  (chrom, start, end, "padding", "211,211,211")
                  for chrom, start, end in padding_only
              ]
              features.sort(
                  key=lambda item: (chrom_order[item[0]], item[1], item[2], item[3])
              )
              with open(igv_bed, "w") as output:
                  output.write('track name="Targeted and Padding Regions" itemRgb="On"\n')
                  for chrom, start, end, feature_type, color in features:
                      output.write(
                          f"{chrom}\t{start}\t{end}\t{feature_type}\t0\t.\t"
                          f"{start}\t{end}\t{color}\n"
                      )

              print(
                  f"Generated {len(analysis_union)} BED3 analysis intervals and "
                  f"{len(features)} IGV features",
                  file=sys.stderr,
              )


          if __name__ == "__main__":
              main()
          # END PADDED_BED_PYTHON
          PYTHON_SCRIPT
            then
              echo "ERROR: Analysis/IGV BED generation failed. Refusing to use unpadded intervals."
              exit 1
            fi
            analysisBedOutput="${hostOutputDir}/${validAnalysisBedName}"
            igvBedOutput="${hostOutputDir}/${validIgvBedName}"
          else
            echo "Skipping padded BED artifacts for this validator invocation."
          fi

          # Write host output paths for Argo
          echo -n "${hostOutputDir}/${validBedName}" > /tmp/validated_bed_file
          echo -n "${hostOutputDir}/${validBedName}.gz" > /tmp/validated_bed_gz_file
          echo -n "${hostOutputDir}/validation_report.json" > /tmp/validation_report
          echo -n "${hostOutputDir}/${validCdsBedName}" > /tmp/validated_bed_cds_only_file
          echo -n "$analysisBedOutput" > /tmp/validated_bed_analysis_file
          echo -n "$igvBedOutput" > /tmp/validated_bed_igv_file
        volumeMounts:
          - name: input-bed-file
            mountPath: "/mnt/input/"
          - name: gtf-file
            mountPath: "/mnt/gtf/"
            readOnly: true
          - name: reference-fai-file
            mountPath: "/mnt/reference/"
            readOnly: true
          - name: chains-dir
            mountPath: "/mnt/chains/"
          - name: output-dir
            mountPath: "/mnt/output/"
