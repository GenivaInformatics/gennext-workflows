apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: annovar-to-maf-template
  namespace: argo
spec:
  templates:
    - name: annovar-to-maf
      inputs:
        parameters:
          - name: sample-id
          - name: annovar-out-f
          - name: ref-version
            value: "hg38"
      outputs:
        parameters:
          - name: annovar-maf-f
            value: "{{=sprig.osDir(inputs.parameters['annovar-out-f'])}}/{{inputs.parameters.sample-id}}.maf"
      volumes:
        - name: annovar-out-f
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['annovar-out-f'])}}"
            type: Directory
      script:
        name: annovar-script
        image: bergun/maftools-rs:v0.2.1@sha256:afc21a8c684a31e429142440850b393cee0f545c77a64e8facfcf9e4ba8f13f2
        workingDir: /mnt/input/
        command: [sh]
        source: |
          set -e
          input="/mnt/input/{{=sprig.osBase(inputs.parameters['annovar-out-f'])}}"
          # annovar-template leaves OncoKB's isoform table next to the multianno
          # when it ran the oncokbGene protocol; without it the MAF is as before.
          isoforms="${input%.hg38_multianno.txt}.oncokbGene.isoforms.tsv"
          set --
          if [ -s "$isoforms" ]; then set -- --oncokb-isoforms "$isoforms"; fi
          maftools-rs annovar-to-maf \
            --input "$input" \
            --output "/mnt/input/{{inputs.parameters.sample-id}}.maf" "$@"
        resources:
          requests:
            cpu: "1"
            memory: 256Mi
          limits:
            memory: 2Gi
        volumeMounts:
          - name: annovar-out-f
            mountPath: "/mnt/input/"
