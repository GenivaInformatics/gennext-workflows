# Local check gate: `mise run ci` must pass before a PR is merged; GitHub
# checks are advisory only. Needs Docker. The first run builds the
# oncokb-annotator image (network); later runs use the build cache.

[tasks."test:oncokb-annotator"]
description = "Wrapper tests in the oncokb-annotator image, against upstream's real AnnotatorCore"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker build -q -t oncokb-annotator:ci images/oncokb-annotator >/dev/null
docker run --rm --network none --entrypoint sh \
  -v "$PWD/images/oncokb-annotator:/work:ro" oncokb-annotator:ci \
  -c 'cd /tmp && PYTHONPATH=/work:/app/oncokb python3 -m unittest test_filtered_maf_annotator test_fusion_annotator >/tmp/log 2>&1; rc=$?; grep -E "^(FAIL|ERROR):" /tmp/log; tail -4 /tmp/log; exit $rc'
"""

[tasks."test:gennext-bpview"]
description = "bpview and fusion-events unit tests (they run in the image build), the load-step column check and an end-to-end run of the load step in DuckDB 0.8.1"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker build -q -t gennext-bpview:ci images/gennext-bpview >/dev/null
python3 images/gennext-bpview/tests/test_columns_match.py
python3 images/gennext-bpview/tests/test_load_events.py
"""

[tasks."test:oncokb-gene-db"]
description = "annovar-template's oncokbGene protocol, annovar-to-maf and CancerVar in their production images on the fixture, and install.sh under busybox"
run = """
#!/usr/bin/env bash
set -euo pipefail
# CancerVar's data files (public, pinned commit), for the CancerVar comparison
cv_commit=c8e26aa2cce71e3da83bdac0a04093414c66acbf
cv="${XDG_CACHE_HOME:-$HOME/.cache}/gennext-ci/cancervar-$cv_commit"
# the marker is written only after a complete checkout; without it, fetch again
if [ ! -f "$cv/.checkout-complete" ]; then
  rm -rf "$cv" && mkdir -p "$(dirname "$cv")"
  git clone -q --filter=blob:none --no-checkout https://github.com/WGLab/CancerVar.git "$cv"
  git -C "$cv" sparse-checkout set cancervardb
  git -C "$cv" -c advice.detachedHead=false checkout -q "$cv_commit"
  touch "$cv/.checkout-complete"
fi
CANCERVARDB="$cv/cancervardb" tests/test_annovar_oncokb_gene.sh
tests/test_oncokb_gene_db_install.sh
"""

[tasks."test:hrd-null-fallback"]
description = "HRD that scarHRD could not compute is written and posted as null, not 0: the scarhrd fallback and collect-hrd-data, run from the templates"
run = "python3 tests/test_hrd_null_fallback.py"

[tasks.ci]
description = "The check gate"
depends = ["test:oncokb-annotator", "test:gennext-bpview", "test:oncokb-gene-db", "test:hrd-null-fallback"]
