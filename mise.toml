# Local check gate: `mise run ci` must pass before a PR is merged; GitHub
# checks are advisory only. Needs Docker. The first run builds the
# oncokb-annotator image (network); later runs use the build cache.

[tasks."test:oncokb-annotator"]
description = "Wrapper tests in the oncokb-annotator image, against upstream's real AnnotatorCore"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker build -q -t oncokb-annotator:ci images/oncokb-annotator >/dev/null
docker run --rm --network none --entrypoint sh \
  -v "$PWD/images/oncokb-annotator:/work:ro" oncokb-annotator:ci \
  -c 'cd /tmp && PYTHONPATH=/work:/app/oncokb python3 -m unittest test_filtered_maf_annotator >/tmp/log 2>&1; rc=$?; grep -E "^(FAIL|ERROR):" /tmp/log; tail -4 /tmp/log; exit $rc'
"""

[tasks."test:gennext-bpview"]
description = "bpview and fusion-events unit tests (they run in the image build), the load-step column check and an end-to-end run of the load step in DuckDB 0.8.1"
run = """
#!/usr/bin/env bash
set -euo pipefail
docker build -q -t gennext-bpview:ci images/gennext-bpview >/dev/null
python3 images/gennext-bpview/tests/test_columns_match.py
python3 images/gennext-bpview/tests/test_load_events.py
"""

[tasks."test:oncokb-gene-db"]
description = "annovar-template's oncokbGene protocol and annovar-to-maf in their production images on the fixture, and install.sh under busybox"
run = """
#!/usr/bin/env bash
set -euo pipefail
tests/test_annovar_oncokb_gene.sh
tests/test_oncokb_gene_db_install.sh
"""

[tasks.ci]
description = "The check gate"
depends = ["test:oncokb-annotator", "test:gennext-bpview", "test:oncokb-gene-db"]
