apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: per-sample-somatic-dna-rna
  namespace: argo
  annotations:
    gennext.bio/expected-pods-fastq: "74"
    gennext.bio/expected-pods-bam: "66"
spec:
  serviceAccountName: gennext-workflows
  entrypoint: main
  onExit: on-exit-handler
  arguments:
    parameters:
      - name: sample-uuid
      - name: sample-id
      - name: run-id
      - name: user-id
      - name: process-type
      - name: input-rel-dir
      - name: output-rel-dir
      - name: temp-rel-dir
      - name: scratch-rel-dir
      - name: ref-base-dir
      - name: modules-base-dir
      - name: annots-base-dir
      - name: thread-count
      - name: processing-group-id
  templates:
    - name: main
      dag:
        tasks:
          - name: set-sample-running
            templateRef:
              name: change-sample-state-template
              template: change-sample-state
            arguments:
              parameters:
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: sample-state
                  value: "running"
          - name: load-and-prepare-dna
            templateRef:
              name: load-and-prepare
              template: load-and-prepare-dna
            arguments:
              parameters:
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: input-rel-dir
                  value: "{{workflow.parameters.input-rel-dir}}"
                - name: output-rel-dir
                  value: "{{workflow.parameters.output-rel-dir}}"
                - name: temp-rel-dir
                  value: "{{workflow.parameters.temp-rel-dir}}"
                - name: scratch-rel-dir
                  value: "{{workflow.parameters.scratch-rel-dir}}"
                - name: ref-base-dir
                  value: "{{workflow.parameters.ref-base-dir}}"
          # --- DNA BRANCH ---
          - name: run-dna-fastq
            when: "'{{tasks.load-and-prepare-dna.outputs.parameters.dna-file-type}}' == 'fastq'"
            templateRef:
              name: somatic-dna-fastq-v2
              template: somatic-testing-dna-gpu-fastq-v2
            arguments:
              parameters:
                - name: user-id
                  value: "{{workflow.parameters.user-id}}"
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: dna-input-files
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.dna-input-files}}"
                - name: tumor-type
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.tumor-type}}"
                - name: ref-version
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}"
                - name: ref-paths
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-paths}}"
                - name: ref-base-dir
                  value: "{{workflow.parameters.ref-base-dir}}"
                - name: sample-input-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-input-dir}}"
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: sample-temp-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-temp-dir}}"
                - name: sample-scratch-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-scratch-dir}}"
                - name: thread-count
                  value: "{{workflow.parameters.thread-count}}"
            depends: "set-sample-running && load-and-prepare-dna"
          - name: run-dna-bam
            when: "'{{tasks.load-and-prepare-dna.outputs.parameters.dna-file-type}}' == 'bam'"
            templateRef:
              name: somatic-dna-bam-v2
              template: somatic-testing-dna-gpu-bam-v2
            arguments:
              parameters:
                - name: user-id
                  value: "{{workflow.parameters.user-id}}"
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: dna-input-files
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.dna-input-files}}"
                - name: tumor-type
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.tumor-type}}"
                - name: ref-version
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}"
                - name: ref-paths
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-paths}}"
                - name: ref-base-dir
                  value: "{{workflow.parameters.ref-base-dir}}"
                - name: sample-input-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-input-dir}}"
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: sample-temp-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-temp-dir}}"
                - name: sample-scratch-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-scratch-dir}}"
                - name: thread-count
                  value: "{{workflow.parameters.thread-count}}"
            depends: "set-sample-running && load-and-prepare-dna"
          - name: run-dna-vcf
            when: "'{{tasks.load-and-prepare-dna.outputs.parameters.dna-file-type}}' == 'vcf'"
            templateRef:
              name: somatic-dna-vcf-v2
              template: somatic-testing-dna-gpu-vcf-v2
            arguments:
              parameters:
                - name: user-id
                  value: "{{workflow.parameters.user-id}}"
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: dna-input-files
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.dna-input-files}}"
                - name: tumor-type
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.tumor-type}}"
                - name: ref-version
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}"
                - name: ref-paths
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-paths}}"
                - name: ref-base-dir
                  value: "{{workflow.parameters.ref-base-dir}}"
                - name: sample-input-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-input-dir}}"
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: sample-temp-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-temp-dir}}"
                - name: sample-scratch-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-scratch-dir}}"
                - name: thread-count
                  value: "{{workflow.parameters.thread-count}}"
            depends: "set-sample-running && load-and-prepare-dna"
          # --- RNA BRANCH (sequential after DNA — re-copies RNA files to scratch after DNA cleanup) ---
          - name: load-and-prepare-rna
            templateRef:
              name: load-and-prepare
              template: load-and-prepare-rna
            arguments:
              parameters:
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: input-rel-dir
                  value: "{{workflow.parameters.input-rel-dir}}"
                - name: output-rel-dir
                  value: "{{workflow.parameters.output-rel-dir}}"
                - name: temp-rel-dir
                  value: "{{workflow.parameters.temp-rel-dir}}"
                - name: scratch-rel-dir
                  value: "{{workflow.parameters.scratch-rel-dir}}"
                - name: ref-base-dir
                  value: "{{workflow.parameters.ref-base-dir}}"
            depends: "(run-dna-fastq.Succeeded || run-dna-fastq.Skipped) && (run-dna-bam.Succeeded || run-dna-bam.Skipped) && (run-dna-vcf.Succeeded || run-dna-vcf.Skipped)"
          - name: run-rna-fastq
            when: "'{{tasks.load-and-prepare-rna.outputs.parameters.rna-file-type}}' == 'fastq'"
            templateRef:
              name: somatic-rna-fastq-v2
              template: somatic-testing-rna-gpu-fastq-v2
            arguments:
              parameters:
                - name: user-id
                  value: "{{workflow.parameters.user-id}}"
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-id
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-id}}"
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: rna-input-files
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.rna-input-files}}"
                - name: tumor-type
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.tumor-type}}"
                - name: ref-version
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.ref-version}}"
                - name: ref-paths
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.ref-paths}}"
                - name: ref-base-dir
                  value: "{{workflow.parameters.ref-base-dir}}"
                - name: sample-input-dir
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-input-dir}}"
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-output-dir}}"
                - name: sample-temp-dir
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-temp-dir}}"
                - name: sample-scratch-dir
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-scratch-dir}}"
                - name: thread-count
                  value: "{{workflow.parameters.thread-count}}"
            depends: "load-and-prepare-rna"
          - name: run-rna-bam
            when: "'{{tasks.load-and-prepare-rna.outputs.parameters.rna-file-type}}' == 'bam'"
            templateRef:
              name: somatic-rna-bam-v2
              template: somatic-testing-rna-gpu-bam-v2
            arguments:
              parameters:
                - name: user-id
                  value: "{{workflow.parameters.user-id}}"
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-id
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-id}}"
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: rna-input-files
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.rna-input-files}}"
                - name: tumor-type
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.tumor-type}}"
                - name: ref-version
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.ref-version}}"
                - name: ref-paths
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.ref-paths}}"
                - name: ref-base-dir
                  value: "{{workflow.parameters.ref-base-dir}}"
                - name: sample-input-dir
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-input-dir}}"
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-output-dir}}"
                - name: sample-temp-dir
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-temp-dir}}"
                - name: sample-scratch-dir
                  value: "{{tasks.load-and-prepare-rna.outputs.parameters.sample-scratch-dir}}"
                - name: thread-count
                  value: "{{workflow.parameters.thread-count}}"
            depends: "load-and-prepare-rna"
          - name: set-sample-completed
            when: "'{{workflow.parameters.processing-group-id}}' != '' || '{{tasks.load-and-prepare-dna.outputs.parameters.has-post-processing}}' == 'false'"
            templateRef:
              name: change-sample-state-template
              template: change-sample-state
            arguments:
              parameters:
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: sample-state
                  value: "completed"
            depends: "(run-dna-fastq.Succeeded || run-dna-fastq.Skipped) && (run-dna-bam.Succeeded || run-dna-bam.Skipped) && (run-dna-vcf.Succeeded || run-dna-vcf.Skipped) && (run-rna-fastq.Succeeded || run-rna-fastq.Skipped) && (run-rna-bam.Succeeded || run-rna-bam.Skipped)"
          - name: set-sample-postprocessing
            when: "'{{workflow.parameters.processing-group-id}}' == '' && '{{tasks.load-and-prepare-dna.outputs.parameters.has-post-processing}}' == 'true'"
            templateRef:
              name: change-sample-state-template
              template: change-sample-state
            arguments:
              parameters:
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: sample-state
                  value: "post_processing"
            depends: "(run-dna-fastq.Succeeded || run-dna-fastq.Skipped) && (run-dna-bam.Succeeded || run-dna-bam.Skipped) && (run-dna-vcf.Succeeded || run-dna-vcf.Skipped) && (run-rna-fastq.Succeeded || run-rna-fastq.Skipped) && (run-rna-bam.Succeeded || run-rna-bam.Skipped)"

    - name: on-exit-handler
      steps:
        - - name: set-sample-error
            templateRef:
              name: change-sample-state-template
              template: change-sample-state
            arguments:
              parameters:
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: sample-state
                  value: "error"
            when: "{{workflow.status}} == Failed"
