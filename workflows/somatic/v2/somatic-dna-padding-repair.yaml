apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: somatic-dna-padding-repair-v1
  namespace: argo
  annotations:
    gennext.bio/description: >-
      Refresh padding-affected SNV/IGV outputs for an existing sample from its
      recalibrated BAM. Does NOT rerun alignment, CNV, SV, MSI, coverage/QC, or
      HRD. mode=validate computes and validates without mutating live output;
      mode=apply promotes with atomic directory exchange and publishes TMB.
spec:
  workflowMetadata:
    annotations:
      gennext.bio/source-revision: "d5a560f8027b0b09bd2fcda2646f03b03a639bc8"
  serviceAccountName: gennext-workflows
  entrypoint: padding-repair
  synchronization:
    mutex:
      name: "padding-repair-{{workflow.parameters.sample-uuid}}"
  nodeSelector:
    kubernetes.io/hostname: "{{workflow.parameters.node-name}}"
  arguments:
    parameters:
      - name: node-name
      - name: user-id
      - name: run-id
      - name: sample-uuid
      - name: mode
        value: validate
  templates:
    # ═══════════════════════════════════════════════════════════════════
    # DAG: padding-repair
    # ═══════════════════════════════════════════════════════════════════
    - name: padding-repair
      dag:
        tasks:
          # ── 1. Resolve node infrastructure ─────────────────────────
          - name: get-node-config
            templateRef:
              name: get-node-config
              template: get-node-config
            arguments:
              parameters:
                - name: node-name
                  value: "{{workflow.parameters.node-name}}"
                - name: user-id
                  value: "{{workflow.parameters.user-id}}"
                - name: job-id
                  value: "{{workflow.parameters.run-id}}"

          # ── 2. Resolve sample metadata ─────────────────────────────
          - name: load-and-prepare-dna
            templateRef:
              name: load-and-prepare
              template: load-and-prepare-dna
            arguments:
              parameters:
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: input-rel-dir
                  value: "{{tasks.get-node-config.outputs.parameters.input-rel-dir}}"
                - name: output-rel-dir
                  value: "{{tasks.get-node-config.outputs.parameters.output-rel-dir}}"
                - name: temp-rel-dir
                  value: "{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}"
                - name: scratch-rel-dir
                  value: "{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}"
                - name: ref-base-dir
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}"
            depends: "get-node-config"

          # ── 3. Validate prerequisites ──────────────────────────────
          - name: validate-sample
            template: validate-sample-for-repair
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: dna-file-type
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.dna-file-type}}"
                - name: dna-input-files
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.dna-input-files}}"
                - name: ref-paths
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-paths}}"
                - name: tumor-type
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.tumor-type}}"
                - name: ref-base-dir
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}"
            depends: "load-and-prepare-dna"

          # ── 4. Compute workflow-UID transaction paths ───────────────
          - name: compute-repair-paths
            template: compute-repair-paths
            arguments:
              parameters:
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
            depends: "validate-sample"

          # ── 5a. Regenerate padded BEDs from original target BED ────
          - name: validate-bed-file
            templateRef:
              name: bed-validator-template
              template: validate-bed-file
            arguments:
              parameters:
                - name: input-bed-file
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['dna-input-files'], '$.regionsFile')}}"
                - name: gtf-file
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}/gene_annots/gencode.v49.basic.annotation.MANE_Select.gtf.gz"
                - name: reference-fai-file
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['ref-paths'], '$.genome')}}.fai"
                - name: chains-dir
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}/other/chains/"
                - name: output-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}metrics/bed_validation/"
                - name: padding
                  value: "100"
                - name: generate-padded-artifacts
                  value: "true"
            depends: "compute-repair-paths"

          # ── 5b. Stage DuckDB copy ─────────────────────────────────
          - name: stage-duckdb
            template: stage-duckdb-copy
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: tx-root
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}"
            depends: "compute-repair-paths"

          # ── 6. Snapshot DuckDB non-SNV inventory ───────────────────
          - name: snapshot-duckdb-inventory
            template: snapshot-duckdb-inventory
            arguments:
              parameters:
                - name: staged-duckdb
                  value: "{{tasks.stage-duckdb.outputs.parameters.staged-duckdb}}"
                - name: inventory-file
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}duckdb_inventory.json"
            depends: "stage-duckdb"

          # ── 7. Sharded Mutect2 (analysis BED, existing recal BAM) ──
          - name: mutect2
            templateRef:
              name: mutect2-sharded-template
              template: mutect2-tumor-only-sharded
            arguments:
              parameters:
                - name: input-bam
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}bam/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_recal.bam"
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: genome-ref
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['ref-paths'], '$.genome')}}"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
                - name: sample-scratch-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-scratch-dir}}"
                - name: output-vcf
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/vcf/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_mutect2_marked.vcf.gz"
            depends: "validate-bed-file && snapshot-duckdb-inventory"

          # ── 8. bcftools filter (analysis BED) ──────────────────────
          - name: bcftools-filter
            templateRef:
              name: bcftools-template
              template: bcftools-filter-and-bed
            arguments:
              parameters:
                - name: do-filter
                  value: ""
                - name: input-vcf-f
                  value: "{{tasks.mutect2.outputs.parameters.output-vcf}}"
                - name: output-vcf-f
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/vcf/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_mutect2_filtered.vcf.gz"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
            depends: "mutect2"

          # ── 9. VLOD ────────────────────────────────────────────────
          - name: vlod
            templateRef:
              name: vlod-template
              template: vlod
            arguments:
              parameters:
                - name: input-bam
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}bam/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_recal.bam"
                - name: input-vcf
                  value: "{{tasks.bcftools-filter.outputs.parameters.output-vcf-f}}"
                - name: vlod-output-vcf
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_mutect2_vlod.vcf"
                - name: thread-count
                  value: "{{tasks.get-node-config.outputs.parameters.thread-count}}"
            depends: "bcftools-filter"

          # ── 10. Annovar ────────────────────────────────────────────
          - name: annovar
            templateRef:
              name: annovar-template
              template: annovar
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: input-vcf-f
                  value: "{{tasks.vlod.outputs.parameters.vlod-output-vcf}}"
                - name: ref-version
                  value: "hg38"
                - name: output-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/"
                - name: annovardb-dir
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['ref-paths'], '$.other.annovar')}}"
            depends: "vlod"

          # ── 11. CancerVar ──────────────────────────────────────────
          - name: cancervar
            templateRef:
              name: cancervar-template
              template: cancervar
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: input-vcf-f
                  value: "{{tasks.vlod.outputs.parameters.vlod-output-vcf}}"
                - name: output-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/"
                - name: annovardb-dir
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['ref-paths'], '$.other.annovar')}}"
            depends: "annovar"

          # ── 12. Annovar → MAF ──────────────────────────────────────
          - name: annovar-to-maf
            templateRef:
              name: annovar-to-maf-template
              template: annovar-to-maf
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: annovar-out-f
                  value: "{{tasks.annovar.outputs.parameters.annovar-out-f}}"
            depends: "annovar"

          # ── 13. OncoKB SNV (no global MAF importer) ────────────────
          - name: oncokb-snv
            templateRef:
              name: oncokb-templates
              template: oncokb-snv
            arguments:
              parameters:
                - name: annovar-maf-f
                  value: "{{tasks.annovar-to-maf.outputs.parameters.annovar-maf-f}}"
                - name: annovar-oncokb-maf-f
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_oncokb.maf"
                - name: ref-version
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}"
                - name: tumor-type
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.tumor-type}}"
                - name: max-attempts
                  value: "12"
                - name: retry-delay-seconds
                  value: "30"
            depends: "annovar-to-maf"

          # ── 14. Determine OtherInfo column names ───────────────────
          - name: get-otherinfo-columns
            templateRef:
              name: duckdb-template
              template: determine-otherinfo-column
            arguments:
              parameters:
                - name: annovar-oncokb-maf
                  value: "{{tasks.oncokb-snv.outputs.parameters.annovar-oncokb-maf-f}}"
            depends: "oncokb-snv"

          # ── 15. DuckDB SNV refresh (on staged copy) ────────────────
          - name: duckdb-snv
            templateRef:
              name: duckdb-template
              template: duckdb-snv
            arguments:
              parameters:
                - name: annovar-oncokb-maf
                  value: "{{tasks.oncokb-snv.outputs.parameters.annovar-oncokb-maf-f}}"
                - name: cancervar-tsv
                  value: "{{tasks.cancervar.outputs.parameters.cancervar-out-f}}"
                - name: vlod-column-name
                  value: "{{tasks.get-otherinfo-columns.outputs.parameters.vlod-column-name}}"
                - name: filter-column-name
                  value: "{{tasks.get-otherinfo-columns.outputs.parameters.filter-column-name}}"
                - name: sample-column-name
                  value: "{{tasks.get-otherinfo-columns.outputs.parameters.sample-column-name}}"
                - name: output-duckdb
                  value: "{{tasks.stage-duckdb.outputs.parameters.staged-duckdb}}"
            depends: "get-otherinfo-columns && cancervar && stage-duckdb"

          # ── 16. Verify non-SNV DuckDB objects survived ─────────────
          - name: verify-duckdb-preservation
            template: verify-duckdb-preservation
            arguments:
              parameters:
                - name: staged-duckdb
                  value: "{{tasks.stage-duckdb.outputs.parameters.staged-duckdb}}"
                - name: inventory-file
                  value: "{{tasks.snapshot-duckdb-inventory.outputs.parameters.inventory-file}}"
            depends: "duckdb-snv"

          # ── 17. Assemble candidate (cp live + overlay repairs) ─────
          - name: assemble-candidate
            template: assemble-candidate
            arguments:
              parameters:
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: tx-root
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
            depends: "verify-duckdb-preservation && validate-bed-file"

          # ── 18. Compute TMB into candidate (unpadded BED) ──────────
          - name: compute-tmb
            template: compute-tmb-data
            arguments:
              parameters:
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: duckdb-file
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}results/db/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_results.duckdb"
                - name: target-bed-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: output-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}metrics/tmb/"
                - name: cosmic-vcf
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/cosmic/Cosmic_CompleteTargetedScreensMutant_v103_GRCh38.vcf.gz"
                - name: filter-common-variants
                  value: "true"
                - name: gnomad-vcf
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/common_variants/gnomad4/gnomad4_1pct.vcf.gz"
                - name: turkish-variome-vcf
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/common_variants/turkish_variome/turkish_variome_1pct.vcf.gz"
                - name: common-af-threshold
                  value: "0.01"
            depends: "assemble-candidate"

          # ── 19. Write manifest into candidate ──────────────────────
          - name: write-manifest
            template: write-repair-manifest
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
                - name: analysis-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
                - name: igv-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-igv-file}}"
                - name: staged-duckdb
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}results/db/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_results.duckdb"
                - name: target-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: input-bam
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}bam/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_recal.bam"
            depends: "compute-tmb"

          # ── 20. Validate assembled candidate ───────────────────────
          - name: validate-candidate
            template: validate-candidate-artifacts
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
                - name: analysis-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
                - name: igv-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-igv-file}}"
                - name: target-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: reference-fai-file
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['ref-paths'], '$.genome')}}.fai"
            depends: "write-manifest"

          # ── 21. Promote (mode=apply, atomic exchange) ──────────────
          - name: promote
            when: "'{{workflow.parameters.mode}}' == 'apply'"
            template: promote-candidate
            arguments:
              parameters:
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
            depends: "validate-candidate"

          # ── 22. Publish TMB (mode=apply, after promotion) ──────────
          - name: publish-tmb
            when: "'{{workflow.parameters.mode}}' == 'apply'"
            template: publish-tmb-result
            arguments:
              parameters:
                - name: request-json
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}metrics/tmb/tmb_api_payload.json"
            depends: "promote.Succeeded"

          # ── 23. Finalize state and UID-scoped transaction paths ───
          - name: finalize
            template: finalize-repair
            arguments:
              parameters:
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
                - name: tx-root
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}"
                - name: validation-status
                  value: "{{tasks.validate-candidate.status}}"
                - name: promote-status
                  value: "{{tasks.promote.status}}"
                - name: publish-status
                  value: "{{tasks.publish-tmb.status}}"
            depends: >-
              compute-repair-paths.Succeeded &&
              (validate-candidate.Succeeded || validate-candidate.Failed ||
               validate-candidate.Errored || validate-candidate.Skipped ||
               validate-candidate.Omitted) &&
              (promote.Succeeded || promote.Failed || promote.Errored ||
               promote.Skipped || promote.Omitted) &&
              (publish-tmb.Succeeded || publish-tmb.Failed ||
               publish-tmb.Errored || publish-tmb.Skipped ||
               publish-tmb.Omitted)

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: validate-sample-for-repair
    # ═══════════════════════════════════════════════════════════════════
    - name: validate-sample-for-repair
      inputs:
        parameters:
          - name: sample-id
          - name: sample-output-dir
          - name: dna-file-type
          - name: dna-input-files
          - name: ref-paths
          - name: tumor-type
          - name: ref-base-dir
      volumes:
        - name: sample-output
          hostPath:
            path: "{{inputs.parameters.sample-output-dir}}"
            type: Directory
        - name: ref-base
          hostPath:
            path: "{{inputs.parameters.ref-base-dir}}"
            type: Directory
      script:
        image: python:3.11-alpine3.18
        command: [python]
        volumeMounts:
          - name: sample-output
            mountPath: /mnt/output/
            readOnly: true
          - name: ref-base
            mountPath: /mnt/ref/
            readOnly: true
        source: |
          # BEGIN VALIDATE_SAMPLE_PYTHON
          import json, os, sys

          mode = "{{workflow.parameters.mode}}"
          sample_id = "{{inputs.parameters.sample-id}}"
          dna_type = "{{inputs.parameters.dna-file-type}}"
          dna_files = json.loads('''{{inputs.parameters.dna-input-files}}''')
          ref_paths = json.loads('''{{inputs.parameters.ref-paths}}''')
          tumor_type = "{{inputs.parameters.tumor-type}}"
          ref_base = "{{inputs.parameters.ref-base-dir}}"

          errors = []

          if mode not in ("validate", "apply"):
              errors.append(f"Invalid mode '{mode}': must be 'validate' or 'apply'")

          if dna_type == "vcf":
              errors.append("VCF-only samples cannot be repaired (no recalibrated BAM)")

          if not tumor_type or tumor_type == ".":
              errors.append("Tumor type not resolved")

          recal_bam = os.path.join("/mnt/output/", "bam", f"{sample_id}_recal.bam")
          if not os.path.isfile(recal_bam):
              errors.append(f"Recalibrated BAM not found: bam/{sample_id}_recal.bam")
          elif not os.access(recal_bam, os.R_OK):
              errors.append("Recalibrated BAM not readable")
          else:
              if not (os.path.isfile(recal_bam + ".bai") or
                      os.path.isfile(recal_bam.replace(".bam", ".bai"))):
                  errors.append("BAM index not found")

          duckdb_path = os.path.join("/mnt/output/", "results", "db",
                                     f"{sample_id}_results.duckdb")
          if not os.path.isfile(duckdb_path):
              errors.append(f"Results DuckDB not found: results/db/{sample_id}_results.duckdb")
          elif os.path.getsize(duckdb_path) == 0:
              errors.append("Results DuckDB is empty")

          regions = dna_files.get("regionsFile", "")
          if not regions or regions == ".":
              errors.append("No target BED (WGS or legacy sample)")

          genome = ref_paths.get("genome", "")
          if not genome:
              errors.append("Reference genome path not resolved")
          else:
              genome_mount = genome.replace(ref_base, "/mnt/ref/", 1)
              if not os.path.isfile(genome_mount):
                  errors.append(f"Genome FASTA not found at {genome}")
              fai = genome_mount + ".fai"
              if not os.path.isfile(fai):
                  errors.append(f"Genome FASTA index not found at {genome}.fai")

          annovar = ref_paths.get("other", {}).get("annovar", "")
          if not annovar:
              errors.append("Annovar DB path not resolved")
          else:
              annovar_mount = annovar.replace(ref_base, "/mnt/ref/", 1)
              if not os.path.isdir(annovar_mount):
                  errors.append(f"Annovar DB directory not found at {annovar}")

          for vcf_name in [
              "hg38/other/cosmic/Cosmic_CompleteTargetedScreensMutant_v103_GRCh38.vcf.gz",
              "hg38/other/common_variants/gnomad4/gnomad4_1pct.vcf.gz",
              "hg38/other/common_variants/turkish_variome/turkish_variome_1pct.vcf.gz",
          ]:
              vcf_path = os.path.join("/mnt/ref/", vcf_name)
              if not os.path.isfile(vcf_path):
                  errors.append(f"Reference VCF not found: {vcf_name}")

          if errors:
              print("Sample validation failed:", file=sys.stderr)
              for e in errors:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)

          print(f"Sample {sample_id} validated for padding repair (mode={mode})")
          # END VALIDATE_SAMPLE_PYTHON

