apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: somatic-dna-padding-repair-v1
  namespace: argo
  annotations:
    gennext.bio/description: >-
      Refresh padding-affected SNV/IGV outputs for an existing sample from its
      recalibrated BAM. Does NOT rerun alignment, CNV, SV, MSI, coverage/QC, or
      HRD. mode=validate computes and validates without mutating live output;
      mode=apply promotes with atomic directory exchange and publishes TMB.
spec:
  serviceAccountName: gennext-workflows
  entrypoint: padding-repair
  synchronization:
    mutex:
      name: "padding-repair-{{workflow.parameters.sample-uuid}}"
  nodeSelector:
    kubernetes.io/hostname: "{{workflow.parameters.node-name}}"
  arguments:
    parameters:
      - name: node-name
      - name: user-id
      - name: run-id
      - name: sample-uuid
      - name: mode
        value: validate
  templates:
    # ═══════════════════════════════════════════════════════════════════
    # DAG: padding-repair
    # ═══════════════════════════════════════════════════════════════════
    - name: padding-repair
      dag:
        tasks:
          # ── 1. Resolve node infrastructure ─────────────────────────
          - name: get-node-config
            templateRef:
              name: get-node-config
              template: get-node-config
            arguments:
              parameters:
                - name: node-name
                  value: "{{workflow.parameters.node-name}}"
                - name: user-id
                  value: "{{workflow.parameters.user-id}}"
                - name: job-id
                  value: "{{workflow.parameters.run-id}}"

          # ── 2. Resolve sample metadata ─────────────────────────────
          - name: load-and-prepare-dna
            templateRef:
              name: load-and-prepare
              template: load-and-prepare-dna
            arguments:
              parameters:
                - name: sample-uuid
                  value: "{{workflow.parameters.sample-uuid}}"
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: input-rel-dir
                  value: "{{tasks.get-node-config.outputs.parameters.input-rel-dir}}"
                - name: output-rel-dir
                  value: "{{tasks.get-node-config.outputs.parameters.output-rel-dir}}"
                - name: temp-rel-dir
                  value: "{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}"
                - name: scratch-rel-dir
                  value: "{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}"
                - name: ref-base-dir
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}"
            depends: "get-node-config"

          # ── 3. Validate prerequisites ──────────────────────────────
          - name: validate-sample
            template: validate-sample-for-repair
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: dna-file-type
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.dna-file-type}}"
                - name: dna-input-files
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.dna-input-files}}"
                - name: ref-paths
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-paths}}"
                - name: tumor-type
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.tumor-type}}"
                - name: ref-base-dir
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}"
            depends: "load-and-prepare-dna"

          # ── 4. Compute workflow-UID transaction paths ───────────────
          - name: compute-repair-paths
            template: compute-repair-paths
            arguments:
              parameters:
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
            depends: "validate-sample"

          # ── 5a. Regenerate padded BEDs from original target BED ────
          - name: validate-bed-file
            templateRef:
              name: bed-validator-template
              template: validate-bed-file
            arguments:
              parameters:
                - name: input-bed-file
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['dna-input-files'], '$.regionsFile')}}"
                - name: gtf-file
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}/gene_annots/gencode.v49.basic.annotation.MANE_Select.gtf.gz"
                - name: reference-fai-file
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['ref-paths'], '$.genome')}}.fai"
                - name: chains-dir
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}/other/chains/"
                - name: output-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}metrics/bed_validation/"
                - name: padding
                  value: "100"
                - name: generate-padded-artifacts
                  value: "true"
            depends: "compute-repair-paths"

          # ── 5b. Stage DuckDB copy ─────────────────────────────────
          - name: stage-duckdb
            template: stage-duckdb-copy
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: tx-root
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}"
            depends: "compute-repair-paths"

          # ── 6. Snapshot DuckDB non-SNV inventory ───────────────────
          - name: snapshot-duckdb-inventory
            template: snapshot-duckdb-inventory
            arguments:
              parameters:
                - name: staged-duckdb
                  value: "{{tasks.stage-duckdb.outputs.parameters.staged-duckdb}}"
            depends: "stage-duckdb"

          # ── 7. Sharded Mutect2 (analysis BED, existing recal BAM) ──
          - name: mutect2
            templateRef:
              name: mutect2-sharded-template
              template: mutect2-tumor-only-sharded
            arguments:
              parameters:
                - name: input-bam
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}bam/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_recal.bam"
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: genome-ref
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['ref-paths'], '$.genome')}}"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
                - name: sample-scratch-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-scratch-dir}}"
                - name: output-vcf
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/vcf/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_mutect2_marked.vcf.gz"
            depends: "validate-bed-file && snapshot-duckdb-inventory"

          # ── 8. bcftools filter (analysis BED) ──────────────────────
          - name: bcftools-filter
            templateRef:
              name: bcftools-template
              template: bcftools-filter-and-bed
            arguments:
              parameters:
                - name: do-filter
                  value: ""
                - name: input-vcf-f
                  value: "{{tasks.mutect2.outputs.parameters.output-vcf}}"
                - name: output-vcf-f
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/vcf/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_mutect2_filtered.vcf.gz"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
            depends: "mutect2"

          # ── 9. VLOD ────────────────────────────────────────────────
          - name: vlod
            templateRef:
              name: vlod-template
              template: vlod
            arguments:
              parameters:
                - name: input-bam
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}bam/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_recal.bam"
                - name: input-vcf
                  value: "{{tasks.bcftools-filter.outputs.parameters.output-vcf-f}}"
                - name: vlod-output-vcf
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_mutect2_vlod.vcf"
                - name: thread-count
                  value: "{{tasks.get-node-config.outputs.parameters.thread-count}}"
            depends: "bcftools-filter"

          # ── 10. Annovar ────────────────────────────────────────────
          - name: annovar
            templateRef:
              name: annovar-template
              template: annovar
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: input-vcf-f
                  value: "{{tasks.vlod.outputs.parameters.vlod-output-vcf}}"
                - name: ref-version
                  value: "hg38"
                - name: output-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/"
                - name: annovardb-dir
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['ref-paths'], '$.other.annovar')}}"
            depends: "vlod"

          # ── 11. CancerVar ──────────────────────────────────────────
          - name: cancervar
            templateRef:
              name: cancervar-template
              template: cancervar
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: input-vcf-f
                  value: "{{tasks.vlod.outputs.parameters.vlod-output-vcf}}"
                - name: output-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/"
                - name: annovardb-dir
                  value: "{{=jsonpath(tasks['load-and-prepare-dna'].outputs.parameters['ref-paths'], '$.other.annovar')}}"
            depends: "annovar"

          # ── 12. Annovar → MAF ──────────────────────────────────────
          - name: annovar-to-maf
            templateRef:
              name: annovar-to-maf-template
              template: annovar-to-maf
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: annovar-out-f
                  value: "{{tasks.annovar.outputs.parameters.annovar-out-f}}"
            depends: "annovar"

          # ── 13. OncoKB SNV (no global MAF importer) ────────────────
          - name: oncokb-snv
            templateRef:
              name: oncokb-templates
              template: oncokb-snv
            arguments:
              parameters:
                - name: annovar-maf-f
                  value: "{{tasks.annovar-to-maf.outputs.parameters.annovar-maf-f}}"
                - name: annovar-oncokb-maf-f
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_oncokb.maf"
                - name: ref-version
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}"
                - name: tumor-type
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.tumor-type}}"
            depends: "annovar-to-maf"

          # ── 14. Determine OtherInfo column names ───────────────────
          - name: get-otherinfo-columns
            templateRef:
              name: duckdb-template
              template: determine-otherinfo-column
            arguments:
              parameters:
                - name: annovar-oncokb-maf
                  value: "{{tasks.oncokb-snv.outputs.parameters.annovar-oncokb-maf-f}}"
            depends: "oncokb-snv"

          # ── 15. DuckDB SNV refresh (on staged copy) ────────────────
          - name: duckdb-snv
            templateRef:
              name: duckdb-template
              template: duckdb-snv
            arguments:
              parameters:
                - name: annovar-oncokb-maf
                  value: "{{tasks.oncokb-snv.outputs.parameters.annovar-oncokb-maf-f}}"
                - name: cancervar-tsv
                  value: "{{tasks.cancervar.outputs.parameters.cancervar-out-f}}"
                - name: vlod-column-name
                  value: "{{tasks.get-otherinfo-columns.outputs.parameters.vlod-column-name}}"
                - name: filter-column-name
                  value: "{{tasks.get-otherinfo-columns.outputs.parameters.filter-column-name}}"
                - name: sample-column-name
                  value: "{{tasks.get-otherinfo-columns.outputs.parameters.sample-column-name}}"
                - name: output-duckdb
                  value: "{{tasks.stage-duckdb.outputs.parameters.staged-duckdb}}"
            depends: "get-otherinfo-columns && cancervar && stage-duckdb"

          # ── 16. Verify non-SNV DuckDB objects survived ─────────────
          - name: verify-duckdb-preservation
            template: verify-duckdb-preservation
            arguments:
              parameters:
                - name: staged-duckdb
                  value: "{{tasks.stage-duckdb.outputs.parameters.staged-duckdb}}"
                - name: inventory-json
                  value: "{{tasks.snapshot-duckdb-inventory.outputs.parameters.inventory-json}}"
            depends: "duckdb-snv"

          # ── 17. Assemble candidate (cp live + overlay repairs) ─────
          - name: assemble-candidate
            template: assemble-candidate
            arguments:
              parameters:
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: tx-root
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
            depends: "verify-duckdb-preservation && validate-bed-file"

          # ── 18. Compute TMB into candidate (unpadded BED) ──────────
          - name: compute-tmb
            templateRef:
              name: collect-tmb-data-template
              template: compute-tmb-data
            arguments:
              parameters:
                - name: duckdb-file
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}results/db/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_results.duckdb"
                - name: target-bed-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: output-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}metrics/tmb/"
                - name: cosmic-vcf
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/cosmic/Cosmic_CompleteTargetedScreensMutant_v103_GRCh38.vcf.gz"
                - name: filter-common-variants
                  value: "true"
                - name: gnomad-vcf
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/common_variants/gnomad4/gnomad4_1pct.vcf.gz"
                - name: turkish-variome-vcf
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/common_variants/turkish_variome/turkish_variome_1pct.vcf.gz"
                - name: common-af-threshold
                  value: "0.01"
            depends: "assemble-candidate"

          # ── 19. Write manifest into candidate ──────────────────────
          - name: write-manifest
            template: write-repair-manifest
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
                - name: analysis-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
                - name: igv-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-igv-file}}"
                - name: staged-duckdb
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}results/db/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_results.duckdb"
            depends: "compute-tmb"

          # ── 20. Validate assembled candidate ───────────────────────
          - name: validate-candidate
            template: validate-candidate-artifacts
            arguments:
              parameters:
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
                - name: analysis-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
                - name: igv-bed
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-igv-file}}"
            depends: "write-manifest"

          # ── 21. Promote (mode=apply, atomic exchange) ──────────────
          - name: promote
            when: "'{{workflow.parameters.mode}}' == 'apply'"
            template: promote-candidate
            arguments:
              parameters:
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
            depends: "validate-candidate"

          # ── 22. Publish TMB (mode=apply, after promotion) ──────────
          - name: publish-tmb
            when: "'{{workflow.parameters.mode}}' == 'apply'"
            templateRef:
              name: collect-tmb-data-template
              template: collect-tmb-data
            arguments:
              parameters:
                - name: run-id
                  value: "{{workflow.parameters.run-id}}"
                - name: sample-id
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}"
                - name: duckdb-file
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}results/db/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_results.duckdb"
                - name: target-bed-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: output-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}tmb-publish/"
                - name: cosmic-vcf
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/cosmic/Cosmic_CompleteTargetedScreensMutant_v103_GRCh38.vcf.gz"
                - name: filter-common-variants
                  value: "true"
                - name: gnomad-vcf
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/common_variants/gnomad4/gnomad4_1pct.vcf.gz"
                - name: turkish-variome-vcf
                  value: "{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/common_variants/turkish_variome/turkish_variome_1pct.vcf.gz"
                - name: common-af-threshold
                  value: "0.01"
            depends: "promote.Succeeded"

          # ── 23. Record projection outcome ──────────────────────────
          - name: update-manifest-projection
            template: update-manifest-projection
            arguments:
              parameters:
                - name: sample-output-dir
                  value: "{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
                - name: promote-status
                  value: "{{tasks.promote.status}}"
                - name: publish-status
                  value: "{{tasks.publish-tmb.status}}"
            depends: "validate-candidate && (promote.Succeeded || promote.Skipped || promote.Failed) && (publish-tmb.Succeeded || publish-tmb.Failed || publish-tmb.Skipped)"

          # ── 24. Cleanup transaction path ───────────────────────────
          - name: cleanup
            template: cleanup-repair
            arguments:
              parameters:
                - name: tx-root
                  value: "{{tasks.compute-repair-paths.outputs.parameters.tx-root}}"
                - name: candidate-dir
                  value: "{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}"
                - name: output-parent
                  value: "{{tasks.compute-repair-paths.outputs.parameters.output-parent}}"
            depends: "update-manifest-projection"

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: validate-sample-for-repair
    # ═══════════════════════════════════════════════════════════════════
    - name: validate-sample-for-repair
      inputs:
        parameters:
          - name: sample-id
          - name: sample-output-dir
          - name: dna-file-type
          - name: dna-input-files
          - name: ref-paths
          - name: tumor-type
          - name: ref-base-dir
      volumes:
        - name: sample-output
          hostPath:
            path: "{{inputs.parameters.sample-output-dir}}"
            type: Directory
        - name: ref-base
          hostPath:
            path: "{{inputs.parameters.ref-base-dir}}"
            type: Directory
      script:
        image: python:3.11-alpine3.18
        command: [python]
        volumeMounts:
          - name: sample-output
            mountPath: /mnt/output/
            readOnly: true
          - name: ref-base
            mountPath: /mnt/ref/
            readOnly: true
        source: |
          # BEGIN VALIDATE_SAMPLE_PYTHON
          import json, os, sys

          mode = "{{workflow.parameters.mode}}"
          sample_id = "{{inputs.parameters.sample-id}}"
          dna_type = "{{inputs.parameters.dna-file-type}}"
          dna_files = json.loads('''{{inputs.parameters.dna-input-files}}''')
          ref_paths = json.loads('''{{inputs.parameters.ref-paths}}''')
          tumor_type = "{{inputs.parameters.tumor-type}}"
          ref_base = "{{inputs.parameters.ref-base-dir}}"

          errors = []

          if mode not in ("validate", "apply"):
              errors.append(f"Invalid mode '{mode}': must be 'validate' or 'apply'")

          if dna_type == "vcf":
              errors.append("VCF-only samples cannot be repaired (no recalibrated BAM)")

          if not tumor_type or tumor_type == ".":
              errors.append("Tumor type not resolved")

          recal_bam = os.path.join("/mnt/output/", "bam", f"{sample_id}_recal.bam")
          if not os.path.isfile(recal_bam):
              errors.append(f"Recalibrated BAM not found: bam/{sample_id}_recal.bam")
          elif not os.access(recal_bam, os.R_OK):
              errors.append("Recalibrated BAM not readable")
          else:
              if not (os.path.isfile(recal_bam + ".bai") or
                      os.path.isfile(recal_bam.replace(".bam", ".bai"))):
                  errors.append("BAM index not found")

          duckdb_path = os.path.join("/mnt/output/", "results", "db",
                                     f"{sample_id}_results.duckdb")
          if not os.path.isfile(duckdb_path):
              errors.append(f"Results DuckDB not found: results/db/{sample_id}_results.duckdb")
          elif os.path.getsize(duckdb_path) == 0:
              errors.append("Results DuckDB is empty")

          regions = dna_files.get("regionsFile", "")
          if not regions or regions == ".":
              errors.append("No target BED (WGS or legacy sample)")

          genome = ref_paths.get("genome", "")
          if not genome:
              errors.append("Reference genome path not resolved")
          else:
              genome_mount = genome.replace(ref_base, "/mnt/ref/", 1)
              if not os.path.isfile(genome_mount):
                  errors.append(f"Genome FASTA not found at {genome}")
              fai = genome_mount + ".fai"
              if not os.path.isfile(fai):
                  errors.append(f"Genome FASTA index not found at {genome}.fai")

          annovar = ref_paths.get("other", {}).get("annovar", "")
          if not annovar:
              errors.append("Annovar DB path not resolved")
          else:
              annovar_mount = annovar.replace(ref_base, "/mnt/ref/", 1)
              if not os.path.isdir(annovar_mount):
                  errors.append(f"Annovar DB directory not found at {annovar}")

          for vcf_name in [
              "hg38/other/cosmic/Cosmic_CompleteTargetedScreensMutant_v103_GRCh38.vcf.gz",
              "hg38/other/common_variants/gnomad4/gnomad4_1pct.vcf.gz",
              "hg38/other/common_variants/turkish_variome/turkish_variome_1pct.vcf.gz",
          ]:
              vcf_path = os.path.join("/mnt/ref/", vcf_name)
              if not os.path.isfile(vcf_path):
                  errors.append(f"Reference VCF not found: {vcf_name}")

          if errors:
              print("Sample validation failed:", file=sys.stderr)
              for e in errors:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)

          print(f"Sample {sample_id} validated for padding repair (mode={mode})")
          # END VALIDATE_SAMPLE_PYTHON

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: compute-repair-paths
    # ═══════════════════════════════════════════════════════════════════
    - name: compute-repair-paths
      inputs:
        parameters:
          - name: sample-output-dir
      outputs:
        parameters:
          - name: tx-root
            valueFrom:
              path: /tmp/tx_root
          - name: candidate-dir
            valueFrom:
              path: /tmp/candidate_dir
          - name: output-parent
            valueFrom:
              path: /tmp/output_parent
      script:
        image: alpine:3.18
        command: [sh]
        source: |
          set -e
          SAMPLE_DIR="{{=sprig.trimSuffix('/', inputs.parameters['sample-output-dir'])}}"
          PARENT="$(dirname "$SAMPLE_DIR")"
          BASE="$(basename "$SAMPLE_DIR")"
          printf '%s' "${PARENT}/${BASE}.repair-wk-{{workflow.uid}}/" > /tmp/tx_root
          printf '%s' "${PARENT}/${BASE}.repair-cd-{{workflow.uid}}/" > /tmp/candidate_dir
          printf '%s' "${PARENT}/" > /tmp/output_parent

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: stage-duckdb-copy
    # ═══════════════════════════════════════════════════════════════════
    - name: stage-duckdb-copy
      inputs:
        parameters:
          - name: sample-id
          - name: sample-output-dir
          - name: tx-root
      outputs:
        parameters:
          - name: staged-duckdb
            value: "{{inputs.parameters.tx-root}}results/db/{{inputs.parameters.sample-id}}_results.duckdb"
      volumes:
        - name: source-db-dir
          hostPath:
            path: "{{inputs.parameters.sample-output-dir}}results/db/"
            type: Directory
        - name: dest-db-dir
          hostPath:
            path: "{{inputs.parameters.tx-root}}results/db/"
            type: DirectoryOrCreate
      script:
        image: alpine:3.18
        command: [sh]
        volumeMounts:
          - name: source-db-dir
            mountPath: /mnt/source/
            readOnly: true
          - name: dest-db-dir
            mountPath: /mnt/dest/
        source: |
          set -e
          DBFILE="{{inputs.parameters.sample-id}}_results.duckdb"
          cp "/mnt/source/${DBFILE}" "/mnt/dest/${DBFILE}"
          echo "Staged DuckDB copy: ${DBFILE}"

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: snapshot-duckdb-inventory
    # ═══════════════════════════════════════════════════════════════════
    - name: snapshot-duckdb-inventory
      inputs:
        parameters:
          - name: staged-duckdb
      outputs:
        parameters:
          - name: inventory-json
            valueFrom:
              path: /tmp/inventory.json
      volumes:
        - name: staged-duckdb-dir
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['staged-duckdb'])}}"
            type: Directory
      script:
        image: python:3.11-alpine3.18
        command: [sh]
        volumeMounts:
          - name: staged-duckdb-dir
            mountPath: /mnt/db/
            readOnly: true
        source: |
          set -e
          pip install -q duckdb 2>/dev/null
          # BEGIN SNAPSHOT_DUCKDB_PYTHON
          python3 - /mnt/db/{{=sprig.osBase(inputs.parameters['staged-duckdb'])}} <<'PYEOF'
          import duckdb, json, sys

          db = duckdb.connect(sys.argv[1], read_only=True)
          inventory = {"tables": {}, "views": {}}

          for row in db.execute(
              "SELECT table_name, table_type FROM information_schema.tables"
          ).fetchall():
              name, ttype = row
              if ttype == "VIEW":
                  sql = db.execute(
                      f"SELECT sql FROM duckdb_views() WHERE view_name = '{name}'"
                  ).fetchone()
                  inventory["views"][name] = {
                      "sql": sql[0] if sql else "",
                      "rows": db.execute(f'SELECT COUNT(*) FROM "{name}"').fetchone()[0],
                  }
              else:
                  inventory["tables"][name] = {
                      "rows": db.execute(f'SELECT COUNT(*) FROM "{name}"').fetchone()[0],
                  }

          db.close()
          with open("/tmp/inventory.json", "w") as f:
              json.dump(inventory, f)
          print(f"Snapshot: {len(inventory['tables'])} tables, {len(inventory['views'])} views")
          PYEOF
          # END SNAPSHOT_DUCKDB_PYTHON

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: verify-duckdb-preservation
    # ═══════════════════════════════════════════════════════════════════
    - name: verify-duckdb-preservation
      inputs:
        parameters:
          - name: staged-duckdb
          - name: inventory-json
      volumes:
        - name: staged-duckdb-dir
          hostPath:
            path: "{{=sprig.osDir(inputs.parameters['staged-duckdb'])}}"
            type: Directory
      script:
        image: python:3.11-alpine3.18
        command: [sh]
        volumeMounts:
          - name: staged-duckdb-dir
            mountPath: /mnt/db/
            readOnly: true
        source: |
          set -e
          pip install -q duckdb 2>/dev/null
          # BEGIN VERIFY_DUCKDB_PYTHON
          python3 - /mnt/db/{{=sprig.osBase(inputs.parameters['staged-duckdb'])}} <<'PYEOF'
          import duckdb, json, sys

          db = duckdb.connect(sys.argv[1], read_only=True)
          pre = json.loads('''{{inputs.parameters.inventory-json}}''')
          snv_objects = {"oncokb_snv", "cancervar_snv", "combined_snv", "advanced_combined_snv"}
          errors = []

          for name, info in pre["tables"].items():
              if name in snv_objects:
                  continue
              try:
                  count = db.execute(f'SELECT COUNT(*) FROM "{name}"').fetchone()[0]
              except Exception as e:
                  errors.append(f"Non-SNV table '{name}' lost after refresh: {e}")
                  continue
              if count != info["rows"]:
                  errors.append(
                      f"Non-SNV table '{name}' row count changed: "
                      f"{info['rows']} → {count}"
                  )

          for name, info in pre["views"].items():
              if name in snv_objects:
                  continue
              try:
                  count = db.execute(f'SELECT COUNT(*) FROM "{name}"').fetchone()[0]
              except Exception as e:
                  errors.append(f"Non-SNV view '{name}' lost after refresh: {e}")
                  continue
              if count != info["rows"]:
                  errors.append(
                      f"Non-SNV view '{name}' row count changed: "
                      f"{info['rows']} → {count}"
                  )

          for tbl in snv_objects & set(pre["tables"]) | snv_objects & set(pre["views"]):
              try:
                  db.execute(f'SELECT 1 FROM "{tbl}" LIMIT 1')
              except Exception as e:
                  errors.append(f"Refreshed SNV object '{tbl}' not queryable: {e}")

          db.close()
          if errors:
              print("DuckDB preservation FAILED:", file=sys.stderr)
              for e in errors:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)
          print("DuckDB non-SNV preservation verified")
          PYEOF
          # END VERIFY_DUCKDB_PYTHON

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: assemble-candidate
    # ═══════════════════════════════════════════════════════════════════
    - name: assemble-candidate
      inputs:
        parameters:
          - name: sample-output-dir
          - name: tx-root
          - name: candidate-dir
          - name: output-parent
      volumes:
        - name: output-parent
          hostPath:
            path: "{{inputs.parameters.output-parent}}"
            type: Directory
      script:
        image: alpine:3.18
        command: [sh]
        volumeMounts:
          - name: output-parent
            mountPath: /mnt/parent/
        source: |
          set -e
          # BEGIN ASSEMBLE_CANDIDATE_SH
          LIVE_BASE="$(basename "{{=sprig.trimSuffix('/', inputs.parameters['sample-output-dir'])}}")"
          TX_BASE="$(basename "{{=sprig.trimSuffix('/', inputs.parameters['tx-root'])}}")"
          CD_BASE="$(basename "{{=sprig.trimSuffix('/', inputs.parameters['candidate-dir'])}}")"

          LIVE="/mnt/parent/${LIVE_BASE}"
          TX="/mnt/parent/${TX_BASE}"
          CANDIDATE="/mnt/parent/${CD_BASE}"

          if [ -d "$CANDIDATE" ]; then
            echo "Stale candidate from prior attempt exists, removing" >&2
            rm -rf "$CANDIDATE"
          fi

          echo "Copying live tree to candidate..."
          cp -a "$LIVE" "$CANDIDATE"

          echo "Overlaying repair artifacts..."
          for subdir in results/snv results/db metrics/bed_validation; do
            if [ -d "${TX}/${subdir}" ]; then
              mkdir -p "${CANDIDATE}/${subdir}"
              cp -a "${TX}/${subdir}/." "${CANDIDATE}/${subdir}/"
            fi
          done
          echo "Candidate assembled"
          # END ASSEMBLE_CANDIDATE_SH

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: write-repair-manifest
    # ═══════════════════════════════════════════════════════════════════
    - name: write-repair-manifest
      inputs:
        parameters:
          - name: sample-id
          - name: candidate-dir
          - name: output-parent
          - name: analysis-bed
          - name: igv-bed
          - name: staged-duckdb
      volumes:
        - name: output-parent
          hostPath:
            path: "{{inputs.parameters.output-parent}}"
            type: Directory
      script:
        image: python:3.11-alpine3.18
        command: [python]
        volumeMounts:
          - name: output-parent
            mountPath: /mnt/parent/
        source: |
          # BEGIN WRITE_MANIFEST_PYTHON
          import hashlib, json, os

          cd_base = os.path.basename("{{=sprig.trimSuffix('/', inputs.parameters['candidate-dir'])}}")
          candidate = os.path.join("/mnt/parent", cd_base)

          def sha256_file(path):
              h = hashlib.sha256()
              try:
                  with open(path, "rb") as f:
                      for chunk in iter(lambda: f.read(8192), b""):
                          h.update(chunk)
                  return h.hexdigest()
              except FileNotFoundError:
                  return "MISSING"

          sample_id = "{{inputs.parameters.sample-id}}"
          db_path = os.path.join(candidate, "results", "db", f"{sample_id}_results.duckdb")

          manifest = {
              "workflow_uid": "{{workflow.uid}}",
              "workflow_name": "{{workflow.name}}",
              "template": "somatic-dna-padding-repair-v1",
              "git_commit": "{{workflow.annotations.workflows.argoproj.io/revision}}",
              "sample_uuid": "{{workflow.parameters.sample-uuid}}",
              "sample_id": sample_id,
              "run_id": "{{workflow.parameters.run-id}}",
              "user_id": "{{workflow.parameters.user-id}}",
              "node_name": "{{workflow.parameters.node-name}}",
              "mode": "{{workflow.parameters.mode}}",
              "padding_bp": 100,
              "checksums": {
                  "analysis_bed": sha256_file(os.path.join(
                      candidate, "metrics", "bed_validation",
                      os.path.basename("{{inputs.parameters.analysis-bed}}")
                  )),
                  "igv_bed": sha256_file(os.path.join(
                      candidate, "metrics", "bed_validation",
                      os.path.basename("{{inputs.parameters.igv-bed}}")
                  )),
                  "duckdb": sha256_file(db_path),
              },
              "promotion": {
                  "state": "pending",
                  "backup_dir": None,
              },
              "projection": {
                  "state": "pending",
              },
          }

          manifest_path = os.path.join(candidate, "padding_repair_manifest.json")
          with open(manifest_path, "w") as f:
              json.dump(manifest, f, indent=2)
          print(f"Manifest written to candidate: {manifest_path}")
          # END WRITE_MANIFEST_PYTHON

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: validate-candidate-artifacts
    # ═══════════════════════════════════════════════════════════════════
    - name: validate-candidate-artifacts
      inputs:
        parameters:
          - name: sample-id
          - name: candidate-dir
          - name: output-parent
          - name: analysis-bed
          - name: igv-bed
      volumes:
        - name: output-parent
          hostPath:
            path: "{{inputs.parameters.output-parent}}"
            type: Directory
      script:
        image: python:3.11-alpine3.18
        command: [python]
        volumeMounts:
          - name: output-parent
            mountPath: /mnt/parent/
            readOnly: true
        source: |
          # BEGIN VALIDATE_CANDIDATE_PYTHON
          import json, os, sys

          cd_base = os.path.basename("{{=sprig.trimSuffix('/', inputs.parameters['candidate-dir'])}}")
          candidate = os.path.join("/mnt/parent", cd_base)
          sample_id = "{{inputs.parameters.sample-id}}"
          errors = []

          analysis_name = os.path.basename("{{inputs.parameters.analysis-bed}}")
          analysis = os.path.join(candidate, "metrics", "bed_validation", analysis_name)
          igv_name = os.path.basename("{{inputs.parameters.igv-bed}}")
          igv = os.path.join(candidate, "metrics", "bed_validation", igv_name)
          db = os.path.join(candidate, "results", "db", f"{sample_id}_results.duckdb")
          manifest = os.path.join(candidate, "padding_repair_manifest.json")
          tmb_dir = os.path.join(candidate, "metrics", "tmb")

          if not os.path.isfile(manifest):
              errors.append("Repair manifest not found in candidate")
          if not os.path.isdir(tmb_dir) or not os.listdir(tmb_dir):
              errors.append("TMB output not found in candidate")

          # ── Analysis BED: strict BED3, reference-ordered, no overlaps ──
          if not os.path.isfile(analysis):
              errors.append("Analysis BED not found in candidate")
          else:
              prev_chrom, prev_end = "", 0
              line_count = 0
              with open(analysis) as f:
                  for i, line in enumerate(f, 1):
                      line = line.rstrip("\n")
                      if line.startswith("#") or line.startswith("track"):
                          errors.append(f"Analysis BED has header at line {i}")
                          break
                      cols = line.split("\t")
                      if len(cols) != 3:
                          errors.append(f"Analysis BED is not strict BED3 (line {i}: {len(cols)} cols)")
                          break
                      chrom, start, end = cols[0], int(cols[1]), int(cols[2])
                      if start >= end:
                          errors.append(f"Analysis BED invalid interval at line {i}")
                          break
                      if chrom == prev_chrom and start <= prev_end:
                          errors.append(
                              f"Analysis BED overlapping/book-ended at {chrom}:{start} "
                              f"(prev end {prev_end})"
                          )
                          break
                      prev_chrom, prev_end = chrom, end
                      line_count += 1
              if line_count == 0 and not errors:
                  errors.append("Analysis BED is empty")

          # ── IGV BED: BED9, correct RGB, non-overlapping features ──
          if not os.path.isfile(igv):
              errors.append("IGV BED not found in candidate")
          else:
              expected_rgb = {"targeted": "128,128,128", "padding": "211,211,211"}
              features = {"targeted": [], "padding": []}
              with open(igv) as f:
                  header = f.readline().rstrip("\n")
                  if 'itemRgb="On"' not in header:
                      errors.append("IGV BED missing itemRgb header")
                  for i, line in enumerate(f, 2):
                      fields = line.rstrip("\n").split("\t")
                      if len(fields) != 9:
                          errors.append(f"IGV line {i} has {len(fields)} columns, expected 9")
                          break
                      chrom, start_s, end_s, feat = fields[:4]
                      start, end = int(start_s), int(end_s)
                      if feat not in expected_rgb:
                          errors.append(f"IGV unknown feature type: {feat!r}")
                          continue
                      if fields[8] != expected_rgb[feat]:
                          errors.append(f"IGV {feat} RGB is {fields[8]}, expected {expected_rgb[feat]}")
                      if start >= end:
                          errors.append(f"IGV invalid interval at line {i}")
                      features[feat].append((chrom, start, end))

              for feat, intervals in features.items():
                  if not intervals:
                      errors.append(f"IGV BED has no {feat} features")
                  for j in range(len(intervals)):
                      for k in range(j + 1, len(intervals)):
                          c1, s1, e1 = intervals[j]
                          c2, s2, e2 = intervals[k]
                          if c1 == c2 and s1 < e2 and s2 < e1:
                              errors.append(
                                  f"IGV {feat} features overlap: "
                                  f"{c1}:{s1}-{e1} and {c2}:{s2}-{e2}"
                              )

              for tc, ts, te in features["targeted"]:
                  for pc, ps, pe in features["padding"]:
                      if tc == pc and ts < pe and ps < te:
                          errors.append(
                              f"IGV targeted/padding overlap: "
                              f"{tc}:{ts}-{te} and {pc}:{ps}-{pe}"
                          )

          # ── DuckDB: exists, queryable SNV objects ──
          if not os.path.isfile(db):
              errors.append("DuckDB not found in candidate")
          elif os.path.getsize(db) == 0:
              errors.append("DuckDB is empty in candidate")

          if errors:
              print("Candidate validation FAILED:", file=sys.stderr)
              for e in errors:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)
          print("Candidate validation passed")
          # END VALIDATE_CANDIDATE_PYTHON

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: promote-candidate
    # Atomic exchange via Linux renameat2(RENAME_EXCHANGE), then rename
    # the swapped-out old live to a timestamped backup.
    # ═══════════════════════════════════════════════════════════════════
    - name: promote-candidate
      inputs:
        parameters:
          - name: sample-output-dir
          - name: candidate-dir
          - name: output-parent
      outputs:
        parameters:
          - name: backup-dir
            valueFrom:
              path: /tmp/backup_dir
      volumes:
        - name: output-parent
          hostPath:
            path: "{{inputs.parameters.output-parent}}"
            type: Directory
      script:
        image: python:3.11-alpine3.18
        command: [python]
        volumeMounts:
          - name: output-parent
            mountPath: /mnt/parent/
        source: |
          # BEGIN PROMOTE_CANDIDATE_PYTHON
          import ctypes, json, os, sys, time

          live_base = os.path.basename("{{=sprig.trimSuffix('/', inputs.parameters['sample-output-dir'])}}")
          cd_base = os.path.basename("{{=sprig.trimSuffix('/', inputs.parameters['candidate-dir'])}}")
          parent_host = "{{inputs.parameters.output-parent}}"

          live = os.path.join("/mnt/parent", live_base)
          candidate = os.path.join("/mnt/parent", cd_base)

          if not os.path.isdir(live):
              print(f"Live directory not found: {live}", file=sys.stderr)
              sys.exit(1)
          if not os.path.isdir(candidate):
              print(f"Candidate directory not found: {candidate}", file=sys.stderr)
              sys.exit(1)

          SYS_RENAMEAT2 = 316
          RENAME_EXCHANGE = 2
          AT_FDCWD = -100

          libc = ctypes.CDLL("libc.so.6", use_errno=True)
          libc.syscall.restype = ctypes.c_long

          ctypes.set_errno(0)
          ret = libc.syscall(
              ctypes.c_long(SYS_RENAMEAT2),
              ctypes.c_int(AT_FDCWD),
              live.encode(),
              ctypes.c_int(AT_FDCWD),
              candidate.encode(),
              ctypes.c_uint(RENAME_EXCHANGE),
          )
          if ret != 0:
              errno = ctypes.get_errno()
              print(
                  f"renameat2 RENAME_EXCHANGE failed: {os.strerror(errno)} "
                  f"(errno={errno})",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("Atomic exchange complete: live <-> candidate")

          timestamp = time.strftime("%Y%m%dT%H%M%S")
          backup_name = f"{live_base}.pre-padding-repair-{timestamp}"
          backup = os.path.join("/mnt/parent", backup_name)
          os.rename(candidate, backup)
          print(f"Old live renamed to backup: {backup_name}")

          backup_host = os.path.join(parent_host, backup_name)
          with open("/tmp/backup_dir", "w") as f:
              f.write(backup_host)

          manifest_path = os.path.join(live, "padding_repair_manifest.json")
          if os.path.isfile(manifest_path):
              with open(manifest_path) as f:
                  m = json.load(f)
              m["promotion"]["state"] = "completed"
              m["promotion"]["backup_dir"] = backup_host
              with open(manifest_path, "w") as f:
                  json.dump(m, f, indent=2)
          print(f"Promotion complete. Backup: {backup_host}")
          # END PROMOTE_CANDIDATE_PYTHON

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: update-manifest-projection
    # Records TMB publication outcome in the manifest. Runs on publish
    # success, failure, and skip (validate mode).
    # ═══════════════════════════════════════════════════════════════════
    - name: update-manifest-projection
      inputs:
        parameters:
          - name: sample-output-dir
          - name: candidate-dir
          - name: output-parent
          - name: promote-status
            default: ""
          - name: publish-status
            default: ""
      volumes:
        - name: output-parent
          hostPath:
            path: "{{inputs.parameters.output-parent}}"
            type: Directory
      script:
        image: python:3.11-alpine3.18
        command: [python]
        volumeMounts:
          - name: output-parent
            mountPath: /mnt/parent/
        source: |
          import json, os

          mode = "{{workflow.parameters.mode}}"
          promote_status = "{{inputs.parameters.promote-status}}"
          publish_status = "{{inputs.parameters.publish-status}}"

          if mode == "apply" and promote_status == "Succeeded":
              live_base = os.path.basename("{{=sprig.trimSuffix('/', inputs.parameters['sample-output-dir'])}}")
              manifest_path = os.path.join("/mnt/parent", live_base, "padding_repair_manifest.json")
          else:
              cd_base = os.path.basename("{{=sprig.trimSuffix('/', inputs.parameters['candidate-dir'])}}")
              manifest_path = os.path.join("/mnt/parent", cd_base, "padding_repair_manifest.json")

          if not os.path.isfile(manifest_path):
              print(f"Manifest not found at {manifest_path}, skipping projection update")
              open("/tmp/ok", "w").close()
              raise SystemExit(0)

          with open(manifest_path) as f:
              m = json.load(f)

          if mode != "apply":
              m["projection"]["state"] = "not-applicable"
          elif publish_status == "Succeeded":
              m["projection"]["state"] = "published"
          elif publish_status in ("Failed", "Error"):
              m["projection"]["state"] = "failed"
          else:
              m["projection"]["state"] = "pending"

          with open(manifest_path, "w") as f:
              json.dump(m, f, indent=2)
          print(f"Manifest projection updated: {m['projection']['state']}")

    # ═══════════════════════════════════════════════════════════════════
    # Inline template: cleanup-repair
    # ═══════════════════════════════════════════════════════════════════
    - name: cleanup-repair
      inputs:
        parameters:
          - name: tx-root
          - name: candidate-dir
          - name: output-parent
      volumes:
        - name: output-parent
          hostPath:
            path: "{{inputs.parameters.output-parent}}"
            type: Directory
      script:
        image: alpine:3.18
        command: [sh]
        volumeMounts:
          - name: output-parent
            mountPath: /mnt/parent/
        source: |
          set -e
          TX_BASE="$(basename "{{=sprig.trimSuffix('/', inputs.parameters['tx-root'])}}")"
          CD_BASE="$(basename "{{=sprig.trimSuffix('/', inputs.parameters['candidate-dir'])}}")"

          [ -d "/mnt/parent/${TX_BASE}" ] && rm -rf "/mnt/parent/${TX_BASE}"
          [ -d "/mnt/parent/${CD_BASE}" ] && rm -rf "/mnt/parent/${CD_BASE}"
          echo "Cleaned transaction paths"
