apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: somatic-dna-bam-v2
  namespace: argo
spec:
  templates:
    - name: somatic-testing-dna-gpu-bam-v2
      inputs:
        parameters:
          - name: user-id
          - name: run-id
          - name: sample-id
          - name: sample-uuid
          - name: dna-input-files
          - name: tumor-type
          - name: ref-version
          - name: ref-paths
          - name: ref-base-dir
          - name: sample-input-dir
          - name: sample-output-dir
          - name: sample-temp-dir
          - name: sample-scratch-dir
          - name: thread-count
            default: "20"
          # Forwarded to per-sample-cnv-cohort-analysis (run-cnv-cohort task)
          # so it can decide whether to run scarHRD. Sourced upstream from
          # load-and-prepare-dna's run-hrd output (image >= 0.5.1).
          - name: run-hrd
            default: "false"
      dag:
        tasks:
          - name: validate-bed-file
            templateRef:
              name: bed-validator-template
              template: validate-bed-file
            arguments:
              parameters:
                - name: input-bed-file
                  value: "{{=jsonpath(inputs.parameters['dna-input-files'], '$.regionsFile')}}"
                - name: gtf-file
                  value: "{{inputs.parameters.ref-base-dir}}/{{inputs.parameters.ref-version}}/gene_annots/gencode.v49.basic.annotation.MANE_Select.gtf.gz"
                - name: reference-fai-file
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.genome')}}.fai"
                - name: chains-dir
                  value: "{{inputs.parameters.ref-base-dir}}/{{inputs.parameters.ref-version}}/other/chains/"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}/metrics/bed_validation/"
                - name: padding
                  value: "100"
                - name: generate-padded-artifacts
                  value: "true"
          - name: validate-msi-bed-file
            when: "{{= jsonpath(inputs.parameters['dna-input-files'], '$.msiBedFile') != '' }}"
            templateRef:
              name: bed-validator-template
              template: validate-bed-file
            arguments:
              parameters:
                - name: input-bed-file
                  value: "{{=jsonpath(inputs.parameters['dna-input-files'], '$.msiBedFile')}}"
                - name: gtf-file
                  value: "{{inputs.parameters.ref-base-dir}}/{{inputs.parameters.ref-version}}/gene_annots/gencode.v49.basic.annotation.MANE_Select.gtf.gz"
                - name: chains-dir
                  value: "{{inputs.parameters.ref-base-dir}}/{{inputs.parameters.ref-version}}/other/chains/"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}/metrics/msi_bed_validation/"
          - name: pb-bam2fq
            templateRef:
              name: parabricks-bam2fq-template
              template: parabricks-bam2fq
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: input-bam
                  value: "{{=jsonpath(inputs.parameters['dna-input-files'], '$.bam')}}"
                - name: output-dir
                  value: "{{inputs.parameters.sample-scratch-dir}}reads/"
                - name: thread-count
                  value: "{{inputs.parameters.thread-count}}"
          - name: fastqc
            templateRef:
              name: fastqc-template
              template: fastqc
            arguments:
              parameters:
                - name: fq-r1
                  value: "{{tasks.pb-bam2fq.outputs.parameters.output-fq-r1}}"
                - name: fq-r2
                  value: "{{tasks.pb-bam2fq.outputs.parameters.output-fq-r2}}"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/fastqc/"
            depends: "pb-bam2fq"
          - name: compose-read-group-str
            templateRef:
              name: compose-read-group-str
              template: compose-read-group-str-from-fq
            arguments:
              parameters:
                - name: fq-r1
                  value: "{{tasks.pb-bam2fq.outputs.parameters.output-fq-r1}}"
                - name: sample-name
                  value: "{{inputs.parameters.sample-id}}"
            depends: "pb-bam2fq"
          - name: pb-fq2bam
            templateRef:
              name: parabricks-fq2bam-template
              template: parabricks-fq2bam-no-bqsr
            arguments:
              parameters:
                - name: input-fq-r1
                  value: "{{tasks.pb-bam2fq.outputs.parameters.output-fq-r1}}"
                - name: input-fq-r2
                  value: "{{tasks.pb-bam2fq.outputs.parameters.output-fq-r2}}"
                - name: genome-ref
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.genome')}}"
                - name: scratch-dir
                  value: "{{inputs.parameters.sample-scratch-dir}}"
                - name: read-group-str
                  value: "{{tasks.compose-read-group-str.outputs.parameters.read-group-str}}"
                - name: output-bam
                  value: "{{inputs.parameters.sample-scratch-dir}}bam/{{inputs.parameters.sample-id}}.bam"
                - name: output-dupes
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/{{inputs.parameters.sample-id}}.dupes"
            depends: "pb-bam2fq && compose-read-group-str"
          - name: pb-bqsr
            templateRef:
              name: parabricks-bqsr-template
              template: parabricks-bqsr
            arguments:
              parameters:
                - name: input-bam
                  value: "{{tasks.pb-fq2bam.outputs.parameters.output-bam}}"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: genome-ref
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.genome')}}"
                - name: known-sites
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.dbsnp')}}"
                - name: known-sites-gnomad
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.gnomad4.common.variants')}}"
                - name: output-recal-file
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/bqsr/{{inputs.parameters.sample-id}}.recal"
            depends: "pb-fq2bam && validate-bed-file"
          - name: pb-applybqsr
            templateRef:
              name: parabricks-bqsr-template
              template: parabricks-applybqsr
            arguments:
              parameters:
                - name: input-bam
                  value: "{{tasks.pb-fq2bam.outputs.parameters.output-bam}}"
                - name: input-recal-file
                  value: "{{tasks.pb-bqsr.outputs.parameters.output-recal-file}}"
                - name: output-bam
                  value: "{{inputs.parameters.sample-temp-dir}}bam/{{inputs.parameters.sample-id}}_recal.bam"
                - name: genome-ref
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.genome')}}"
            depends: "pb-bqsr"
          - name: mutect2
            templateRef:
              name: mutect2-sharded-template
              template: mutect2-tumor-only-sharded
            arguments:
              parameters:
                - name: input-bam
                  value: "{{tasks.pb-applybqsr.outputs.parameters.output-bam}}"
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: genome-ref
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.genome')}}"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
                - name: sample-scratch-dir
                  value: "{{inputs.parameters.sample-scratch-dir}}"
                - name: output-vcf
                  value: "{{inputs.parameters.sample-temp-dir}}results/snv/vcf/{{inputs.parameters.sample-id}}_mutect2_marked.vcf.gz"
            depends: "pb-applybqsr && validate-bed-file"
          - name: bcftools-filter
            templateRef:
              name: bcftools-template
              template: bcftools-filter-and-bed
            arguments:
              parameters:
                - name: do-filter
                  value: ""
                - name: input-vcf-f
                  value: "{{tasks.mutect2.outputs.parameters.output-vcf}}"
                - name: output-vcf-f
                  value: "{{inputs.parameters.sample-temp-dir}}/results/snv/vcf/{{inputs.parameters.sample-id}}_mutect2_filtered.vcf.gz"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}"
            depends: "mutect2 && validate-bed-file"
          - name: vlod
            templateRef:
              name: vlod-template
              template: vlod
            arguments:
              parameters:
                - name: input-bam
                  value: "{{tasks.pb-applybqsr.outputs.parameters.output-bam}}"
                - name: input-vcf
                  value: "{{tasks.bcftools-filter.outputs.parameters.output-vcf-f}}"
                - name: vlod-output-vcf
                  value: "{{inputs.parameters.sample-temp-dir}}results/snv/{{inputs.parameters.sample-id}}_mutect2_vlod.vcf" # output returns .gz
                - name: thread-count
                  value: "{{inputs.parameters.thread-count}}"
            depends: "bcftools-filter && pb-applybqsr"
          - name: annovar
            templateRef:
              name: annovar-template
              template: annovar
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: input-vcf-f
                  value: "{{tasks.vlod.outputs.parameters.vlod-output-vcf}}"
                - name: ref-version
                  value: "hg38"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}results/snv/"
                - name: annovardb-dir
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.other.annovar')}}"
            depends: "vlod"
          - name: cancervar
            templateRef:
              name: cancervar-template
              template: cancervar
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: input-vcf-f
                  value: "{{tasks.vlod.outputs.parameters.vlod-output-vcf}}"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}results/snv/"
                - name: annovardb-dir
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.other.annovar')}}"
            depends: "annovar"
          - name: annovar-to-maf
            templateRef:
              name: annovar-to-maf-template
              template: annovar-to-maf
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: annovar-out-f
                  value: "{{tasks.annovar.outputs.parameters.annovar-out-f}}"
            depends: "annovar"
          - name: maf-to-db
            templateRef:
              name: maf-to-db-template
              template: maf-to-db
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-uuid}}"
                - name: input-maf
                  value: "{{tasks.annovar-to-maf.outputs.parameters.annovar-maf-f}}"
                - name: batch-size
                  value: "1000"
            depends: "annovar-to-maf"
          - name: oncokb-snv
            templateRef:
              name: oncokb-templates
              template: oncokb-snv
            arguments:
              parameters:
                - name: annovar-maf-f
                  value: "{{tasks.annovar-to-maf.outputs.parameters.annovar-maf-f}}"
                - name: annovar-oncokb-maf-f
                  value: "{{inputs.parameters.sample-temp-dir}}results/snv/{{inputs.parameters.sample-id}}_oncokb.maf"
                - name: ref-version
                  value: "{{inputs.parameters.ref-version}}"
                - name: tumor-type
                  value: "{{inputs.parameters.tumor-type}}"
            depends: "annovar-to-maf"
          - name: get-otherinfo-columns
            templateRef:
              name: duckdb-template
              template: determine-otherinfo-column
            arguments:
              parameters:
                - name: annovar-oncokb-maf
                  value: "{{tasks.oncokb-snv.outputs.parameters.annovar-oncokb-maf-f}}"
            depends: "oncokb-snv"
          - name: duckdb-snv
            templateRef:
              name: duckdb-template
              template: duckdb-snv
            arguments:
              parameters:
                - name: annovar-oncokb-maf
                  value: "{{tasks.oncokb-snv.outputs.parameters.annovar-oncokb-maf-f}}"
                - name: cancervar-tsv
                  value: "{{tasks.cancervar.outputs.parameters.cancervar-out-f}}"
                - name: vlod-column-name
                  value: "{{tasks.get-otherinfo-columns.outputs.parameters.vlod-column-name}}"
                - name: filter-column-name
                  value: "{{tasks.get-otherinfo-columns.outputs.parameters.filter-column-name}}"
                - name: sample-column-name
                  value: "{{tasks.get-otherinfo-columns.outputs.parameters.sample-column-name}}"
                - name: output-duckdb
                  value: "{{inputs.parameters.sample-temp-dir}}results/db/{{inputs.parameters.sample-id}}_results.duckdb"
            depends: "oncokb-snv && cancervar && get-otherinfo-columns"
          - name: manta
            templateRef:
              name: manta-template
              template: manta
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: tumor-bam
                  value: "{{tasks.pb-applybqsr.outputs.parameters.output-bam}}"
                - name: ref-genome-f
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.genome')}}"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}results/sv/"
                - name: scratch-dir
                  value: "{{inputs.parameters.sample-scratch-dir}}manta/"
                - name: thread-count
                  value: "{{inputs.parameters.thread-count}}"
            depends: "pb-applybqsr && validate-bed-file"
          - name: bcftools-filter-and-bed
            templateRef:
              name: bcftools-template
              template: bcftools-filter-and-bed
            arguments:
              parameters:
                - name: input-vcf-f
                  value: "{{tasks.manta.outputs.parameters.output-tumor-vcf-f}}"
                - name: output-vcf-f
                  value: "{{inputs.parameters.sample-temp-dir}}results/sv/{{inputs.parameters.sample-id}}_SV.vcf.gz"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: do-filter
                  value: ""
            depends: "manta && validate-bed-file"
          - name: annotsv
            templateRef:
              name: annotsv-template
              template: annotsv
            arguments:
              parameters:
                - name: input-vcf-f
                  value: "{{tasks.bcftools-filter-and-bed.outputs.parameters.output-vcf-f}}"
                - name: annotsv-ref-dir
                  value: "{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/other/AnnotSV/"
                - name: ref-version
                  value: "{{inputs.parameters.ref-version}}"
                - name: sv-min-size
                  value: "20"
                - name: output-annotsv-tsv-f
                  value: "{{inputs.parameters.sample-scratch-dir}}results/sv/{{inputs.parameters.sample-id}}_SV_annot.tsv"
            depends: "bcftools-filter-and-bed"
          - name: annotsv-create-dummy-tsv
            templateRef:
              name: annotsv-template
              template: annotsv-create-dummy-tsv
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: dummy-annotsv-tsv-f
                  value: "{{tasks.annotsv.outputs.parameters.output-annotsv-tsv-f}}"
            depends: "annotsv"
          - name: annotsv-to-oncokb-format
            templateRef:
              name: filter-annotsv-template
              template: annotsv-to-oncokb-format
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: annotsv-tsv
                  value: "{{tasks.annotsv.outputs.parameters.output-annotsv-tsv-f}}"
                - name: annotsv-filtered-out-tsv
                  value: "{{inputs.parameters.sample-temp-dir}}results/sv/{{inputs.parameters.sample-id}}_SV_annot_filtered.tsv"
                - name: annotsv-oncokb-out-tsv
                  value: "{{inputs.parameters.sample-scratch-dir}}results/sv/{{inputs.parameters.sample-id}}_SV_oncokb.tsv"
            depends: "annotsv"
          - name: oncokb-sv
            templateRef:
              name: oncokb-templates
              template: oncokb-sv
            arguments:
              parameters:
                - name: oncokb-sv-in-f
                  value: "{{tasks.annotsv-to-oncokb-format.outputs.parameters.annotsv-oncokb-out-tsv}}"
                - name: oncokb-sv-out-f
                  value: "{{inputs.parameters.sample-temp-dir}}results/sv/{{inputs.parameters.sample-id}}_SV_oncokb_annot.tsv"
                - name: tumor-type
                  value: "{{inputs.parameters.tumor-type}}"
            depends: "annotsv-to-oncokb-format"
          - name: duckdb-sv
            templateRef:
              name: duckdb-template
              template: duckdb-sv
            arguments:
              parameters:
                - name: oncokb-tsv-f
                  value: "{{tasks.oncokb-sv.outputs.parameters.oncokb-sv-out-f}}"
                - name: annotsv-tsv-f
                  value: "{{tasks.annotsv-to-oncokb-format.outputs.parameters.annotsv-filtered-out-tsv}}"
                - name: output-duckdb
                  value: "{{inputs.parameters.sample-temp-dir}}results/db/{{inputs.parameters.sample-id}}_results.duckdb"
            # duckdb-snv must write the results.duckdb FIRST: DuckDB 0.8.1 fails
            # to commit a second writer's tables into an already-populated file
            # ("invalid/unsupported GZIP stream"), silently dropping combined_snv.
            # Gating sv (and run-cnv-cohort) on duckdb-snv forces snv into the
            # empty db first; the mutex then serialises the rest safely.
            depends: "oncokb-sv && duckdb-snv"
          # Per-sample CNV against the kit-resident healthy WGS cohort reference.
          # Lazy-builds {ref-base-dir}{ref-version}/other/cnvkit/<bed-stem>/ on
          # first use, then runs cnvkit coverage/fix/segment/call/scatter/export
          # + genemetrics, annotsv, oncokb, duckdb-cnv (table-suffix=_cohort)
          # and optional scarHRD. Outputs land in
          #   {sample-temp-dir}results/cnv/cohort_results/
          # and are carried to {sample-output-dir} by copy-temp-to-output.
          - name: run-cnv-cohort
            templateRef:
              name: per-sample-cnv-cohort-analysis
              template: per-sample-cnv-cohort-pipeline
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: sample-uuid
                  value: "{{inputs.parameters.sample-uuid}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: sample-temp-dir
                  value: "{{inputs.parameters.sample-temp-dir}}"
                - name: sample-scratch-dir
                  value: "{{inputs.parameters.sample-scratch-dir}}"
                - name: tumor-type
                  value: "{{inputs.parameters.tumor-type}}"
                - name: ref-version
                  value: "{{inputs.parameters.ref-version}}"
                - name: ref-base-dir
                  value: "{{inputs.parameters.ref-base-dir}}"
                - name: ref-paths
                  value: "{{inputs.parameters.ref-paths}}"
                - name: regions-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: input-bam
                  value: "{{tasks.pb-applybqsr.outputs.parameters.output-bam}}"
                - name: input-vcf
                  value: "{{tasks.vlod.outputs.parameters.vlod-output-vcf}}"
                - name: run-hrd
                  value: "{{inputs.parameters.run-hrd}}"
                - name: thread-count
                  value: "{{inputs.parameters.thread-count}}"
            # See duckdb-sv: gated on duckdb-snv so the cohort's duckdb-cnv writer
            # never reaches the shared results.duckdb before duckdb-snv has seeded
            # it (DuckDB 0.8.1 multi-writer commit bug).
            depends: "pb-applybqsr && vlod && validate-bed-file && duckdb-snv"
          - name: verifybamid
            templateRef:
              name: verifybamid-template
              template: verifybamid-exome-wrapper
            arguments:
              parameters:
                - name: input-bam
                  value: "{{tasks.pb-applybqsr.outputs.parameters.output-bam}}"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/verifybamid/"
                - name: ref-version
                  value: "{{inputs.parameters.ref-version}}"
                - name: verifybamid-ref-base-dir
                  value: "{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/other/verifybamid/"
            depends: "pb-applybqsr"
          - name: mosdepth
            templateRef:
              name: mosdepth-template
              template: mosdepth-exome
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: thresholds
                  value: "1,5,10,30,50,100,500"
                - name: input-bam
                  value: "{{tasks.pb-applybqsr.outputs.parameters.output-bam}}"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/mosdepth/"
                - name: regions-bed-f
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-cds-only-file}}"
            depends: "pb-applybqsr && verifybamid && validate-bed-file"
          - name: msisensor-pro
            templateRef:
              name: msisensor-pro-template
              template: msisensor-pro
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: input-bam
                  value: "{{tasks.pb-applybqsr.outputs.parameters.output-bam}}"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/msi/msisensor/"
                - name: tcga-baseline
                  value: "{{=jsonpath(inputs.parameters['ref-paths'], '$.rna.msisensor-pro.baseline')}}"
                - name: regions-bed-f
                  value: "{{= jsonpath(inputs.parameters['dna-input-files'], '$.msiBedFile') != '' ? tasks['validate-msi-bed-file'].outputs.parameters['validated-bed-file'] : tasks['validate-bed-file'].outputs.parameters['validated-bed-file'] }}"
            depends: "pb-applybqsr && validate-bed-file && (validate-msi-bed-file.Succeeded || validate-msi-bed-file.Skipped)"
          - name: filter-msisensor-pro
            templateRef:
              name: filter-msisensor-pro-template
              template: filter-msisensor-pro
            arguments:
              parameters:
                - name: msisensor-pro-tsv
                # output_tsv is the summary TSV "_all" is the one listing each repeat site
                  value: "{{tasks.msisensor-pro.outputs.parameters.output-tsv}}_all"
                - name: regions-bed-f
                  value: "{{= jsonpath(inputs.parameters['dna-input-files'], '$.msiBedFile') != '' ? tasks['validate-msi-bed-file'].outputs.parameters['validated-bed-file'] : tasks['validate-bed-file'].outputs.parameters['validated-bed-file'] }}"
                - name: min-coverage
                  value: "500"
                - name: filtered-output-tsv
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/msi/{{inputs.parameters.sample-id}}_msi_filtered.tsv"
                - name: summary-output-json
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/msi/{{inputs.parameters.sample-id}}_msi_filtered_summary.json"
            depends: "msisensor-pro && (validate-msi-bed-file.Succeeded || validate-msi-bed-file.Skipped)"
          - name: collect-tmb-data
            templateRef:
              name: collect-tmb-data-template
              template: collect-tmb-data
            arguments:
              parameters:
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: duckdb-file
                  value: "{{tasks.duckdb-snv.outputs.parameters.output-duckdb}}"
                - name: target-bed-file
                  value: "{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}"
                - name: af-lower-threshold
                  value: "0.05"
                - name: af-upper-threshold
                  value: "0.95"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}/metrics/tmb/"
                - name: cosmic-vcf
                  value: "{{inputs.parameters.ref-base-dir}}/hg38/other/cosmic/Cosmic_CompleteTargetedScreensMutant_v103_GRCh38.vcf.gz"
                - name: filter-common-variants
                  value: "true"
                - name: gnomad-vcf
                  value: "{{inputs.parameters.ref-base-dir}}/hg38/other/common_variants/gnomad4/gnomad4_1pct.vcf.gz"
                - name: turkish-variome-vcf
                  value: "{{inputs.parameters.ref-base-dir}}/hg38/other/common_variants/turkish_variome/turkish_variome_1pct.vcf.gz"
                - name: common-af-threshold
                  value: "0.01"
            depends: "duckdb-snv && validate-bed-file"
          - name: collect-msi-data
            templateRef:
              name: collect-somatic-data-templates
              template: collect-msi-data-v2
            arguments:
              parameters:
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: msisensorpro-in-json
                  value: "{{tasks.filter-msisensor-pro.outputs.parameters.summary-output-json}}"
            depends: "filter-msisensor-pro"
          - name: multiqc
            templateRef:
              name: multiqc-template
              template: main
            arguments:
              parameters:
                - name: input-dir
                  value: "{{inputs.parameters.sample-temp-dir}}"
                - name: output-dir
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/"
            depends: "verifybamid && pb-applybqsr && mosdepth"
          - name: collect-qc-data
            templateRef:
              name: collect-qc-data-v2-templates
              template: collect-qc-data-v2
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: run-id
                  value: "{{inputs.parameters.run-id}}"
                - name: sample-fqs-fnames
                  value: '["{{=sprig.osBase(tasks[''pb-bam2fq''].outputs.parameters[''output-fq-r1''])}}", "{{=sprig.osBase(tasks[''pb-bam2fq''].outputs.parameters[''output-fq-r2''])}}"]'
                - name: metrics-dir
                  value: "{{inputs.parameters.sample-temp-dir}}metrics/"
            depends: "multiqc && mosdepth && verifybamid"
          - name: copy-temp-to-output
            templateRef:
              name: copy-temp-to-output
              template: copy-temp-to-output
            arguments:
              parameters:
                - name: sample-id
                  value: "{{inputs.parameters.sample-id}}"
                - name: output-rel-dir
                  value: "{{inputs.parameters.sample-output-dir}}"
                - name: temp-rel-dir
                  value: "{{inputs.parameters.sample-temp-dir}}"
            depends: "collect-qc-data && maf-to-db && collect-tmb-data && collect-msi-data && duckdb-sv && duckdb-snv && run-cnv-cohort"
          - name: clean-scratch
            templateRef:
              name: dir-clean-up
              template: dir-clean-up
            arguments:
              parameters:
                - name: directory
                  value: "{{inputs.parameters.sample-scratch-dir}}"
            depends: "collect-qc-data && duckdb-sv && duckdb-snv && collect-msi-data && copy-temp-to-output"
