apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: fan-out-in-params-workflow
  namespace: argo
spec:
  entrypoint: fan-out-in-params-workflow
  nodeSelector:
    kubernetes.io/hostname: gennext.bio
  templates:
  - name: fan-out-in-params-workflow
    steps:
    - - name: generate
        template: gen-number-list
    - - arguments:
          parameters:
          - name: number
            value: '{{item}}'
        name: fan-out
        template: fan-out
        withParam: '{{steps.generate.outputs.result}}'
    - - arguments:
          parameters:
          - name: numbers
            value: '{{steps.fan-out.outputs.parameters}}'
        name: fan-in
        template: fan-in
  - name: gen-number-list
    script:
      command:
      - python
      image: python:alpine3.6
      source: 'import json

        import sys

        import random

        json.dump([i for i in range(1, random.randint(8, 16))], sys.stdout)

        '
  - container:
      args:
      - echo {{inputs.parameters.number}} > /tmp/number.txt
      command:
      - sh
      - -c
      image: alpine:latest
    inputs:
      parameters:
      - name: number
    name: fan-out
    outputs:
      parameters:
      - name: number
        valueFrom:
          path: /tmp/number.txt
    paralellism: 2
  - container:
      args:
      - echo received {{inputs.parameters.numbers}}
      command:
      - sh
      - -c
      image: alpine:latest
    inputs:
      parameters:
      - name: numbers
    name: fan-in
