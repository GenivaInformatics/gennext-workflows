apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gennext-qc
  namespace: argo
spec:
  arguments:
    parameters:
    - name: run-id
    - name: node-name
    - name: temp-dir
    - name: ref-dir
    - name: min-call-rate
      value: '0.99'
    - name: max-mean-detp
      value: '0.01'
    - name: bad-sample-cutoff
      value: '10.5'
  entrypoint: qc
  templates:
  - container:
      args:
      - /app/scripts/qc.R
      - --run-id
      - '{{inputs.parameters.run-id}}'
      - --min-call-rate
      - '{{inputs.parameters.min-call-rate}}'
      - --max-mean-detp
      - '{{inputs.parameters.max-mean-detp}}'
      - --bad-sample-cutoff
      - '{{inputs.parameters.bad-sample-cutoff}}'
      - --output-dir
      - /data/outputs
      command:
      - Rscript
      image: bergun/gennext-minfi:0.1.2
      volumeMounts:
      - mountPath: /data/outputs
        name: temp-dir
      - mountPath: /data/ref
        name: ref-dir
        readOnly: true
    inputs:
      parameters:
      - name: run-id
      - name: node-name
      - name: temp-dir
      - name: ref-dir
      - default: '0.99'
        name: min-call-rate
      - default: '0.01'
        name: max-mean-detp
      - default: '10.5'
        name: bad-sample-cutoff
    name: qc
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.temp-dir}}'
        type: DirectoryOrCreate
      name: temp-dir
    - hostPath:
        path: '{{inputs.parameters.ref-dir}}'
        type: Directory
      name: ref-dir
