apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gennext-assemble
  namespace: argo
spec:
  arguments:
    parameters:
    - name: run-id
    - name: node-name
    - name: temp-dir
    - name: ref-dir
    - name: metadata-file
  entrypoint: assemble
  templates:
  - container:
      args:
      - assemble
      - --run-id
      - '{{inputs.parameters.run-id}}'
      command:
      - gennext-epi
      env:
      - name: RUN_ID
        value: '{{inputs.parameters.run-id}}'
      - name: EWAS_PVALUE_THRESHOLD
        value: 1e-7
      - name: EWAS_TOP_K
        value: '1000'
      - name: EWAS_MIN_CPGS
        value: '10'
      - name: EWAS_WEIGHT_CLIP_MAX
        value: '50'
      - name: MIN_TRAIT_COVERAGE
        value: '0.10'
      - name: LOW_COVERAGE_WARNING
        value: '0.50'
      - name: HYPER_THRESHOLD
        value: '0.70'
      - name: HYPO_THRESHOLD
        value: '0.30'
      - name: AGING_ACCELERATION_THRESHOLD
        value: '3.0'
      - name: AGING_CLOCK_COVERAGE_WARNING
        value: '0.90'
      image: bergun/gennext-epi:0.1.1
      volumeMounts:
      - mountPath: /data/outputs
        name: temp-dir
      - mountPath: /data/ref
        name: ref-dir
        readOnly: true
      - mountPath: /data/config/sample_metadata.tsv
        name: metadata-file
        readOnly: true
    inputs:
      parameters:
      - name: run-id
      - name: node-name
      - name: temp-dir
      - name: ref-dir
      - name: metadata-file
    name: assemble
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.temp-dir}}'
        type: DirectoryOrCreate
      name: temp-dir
    - hostPath:
        path: '{{inputs.parameters.ref-dir}}'
        type: Directory
      name: ref-dir
    - hostPath:
        path: '{{inputs.parameters.metadata-file}}'
        type: File
      name: metadata-file
