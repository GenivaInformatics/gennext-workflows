      source: "ref_version=\"{{inputs.parameters.ref-version}}\"\nif [ \"$ref_version\" = \"hg38\" ]; then\n    grch_ref_version=\"GRCh38\"\nelif [ \"$ref_version\" = \"hg19\" ]; then\n    grch_ref_version=\"\
        GRCh37\"\nelse\n    grch_ref_version=$ref_version\nfi;\n\ntumor_type=\"{{inputs.parameters.tumor-type}}\"\necho \"OncoKB SNV (on-node): Using tumor type: '$tumor_type'\"\n\ninput_file=\"/mnt/input/{{=sprig.osBase(inputs.parameters['annovar-maf-f'])}}\"\
        \noutput_file=\"/mnt/output/{{=sprig.osBase(inputs.parameters['annovar-oncokb-maf-f'])}}\"\n\n# Function to run annotation\nrun_annotation() {\n    echo \"Running OncoKB annotation on node (attempt\
