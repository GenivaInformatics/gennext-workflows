apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: star-align-template
  namespace: argo
spec:
  templates:
  - inputs:
      parameters:
      - name: sample-id
      - name: read-group-str
      - name: fq-r1
      - name: fq-r2
        value: ''
      - name: ctat-genome-lib-build-dir
      - name: output-bam
      - name: output-chimeric-out-fusions
      - name: metrics-dir
      - name: scratch-dir
      - name: thread-count
    name: star-align-arriba
    outputs:
      parameters:
      - name: output-bam
        value: '{{inputs.parameters.output-bam}}'
      - name: output-chimeric-out-fusions
        value: '{{inputs.parameters.output-chimeric-out-fusions}}'
      - name: star-log-final
        value: '{{inputs.parameters.metrics-dir}}Log.final.out'
    script:
      command:
      - sh
      env:
      - name: STAR_RG_LINE
        value: '{{inputs.parameters.read-group-str}}'
      image: quay.io/biocontainers/star:2.7.11b--h43eeafb_3
      name: star-align-arriba
      resources:
        requests:
          cpu: '8'
          memory: 32Gi
      source: "set -euo pipefail\n\nfqR1=\"{{=sprig.osBase(inputs.parameters['fq-r1'])}}\"\nfqR2=\"{{=sprig.osBase(inputs.parameters['fq-r2'])}}\"\n\nBAM_OUT_DIR=\"/mnt/output/bam\"\nBAM_OUT_FILE=\"$BAM_OUT_DIR/{{=sprig.osBase(inputs.parameters['output-bam'])}}\"\
        \nCHIMERIC_OUT_DIR=\"/mnt/output/chimeric\"\nCHIMERIC_OUT_FILE=\"$CHIMERIC_OUT_DIR/{{=sprig.osBase(inputs.parameters['output-chimeric-out-fusions'])}}\"\n\n# Clean stale checkpoints/output from\
        \ any previous run\nrm -rf /mnt/scratch/*\n\n# Build optional R2 arg for paired-end\nR2_PATH=\"\"\nif [ -n \"$fqR2\" ]; then\n  R2_PATH=\"/mnt/input/r2/$fqR2\"\nfi\n\necho \"Running STAR (Arriba-tuned\
        \ chimeric params; BAM + Chimeric.out.junction)\"\n# --outSAMmultNmax 1: emit only the primary alignment per read,\n# even when --outFilterMultimapNmax allows up to 50 multi-mapping\n# locations.\
        \ The NH:i:N tag stays on the primary so consumers\n# that need multi-mapping awareness (arriba's `multimappers`\n# filter, RNA-seq QC) still have the info. ~40% reduction in\n# BAM size on a typical\
        \ RNA-seq library; all downstream tasks\n# (samtools sort, fgbio mark-duplicates, arriba, FI extractor)\n# process less data. Supplementary chimeric alignments (0x800)\n# are unaffected \u2014 they're\
        \ the fusion evidence and stay.\n#\n# TODO(sensitivity): for fusions in paralog-heavy regions\n# (kinase families, IG/TR loci, NTRK/ROS1/ALK with pseudogenes,\n# ribosomal-adjacent genes), losing\
        \ the secondary supplementary\n# alignments means losing real evidence. Arriba's recommended\n# STAR config sets --chimMultimapNmax 50 specifically to capture\n# these. To recover them, we'd need\
        \ to:\n#   - Drop --outSAMmultNmax 1 (or raise it for chimerics only)\n#   - Handle secondary alignments through fgbio's pipeline\n#     differently (currently they break SetMateInformation /\n\
        #     GroupReadsByUmi because MQ isn't set on secondaries)\n#   - Possibly split the BAM: primaries through fgbio mark-dup,\n#     secondaries kept separate and merged back for arriba.\n# Tracking\
        \ as a follow-up \u2014 single-best-alignment is acceptable\n# for the calls we currently care about.\nSTAR \\\n  --runMode alignReads \\\n  --genomeDir /mnt/ref/ctat-lib/ref_genome.fa.star.idx\
        \ \\\n  --readFilesIn \"/mnt/input/r1/$fqR1\" $R2_PATH \\\n  --readFilesCommand zcat \\\n  --outFileNamePrefix /mnt/scratch/ \\\n  --outSAMtype BAM Unsorted \\\n  --outSAMunmapped None \\\n  --outSAMattrRGline\
        \ \"$STAR_RG_LINE\" \\\n  --runThreadN {{inputs.parameters.thread-count}} \\\n  --outFilterMultimapNmax 50 \\\n  --outSAMmultNmax 1 \\\n  --peOverlapNbasesMin 10 \\\n  --alignSplicedMateMapLminOverLmate\
        \ 0.5 \\\n  --alignSJstitchMismatchNmax 5 -1 5 5 \\\n  --chimOutType WithinBAM HardClip Junctions \\\n  --chimOutJunctionFormat 1 \\\n  --chimSegmentMin 10 \\\n  --chimJunctionOverhangMin 10 \\\n\
        \  --chimScoreMin 1 \\\n  --chimScoreDropMax 30 \\\n  --chimScoreJunctionNonGTAG 0 \\\n  --chimScoreSeparation 1 \\\n  --chimSegmentReadGapMax 3 \\\n  --chimMultimapNmax 50\n\nif [ -f \"/mnt/scratch/Aligned.out.bam\"\
        \ ]; then\n  mv /mnt/scratch/Aligned.out.bam \"$BAM_OUT_FILE\"\n  echo \"STAR BAM at $BAM_OUT_FILE\"\nelse\n  echo \"ERROR: STAR did not produce Aligned.out.bam\"\n  ls -la /mnt/scratch/\n  exit\
        \ 1\nfi\n\n# --chimOutJunctionFormat 1 produces the STAR-Fusion-compatible\n# Chimeric.out.junction (header + 21-column body). Required by\n# the star-fusion-from-junction kickstart template downstream.\n\
        if [ -f \"/mnt/scratch/Chimeric.out.junction\" ]; then\n  mv /mnt/scratch/Chimeric.out.junction \"$CHIMERIC_OUT_FILE\"\n  echo \"Chimeric junctions at $CHIMERIC_OUT_FILE\"\nelse\n  echo \"WARN:\
        \ STAR did not produce Chimeric.out.junction; emitting empty header-only file\"\n  echo -e \"chr_donorA\\tbrkpt_donorA\\tstrand_donorA\\tchr_acceptorB\\tbrkpt_acceptorB\\tstrand_acceptorB\\tjunction_type\\\
        trepeat_left_lenA\\trepeat_right_lenB\\tread_name\\tstart_alnA\\tcigar_alnA\\tstart_alnB\\tcigar_alnB\\tnum_chim_aln\\tmax_poss_aln_score\\tnon_chim_aln_score\\tthis_chim_aln_score\\tbestall_chim_aln_score\\\
        tPEmerged_bool\\treadgrp\" > \"$CHIMERIC_OUT_FILE\"\nfi\n\n# Relay STAR alignment summary into metrics-dir for MultiQC.\nfor f in Log.final.out SJ.out.tab; do\n  if [ -f \"/mnt/scratch/$f\" ]; then\n\
        \    cp \"/mnt/scratch/$f\" \"/mnt/metrics/$f\"\n  fi\ndone\n"
      volumeMounts:
      - mountPath: /mnt/input/r1/{{=sprig.osBase(inputs.parameters['fq-r1'])}}
        name: fq-r1
      - mountPath: /mnt/input/r2/{{=sprig.osBase(inputs.parameters['fq-r2'])}}
        name: fq-r2
      - mountPath: /mnt/output/bam/
        name: output-bam
      - mountPath: /mnt/output/chimeric/
        name: output-chimeric-out-fusions
      - mountPath: /mnt/metrics/
        name: metrics-dir
      - mountPath: /mnt/scratch/
        name: scratch-dir
      - mountPath: /mnt/ref/ctat-lib/
        name: ctat-genome-lib-build-dir
    volumes:
    - hostPath:
        path: '{{inputs.parameters.fq-r1}}'
        type: File
      name: fq-r1
    - hostPath:
        path: '{{inputs.parameters.fq-r2}}'
        type: File
      name: fq-r2
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-bam''])}}'
        type: DirectoryOrCreate
      name: output-bam
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-chimeric-out-fusions''])}}'
        type: DirectoryOrCreate
      name: output-chimeric-out-fusions
    - hostPath:
        path: '{{inputs.parameters.metrics-dir}}'
        type: DirectoryOrCreate
      name: metrics-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''scratch-dir''])}}'
        type: DirectoryOrCreate
      name: scratch-dir
    - hostPath:
        path: '{{inputs.parameters.ctat-genome-lib-build-dir}}'
        type: Directory
      name: ctat-genome-lib-build-dir
