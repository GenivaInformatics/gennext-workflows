apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pgs-workflow
  namespace: argo
spec:
  entrypoint: main
  templates:
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: ref-base-dir
            value: '{{inputs.parameters.ref-base-dir}}'
          - name: ref-ver
            value: hg19
        name: get-abs-pgs-ref-dirs
        templateRef:
          name: get-abs-pgs-ref-dirs
          template: get-abs-pgs-ref-dirs
      - arguments:
          parameters:
          - name: input-file-1
            value: '{{inputs.parameters.genotype-file-name}}'
          - name: input-file-2
            value: .
          - name: input-file-3
            value: .
          - name: input-rel-dir
            value: '{{inputs.parameters.input-rel-dir}}'
        name: check-file-path
        templateRef:
          name: check-file-path
          template: check-file-path
      - arguments:
          parameters:
          - name: genotype-file
            value: '{{tasks.check-file-path.outputs.parameters.output-file-1}}'
          - name: input-rel-dir
            value: '{{tasks.check-file-path.outputs.parameters.input-rel-dir-1}}'
          - name: scratch-rel-dir
            value: '{{inputs.parameters.scratch-rel-dir}}/genotype_file/'
        depends: check-file-path
        name: copy-genotype-file-to-scratch
        templateRef:
          name: copy-inputs-to-scratch
          template: copy-genotype-file-to-scratch
      - arguments:
          parameters:
          - name: input-genotype-file
            value: '{{tasks.copy-genotype-file-to-scratch.outputs.parameters.output-genotype-file}}'
          - name: output-genotype-file
            value: '{{inputs.parameters.temp-rel-dir}}/genotype_file/{{inputs.parameters.genotype-file-name}}'
          - name: dbsnp-file
            value: '{{tasks.get-abs-pgs-ref-dirs.outputs.parameters.dbsnp-f}}'
        depends: copy-genotype-file-to-scratch && get-abs-pgs-ref-dirs
        name: update-genotype-snps
        templateRef:
          name: update-genotype-snps-template
          template: update-genotype-snps
      - arguments:
          parameters:
          - name: input-genotype-file
            value: '{{tasks.update-genotype-snps.outputs.parameters.output-genotype-file}}'
          - name: ref-pgs-folder
            value: '{{tasks.get-abs-pgs-ref-dirs.outputs.parameters.pgs-dir}}'
          - name: ref-pgs-metadata
            value: '{{tasks.get-abs-pgs-ref-dirs.outputs.parameters.pgs-metadata-f}}'
          - name: output-dbs-folder
            value: '{{inputs.parameters.temp-rel-dir}}/dbs/'
          - name: output-json-folder
            value: '{{inputs.parameters.scratch-rel-dir}}/json/'
          - name: thread-count
            value: '{{inputs.parameters.thread-count}}'
        depends: update-genotype-snps
        name: gennext-prs
        templateRef:
          name: gennext-prs-template
          template: gennext-prs
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.product-id}}'
          - name: output-rel-dir
            value: '{{inputs.parameters.output-rel-dir}}'
          - name: temp-rel-dir
            value: '{{inputs.parameters.temp-rel-dir}}'
        depends: gennext-prs
        name: copy-temp-to-output
        templateRef:
          name: copy-temp-to-output
          template: copy-temp-to-output
      - arguments:
          parameters:
          - name: directory
            value: '{{inputs.parameters.scratch-rel-dir}}'
        depends: copy-temp-to-output
        name: clean-scratch
        templateRef:
          name: dir-clean-up
          template: dir-clean-up
    inputs:
      parameters:
      - name: user-id
      - name: run-id
      - name: product-id
      - name: genotype-file-name
      - name: input-rel-dir
      - name: ref-base-dir
      - name: temp-rel-dir
      - name: scratch-rel-dir
      - name: output-rel-dir
      - default: '20'
        name: thread-count
    name: prs-by-genotype-data
    outputs:
      parameters:
      - name: dbs-folder
        valueFrom:
          parameter: '{{tasks.gennext-prs.outputs.parameters.dbs-folder}}'
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: user-id
            value: '{{inputs.parameters.user-id}}'
          - name: run-id
            value: '{{inputs.parameters.run-id}}'
          - name: run-data
            value: '{{inputs.parameters.run-data}}'
          - name: input-rel-dir
            value: '{{inputs.parameters.input-rel-dir}}'
          - name: temp-rel-dir
            value: '{{inputs.parameters.temp-rel-dir}}'
          - name: scratch-rel-dir
            value: '{{inputs.parameters.scratch-rel-dir}}'
          - name: output-rel-dir
            value: '{{inputs.parameters.output-rel-dir}}'
          - name: ref-base-dir
            value: '{{inputs.parameters.ref-base-dir}}'
          - name: thread-count
            value: '{{inputs.parameters.thread-count}}'
        name: prs-workflow
        template: prs-by-genotype-data
    inputs:
      parameters:
      - name: user-id
      - name: run-id
      - name: product-id
      - name: genotype-file-name
      - name: input-rel-dir
      - name: temp-rel-dir
      - name: scratch-rel-dir
      - name: output-rel-dir
      - name: ref-base-dir
      - default: '8'
        name: thread-count
    name: main
