apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cnvkit-annotate
  namespace: argo
  labels:
    pipeline: cnv-calling
    tool: cnvkit-annotate
spec:
  templates:
  - container:
      args:
      - "import sys\nimport os\nfrom collections import defaultdict\n\nSAMPLE_ID = \"{{inputs.parameters.sample-id}}\"\nINPUT_VCF = f\"/mnt/output/{SAMPLE_ID}.cnv.vcf\"\nOUTPUT_VCF = f\"/mnt/output/{SAMPLE_ID}.cnv.annotated.vcf\"\
        \nREFFLAT = \"/mnt/ref/regions/refFlat_hg38.txt\"\n\nprint(\"=== CNVkit Gene Annotation ===\")\nprint(f\"  Sample:  {SAMPLE_ID}\")\nprint(f\"  Input:   {INPUT_VCF}\")\nprint(f\"  RefFlat: {REFFLAT}\"\
        )\nprint(f\"  Output:  {OUTPUT_VCF}\")\n\n# Validate inputs\nfor path, label in [(INPUT_VCF, \"Input VCF\"), (REFFLAT, \"RefFlat\")]:\n    if not os.path.isfile(path):\n        print(f\"Error: {label}\
        \ not found: {path}\", file=sys.stderr)\n        sys.exit(1)\n\n# --- Parse refFlat file ---\nprint(\"Parsing refFlat file...\")\ngenes_by_chrom = defaultdict(list)\n\nwith open(REFFLAT, \"r\")\
        \ as f:\n    for line in f:\n        fields = line.strip().split(\"\\t\")\n        if len(fields) < 11:\n            continue\n\n        exon_starts = [int(x) for x in fields[9].rstrip(\",\").split(\"\
        ,\") if x]\n        exon_ends = [int(x) for x in fields[10].rstrip(\",\").split(\",\") if x]\n\n        gene = {\n            \"name\": fields[0],\n            \"transcript\": fields[1],\n     \
        \       \"chrom\": fields[2],\n            \"strand\": fields[3],\n            \"tx_start\": int(fields[4]),\n            \"tx_end\": int(fields[5]),\n            \"cds_start\": int(fields[6]),\n\
        \            \"cds_end\": int(fields[7]),\n            \"exon_count\": int(fields[8]),\n            \"exon_starts\": exon_starts,\n            \"exon_ends\": exon_ends,\n        }\n        genes_by_chrom[gene[\"\
        chrom\"]].append(gene)\n\nfor chrom in genes_by_chrom:\n    genes_by_chrom[chrom].sort(key=lambda g: g[\"tx_start\"])\n\ntotal_genes = sum(len(v) for v in genes_by_chrom.values())\nprint(f\"Loaded\
        \ {total_genes} gene annotations from {len(genes_by_chrom)} chromosomes\")\n\n\ndef find_overlapping_genes(chrom, start, end, min_overlap=0.1):\n    \"\"\"Find genes overlapping a region, return\
        \ list of overlap dicts.\"\"\"\n    overlaps = []\n    if chrom not in genes_by_chrom:\n        return overlaps\n\n    for gene in genes_by_chrom[chrom]:\n        if gene[\"tx_end\"] < start:\n\
        \            continue\n        if gene[\"tx_start\"] > end:\n            break\n\n        overlap_start = max(start, gene[\"tx_start\"])\n        overlap_end = min(end, gene[\"tx_end\"])\n     \
        \   overlap_size = overlap_end - overlap_start\n\n        if overlap_size <= 0:\n            continue\n\n        gene_size = gene[\"tx_end\"] - gene[\"tx_start\"]\n        if gene_size == 0:\n \
        \           continue\n        percent_overlap = (overlap_size / gene_size) * 100\n\n        if percent_overlap < (min_overlap * 100):\n            continue\n\n        # Determine overlap type\n\
        \        if start <= gene[\"tx_start\"] and end >= gene[\"tx_end\"]:\n            overlap_type = \"COMPLETE\"\n        elif start > gene[\"tx_start\"] and end < gene[\"tx_end\"]:\n            overlap_type\
        \ = \"INTERNAL\"\n        elif gene[\"tx_start\"] <= start and gene[\"tx_end\"] >= end:\n            overlap_type = \"SPANNING\"\n        elif gene[\"strand\"] == \"+\":\n            overlap_type\
        \ = \"PARTIAL_5PRIME\" if end < gene[\"tx_end\"] else \"PARTIAL_3PRIME\"\n        else:\n            overlap_type = \"PARTIAL_5PRIME\" if start > gene[\"tx_start\"] else \"PARTIAL_3PRIME\"\n\n \
        \       # Determine functional impact\n        if overlap_start < gene[\"cds_end\"] and overlap_end > gene[\"cds_start\"]:\n            impact = \"CDS_AFFECTED\"\n        elif overlap_start < gene[\"\
        tx_start\"] - 2000:\n            impact = \"PROMOTER\"\n        else:\n            impact = \"UTR_ONLY\"\n\n        # Count affected exons\n        exons_affected = 0\n        for i in range(gene[\"\
        exon_count\"]):\n            if overlap_start < gene[\"exon_ends\"][i] and overlap_end > gene[\"exon_starts\"][i]:\n                exons_affected += 1\n\n        overlaps.append({\n           \
        \ \"gene_name\": gene[\"name\"],\n            \"overlap_type\": overlap_type,\n            \"impact\": impact,\n            \"percent_overlap\": percent_overlap,\n            \"exons_affected\"\
        : exons_affected,\n            \"total_exons\": gene[\"exon_count\"],\n        })\n\n    return overlaps\n\n\ndef deduplicate_overlaps(overlaps):\n    \"\"\"Keep best transcript per gene name.\"\
        \"\"\n    type_priority = {\n        \"COMPLETE\": 4, \"SPANNING\": 3,\n        \"PARTIAL_5PRIME\": 2, \"PARTIAL_3PRIME\": 2,\n        \"INTERNAL\": 1,\n    }\n    best = {}\n    for o in overlaps:\n\
        \        name = o[\"gene_name\"]\n        if name not in best:\n            best[name] = o\n        else:\n            cur = best[name]\n            cur_pri = type_priority.get(cur[\"overlap_type\"\
        ], 0)\n            new_pri = type_priority.get(o[\"overlap_type\"], 0)\n            if new_pri > cur_pri or (new_pri == cur_pri and o[\"percent_overlap\"] > cur[\"percent_overlap\"]):\n        \
        \        best[name] = o\n    return list(best.values())\n\n\ndef extract_info_value(info_str, key):\n    \"\"\"Extract a value from VCF INFO field by key.\"\"\"\n    for field in info_str.split(\"\
        ;\"):\n        if field.startswith(key + \"=\"):\n            return field[len(key) + 1:]\n    return None\n\n# --- Process VCF ---\nprint(\"Processing VCF...\")\ntotal_variants = 0\nannotated_variants\
        \ = 0\n\nnew_info_headers = [\n    '##INFO=<ID=GENES,Number=.,Type=String,Description=\"Comma-separated list of overlapping gene names\">',\n    '##INFO=<ID=GENE_COUNT,Number=1,Type=Integer,Description=\"\
        Number of overlapping genes\">',\n    '##INFO=<ID=GENE_DETAILS,Number=.,Type=String,Description=\"Detailed gene overlap information (gene:overlap_type:impact:percent:exons)\">',\n]\n\nwith open(INPUT_VCF,\
        \ \"r\") as fin, open(OUTPUT_VCF, \"w\") as fout:\n    for line in fin:\n        if line.startswith(\"##\"):\n            fout.write(line)\n            continue\n\n        if line.startswith(\"\
        #CHROM\"):\n            # Insert new INFO headers before the #CHROM line\n            for hdr in new_info_headers:\n                fout.write(hdr + \"\\n\")\n            fout.write(line)\n    \
        \        continue\n\n        # Data line\n        total_variants += 1\n        parts = line.rstrip(\"\\n\").split(\"\\t\")\n        if len(parts) < 8:\n            fout.write(line)\n           \
        \ continue\n\n        chrom = parts[0]\n        pos = int(parts[1])\n        info = parts[7]\n\n        # Get END from INFO field\n        end_val = extract_info_value(info, \"END\")\n        end\
        \ = int(end_val) if end_val else pos\n\n        overlaps = find_overlapping_genes(chrom, pos, end)\n\n        if overlaps:\n            annotated_variants += 1\n            unique_overlaps = deduplicate_overlaps(overlaps)\n\
        \            gene_names = [o[\"gene_name\"] for o in unique_overlaps]\n\n            genes_str = \",\".join(gene_names)\n            gene_count = len(gene_names)\n            details = \"|\".join(\n\
        \                f'{o[\"gene_name\"]}:{o[\"overlap_type\"]}:{o[\"impact\"]}:{o[\"percent_overlap\"]:.0f}%:{o[\"exons_affected\"]}/{o[\"total_exons\"]}_exons'\n                for o in unique_overlaps\n\
        \            )\n\n            parts[7] = f\"{info};GENES={genes_str};GENE_COUNT={gene_count};GENE_DETAILS={details}\"\n\n        fout.write(\"\\t\".join(parts) + \"\\n\")\n\nif total_variants >\
        \ 0:\n    pct = 100 * annotated_variants / total_variants\nelse:\n    pct = 0\n\nprint(f\"\\nAnnotation complete:\")\nprint(f\"  Total variants:     {total_variants}\")\nprint(f\"  Annotated variants:\
        \ {annotated_variants} ({pct:.1f}%)\")\nprint(f\"  Output: {OUTPUT_VCF}\")\n"
      command:
      - python3
      - -c
      image: python:3.11-slim
      resources:
        requests:
          cpu: '1'
          memory: 2Gi
      volumeMounts:
      - mountPath: /mnt/ref
        name: ref-data
        readOnly: true
      - mountPath: /mnt/output
        name: output-data
    inputs:
      parameters:
      - name: sample-id
    name: run-cnvkit-annotate
