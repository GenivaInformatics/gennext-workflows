apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gennext-finalize
  namespace: argo
spec:
  arguments:
    parameters:
    - name: node-name
    - name: temp-dir
    - name: output-dir
  entrypoint: finalize
  templates:
  - container:
      args:
      - 'set -e

        echo "Copying runs/ to final output..."

        cp -a /data/outputs/runs /data/final-output/ 2>/dev/null || echo "No runs/ directory found, skipping."

        echo "Copying elmp/ to final output..."

        cp -a /data/outputs/elmp /data/final-output/ 2>/dev/null || echo "No elmp/ directory found, skipping."

        echo "Cleaning up intermediate data..."

        rm -rf /data/outputs/intermediate

        echo "Finalize complete."

        '
      command:
      - /bin/sh
      - -c
      image: alpine:3.19
      volumeMounts:
      - mountPath: /data/outputs
        name: temp-dir
      - mountPath: /data/final-output
        name: output-dir
    inputs:
      parameters:
      - name: node-name
      - name: temp-dir
      - name: output-dir
    name: finalize
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.temp-dir}}'
        type: Directory
      name: temp-dir
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
