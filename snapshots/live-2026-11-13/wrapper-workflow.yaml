apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: wrapper-workflow
  namespace: argo
spec:
  arguments:
    parameters:
    - name: node-name
    - name: user-id
    - name: job-id
    - name: process-type
  entrypoint: wrapper-workflow
  nodeSelector:
    kubernetes.io/hostname: '{{workflow.parameters.node-name}}'
  podGC:
    strategy: OnPodSuccess
  serviceAccountName: gennext-workflows
  templates:
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: node-name
            value: '{{workflow.parameters.node-name}}'
          - name: user-id
            value: '{{workflow.parameters.user-id}}'
          - name: job-id
            value: '{{workflow.parameters.job-id}}'
        name: get-node-config
        templateRef:
          name: get-node-config
          template: get-node-config
      - arguments:
          parameters:
          - name: job-id
            value: '{{workflow.parameters.job-id}}'
          - name: input-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.input-rel-dir}}'
        depends: get-node-config
        name: get-run-data
        templateRef:
          name: get-run-data
          template: get-run-data
      - arguments:
          parameters:
          - name: user-id
            value: '{{workflow.parameters.user-id}}'
          - name: run-id
            value: '{{workflow.parameters.job-id}}'
          - name: run-data
            value: '{{tasks.get-run-data.outputs.parameters.run-data}}'
          - name: input-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.input-rel-dir}}'
          - name: temp-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}'
          - name: scratch-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}'
          - name: output-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.output-rel-dir}}'
          - name: ref-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}'
          - name: modules-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.modules-base-dir}}'
          - name: annots-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.annots-base-dir}}'
          - name: job-id
            value: '{{workflow.parameters.job-id}}'
          - name: ref-ver
            value: '{{=jsonpath(tasks[''get-run-data''].outputs.parameters[''run-data''], ''$.refVersion'')}}'
          - name: thread-count
            value: '{{tasks.get-node-config.outputs.parameters.thread-count}}'
        depends: get-run-data && get-node-config
        name: tps-workflow
        templateRef:
          name: germline-tps-gpu-workflow
          template: main
        when: '''{{workflow.parameters.process-type}}'' == ''targetted'' || ''{{workflow.parameters.process-type}}'' == ''tps'' || ''{{workflow.parameters.process-type}}'' == ''ces'''
      - arguments:
          parameters:
          - name: user-id
            value: '{{workflow.parameters.user-id}}'
          - name: run-id
            value: '{{workflow.parameters.job-id}}'
          - name: run-data
            value: '{{tasks.get-run-data.outputs.parameters.run-data}}'
          - name: input-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.input-rel-dir}}'
          - name: temp-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}'
          - name: scratch-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}'
          - name: output-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.output-rel-dir}}'
          - name: ref-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}'
          - name: modules-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.modules-base-dir}}'
          - name: annots-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.annots-base-dir}}'
          - name: job-id
            value: '{{workflow.parameters.job-id}}'
          - name: ref-ver
            value: '{{=jsonpath(tasks[''get-run-data''].outputs.parameters[''run-data''], ''$.refVersion'')}}'
          - name: thread-count
            value: '{{tasks.get-node-config.outputs.parameters.thread-count}}'
        depends: get-run-data && get-node-config
        name: wes-workflow
        templateRef:
          name: germline-wes-gpu-workflow
          template: main
        when: '''{{workflow.parameters.process-type}}'' == ''wes'''
      - arguments:
          parameters:
          - name: user-id
            value: '{{workflow.parameters.user-id}}'
          - name: run-id
            value: '{{workflow.parameters.job-id}}'
          - name: run-data
            value: '{{tasks.get-run-data.outputs.parameters.run-data}}'
          - name: input-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.input-rel-dir}}'
          - name: temp-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}'
          - name: scratch-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}'
          - name: output-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.output-rel-dir}}'
          - name: ref-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}'
          - name: modules-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.modules-base-dir}}'
          - name: annots-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.annots-base-dir}}'
          - name: ref-ver
            value: '{{=jsonpath(tasks[''get-run-data''].outputs.parameters[''run-data''], ''$.refVersion'')}}'
          - name: thread-count
            value: '{{tasks.get-node-config.outputs.parameters.thread-count}}'
        depends: get-run-data && get-node-config
        name: rna-workflow
        templateRef:
          name: germline-rna-gpu-workflow
          template: main
        when: '''{{workflow.parameters.process-type}}'' == ''rna'''
      - arguments:
          parameters:
          - name: user-id
            value: '{{workflow.parameters.user-id}}'
          - name: run-id
            value: '{{workflow.parameters.job-id}}'
          - name: run-data
            value: '{{tasks.get-run-data.outputs.parameters.run-data}}'
          - name: input-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.input-rel-dir}}'
          - name: temp-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}'
          - name: scratch-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}'
          - name: output-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.output-rel-dir}}'
          - name: ref-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}'
          - name: modules-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.modules-base-dir}}'
          - name: annots-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.annots-base-dir}}'
          - name: job-id
            value: '{{workflow.parameters.job-id}}'
          - name: ref-ver
            value: '{{=jsonpath(tasks[''get-run-data''].outputs.parameters[''run-data''], ''$.refVersion'')}}'
          - name: thread-count
            value: '{{tasks.get-node-config.outputs.parameters.thread-count}}'
        depends: get-run-data && get-node-config
        name: wgs-workflow
        templateRef:
          name: germline-wgs-gpu-workflow
          template: main
        when: '''{{workflow.parameters.process-type}}'' == ''wgs'''
      - arguments:
          parameters:
          - name: user-id
            value: '{{workflow.parameters.user-id}}'
          - name: run-id
            value: '{{workflow.parameters.job-id}}'
          - name: run-data
            value: '{{tasks.get-run-data.outputs.parameters.run-data}}'
          - name: input-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.input-rel-dir}}'
          - name: temp-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}'
          - name: scratch-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}'
          - name: output-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.output-rel-dir}}'
          - name: ref-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}'
          - name: thread-count
            value: '{{tasks.get-node-config.outputs.parameters.thread-count}}'
        depends: get-run-data && get-node-config
        name: somatic-testing-tumor-workflow
        templateRef:
          name: somatic-testing-workflow
          template: main-dna
        when: '''{{workflow.parameters.process-type}}'' == ''som-test-tumor'''
      - arguments:
          parameters:
          - name: user-id
            value: '{{workflow.parameters.user-id}}'
          - name: run-id
            value: '{{workflow.parameters.job-id}}'
          - name: run-data
            value: '{{tasks.get-run-data.outputs.parameters.run-data}}'
          - name: input-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.input-rel-dir}}'
          - name: temp-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}'
          - name: scratch-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}'
          - name: output-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.output-rel-dir}}'
          - name: ref-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}'
          - name: thread-count
            value: '{{tasks.get-node-config.outputs.parameters.thread-count}}'
        depends: get-run-data && get-node-config
        name: somatic-testing-rna-workflow
        templateRef:
          name: somatic-testing-workflow
          template: main-rna
        when: '''{{workflow.parameters.process-type}}'' == ''som-test-rna'''
      - arguments:
          parameters:
          - name: user-id
            value: '{{workflow.parameters.user-id}}'
          - name: run-id
            value: '{{workflow.parameters.job-id}}'
          - name: run-data
            value: '{{tasks.get-run-data.outputs.parameters.run-data}}'
          - name: input-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.input-rel-dir}}'
          - name: temp-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}'
          - name: scratch-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}'
          - name: output-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.output-rel-dir}}'
          - name: ref-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}'
          - name: thread-count
            value: '{{tasks.get-node-config.outputs.parameters.thread-count}}'
        depends: get-run-data && get-node-config
        name: somatic-testing-tumor-rna-workflow
        templateRef:
          name: somatic-testing-workflow
          template: main-dna-rna
        when: '''{{workflow.parameters.process-type}}'' == ''som-test-tumor-rna'''
      - arguments:
          parameters:
          - name: run-id
            value: '{{workflow.parameters.job-id}}'
          - name: run-state
            value: completed
        depends: (tps-workflow.Succeeded || wes-workflow.Succeeded || wgs-workflow.Succeeded || somatic-testing-tumor-workflow.Succeeded || somatic-testing-rna-workflow.Succeeded || somatic-testing-tumor-rna-workflow.Succeeded)
          && get-run-data.Succeeded
        name: set-state-completed
        templateRef:
          name: change-run-state-template
          template: change-run-state
    name: wrapper-workflow
  workflowMetadata:
    generateName: wrapper-workflow-{{workflow.parameters.job-id}}-
    labels:
      gennext.bio/node: '{{workflow.parameters.node-name}}'
      gennext.bio/process-type: '{{workflow.parameters.process-type}}'
      gennext.bio/user-id: '{{workflow.parameters.user-id}}'
