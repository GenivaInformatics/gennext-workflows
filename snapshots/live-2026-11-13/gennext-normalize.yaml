apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gennext-normalize
  namespace: argo
spec:
  arguments:
    parameters:
    - name: run-id
    - name: node-name
    - name: temp-dir
    - name: ref-dir
    - name: normalization-method
      value: noob
    - name: detp-threshold
      value: '0.01'
    - name: autosomes-only
      value: 'false'
  entrypoint: normalize
  templates:
  - container:
      args:
      - "ARGS=\"--run-id {{inputs.parameters.run-id}} --normalization-method {{inputs.parameters.normalization-method}} --max-mean-detp {{inputs.parameters.detp-threshold}} --output-dir /data/outputs\"\n\
        if [ \"{{inputs.parameters.autosomes-only}}\" = \"true\" ]; then\n  ARGS=\"$ARGS --autosomes-only\"\nfi\nexec Rscript /app/scripts/normalize.R $ARGS\n"
      command:
      - /bin/sh
      - -c
      image: bergun/gennext-minfi:0.1.2
      volumeMounts:
      - mountPath: /data/outputs
        name: temp-dir
      - mountPath: /data/ref
        name: ref-dir
        readOnly: true
    inputs:
      parameters:
      - name: run-id
      - name: node-name
      - name: temp-dir
      - name: ref-dir
      - default: noob
        name: normalization-method
      - default: '0.01'
        name: detp-threshold
      - default: 'false'
        name: autosomes-only
    name: normalize
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.temp-dir}}'
        type: DirectoryOrCreate
      name: temp-dir
    - hostPath:
        path: '{{inputs.parameters.ref-dir}}'
        type: Directory
      name: ref-dir
