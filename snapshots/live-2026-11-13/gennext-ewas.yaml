apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gennext-ewas
  namespace: argo
spec:
  arguments:
    parameters:
    - name: node-name
    - name: temp-dir
    - name: ref-dir
  entrypoint: ewas
  templates:
  - container:
      args:
      - ewas
      command:
      - gennext-epi
      env:
      - name: EWAS_PVALUE_THRESHOLD
        value: 1e-7
      - name: EWAS_TOP_K
        value: '1000'
      - name: EWAS_MIN_CPGS
        value: '10'
      - name: EWAS_WEIGHT_CLIP_MAX
        value: '50'
      - name: MIN_TRAIT_COVERAGE
        value: '0.10'
      - name: LOW_COVERAGE_WARNING
        value: '0.50'
      - name: HYPER_THRESHOLD
        value: '0.70'
      - name: HYPO_THRESHOLD
        value: '0.30'
      image: bergun/gennext-epi:0.1.1
      volumeMounts:
      - mountPath: /data/ref
        name: ref-dir
        readOnly: true
      - mountPath: /data/outputs
        name: temp-dir
    inputs:
      parameters:
      - name: node-name
      - name: temp-dir
      - name: ref-dir
    name: ewas
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.ref-dir}}'
        type: Directory
      name: ref-dir
    - hostPath:
        path: '{{inputs.parameters.temp-dir}}'
        type: DirectoryOrCreate
      name: temp-dir
