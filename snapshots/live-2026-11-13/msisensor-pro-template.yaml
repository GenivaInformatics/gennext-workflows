apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: msisensor-pro-template
  namespace: argo
spec:
  entrypoint: msisensor-pro
  templates:
  - inputs:
      parameters:
      - name: sample-id
      - name: tcga-baseline
      - name: input-bam
      - name: output-dir
      - default: ''
        name: regions-bed-f
    name: msisensor-pro
    outputs:
      parameters:
      - name: output-tsv
        value: '{{inputs.parameters.output-dir}}/{{inputs.parameters.sample-id}}_fusions_msi'
    script:
      command:
      - sh
      image: quay.io/biocontainers/msisensor-pro:1.3.0--hd979922_1
      name: msisensor-pro-script
      source: "REGIONS_BED=\"{{inputs.parameters.regions-bed-f}}\"\nBED_FLAG=\"\"\nif [ -n \"$REGIONS_BED\" ]; then\n  BED_FLAG=\"-e /mnt/bed/$(basename \"$REGIONS_BED\")\"\nfi\n\nmsisensor-pro pro \\\n\
        -d /ref/msisensor-pro/{{=sprig.osBase(inputs.parameters['tcga-baseline'])}} \\\n-t /mnt/input/{{=sprig.osBase(inputs.parameters['input-bam'])}} \\\n$BED_FLAG \\\n-o /mnt/output/{{inputs.parameters.sample-id}}_fusions_msi\n"
      volumeMounts:
      - mountPath: /mnt/input/
        name: input-bam
      - mountPath: /mnt/output/
        name: output-dir
      - mountPath: /ref/msisensor-pro/{{=sprig.osBase(inputs.parameters['tcga-baseline'])}}
        name: tcga-baseline
      - mountPath: /mnt/bed/
        name: regions-bed-f
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
    - hostPath:
        path: '{{inputs.parameters.tcga-baseline}}'
        type: File
      name: tcga-baseline
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''regions-bed-f''] != '''' ? inputs.parameters[''regions-bed-f''] : ''/tmp/empty'')}}'
        type: DirectoryOrCreate
      name: regions-bed-f
