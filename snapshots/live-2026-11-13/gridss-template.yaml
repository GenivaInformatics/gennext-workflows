apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gridss-template
  namespace: argo
spec:
  arguments: {}
  templates:
  - inputs:
      parameters:
      - name: input-bam
      - name: input-bed
    metadata: {}
    name: gridss-filter
    outputs:
      parameters:
      - name: output-bam
        valueFrom:
          path: /mnt/output/targeted_bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}
    script:
      command:
      - sh
      image: quay.io/biocontainers/gridss:2.13.2--h96c455f_5
      name: ''
      resources: {}
      source: 'gridss_extract_overlapping_fragments \ --targetbed /mnt/input/bed/{{=sprig.osBase(inputs.parameters[''input-bed''])}} \ --threads 20 \ -j /usr/local/share/gridss-2.13.2-5/gridss.jar \ -o
        /mnt/output/targeted_bam/{{=sprig.osBase(inputs.parameters[''input-bam''])}} \ /mnt/input/bam/{{=sprig.osBase(inputs.parameters[''input-bam''])}}

        '
      volumeMounts:
      - mountPath: /mnt/input/bam/
        name: input-bam
      - mountPath: /mnt/input/bed/
        name: input-bed
      - mountPath: /mnt/output/targeted_bam/
        name: output-bam
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bed''])}}'
        type: Directory
      name: input-bed
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: output-bam
