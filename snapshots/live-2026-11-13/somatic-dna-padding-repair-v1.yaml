apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: somatic-dna-padding-repair-v1
  namespace: argo
  annotations:
    gennext.bio/description: Refresh padding-affected SNV/IGV outputs for an existing sample from its recalibrated BAM. Does NOT rerun alignment, CNV, SV, MSI, coverage/QC, or HRD. mode=validate computes
      and validates without mutating live output; mode=apply promotes with atomic directory exchange and publishes TMB.
spec:
  arguments:
    parameters:
    - name: node-name
    - name: user-id
    - name: run-id
    - name: sample-uuid
    - name: mode
      value: validate
  entrypoint: padding-repair
  nodeSelector:
    kubernetes.io/hostname: '{{workflow.parameters.node-name}}'
  serviceAccountName: gennext-workflows
  synchronization:
    mutex:
      name: padding-repair-{{workflow.parameters.sample-uuid}}
  templates:
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: node-name
            value: '{{workflow.parameters.node-name}}'
          - name: user-id
            value: '{{workflow.parameters.user-id}}'
          - name: job-id
            value: '{{workflow.parameters.run-id}}'
        name: get-node-config
        templateRef:
          name: get-node-config
          template: get-node-config
      - arguments:
          parameters:
          - name: sample-uuid
            value: '{{workflow.parameters.sample-uuid}}'
          - name: run-id
            value: '{{workflow.parameters.run-id}}'
          - name: input-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.input-rel-dir}}'
          - name: output-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.output-rel-dir}}'
          - name: temp-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.temp-rel-dir}}'
          - name: scratch-rel-dir
            value: '{{tasks.get-node-config.outputs.parameters.scratch-rel-dir}}'
          - name: ref-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}'
        depends: get-node-config
        name: load-and-prepare-dna
        templateRef:
          name: load-and-prepare
          template: load-and-prepare-dna
      - arguments:
          parameters:
          - name: sample-id
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}'
          - name: sample-output-dir
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}'
          - name: dna-file-type
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.dna-file-type}}'
          - name: dna-input-files
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.dna-input-files}}'
          - name: ref-paths
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.ref-paths}}'
          - name: tumor-type
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.tumor-type}}'
          - name: ref-base-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}'
        depends: load-and-prepare-dna
        name: validate-sample
        template: validate-sample-for-repair
      - arguments:
          parameters:
          - name: sample-output-dir
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}'
        depends: validate-sample
        name: compute-repair-paths
        template: compute-repair-paths
      - arguments:
          parameters:
          - name: input-bed-file
            value: '{{=jsonpath(tasks[''load-and-prepare-dna''].outputs.parameters[''dna-input-files''], ''$.regionsFile'')}}'
          - name: gtf-file
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}/gene_annots/gencode.v49.basic.annotation.MANE_Select.gtf.gz'
          - name: reference-fai-file
            value: '{{=jsonpath(tasks[''load-and-prepare-dna''].outputs.parameters[''ref-paths''], ''$.genome'')}}.fai'
          - name: chains-dir
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}/other/chains/'
          - name: output-dir
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}metrics/bed_validation/'
          - name: padding
            value: '100'
          - name: generate-padded-artifacts
            value: 'true'
        depends: compute-repair-paths
        name: validate-bed-file
        templateRef:
          name: bed-validator-template
          template: validate-bed-file
      - arguments:
          parameters:
          - name: sample-id
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}'
          - name: sample-output-dir
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}'
          - name: tx-root
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}'
        depends: compute-repair-paths
        name: stage-duckdb
        template: stage-duckdb-copy
      - arguments:
          parameters:
          - name: staged-duckdb
            value: '{{tasks.stage-duckdb.outputs.parameters.staged-duckdb}}'
          - name: inventory-file
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}duckdb_inventory.json'
        depends: stage-duckdb
        name: snapshot-duckdb-inventory
        template: snapshot-duckdb-inventory
      - arguments:
          parameters:
          - name: input-bam
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}bam/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_recal.bam'
          - name: sample-id
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}'
          - name: genome-ref
            value: '{{=jsonpath(tasks[''load-and-prepare-dna''].outputs.parameters[''ref-paths''], ''$.genome'')}}'
          - name: regions-file
            value: '{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}'
          - name: sample-scratch-dir
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-scratch-dir}}'
          - name: output-vcf
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/vcf/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_mutect2_marked.vcf.gz'
        depends: validate-bed-file && snapshot-duckdb-inventory
        name: mutect2
        templateRef:
          name: mutect2-sharded-template
          template: mutect2-tumor-only-sharded
      - arguments:
          parameters:
          - name: do-filter
            value: ''
          - name: input-vcf-f
            value: '{{tasks.mutect2.outputs.parameters.output-vcf}}'
          - name: output-vcf-f
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/vcf/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_mutect2_filtered.vcf.gz'
          - name: regions-file
            value: '{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}'
        depends: mutect2
        name: bcftools-filter
        templateRef:
          name: bcftools-template
          template: bcftools-filter-and-bed
      - arguments:
          parameters:
          - name: input-bam
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}bam/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_recal.bam'
          - name: input-vcf
            value: '{{tasks.bcftools-filter.outputs.parameters.output-vcf-f}}'
          - name: vlod-output-vcf
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_mutect2_vlod.vcf'
          - name: thread-count
            value: '{{tasks.get-node-config.outputs.parameters.thread-count}}'
        depends: bcftools-filter
        name: vlod
        templateRef:
          name: vlod-template
          template: vlod
      - arguments:
          parameters:
          - name: sample-id
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}'
          - name: input-vcf-f
            value: '{{tasks.vlod.outputs.parameters.vlod-output-vcf}}'
          - name: ref-version
            value: hg38
          - name: output-dir
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/'
          - name: annovardb-dir
            value: '{{=jsonpath(tasks[''load-and-prepare-dna''].outputs.parameters[''ref-paths''], ''$.other.annovar'')}}'
        depends: vlod
        name: annovar
        templateRef:
          name: annovar-template
          template: annovar
      - arguments:
          parameters:
          - name: sample-id
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}'
          - name: input-vcf-f
            value: '{{tasks.vlod.outputs.parameters.vlod-output-vcf}}'
          - name: output-dir
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/'
          - name: annovardb-dir
            value: '{{=jsonpath(tasks[''load-and-prepare-dna''].outputs.parameters[''ref-paths''], ''$.other.annovar'')}}'
        depends: annovar
        name: cancervar
        templateRef:
          name: cancervar-template
          template: cancervar
      - arguments:
          parameters:
          - name: sample-id
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}'
          - name: annovar-out-f
            value: '{{tasks.annovar.outputs.parameters.annovar-out-f}}'
        depends: annovar
        name: annovar-to-maf
        templateRef:
          name: annovar-to-maf-template
          template: annovar-to-maf
      - arguments:
          parameters:
          - name: annovar-maf-f
            value: '{{tasks.annovar-to-maf.outputs.parameters.annovar-maf-f}}'
          - name: annovar-oncokb-maf-f
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}results/snv/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_oncokb.maf'
          - name: ref-version
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.ref-version}}'
          - name: tumor-type
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.tumor-type}}'
          - name: max-attempts
            value: '12'
          - name: retry-delay-seconds
            value: '30'
        depends: annovar-to-maf
        name: oncokb-snv
        templateRef:
          name: oncokb-templates
          template: oncokb-snv
      - arguments:
          parameters:
          - name: annovar-oncokb-maf
            value: '{{tasks.oncokb-snv.outputs.parameters.annovar-oncokb-maf-f}}'
        depends: oncokb-snv
        name: get-otherinfo-columns
        templateRef:
          name: duckdb-template
          template: determine-otherinfo-column
      - arguments:
          parameters:
          - name: annovar-oncokb-maf
            value: '{{tasks.oncokb-snv.outputs.parameters.annovar-oncokb-maf-f}}'
          - name: cancervar-tsv
            value: '{{tasks.cancervar.outputs.parameters.cancervar-out-f}}'
          - name: vlod-column-name
            value: '{{tasks.get-otherinfo-columns.outputs.parameters.vlod-column-name}}'
          - name: filter-column-name
            value: '{{tasks.get-otherinfo-columns.outputs.parameters.filter-column-name}}'
          - name: sample-column-name
            value: '{{tasks.get-otherinfo-columns.outputs.parameters.sample-column-name}}'
          - name: output-duckdb
            value: '{{tasks.stage-duckdb.outputs.parameters.staged-duckdb}}'
        depends: get-otherinfo-columns && cancervar && stage-duckdb
        name: duckdb-snv
        templateRef:
          name: duckdb-template
          template: duckdb-snv
      - arguments:
          parameters:
          - name: staged-duckdb
            value: '{{tasks.stage-duckdb.outputs.parameters.staged-duckdb}}'
          - name: inventory-file
            value: '{{tasks.snapshot-duckdb-inventory.outputs.parameters.inventory-file}}'
        depends: duckdb-snv
        name: verify-duckdb-preservation
        template: verify-duckdb-preservation
      - arguments:
          parameters:
          - name: sample-output-dir
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}'
          - name: tx-root
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}'
          - name: candidate-dir
            value: '{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}'
          - name: output-parent
            value: '{{tasks.compute-repair-paths.outputs.parameters.output-parent}}'
        depends: verify-duckdb-preservation && validate-bed-file
        name: assemble-candidate
        template: assemble-candidate
      - arguments:
          parameters:
          - name: run-id
            value: '{{workflow.parameters.run-id}}'
          - name: sample-id
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}'
          - name: duckdb-file
            value: '{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}results/db/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_results.duckdb'
          - name: target-bed-file
            value: '{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}'
          - name: output-dir
            value: '{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}metrics/tmb/'
          - name: cosmic-vcf
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/cosmic/Cosmic_CompleteTargetedScreensMutant_v103_GRCh38.vcf.gz'
          - name: filter-common-variants
            value: 'true'
          - name: gnomad-vcf
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/common_variants/gnomad4/gnomad4_1pct.vcf.gz'
          - name: turkish-variome-vcf
            value: '{{tasks.get-node-config.outputs.parameters.ref-base-dir}}hg38/other/common_variants/turkish_variome/turkish_variome_1pct.vcf.gz'
          - name: common-af-threshold
            value: '0.01'
        depends: assemble-candidate
        name: compute-tmb
        template: compute-tmb-data
      - arguments:
          parameters:
          - name: sample-id
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}'
          - name: candidate-dir
            value: '{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}'
          - name: output-parent
            value: '{{tasks.compute-repair-paths.outputs.parameters.output-parent}}'
          - name: analysis-bed
            value: '{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}'
          - name: igv-bed
            value: '{{tasks.validate-bed-file.outputs.parameters.validated-bed-igv-file}}'
          - name: staged-duckdb
            value: '{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}results/db/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_results.duckdb'
          - name: target-bed
            value: '{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}'
          - name: input-bam
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}bam/{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}_recal.bam'
        depends: compute-tmb
        name: write-manifest
        template: write-repair-manifest
      - arguments:
          parameters:
          - name: sample-id
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-id}}'
          - name: candidate-dir
            value: '{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}'
          - name: output-parent
            value: '{{tasks.compute-repair-paths.outputs.parameters.output-parent}}'
          - name: analysis-bed
            value: '{{tasks.validate-bed-file.outputs.parameters.validated-bed-analysis-file}}'
          - name: igv-bed
            value: '{{tasks.validate-bed-file.outputs.parameters.validated-bed-igv-file}}'
          - name: target-bed
            value: '{{tasks.validate-bed-file.outputs.parameters.validated-bed-file}}'
          - name: reference-fai-file
            value: '{{=jsonpath(tasks[''load-and-prepare-dna''].outputs.parameters[''ref-paths''], ''$.genome'')}}.fai'
        depends: write-manifest
        name: validate-candidate
        template: validate-candidate-artifacts
      - arguments:
          parameters:
          - name: sample-output-dir
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}'
          - name: candidate-dir
            value: '{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}'
          - name: output-parent
            value: '{{tasks.compute-repair-paths.outputs.parameters.output-parent}}'
        depends: validate-candidate
        name: promote
        template: promote-candidate
        when: '''{{workflow.parameters.mode}}'' == ''apply'''
      - arguments:
          parameters:
          - name: request-json
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}metrics/tmb/tmb_api_payload.json'
        depends: promote.Succeeded
        name: publish-tmb
        template: publish-tmb-result
        when: '''{{workflow.parameters.mode}}'' == ''apply'''
      - arguments:
          parameters:
          - name: sample-output-dir
            value: '{{tasks.load-and-prepare-dna.outputs.parameters.sample-output-dir}}'
          - name: candidate-dir
            value: '{{tasks.compute-repair-paths.outputs.parameters.candidate-dir}}'
          - name: output-parent
            value: '{{tasks.compute-repair-paths.outputs.parameters.output-parent}}'
          - name: tx-root
            value: '{{tasks.compute-repair-paths.outputs.parameters.tx-root}}'
          - name: validation-status
            value: '{{tasks.validate-candidate.status}}'
          - name: promote-status
            value: '{{tasks.promote.status}}'
          - name: publish-status
            value: '{{tasks.publish-tmb.status}}'
        depends: "compute-repair-paths.Succeeded && (validate-candidate.Succeeded || validate-candidate.Failed ||\n validate-candidate.Errored || validate-candidate.Skipped ||\n validate-candidate.Omitted)\
          \ &&\n(promote.Succeeded || promote.Failed || promote.Errored ||\n promote.Skipped || promote.Omitted) &&\n(publish-tmb.Succeeded || publish-tmb.Failed ||\n publish-tmb.Errored || publish-tmb.Skipped\
          \ ||\n publish-tmb.Omitted)"
        name: finalize
        template: finalize-repair
    name: padding-repair
  - inputs:
      parameters:
      - name: sample-id
      - name: sample-output-dir
      - name: dna-file-type
      - name: dna-input-files
      - name: ref-paths
      - name: tumor-type
      - name: ref-base-dir
    name: validate-sample-for-repair
    script:
      command:
      - python
      image: python:3.11-alpine3.18
      source: "# BEGIN VALIDATE_SAMPLE_PYTHON\nimport json, os, sys\n\nmode = \"{{workflow.parameters.mode}}\"\nsample_id = \"{{inputs.parameters.sample-id}}\"\ndna_type = \"{{inputs.parameters.dna-file-type}}\"\
        \ndna_files = json.loads('''{{inputs.parameters.dna-input-files}}''')\nref_paths = json.loads('''{{inputs.parameters.ref-paths}}''')\ntumor_type = \"{{inputs.parameters.tumor-type}}\"\nref_base\
        \ = \"{{inputs.parameters.ref-base-dir}}\"\n\nerrors = []\n\nif mode not in (\"validate\", \"apply\"):\n    errors.append(f\"Invalid mode '{mode}': must be 'validate' or 'apply'\")\n\nif dna_type\
        \ == \"vcf\":\n    errors.append(\"VCF-only samples cannot be repaired (no recalibrated BAM)\")\n\nif not tumor_type or tumor_type == \".\":\n    errors.append(\"Tumor type not resolved\")\n\nrecal_bam\
        \ = os.path.join(\"/mnt/output/\", \"bam\", f\"{sample_id}_recal.bam\")\nif not os.path.isfile(recal_bam):\n    errors.append(f\"Recalibrated BAM not found: bam/{sample_id}_recal.bam\")\nelif not\
        \ os.access(recal_bam, os.R_OK):\n    errors.append(\"Recalibrated BAM not readable\")\nelse:\n    if not (os.path.isfile(recal_bam + \".bai\") or\n            os.path.isfile(recal_bam.replace(\"\
        .bam\", \".bai\"))):\n        errors.append(\"BAM index not found\")\n\nduckdb_path = os.path.join(\"/mnt/output/\", \"results\", \"db\",\n                           f\"{sample_id}_results.duckdb\"\
        )\nif not os.path.isfile(duckdb_path):\n    errors.append(f\"Results DuckDB not found: results/db/{sample_id}_results.duckdb\")\nelif os.path.getsize(duckdb_path) == 0:\n    errors.append(\"Results\
        \ DuckDB is empty\")\n\nregions = dna_files.get(\"regionsFile\", \"\")\nif not regions or regions == \".\":\n    errors.append(\"No target BED (WGS or legacy sample)\")\n\ngenome = ref_paths.get(\"\
        genome\", \"\")\nif not genome:\n    errors.append(\"Reference genome path not resolved\")\nelse:\n    genome_mount = genome.replace(ref_base, \"/mnt/ref/\", 1)\n    if not os.path.isfile(genome_mount):\n\
        \        errors.append(f\"Genome FASTA not found at {genome}\")\n    fai = genome_mount + \".fai\"\n    if not os.path.isfile(fai):\n        errors.append(f\"Genome FASTA index not found at {genome}.fai\"\
        )\n\nannovar = ref_paths.get(\"other\", {}).get(\"annovar\", \"\")\nif not annovar:\n    errors.append(\"Annovar DB path not resolved\")\nelse:\n    annovar_mount = annovar.replace(ref_base, \"\
        /mnt/ref/\", 1)\n    if not os.path.isdir(annovar_mount):\n        errors.append(f\"Annovar DB directory not found at {annovar}\")\n\nfor vcf_name in [\n    \"hg38/other/cosmic/Cosmic_CompleteTargetedScreensMutant_v103_GRCh38.vcf.gz\"\
        ,\n    \"hg38/other/common_variants/gnomad4/gnomad4_1pct.vcf.gz\",\n    \"hg38/other/common_variants/turkish_variome/turkish_variome_1pct.vcf.gz\",\n]:\n    vcf_path = os.path.join(\"/mnt/ref/\"\
        , vcf_name)\n    if not os.path.isfile(vcf_path):\n        errors.append(f\"Reference VCF not found: {vcf_name}\")\n\nif errors:\n    print(\"Sample validation failed:\", file=sys.stderr)\n    for\
        \ e in errors:\n        print(f\"  - {e}\", file=sys.stderr)\n    sys.exit(1)\n\nprint(f\"Sample {sample_id} validated for padding repair (mode={mode})\")\n# END VALIDATE_SAMPLE_PYTHON\n"
      volumeMounts:
      - mountPath: /mnt/output/
        name: sample-output
        readOnly: true
      - mountPath: /mnt/ref/
        name: ref-base
        readOnly: true
    volumes:
    - hostPath:
        path: '{{inputs.parameters.sample-output-dir}}'
        type: Directory
      name: sample-output
    - hostPath:
        path: '{{inputs.parameters.ref-base-dir}}'
        type: Directory
      name: ref-base
  - inputs:
      parameters:
      - name: sample-output-dir
    name: compute-repair-paths
    outputs:
      parameters:
      - name: tx-root
        valueFrom:
          path: /tmp/tx_root
      - name: candidate-dir
        valueFrom:
          path: /tmp/candidate_dir
      - name: output-parent
        valueFrom:
          path: /tmp/output_parent
    script:
      command:
      - sh
      image: alpine:3.18
      source: 'set -e

        SAMPLE_DIR="{{=sprig.trimSuffix(''/'', inputs.parameters[''sample-output-dir''])}}"

        PARENT="$(dirname "$SAMPLE_DIR")"

        BASE="$(basename "$SAMPLE_DIR")"

        printf ''%s'' "${PARENT}/${BASE}.repair-wk-{{workflow.uid}}/" > /tmp/tx_root

        printf ''%s'' "${PARENT}/${BASE}.repair-cd-{{workflow.uid}}/" > /tmp/candidate_dir

        printf ''%s'' "${PARENT}/" > /tmp/output_parent

        '
  - inputs:
      parameters:
      - name: sample-id
      - name: sample-output-dir
      - name: tx-root
    name: stage-duckdb-copy
    outputs:
      parameters:
      - name: staged-duckdb
        value: '{{inputs.parameters.tx-root}}results/db/{{inputs.parameters.sample-id}}_results.duckdb'
    script:
      command:
      - sh
      image: alpine:3.18
      source: 'set -e

        DBFILE="{{inputs.parameters.sample-id}}_results.duckdb"

        cp "/mnt/source/${DBFILE}" "/mnt/dest/${DBFILE}"

        echo "Staged DuckDB copy: ${DBFILE}"

        '
      volumeMounts:
      - mountPath: /mnt/source/
        name: source-db-dir
        readOnly: true
