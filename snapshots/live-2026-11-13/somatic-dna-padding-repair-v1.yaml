      image: python:3.11-alpine3.18
      source: "# BEGIN PROMOTE_CANDIDATE_PYTHON\nimport ctypes\nimport json\nimport os\nimport platform\nimport sys\n\nlive_base = os.environ[\"LIVE_BASE\"]\ncd_base = os.environ[\"CANDIDATE_BASE\"]\nparent_host\
        \ = os.environ[\"OUTPUT_PARENT_HOST\"]\nworkflow_uid = os.environ[\"WORKFLOW_UID\"]\n\nmount_parent = os.environ.get(\"MOUNT_PARENT\", \"/mnt/parent\")\nlive = os.path.join(mount_parent, live_base)\n\
        candidate = os.path.join(mount_parent, cd_base)\nbackup_name = f\"{live_base}.pre-padding-repair-{workflow_uid}\"\nbackup = os.path.join(mount_parent, backup_name)\nbackup_host = os.path.join(parent_host,\
        \ backup_name)\nbackup_output_path = os.environ.get(\"BACKUP_OUTPUT_PATH\", \"/tmp/backup_dir\")\n\ndef manifest_uid(directory):\n    path = os.path.join(directory, \"padding_repair_manifest.json\"\
        )\n    try:\n        with open(path) as handle:\n            return json.load(handle).get(\"workflow_uid\")\n    except (FileNotFoundError, json.JSONDecodeError, OSError):\n        return None\n\
        \ndef update_live_manifest():\n    path = os.path.join(live, \"padding_repair_manifest.json\")\n    with open(path) as handle:\n        manifest = json.load(handle)\n    manifest[\"promotion\"][\"\
        state\"] = \"completed\"\n    manifest[\"promotion\"][\"backup_dir\"] = backup_host\n    temporary = path + \".tmp\"\n    with open(temporary, \"w\") as handle:\n        json.dump(manifest, handle,\
        \ indent=2)\n        handle.flush()\n        os.fsync(handle.fileno())\n    os.replace(temporary, path)\n\n# Idempotent recovery if an earlier attempt exchanged directories\n# but failed before\
        \ recording the backup/output parameter.\nif os.path.isdir(live) and manifest_uid(live) == workflow_uid:\n    if os.path.isdir(candidate):\n        if os.path.exists(backup):\n            raise\
        \ RuntimeError(\n                \"Both swapped candidate and UID backup exist; refusing data loss\"\n            )\n        os.rename(candidate, backup)\n    if not os.path.isdir(backup):\n   \
        \     raise RuntimeError(\"Promoted live exists but UID backup is missing\")\n    update_live_manifest()\n    with open(backup_output_path, \"w\") as handle:\n        handle.write(backup_host)\n\
        \    print(f\"Recovered completed promotion. Backup: {backup_host}\")\n    raise SystemExit(0)\n\nif not os.path.isdir(live):\n    print(f\"Live directory not found: {live}\", file=sys.stderr)\n\
        \    sys.exit(1)\nif not os.path.isdir(candidate):\n    print(f\"Candidate directory not found: {candidate}\", file=sys.stderr)\n    sys.exit(1)\nif manifest_uid(candidate) != workflow_uid:\n  \
        \  print(\"Candidate manifest does not match this workflow UID\", file=sys.stderr)\n    sys.exit(1)\nif os.path.exists(backup):\n    print(f\"UID backup already exists: {backup}\", file=sys.stderr)\n\
        \    sys.exit(1)\n\nsyscall_numbers = {\"x86_64\": 316, \"aarch64\": 276}\nmachine = platform.machine().lower()\nif machine not in syscall_numbers:\n    print(f\"Unsupported architecture for renameat2:\
        \ {machine}\", file=sys.stderr)\n    sys.exit(1)\nSYS_RENAMEAT2 = syscall_numbers[machine]\nRENAME_EXCHANGE = 2\nAT_FDCWD = -100\n\nlibc = ctypes.CDLL(None, use_errno=True)\nlibc.syscall.restype\
        \ = ctypes.c_long\n\nos.sync()\nctypes.set_errno(0)\nret = libc.syscall(\n    ctypes.c_long(SYS_RENAMEAT2),\n    ctypes.c_int(AT_FDCWD),\n    ctypes.c_char_p(os.fsencode(live)),\n    ctypes.c_int(AT_FDCWD),\n\
        \    ctypes.c_char_p(os.fsencode(candidate)),\n    ctypes.c_uint(RENAME_EXCHANGE),\n)\nif ret != 0:\n    errno = ctypes.get_errno()\n    print(\n        f\"renameat2 RENAME_EXCHANGE failed: {os.strerror(errno)}\
        \ \"\n        f\"(errno={errno})\",\n        file=sys.stderr,\n    )\n    sys.exit(1)\n\nprint(\"Atomic exchange complete: live <-> candidate\")\nos.rename(candidate, backup)\nprint(f\"Old live\
        \ renamed to backup: {backup_name}\")\n\nwith open(backup_output_path, \"w\") as f:\n    f.write(backup_host)\n\nupdate_live_manifest()\nprint(f\"Promotion complete. Backup: {backup_host}\")\n#\
        \ END PROMOTE_CANDIDATE_PYTHON\n"
