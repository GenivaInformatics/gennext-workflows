      image: bergun/gennext-tmb-calc:0.5.0
      source: "set -e\n# BEGIN VERIFY_DUCKDB_PYTHON\npython3 - <<'PYEOF'\nimport base64\nimport datetime\nimport decimal\nimport hashlib\nimport json\nimport os\nimport sys\n\nimport duckdb\n\nSNV_TABLES\
        \ = {\"oncokb_snv\", \"cancervar_snv\"}\nSNV_VIEWS = {\"combined_snv\", \"advanced_combined_snv\"}\n\ndef quote(name):\n    return '\"' + name.replace('\"', '\"\"') + '\"'\n\ndef normalize(value):\n\
        \    if value is None or isinstance(value, (bool, int, float, str)):\n        return value\n    if isinstance(value, bytes):\n        return {\"bytes\": base64.b64encode(value).decode(\"ascii\"\
        )}\n    if isinstance(value, decimal.Decimal):\n        return {\"decimal\": str(value)}\n    if isinstance(value, (datetime.date, datetime.time, datetime.datetime)):\n        return {\"datetime\"\
        : value.isoformat()}\n    if isinstance(value, (list, tuple)):\n        return [normalize(item) for item in value]\n    if isinstance(value, dict):\n        return {str(key): normalize(value[key])\
        \ for key in sorted(value, key=str)}\n    return {\"repr\": repr(value)}\n\ndef row_fingerprint(db, name):\n    cursor = db.execute(f\"SELECT * FROM {quote(name)}\")\n    count = 0\n    xor_digest\
        \ = 0\n    sum_digest = 0\n    modulus = 1 << 256\n    while True:\n        batch = cursor.fetchmany(1000)\n        if not batch:\n            break\n        for row in batch:\n            payload\
        \ = json.dumps(\n                normalize(row), sort_keys=True, separators=(\",\", \":\")\n            ).encode(\"utf-8\")\n            digest = int.from_bytes(hashlib.sha256(payload).digest(),\
        \ \"big\")\n            xor_digest ^= digest\n            sum_digest = (sum_digest + digest) % modulus\n            count += 1\n    return {\n        \"rows\": count,\n        \"content_xor\": f\"\
        {xor_digest:064x}\",\n        \"content_sum\": f\"{sum_digest:064x}\",\n    }\n\ndb = duckdb.connect(os.environ[\"DB_PATH\"], read_only=True)\nwith open(os.environ[\"INVENTORY_PATH\"]) as handle:\n\
        \    pre = json.load(handle)\nerrors = []\n\ntable_sql = dict(db.execute(\n    \"SELECT table_name, sql FROM duckdb_tables() \"\n    \"WHERE schema_name = 'main' AND NOT internal AND NOT temporary\"\
        \n).fetchall())\nview_sql = dict(db.execute(\n    \"SELECT view_name, sql FROM duckdb_views() \"\n    \"WHERE schema_name = 'main' AND NOT internal AND NOT temporary\"\n).fetchall())\n\nfor name,\
        \ info in pre[\"tables\"].items():\n    if name not in table_sql:\n        errors.append(f\"Non-SNV table '{name}' was removed\")\n        continue\n    current = row_fingerprint(db, name)\n   \
        \ current[\"sql\"] = table_sql[name] or \"\"\n    current[\"columns\"] = [\n        list(row) for row in db.execute(\n            f\"PRAGMA table_info({quote(name)})\"\n        ).fetchall()\n  \
        \  ]\n    if current != info:\n        errors.append(f\"Non-SNV table '{name}' content or schema changed\")\n\nfor name, info in pre[\"views\"].items():\n    if name not in view_sql:\n        errors.append(f\"\
        Non-SNV view '{name}' was removed\")\n        continue\n    current = row_fingerprint(db, name)\n    current[\"sql\"] = view_sql[name] or \"\"\n    if current != info:\n        errors.append(f\"\
        Non-SNV view '{name}' content or definition changed\")\n\nfor table in sorted(SNV_TABLES):\n    if table not in table_sql:\n        errors.append(f\"Required refreshed SNV table '{table}' is missing\"\
        )\nfor view in sorted(SNV_VIEWS):\n    if view not in view_sql:\n        errors.append(f\"Required refreshed SNV view '{view}' is missing\")\n\nfor name in sorted(SNV_TABLES | SNV_VIEWS):\n    try:\n\
        \        db.execute(f\"SELECT 1 FROM {quote(name)} LIMIT 1\")\n    except Exception as e:\n        errors.append(f\"Refreshed SNV object '{name}' is not queryable: {e}\")\n\ndb.close()\nif errors:\n\
        \    print(\"DuckDB preservation FAILED:\", file=sys.stderr)\n    for e in errors:\n        print(f\"  - {e}\", file=sys.stderr)\n    sys.exit(1)\nprint(\"DuckDB non-SNV preservation verified\"\
        )\nPYEOF\n# END VERIFY_DUCKDB_PYTHON\n"
