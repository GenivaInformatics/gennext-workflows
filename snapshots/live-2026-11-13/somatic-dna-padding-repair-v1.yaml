        value: /mnt/inventory/{{=sprig.osBase(inputs.parameters['inventory-file'])}}
      image: bergun/gennext-tmb-calc:0.5.0
      source: "set -e\n# BEGIN SNAPSHOT_DUCKDB_PYTHON\npython3 - <<'PYEOF'\nimport base64\nimport datetime\nimport decimal\nimport hashlib\nimport json\nimport os\n\nimport duckdb\n\nSNV_OBJECTS = {\n \
        \   \"oncokb_snv\", \"cancervar_snv\", \"combined_snv\", \"advanced_combined_snv\"\n}\n\ndef quote(name):\n    return '\"' + name.replace('\"', '\"\"') + '\"'\n\ndef normalize(value):\n    if value\
        \ is None or isinstance(value, (bool, int, float, str)):\n        return value\n    if isinstance(value, bytes):\n        return {\"bytes\": base64.b64encode(value).decode(\"ascii\")}\n    if isinstance(value,\
        \ decimal.Decimal):\n        return {\"decimal\": str(value)}\n    if isinstance(value, (datetime.date, datetime.time, datetime.datetime)):\n        return {\"datetime\": value.isoformat()}\n  \
        \  if isinstance(value, (list, tuple)):\n        return [normalize(item) for item in value]\n    if isinstance(value, dict):\n        return {str(key): normalize(value[key]) for key in sorted(value,\
        \ key=str)}\n    return {\"repr\": repr(value)}\n\ndef row_fingerprint(db, name):\n    cursor = db.execute(f\"SELECT * FROM {quote(name)}\")\n    count = 0\n    xor_digest = 0\n    sum_digest =\
        \ 0\n    modulus = 1 << 256\n    while True:\n        batch = cursor.fetchmany(1000)\n        if not batch:\n            break\n        for row in batch:\n            payload = json.dumps(\n   \
        \             normalize(row), sort_keys=True, separators=(\",\", \":\")\n            ).encode(\"utf-8\")\n            digest = int.from_bytes(hashlib.sha256(payload).digest(), \"big\")\n       \
        \     xor_digest ^= digest\n            sum_digest = (sum_digest + digest) % modulus\n            count += 1\n    return {\n        \"rows\": count,\n        \"content_xor\": f\"{xor_digest:064x}\"\
        ,\n        \"content_sum\": f\"{sum_digest:064x}\",\n    }\n\ndb = duckdb.connect(os.environ[\"DB_PATH\"], read_only=True)\ninventory = {\"tables\": {}, \"views\": {}}\n\ntable_sql = dict(db.execute(\n\
        \    \"SELECT table_name, sql FROM duckdb_tables() \"\n    \"WHERE schema_name = 'main' AND NOT internal AND NOT temporary\"\n).fetchall())\nview_sql = dict(db.execute(\n    \"SELECT view_name,\
        \ sql FROM duckdb_views() \"\n    \"WHERE schema_name = 'main' AND NOT internal AND NOT temporary\"\n).fetchall())\n\nfor name, sql in table_sql.items():\n    if name in SNV_OBJECTS:\n        continue\n\
        \    fingerprint = row_fingerprint(db, name)\n    fingerprint[\"sql\"] = sql or \"\"\n    fingerprint[\"columns\"] = [\n        list(row) for row in db.execute(\n            f\"PRAGMA table_info({quote(name)})\"\
        \n        ).fetchall()\n    ]\n    inventory[\"tables\"][name] = fingerprint\n\nfor name, sql in view_sql.items():\n    if name in SNV_OBJECTS:\n        continue\n    fingerprint = row_fingerprint(db,\
        \ name)\n    fingerprint[\"sql\"] = sql or \"\"\n    inventory[\"views\"][name] = fingerprint\n\ndb.close()\nwith open(os.environ[\"INVENTORY_PATH\"], \"w\") as f:\n    json.dump(inventory, f, sort_keys=True,\
        \ separators=(\",\", \":\"))\nprint(f\"Snapshot: {len(inventory['tables'])} tables, {len(inventory['views'])} views\")\nPYEOF\n# END SNAPSHOT_DUCKDB_PYTHON\n"
