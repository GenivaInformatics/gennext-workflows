      image: python:3.11-alpine3.18
      source: "# BEGIN VALIDATE_CANDIDATE_PYTHON\nimport hashlib\nimport json\nimport os\nimport sys\n\nmount_parent = os.environ.get(\"MOUNT_PARENT\", \"/mnt/parent\")\nreference_fai = os.environ.get(\"\
        REFERENCE_FAI\", \"/mnt/reference.fai\")\ncandidate = os.path.join(mount_parent, os.environ[\"CANDIDATE_BASE\"])\nsample_id = os.environ[\"SAMPLE_ID\"]\nerrors = []\n\nanalysis_name = os.environ[\"\
        ANALYSIS_BED_NAME\"]\nanalysis = os.path.join(candidate, \"metrics\", \"bed_validation\", analysis_name)\nigv_name = os.environ[\"IGV_BED_NAME\"]\nigv = os.path.join(candidate, \"metrics\", \"bed_validation\"\
        , igv_name)\ntarget = os.path.join(\n    candidate, \"metrics\", \"bed_validation\", os.environ[\"TARGET_BED_NAME\"]\n)\ndb = os.path.join(candidate, \"results\", \"db\", f\"{sample_id}_results.duckdb\"\
        )\nmanifest = os.path.join(candidate, \"padding_repair_manifest.json\")\ntmb_dir = os.path.join(candidate, \"metrics\", \"tmb\")\n\ndef sha256_file(path):\n    digest = hashlib.sha256()\n    try:\n\
        \        with open(path, \"rb\") as handle:\n            for chunk in iter(lambda: handle.read(8192), b\"\"):\n                digest.update(chunk)\n    except FileNotFoundError:\n        return\
        \ \"MISSING\"\n    return digest.hexdigest()\n\ndef sha256_tree(path):\n    if not os.path.isdir(path):\n        return \"MISSING\"\n    digest = hashlib.sha256()\n    files = []\n    for root,\
        \ _, names in os.walk(path):\n        for name in names:\n            files.append(os.path.join(root, name))\n    if not files:\n        return \"EMPTY\"\n    for file_path in sorted(files):\n \
        \       relative = os.path.relpath(file_path, path)\n        digest.update(relative.encode(\"utf-8\"))\n        digest.update(b\"\\0\")\n        digest.update(sha256_file(file_path).encode(\"ascii\"\
        ))\n        digest.update(b\"\\0\")\n    return digest.hexdigest()\n\ncontig_order = {}\ncontig_sizes = {}\nwith open(reference_fai) as handle:\n    for line_number, line in enumerate(handle, 1):\n\
        \        fields = line.rstrip(\"\\n\").split(\"\\t\")\n        if len(fields) < 2:\n            errors.append(f\"Malformed FASTA index at line {line_number}\")\n            continue\n        chrom\
        \ = fields[0]\n        try:\n            length = int(fields[1])\n        except ValueError:\n            errors.append(f\"Non-integer FASTA length at line {line_number}\")\n            continue\n\
        \        if chrom in contig_sizes or length < 1:\n            errors.append(f\"Invalid or duplicate FASTA contig at line {line_number}\")\n            continue\n        contig_order[chrom] = len(contig_order)\n\
        \        contig_sizes[chrom] = length\n\nif not contig_order:\n    errors.append(\"Reference FASTA index has no valid contigs\")\n\n# \u2500\u2500 Analysis BED: strict BED3, reference-ordered, no\
        \ overlaps \u2500\u2500\nif not os.path.isfile(analysis):\n    errors.append(\"Analysis BED not found in candidate\")\nelse:\n    prev_rank, prev_chrom, prev_end = -1, \"\", -1\n    line_count =\
        \ 0\n    with open(analysis) as f:\n        for i, line in enumerate(f, 1):\n            line = line.rstrip(\"\\n\")\n            if line.startswith(\"#\") or line.startswith(\"track\"):\n     \
        \           errors.append(f\"Analysis BED has header at line {i}\")\n                break\n            cols = line.split(\"\\t\")\n            if len(cols) != 3:\n                errors.append(f\"\
        Analysis BED is not strict BED3 (line {i}: {len(cols)} cols)\")\n                break\n            chrom = cols[0]\n            try:\n                start, end = int(cols[1]), int(cols[2])\n \
        \           except ValueError:\n                errors.append(f\"Analysis BED has non-integer coordinates at line {i}\")\n                break\n            if chrom not in contig_order:\n     \
        \           errors.append(f\"Analysis BED contig {chrom!r} is absent from FASTA index\")\n                break\n            if start < 0 or start >= end or end > contig_sizes[chrom]:\n        \
        \        errors.append(f\"Analysis BED invalid interval at line {i}\")\n                break\n            rank = contig_order[chrom]\n            if rank < prev_rank:\n                errors.append(f\"\
        Analysis BED is not in FASTA contig order at line {i}\")\n                break\n            if chrom == prev_chrom and start <= prev_end:\n                errors.append(\n                    f\"\
        Analysis BED overlapping/book-ended at {chrom}:{start} \"\n                    f\"(prev end {prev_end})\"\n                )\n                break\n            prev_rank, prev_chrom, prev_end =\
        \ rank, chrom, end\n            line_count += 1\n    if line_count == 0 and not errors:\n        errors.append(\"Analysis BED is empty\")\n\n# \u2500\u2500 IGV BED: BED9, correct RGB, non-overlapping\
        \ features \u2500\u2500\nif not os.path.isfile(igv):\n    errors.append(\"IGV BED not found in candidate\")\nelse:\n    expected_rgb = {\"targeted\": \"128,128,128\", \"padding\": \"211,211,211\"\
        }\n    feature_counts = {\"targeted\": 0, \"padding\": 0}\n    prev_rank, prev_chrom, prev_start, prev_end = -1, \"\", -1, -1\n    with open(igv) as f:\n        header = f.readline().rstrip(\"\\\
        n\")\n        if 'itemRgb=\"On\"' not in header:\n            errors.append(\"IGV BED missing itemRgb header\")\n        for i, line in enumerate(f, 2):\n            fields = line.rstrip(\"\\n\"\
        ).split(\"\\t\")\n            if len(fields) != 9:\n                errors.append(f\"IGV line {i} has {len(fields)} columns, expected 9\")\n                break\n            chrom, start_s, end_s,\
        \ feat = fields[:4]\n            try:\n                start, end = int(start_s), int(end_s)\n            except ValueError:\n                errors.append(f\"IGV line {i} has non-integer coordinates\"\
        )\n                break\n            if feat not in expected_rgb:\n                errors.append(f\"IGV unknown feature type: {feat!r}\")\n                continue\n            if fields[8] !=\
        \ expected_rgb[feat]:\n                errors.append(f\"IGV {feat} RGB is {fields[8]}, expected {expected_rgb[feat]}\")\n            if chrom not in contig_order:\n                errors.append(f\"\
        IGV contig {chrom!r} is absent from FASTA index\")\n                continue\n            if start < 0 or start >= end or end > contig_sizes[chrom]:\n                errors.append(f\"IGV invalid\
        \ interval at line {i}\")\n            rank = contig_order[chrom]\n            if rank < prev_rank or (\n                rank == prev_rank and start < prev_start\n            ):\n              \
        \  errors.append(f\"IGV BED is not in FASTA coordinate order at line {i}\")\n            if chrom == prev_chrom and start < prev_end:\n                errors.append(\n                    f\"IGV\
        \ features overlap at {chrom}:{start}-{end} \"\n                    f\"(previous end {prev_end})\"\n                )\n            prev_rank, prev_chrom = rank, chrom\n            prev_start, prev_end\
        \ = start, end\n            feature_counts[feat] += 1\n\n    for feat, count in feature_counts.items():\n        if count == 0:\n            errors.append(f\"IGV BED has no {feat} features\")\n\n\
        # \u2500\u2500 Required affected outputs \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\nrequired_files = [\n    target,\n    db,\n    os.path.join(candidate, \"results\", \"snv\", \"vcf\", f\"{sample_id}_mutect2_marked.vcf.gz\"),\n    os.path.join(candidate,\
        \ \"results\", \"snv\", \"vcf\", f\"{sample_id}_mutect2_filtered.vcf.gz\"),\n    os.path.join(candidate, \"results\", \"snv\", f\"{sample_id}_mutect2_vlod.vcf.gz\"),\n    os.path.join(candidate,\
        \ \"results\", \"snv\", f\"{sample_id}.hg38_multianno.txt\"),\n    os.path.join(candidate, \"results\", \"snv\", f\"{sample_id}.hg38_multianno.txt.cancervar\"),\n    os.path.join(candidate, \"results\"\
        , \"snv\", f\"{sample_id}.maf\"),\n    os.path.join(candidate, \"results\", \"snv\", f\"{sample_id}_oncokb.maf\"),\n    os.path.join(tmb_dir, f\"tmb_report_{sample_id}.json\"),\n    os.path.join(tmb_dir,\
        \ f\"tmb_report_{sample_id}.txt\"),\n    os.path.join(tmb_dir, \"tmb_api_payload.json\"),\n]\nfor path in required_files:\n    if not os.path.isfile(path) or os.path.getsize(path) == 0:\n      \
        \  errors.append(f\"Required candidate artifact is missing or empty: {path}\")\n\n# \u2500\u2500 TMB report and staged API payload must agree \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\nreport_path = os.path.join(tmb_dir, f\"tmb_report_{sample_id}.json\")\npayload_path = os.path.join(tmb_dir, \"tmb_api_payload.json\")\nif os.path.isfile(report_path) and os.path.isfile(payload_path):\n\
        \    try:\n        with open(report_path) as handle:\n            report = json.load(handle)[\"results\"]\n        with open(payload_path) as handle:\n            payload = json.load(handle)\n \
        \       somatic = payload[\"somaticData\"]\n        expected = {\n            \"tmbValue\": f\"{report['tmb_per_mb']:.2f}\",\n            \"tmbVariantCount\": int(report[\"tmb_variants\"]),\n  \
        \          \"tmbTargetRegionSize\": int(report[\"total_target_bases\"]),\n            \"cdsTmbValue\": f\"{report['cds_tmb_per_mb']:.2f}\",\n            \"cdsTmbVariantCount\": int(report[\"cds_tmb_variants\"\
        ]),\n            \"cdsTmbTargetRegionSize\": int(report[\"targeted_cds_bases\"]),\n        }\n        for key, value in expected.items():\n            if somatic.get(key) != value:\n           \
        \     errors.append(f\"Staged TMB payload disagrees with report for {key}\")\n        if payload.get(\"runId\") == \"\" or payload.get(\"sampleId\") != sample_id:\n            errors.append(\"Staged\
        \ TMB payload identity is invalid\")\n        if payload.get(\"token\") != \"STAGED\":\n            errors.append(\"Staged TMB payload must contain only the STAGED token\")\n    except (KeyError,\
        \ TypeError, ValueError, json.JSONDecodeError) as error:\n        errors.append(f\"Invalid TMB report or staged payload: {error}\")\n\n# \u2500\u2500 Manifest identity and checksums \u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nif not os.path.isfile(manifest):\n    errors.append(\"\
        Repair manifest not found in candidate\")\nelse:\n    try:\n        with open(manifest) as handle:\n            manifest_data = json.load(handle)\n        if manifest_data.get(\"workflow_uid\")\
        \ != os.environ[\"WORKFLOW_UID\"]:\n            errors.append(\"Repair manifest workflow UID does not match\")\n        if manifest_data.get(\"source_revision\") != os.environ[\"SOURCE_REVISION\"\
        ]:\n            errors.append(\"Repair manifest source revision does not match\")\n        if not manifest_data.get(\"source_revision\") or manifest_data.get(\"source_revision\") == \"DIRECT_FIX_COMMIT\"\
        :\n            errors.append(\"Repair manifest source revision is not release-pinned\")\n        expected_checksums = {\n            \"input_bam\": sha256_file(os.path.join(candidate, \"bam\", f\"\
        {sample_id}_recal.bam\")),\n            \"input_bai\": sha256_file(next(\n                (\n                    path for path in [\n                        os.path.join(candidate, \"bam\", f\"\
        {sample_id}_recal.bam.bai\"),\n                        os.path.join(candidate, \"bam\", f\"{sample_id}_recal.bai\"),\n                    ]\n                    if os.path.isfile(path)\n       \
        \         ),\n                os.path.join(candidate, \"bam\", f\"{sample_id}_recal.bam.bai\"),\n            )),\n            \"target_bed\": sha256_file(target),\n            \"analysis_bed\":\
        \ sha256_file(analysis),\n            \"igv_bed\": sha256_file(igv),\n            \"snv_tree\": sha256_tree(os.path.join(candidate, \"results\", \"snv\")),\n            \"duckdb\": sha256_file(db),\n\
        \            \"tmb_tree\": sha256_tree(tmb_dir),\n        }\n        if manifest_data.get(\"checksums\") != expected_checksums:\n            errors.append(\"Repair manifest checksums do not match\
        \ candidate artifacts\")\n    except (OSError, ValueError, json.JSONDecodeError) as error:\n        errors.append(f\"Invalid repair manifest: {error}\")\n\nif errors:\n    print(\"Candidate validation\
        \ FAILED:\", file=sys.stderr)\n    for e in errors:\n        print(f\"  - {e}\", file=sys.stderr)\n    sys.exit(1)\nprint(\"Candidate validation passed\")\n# END VALIDATE_CANDIDATE_PYTHON\n"
