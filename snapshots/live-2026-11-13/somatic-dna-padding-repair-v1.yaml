      image: python:3.11-alpine3.18
      source: "# BEGIN FINALIZE_REPAIR_PYTHON\nimport json\nimport os\nimport shutil\nimport sys\n\nuid = os.environ[\"WORKFLOW_UID\"]\nmode = os.environ[\"REPAIR_MODE\"]\nvalidation_status = os.environ[\"\
        VALIDATION_STATUS\"]\npromote_status = os.environ[\"PROMOTE_STATUS\"]\npublish_status = os.environ[\"PUBLISH_STATUS\"]\nlive_base = os.environ[\"LIVE_BASE\"]\ncandidate_base = os.environ[\"CANDIDATE_BASE\"\
        ]\ntx_base = os.environ[\"TX_BASE\"]\nparent_host = os.environ[\"OUTPUT_PARENT_HOST\"]\n\nparent = os.environ.get(\"MOUNT_PARENT\", \"/mnt/parent\")\nlive = os.path.join(parent, live_base)\ncandidate\
        \ = os.path.join(parent, candidate_base)\ntx_root = os.path.join(parent, tx_base)\nbackup_name = f\"{live_base}.pre-padding-repair-{uid}\"\nbackup = os.path.join(parent, backup_name)\nbackup_host\
        \ = os.path.join(parent_host, backup_name)\nrecovery_errors = []\nterminal_errors = []\n\ndef load_manifest(directory):\n    path = os.path.join(directory, \"padding_repair_manifest.json\")\n  \
        \  try:\n        with open(path) as handle:\n            manifest = json.load(handle)\n    except (FileNotFoundError, json.JSONDecodeError, OSError):\n        return None, path\n    if manifest.get(\"\
        workflow_uid\") != uid:\n        return None, path\n    return manifest, path\n\nlive_manifest, live_manifest_path = load_manifest(live)\ncandidate_manifest, candidate_manifest_path = load_manifest(candidate)\n\
        \n# Recover the only safe post-exchange partial state: new manifest\n# is live and the old live tree is still at the candidate path.\nif live_manifest is not None and os.path.isdir(candidate):\n\
        \    if os.path.exists(backup):\n        recovery_errors.append(\n            \"Both swapped candidate and UID backup exist; manual recovery required\"\n        )\n    else:\n        try:\n    \
        \        os.rename(candidate, backup)\n            candidate_manifest = None\n        except OSError as error:\n            recovery_errors.append(f\"Could not finish backup rename: {error}\")\n\
        \nmanifest = live_manifest or candidate_manifest\nmanifest_path = live_manifest_path if live_manifest else candidate_manifest_path\n\nif manifest is None:\n    print(\n        \"No current-workflow\
        \ repair manifest exists; retaining transaction data\",\n        file=sys.stderr,\n    )\n    raise SystemExit(1)\n\nif validation_status == \"Succeeded\":\n    manifest[\"validation\"][\"state\"\
        ] = \"validated\"\nelif validation_status in (\"Failed\", \"Errored\"):\n    manifest[\"validation\"][\"state\"] = \"failed\"\nelse:\n    manifest[\"validation\"][\"state\"] = \"incomplete\"\n\n\
        promoted = live_manifest is not None and os.path.isdir(backup)\nif mode != \"apply\":\n    manifest[\"promotion\"][\"state\"] = \"not-applicable\"\nelif promoted and not recovery_errors:\n    manifest[\"\
        promotion\"][\"state\"] = \"completed\"\n    manifest[\"promotion\"][\"backup_dir\"] = backup_host\nelif recovery_errors:\n    manifest[\"promotion\"][\"state\"] = \"recovery-required\"\nelif promote_status\
        \ in (\"Failed\", \"Errored\"):\n    manifest[\"promotion\"][\"state\"] = \"failed\"\nelse:\n    manifest[\"promotion\"][\"state\"] = \"incomplete\"\n\nif mode != \"apply\":\n    manifest[\"projection\"\
        ][\"state\"] = \"not-applicable\"\nelif not promoted:\n    manifest[\"projection\"][\"state\"] = \"not-published\"\nelif publish_status == \"Succeeded\":\n    manifest[\"projection\"][\"state\"\
        ] = \"published\"\nelse:\n    manifest[\"projection\"][\"state\"] = \"failed\"\n\nmanifest[\"terminal_tasks\"] = {\n    \"validation\": validation_status,\n    \"promotion\": promote_status,\n \
        \   \"tmb_publication\": publish_status,\n}\nif validation_status != \"Succeeded\":\n    terminal_errors.append(\n        f\"Candidate validation did not succeed: {validation_status or 'Missing'}\"\
        \n    )\nif mode == \"apply\":\n    if promote_status != \"Succeeded\":\n        terminal_errors.append(\n            f\"Candidate promotion did not succeed: {promote_status or 'Missing'}\"\n  \
        \      )\n    if publish_status != \"Succeeded\":\n        terminal_errors.append(\n            f\"TMB publication did not succeed: {publish_status or 'Missing'}\"\n        )\nif recovery_errors:\n\
        \    manifest[\"recovery_errors\"] = recovery_errors\n\ntemporary = manifest_path + \".tmp\"\nwith open(temporary, \"w\") as handle:\n    json.dump(manifest, handle, indent=2)\n    handle.flush()\n\
        \    os.fsync(handle.fileno())\nos.replace(temporary, manifest_path)\n\n# Remove only a positively identified UID-scoped work directory,\n# and only after candidate validation succeeded. Candidates\
        \ and\n# backups are retained for review/recovery.\nexpected_suffix = f\".repair-wk-{uid}\"\nif validation_status == \"Succeeded\" and tx_base.endswith(expected_suffix):\n    if os.path.isdir(tx_root):\n\
        \        shutil.rmtree(tx_root)\n        print(f\"Removed completed transaction work directory: {tx_base}\")\n\nprint(\n    \"Final state: \"\n    f\"validation={manifest['validation']['state']}\
        \ \"\n    f\"promotion={manifest['promotion']['state']} \"\n    f\"projection={manifest['projection']['state']}\"\n)\nif recovery_errors or terminal_errors:\n    for error in recovery_errors + terminal_errors:\n\
        \        print(error, file=sys.stderr)\n    raise SystemExit(1)\n# END FINALIZE_REPAIR_PYTHON\n"
      volumeMounts:
      - mountPath: /mnt/parent/
        name: output-parent
    volumes:
    - hostPath:
        path: '{{inputs.parameters.output-parent}}'
        type: Directory
      name: output-parent
