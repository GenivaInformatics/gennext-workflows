apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cravat-templates-trio
  namespace: argo
spec:
  templates:
  - inputs:
      parameters:
      - name: proband-vcf
      - name: mother-vcf
      - name: father-vcf
      - name: ref-version
      - name: annotators
      - default: /opt/open-cravat/cravat/modules
        name: modules-dir
      - name: output-dir
    name: cravat-trio-template
    script:
      command:
      - sh
      image: bergun/gennext-cravat:0.2.11c-alpha-no_mu
      name: cravat-trio
      source: 'oc run \

        "/mnt/input/{{=sprig.osBase(inputs.parameters[''father-vcf''])}}" \

        "/mnt/input/{{=sprig.osBase(inputs.parameters[''mother-vcf''])}}" \

        "/mnt/input/{{=sprig.osBase(inputs.parameters[''proband-vcf''])}}" \

        -a {{inputs.parameters.annotators}} \

        -l {{inputs.parameters.ref-version}} \

        --skip reporter \

        --temp-files \

        --cleanrun \

        -d "{{inputs.parameters.output-dir}}"

        '
      volumeMounts:
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}
        name: proband-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['mother-vcf'])}}
        name: mother-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['father-vcf'])}}
        name: father-vcf
      - mountPath: /opt/
        name: modules-dir
      - mountPath: /mnt/output/
        name: output-dir
    volumes:
    - hostPath:
        path: '{{inputs.parameters.proband-vcf}}'
        type: File
      name: proband-vcf
    - hostPath:
        path: '{{inputs.parameters.mother-vcf}}'
        type: File
      name: mother-vcf
    - hostPath:
        path: '{{inputs.parameters.father-vcf}}'
        type: File
      name: father-vcf
    - hostPath:
        path: '{{inputs.parameters.modules-dir}}'
        type: Directory
      name: modules-dir
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
  - inputs:
      parameters:
      - name: proband-vcf
      - name: mother-vcf
      - name: father-vcf
      - name: ref-version
      - name: annotators
      - default: /opt/open-cravat/cravat/modules
        name: modules-dir
      - name: output-dir
      - name: node-name
    name: cravat-trio-template-nodeSelector
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    script:
      command:
      - sh
      image: bergun/gennext-cravat:0.2.0-alpha
      name: cravat-trio
      source: 'oc run \

        "/mnt/input/{{=sprig.osBase(inputs.parameters[''father-vcf''])}}" \

        "/mnt/input/{{=sprig.osBase(inputs.parameters[''mother-vcf''])}}" \

        "/mnt/input/{{=sprig.osBase(inputs.parameters[''proband-vcf''])}}" \

        -a {{inputs.parameters.annotators}} \

        -l {{inputs.parameters.ref-version}} \

        --skip reporter \

        --temp-files \

        --cleanrun \

        -d "{{inputs.parameters.output-dir}}"

        '
      volumeMounts:
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}
        name: proband-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['mother-vcf'])}}
        name: mother-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['father-vcf'])}}
        name: father-vcf
      - mountPath: /opt/
        name: modules-dir
      - mountPath: /mnt/output/
        name: output-dir
    volumes:
    - hostPath:
        path: '{{inputs.parameters.proband-vcf}}'
        type: File
      name: proband-vcf
    - hostPath:
        path: '{{inputs.parameters.mother-vcf}}'
        type: File
      name: mother-vcf
    - hostPath:
        path: '{{inputs.parameters.father-vcf}}'
        type: File
      name: father-vcf
    - hostPath:
        path: '{{inputs.parameters.modules-dir}}'
        type: Directory
      name: modules-dir
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
