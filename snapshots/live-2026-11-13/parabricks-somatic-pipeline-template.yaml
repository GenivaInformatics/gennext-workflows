apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: parabricks-somatic-pipeline-template
  namespace: argo
spec:
  templates:
  - inputs:
      parameters:
      - name: genome-ref
      - name: input-tumor-fq-r1
      - name: input-tumor-fq-r2
      - name: known-sites
      - name: scratch-dir
      - name: read-group-str
      - name: output-tumor-bam
      - name: output-tumor-recal
      - name: output-tumor-vcf
      - name: bwa-options
        value: ''
    name: parabricks-somatic-pipeline-tumor-only
    outputs:
      parameters:
      - name: output-tumor-bam
        value: '{{inputs.parameters.output-tumor-bam}}'
      - name: output-tumor-recal
        value: '{{inputs.parameters.output-tumor-recal}}'
      - name: output-tumor-vcf
        value: '{{inputs.parameters.output-tumor-vcf}}'
    script:
      command:
      - sh
      image: nvcr.io/nvidia/clara/clara-parabricks:4.3.1-1
      name: parabricks-somatic-pipeline-tumor-only-script
      resources:
        limits:
          nvidia.com/gpu: 1
      source: "pbrun somatic \\\n  --ref /mnt/ref/genome/{{=sprig.osBase(inputs.parameters['genome-ref'])}} \\\n  --knownSites /mnt/ref/known-sites/{{=sprig.osBase(inputs.parameters['known-sites'])}} \\\
        \n  --in-tumor-fq /mnt/input/fq_r1/{{=sprig.osBase(inputs.parameters['input-tumor-fq-r1'])}} /mnt/input/fq_r2/{{=sprig.osBase(inputs.parameters['input-tumor-fq-r2'])}} \\\n  \"{{inputs.parameters.read-group-str}}\"\
        \ \\\n  --bwa-options=\"{{inputs.parameters.bwa-options}}\" \\\n  --low-memory \\\n  --tmp-dir /mnt/scratch/ \\\n  --out-vcf /mnt/output/vcf/{{=sprig.osBase(inputs.parameters['output-tumor-vcf'])}}\
        \ \\\n  --out-tumor-recal-file /mnt/output/metrics/{{=sprig.osBase(inputs.parameters['output-tumor-recal'])}} \\\n  --out-tumor-bam /mnt/output/bam/{{=sprig.osBase(inputs.parameters['output-tumor-bam'])}}\n"
      volumeMounts:
      - mountPath: /mnt/input/fq_r1/{{=sprig.osBase(inputs.parameters['input-tumor-fq-r1'])}}
        name: input-tumor-fq-r1
      - mountPath: /mnt/input/fq_r2/{{=sprig.osBase(inputs.parameters['input-tumor-fq-r2'])}}
        name: input-tumor-fq-r2
      - mountPath: /mnt/output/bam/
        name: output-tumor-bam
      - mountPath: /mnt/output/vcf/
        name: output-tumor-vcf
      - mountPath: /mnt/scratch/
        name: scratch-dir
      - mountPath: /mnt/ref/genome/
        name: genome-ref
      - mountPath: /mnt/ref/known-sites/
        name: known-sites
      - mountPath: /mnt/output/metrics/
        name: output-tumor-recal
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - hostPath:
        path: '{{inputs.parameters.input-tumor-fq-r1}}'
        type: File
      name: input-tumor-fq-r1
    - hostPath:
        path: '{{inputs.parameters.input-tumor-fq-r2}}'
        type: File
      name: input-tumor-fq-r2
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-tumor-bam''])}}'
        type: DirectoryOrCreate
      name: output-tumor-bam
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-tumor-recal''])}}'
        type: DirectoryOrCreate
      name: output-tumor-recal
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-tumor-vcf''])}}'
        type: DirectoryOrCreate
      name: output-tumor-vcf
    - hostPath:
        path: '{{inputs.parameters.scratch-dir}}'
        type: Directory
      name: scratch-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''genome-ref''])}}'
        type: Directory
      name: genome-ref
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''known-sites''])}}'
        type: Directory
      name: known-sites
  - inputs:
      parameters:
      - name: genome-ref
      - name: input-tumor-fq-r1
      - name: input-tumor-fq-r2
      - name: known-sites
      - name: scratch-dir
      - name: regions-file
      - name: read-group-str
      - name: output-tumor-bam
      - name: output-tumor-vcf
      - name: output-tumor-recal
      - name: node-name
    name: parabricks-somatic-pipeline-tumor-only-nodeSelector
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    script:
      command:
      - sh
      image: nvcr.io/nvidia/clara/clara-parabricks:4.3.1-1
      name: parabricks-somatic-pipeline-tumor-only-script
      resources:
        limits:
          nvidia.com/gpu: 1
      source: "echo \"@{{inputs.parameters.read-group-str}}\";\npbrun somatic \\\n  --ref /mnt/ref/genome/{{=sprig.osBase(inputs.parameters['genome-ref'])}} \\\n  --knownSites /mnt/ref/known-sites/{{=sprig.osBase(inputs.parameters['known-sites'])}}\
        \ \\\n  --in-tumor-fq /mnt/input/fq_r1/{{=sprig.osBase(inputs.parameters['input-tumor-fq-r1'])}} /mnt/input/fq_r2/{{=sprig.osBase(inputs.parameters['input-tumor-fq-r2'])}} \\\n  \"{{inputs.parameters.read-group-str}}\"\
        \ \\\n  --interval-file /mnt/ref/regions/{{=sprig.osBase(inputs.parameters['regions-file'])}} \\\n  --tmp-dir /mnt/scratch/ \\\n  --out-vcf /mnt/output/vcf/{{=sprig.osBase(inputs.parameters['output-tumor-vcf'])}}\
        \ \\\n  --out-tumor-recal-file /mnt/output/metrics/{{=sprig.osBase(inputs.parameters['output-tumor-recal'])}} \\\n  --out-tumor-bam /mnt/output/bam/{{=sprig.osBase(inputs.parameters['output-tumor-bam'])}}\n"
      volumeMounts:
      - mountPath: /mnt/input/fq_r1/{{=sprig.osBase(inputs.parameters['input-tumor-fq-r1'])}}
        name: input-tumor-fq-r1
      - mountPath: /mnt/input/fq_r2/{{=sprig.osBase(inputs.parameters['input-tumor-fq-r2'])}}
        name: input-tumor-fq-r2
      - mountPath: /mnt/output/bam/
        name: output-tumor-bam
      - mountPath: /mnt/output/vcf/
        name: output-tumor-vcf
      - mountPath: /mnt/scratch/
        name: scratch-dir
      - mountPath: /mnt/ref/regions/{{=sprig.osBase(inputs.parameters['regions-file'])}}
        name: regions-file
      - mountPath: /mnt/ref/genome/
        name: genome-ref
      - mountPath: /mnt/ref/known-sites/
        name: known-sites
      - mountPath: /mnt/output/metrics/
        name: output-tumor-recal
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - hostPath:
        path: '{{inputs.parameters.input-tumor-fq-r1}}'
        type: File
      name: input-tumor-fq-r1
    - hostPath:
        path: '{{inputs.parameters.input-tumor-fq-r2}}'
        type: File
      name: input-tumor-fq-r2
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-tumor-bam''])}}'
        type: Directory
      name: output-tumor-bam
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-tumor-vcf''])}}'
        type: Directory
      name: output-tumor-vcf
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-tumor-recal''])}}'
        type: Directory
      name: output-tumor-recal
    - hostPath:
        path: '{{inputs.parameters.scratch-dir}}'
        type: Directory
      name: scratch-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''genome-ref''])}}'
        type: Directory
      name: genome-ref
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''known-sites''])}}'
        type: Directory
      name: known-sites
    - hostPath:
        path: '{{inputs.parameters.regions-file}}'
        type: File
      name: regions-file
