apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: per-sample-cnv-analysis
  namespace: argo
spec:
  entrypoint: per-sample-cnv-pipeline
  serviceAccountName: gennext-workflows
  templates:
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: scratch-cnv-dir
            value: '{{inputs.parameters.scratch-cnv-dir}}'
        name: resolve-sample
        template: resolve-sample-data
      - arguments:
          parameters:
          - name: sample-uuid
            value: '{{tasks.resolve-sample.outputs.parameters.sample-uuid}}'
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: scratch-cnv-dir
            value: '{{inputs.parameters.scratch-cnv-dir}}'
          - name: output-cnv-dir
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}'
          - name: vcf-path
            value: '{{tasks.resolve-sample.outputs.parameters.vcf-path}}'
        depends: resolve-sample
        name: analyze
        template: cnvkit-analyze
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: scratch-cnv-dir
            value: '{{inputs.parameters.scratch-cnv-dir}}'
          - name: output-cnv-dir
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}'
          - name: ref-flat
            value: '{{inputs.parameters.ref-flat}}'
        depends: analyze
        name: post-process
        template: cnvkit-post-process
      - arguments:
          parameters:
          - name: input-vcf-f
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}/{{inputs.parameters.sample-id}}.cnv.filtered.annotated.vcf'
          - name: annotsv-ref-dir
            value: '{{inputs.parameters.ref-base-dir}}/hg38/other/AnnotSV/'
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: ref-version
            value: hg38
          - name: sv-min-size
            value: '20'
          - name: vcf-pass-only
            value: 'true'
          - name: output-annotsv-tsv-f
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}/{{inputs.parameters.sample-id}}_CNV_annot.tsv'
        depends: post-process
        name: annotsv
        templateRef:
          name: annotsv-template
          template: annotsv-with-fallback
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: annotsv-tsv
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}/{{inputs.parameters.sample-id}}_CNV_annot.tsv'
          - name: annotsv-filtered-out-tsv
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}/{{inputs.parameters.sample-id}}_CNV_annot_filtered.tsv'
          - name: annotsv-oncokb-out-tsv
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}/{{inputs.parameters.sample-id}}_CNV_oncokb.tsv'
        depends: annotsv
        name: annotsv-to-oncokb
        templateRef:
          name: filter-annotsv-template
          template: annotsv-to-oncokb-format
      - arguments:
          parameters:
          - name: oncokb-sv-in-f
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}/{{inputs.parameters.sample-id}}_CNV_oncokb.tsv'
          - name: oncokb-sv-out-f
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}/{{inputs.parameters.sample-id}}_CNV_oncokb_annot.tsv'
          - name: tumor-type
            value: '{{tasks.resolve-sample.outputs.parameters.tumor-type}}'
          - name: regions-file
            value: '{{inputs.parameters.regions-file}}'
        depends: annotsv-to-oncokb
        name: oncokb-cnv
        templateRef:
          name: oncokb-templates
          template: oncokb-sv
      - arguments:
          parameters:
          - name: oncokb-tsv-f
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}/{{inputs.parameters.sample-id}}_CNV_oncokb_annot.tsv'
          - name: annotsv-tsv-f
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}/{{inputs.parameters.sample-id}}_CNV_annot_filtered.tsv'
          - name: output-duckdb
            value: '{{inputs.parameters.output-base-dir}}{{tasks.resolve-sample.outputs.parameters.sample-uuid}}/results/db/{{inputs.parameters.sample-id}}_results.duckdb'
        depends: oncokb-cnv
        name: duckdb-cnv
        templateRef:
          name: duckdb-template
          template: duckdb-cnv
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: output-cnv-dir
            value: '{{tasks.resolve-sample.outputs.parameters.output-cnv-dir}}'
          - name: output-hrd-dir
            value: '{{inputs.parameters.output-base-dir}}{{tasks.resolve-sample.outputs.parameters.sample-uuid}}/metrics/hrd/'
        depends: analyze
        name: scarhrd
        template: scarhrd
        when: '''{{inputs.parameters.run-hrd}}'' == ''true'''
      - arguments:
          parameters:
          - name: run-id
            value: '{{inputs.parameters.run-id}}'
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: hrd-json-f
            value: '{{inputs.parameters.output-base-dir}}{{tasks.resolve-sample.outputs.parameters.sample-uuid}}/metrics/hrd/{{inputs.parameters.sample-id}}_hrd.json'
        depends: scarhrd
        name: collect-hrd-data
        templateRef:
          name: collect-somatic-data-templates
          template: collect-hrd-data
        when: '''{{inputs.parameters.run-hrd}}'' == ''true'''
    inputs:
      parameters:
      - name: sample-id
      - name: scratch-cnv-dir
      - name: ref-flat
      - name: ref-base-dir
      - name: output-base-dir
      - name: run-id
      - name: run-hrd
      - name: regions-file
        value: .
    name: per-sample-cnv-pipeline
  - inputs:
      parameters:
      - name: sample-id
      - name: scratch-cnv-dir
    name: resolve-sample-data
    outputs:
      parameters:
      - name: sample-uuid
        valueFrom:
          path: /tmp/sample_uuid.txt
      - name: bam-path
        valueFrom:
          path: /tmp/bam_path.txt
      - name: vcf-path
        valueFrom:
          path: /tmp/vcf_path.txt
      - name: output-cnv-dir
        valueFrom:
          path: /tmp/output_cnv_dir.txt
      - name: tumor-type
        valueFrom:
          path: /tmp/tumor_type.txt
    script:
      command:
      - python
      image: python:3.13-alpine
      source: "import json, os\nwith open(\"/scratch/samples/{{inputs.parameters.sample-id}}.json\") as f:\n    sample = json.load(f)\n# Batch CNV outputs land in batch_results/ so the cohort CNV pipeline\n\
        # (per-sample-cnv-cohort-analysis) can write to cohort_results/ side-by-side.\nbatch_cnv_dir = os.path.join(sample[\"output-cnv-dir\"].rstrip(\"/\"), \"batch_results\")\nfor key, path, value in\
        \ [\n    (\"sample-uuid\", \"/tmp/sample_uuid.txt\", sample[\"sample-uuid\"]),\n    (\"bam-path\", \"/tmp/bam_path.txt\", sample[\"bam-path\"]),\n    (\"vcf-path\", \"/tmp/vcf_path.txt\", sample[\"\
        vcf-path\"]),\n    (\"output-cnv-dir\", \"/tmp/output_cnv_dir.txt\", batch_cnv_dir),\n    (\"tumor-type\", \"/tmp/tumor_type.txt\", sample[\"tumor-type\"]),\n]:\n    with open(path, \"w\") as f:\n\
        \        f.write(value)\n"
      volumeMounts:
      - mountPath: /scratch/
        name: scratch
        readOnly: true
    volumes:
    - hostPath:
        path: '{{inputs.parameters.scratch-cnv-dir}}'
        type: Directory
      name: scratch
  - inputs:
      parameters:
      - name: sample-uuid
      - name: sample-id
      - name: scratch-cnv-dir
      - name: output-cnv-dir
      - name: vcf-path
    name: cnvkit-analyze
    script:
      command:
      - sh
      image: quay.io/biocontainers/cnvkit:0.9.13--pyhdfd78af_0
      source: "set -e\nUUID=\"{{inputs.parameters.sample-uuid}}\"\nSAMPLE_ID=\"{{inputs.parameters.sample-id}}\"\nVCF=\"/vcf/{{=sprig.osBase(inputs.parameters['vcf-path'])}}\"\nmkdir -p /output\n\n# Fix\
        \ (normalize) coverage against pooled reference. CNVkit 0.9.13\n# doesn't support --drop-low-coverage on fix (the flag applies to\n# segment/call/genemetrics, where the actual filtering matters);\n\
        # low-coverage bins are still emitted to .cnr with log2=-20 sentinel\n# but get excluded downstream by the --drop-low-coverage on segment.\nEDGE_FLAG=\"\"\nif [ -f /scratch/references/cnv-mode.txt\
        \ ] && [ \"$(cat /scratch/references/cnv-mode.txt)\" = wgs ]; then\n  EDGE_FLAG=\"--no-edge\"\nfi\ncnvkit.py fix $EDGE_FLAG \\\n  /scratch/coverage/${UUID}.targetcoverage.cnn \\\n  /scratch/coverage/${UUID}.antitargetcoverage.cnn\
        \ \\\n  /scratch/references/pooled_reference.cnn \\\n  -o /output/${SAMPLE_ID}.cnr\n\n# Match cohort analysis: DNAcopy smoothing is safe only for hybrid\n# references. Amplicon references have an\
        \ empty antitarget BED and\n# may contain single-bin chromosomes that make smooth.CNA fail.\nif [ -s /scratch/references/antitargets.bed ]; then\n  SMOOTH_FLAG=\"--smooth-cbs\"\nelse\n  SMOOTH_FLAG=\"\
        \"\nfi\n\n# Segment via CBS with hybrid-only smoothing for tumor robustness.\ncnvkit.py segment \\\n  $SMOOTH_FLAG \\\n  --drop-low-coverage \\\n  /output/${SAMPLE_ID}.cnr \\\n  -o /output/${SAMPLE_ID}.cns\n\
        \n# cnvkit's -v expects germline HETEROZYGOUS SNPs: their BAF sits at ~0.5,\n# and drift away from it is the allele-imbalance signal that produces\n# cn1/cn2. What we pass is the vLoD *somatic*\
        \ call set, which is the\n# wrong population. cnvkit's own heterozygous() filter reads zygosity\n# from GT, and Mutect2 in tumour-only mode emits 0/1 for every call\n# (observed at AF 0.994), so\
        \ that filter is a no-op: homozygous\n# germline and low-VAF somatic calls both reach the BAF. cnvkit then\n# mirrors BAF about 0.5, so 0.03 and 0.97 both collapse to ~0,\n# upper_baf approaches\
        \ 1, cn2 rounds to 0, and the genome reads as\n# near-universal LOH. Measured across nine TSO500 samples: 80-98% of\n# segments called LOH, median segment BAF 0.025-0.167.\n#\n# Selecting PASS sites\
        \ with 0.25 <= VAF <= 0.75 restores it: median\n# segment BAF 0.395-0.601, LOH-called segments 32-52%.\nHET_VCF=\"/output/${SAMPLE_ID}.het.vcf\"\ncase \"$VCF\" in *.gz) READ_VCF=\"gzip -dc\";; *)\
        \ READ_VCF=\"cat\";; esac\n$READ_VCF \"$VCF\" | awk -F'\\t' -v OFS='\\t' '\n  /^#/ { print; next }\n  $7 != \"PASS\" { next }\n  {\n    split($9, k, \":\"); split($10, v, \":\"); af = \"\"\n   \
        \ for (i in k) if (k[i] == \"AF\") { split(v[i], a, \",\"); af = a[1] }\n    if (af == \"\") next\n    if (af + 0 >= 0.25 && af + 0 <= 0.75) print\n  }' > \"$HET_VCF\"\nN_HET=$(grep -vc '^#' \"\
        $HET_VCF\" || true)\necho \"BAF sites after germline-heterozygote selection: $N_HET\"\n# Deliberately no fallback to the unfiltered VCF: too few het sites\n# means there is no allelic information,\
        \ and scarhrd-cli's\n# --unsupported-segments balanced handles the resulting empty BAF\n# honestly. Falling back would reinstate the artefact.\nif [ \"$N_HET\" -lt 50 ]; then\n  echo \"WARN: only\
        \ $N_HET heterozygous BAF sites; allele-specific copy number will be sparse\" >&2\nfi\n\n# Call with BAF from the germline-heterozygote subset (produces cn1, cn2).\ncnvkit.py call \\\n  --drop-low-coverage\
        \ \\\n  /output/${SAMPLE_ID}.cns \\\n  -v \"$HET_VCF\" \\\n  -i ${SAMPLE_ID} \\\n  --ploidy 2 \\\n  -o /output/${SAMPLE_ID}.call.cns\n\n# Scatter plot with BAF track\ncnvkit.py scatter \\\n  /output/${SAMPLE_ID}.cnr\
        \ \\\n  -s /output/${SAMPLE_ID}.call.cns \\\n  -v \"$HET_VCF\" \\\n  -o /output/${SAMPLE_ID}-scatter.png\n\n# Export to VCF from the called segments. Must be .call.cns (integer\n# cn calls), not\
        \ .cns: exporting from .cns loses every CNV because\n# cnvkit re-derives copy number by naive ploidy rounding of the modest\n# log2 values, collapsing all segments to neutral \u2192 empty VCF.\n\
        cnvkit.py export vcf \\\n  /output/${SAMPLE_ID}.call.cns \\\n  --cnr /output/${SAMPLE_ID}.cnr \\\n  -i ${SAMPLE_ID} \\\n  -o /output/${SAMPLE_ID}.cnv.vcf\n\n# Per-gene log2/fold summary, computed\
        \ straight off .cnr so it's\n# robust to segmentation choices (catches focal oncogenic events\n# that get diluted into broader segments). Mirrors the same step\n# in per-sample-cnv-cohort-analysis.yaml's\
        \ cnvkit-analyze. Non-fatal\n# so a genemetrics failure doesn't tank an otherwise-good run.\n# Thresholds: log2 >= 0.3 (~|fold|>1.23), min 1 probe per gene.\ncnvkit.py genemetrics \\\n  --drop-low-coverage\
        \ \\\n  /output/${SAMPLE_ID}.cnr \\\n  -t 0.3 \\\n  -m 1 \\\n  -o /output/${SAMPLE_ID}.genemetrics.tsv \\\n  || echo \"genemetrics failed (non-fatal)\" >&2\n"
      volumeMounts:
      - mountPath: /scratch/
        name: scratch
        readOnly: true
      - mountPath: /output/
        name: output-cnv
      - mountPath: /vcf/
        name: vcf-dir
        readOnly: true
    volumes:
    - hostPath:
        path: '{{inputs.parameters.scratch-cnv-dir}}'
        type: Directory
      name: scratch
    - hostPath:
        path: '{{inputs.parameters.output-cnv-dir}}'
        type: DirectoryOrCreate
      name: output-cnv
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''vcf-path''])}}'
        type: Directory
      name: vcf-dir
  - container:
      args:
      - batch-post-process
      - --vcf=/output/{{inputs.parameters.sample-id}}.cnv.vcf
      - --reference=/scratch/references/pooled_reference.cnn
      - --refflat=/refflat/{{=sprig.osBase(inputs.parameters['ref-flat'])}}
      - --output-dir=/output/
      - --sample-id={{inputs.parameters.sample-id}}
      - --sigma-source=spread
      - --verbose
      image: bergun/gennext-cnv-analysis:0.4.0
      volumeMounts:
      - mountPath: /scratch/
        name: scratch
        readOnly: true
      - mountPath: /output/
        name: output-cnv
      - mountPath: /refflat/
        name: refflat-dir
        readOnly: true
    inputs:
      parameters:
      - name: sample-id
      - name: scratch-cnv-dir
      - name: output-cnv-dir
      - name: ref-flat
    name: cnvkit-post-process
    volumes:
    - hostPath:
        path: '{{inputs.parameters.scratch-cnv-dir}}'
        type: Directory
      name: scratch
    - hostPath:
        path: '{{inputs.parameters.output-cnv-dir}}'
        type: DirectoryOrCreate
      name: output-cnv
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''ref-flat''])}}'
        type: Directory
      name: refflat-dir
  - inputs:
      parameters:
      - name: sample-id
      - name: output-cnv-dir
      - name: output-hrd-dir
    name: scarhrd
    script:
      args:
      - "set -euo pipefail\nmkdir -p /mnt/hrd-output\n\nSAMPLE_ID=\"{{inputs.parameters.sample-id}}\"\nCNS=\"/mnt/output/${SAMPLE_ID}.call.cns\"\nHRD_JSON=\"/mnt/hrd-output/${SAMPLE_ID}_hrd.json\"\n\n#\
        \ scarHRD needs allele-specific copy numbers (cn1/cn2). cnvkit only\n# emits those when there are enough reads/variants to call BAF; a\n# near-empty sample yields a plain call.cns without them.\
        \ In that\n# case emit a zero-filled fallback so collect-hrd-data still runs\n# and the sample completes instead of failing the whole workflow.\nif [[ ! -s \"$CNS\" ]] || ! head -n1 \"$CNS\" | grep\
        \ -qw cn1 || ! head -n1 \"$CNS\" | grep -qw cn2; then\n    echo \"WARN: ${CNS} lacks cn1/cn2 (insufficient reads for allele-specific CN). Writing zero-filled HRD fallback.\" >&2\n    cat > \"$HRD_JSON\"\
        \ <<EOF\n{\"HRD\": 0, \"Telomeric_AI\": 0, \"LST\": 0, \"HRD_sum\": 0}\nEOF\n    exit 0\nfi\n\nscarhrd-cli \\\n    --input \"$CNS\" \\\n    --sample-id \"$SAMPLE_ID\" \\\n    --sequenza-output \"\
        /mnt/hrd-output/${SAMPLE_ID}_sequenza.txt\" \\\n    --hrd-tsv-output \"/mnt/hrd-output/${SAMPLE_ID}_hrd.tsv\" \\\n    --hrd-json-output \"$HRD_JSON\"\n"
      command:
      - bash
      - -euo
      - pipefail
      - -c
      image: bergun/gennext-scarhrd-cli:0.1.0
      resources:
        requests:
          cpu: '1'
          memory: 2Gi
      securityContext:
        runAsUser: 0
      volumeMounts:
      - mountPath: /mnt/output
        name: output-cnv
        readOnly: true
      - mountPath: /mnt/hrd-output
        name: hrd-output
    volumes:
    - hostPath:
        path: '{{inputs.parameters.output-cnv-dir}}'
        type: Directory
      name: output-cnv
    - hostPath:
        path: '{{inputs.parameters.output-hrd-dir}}'
        type: DirectoryOrCreate
      name: hrd-output
