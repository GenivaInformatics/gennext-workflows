apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: picard-collect-rnaseq-metrics-template
  namespace: argo
spec:
  templates:
  - inputs:
      parameters:
      - name: sample-id
      - name: input-bam
      - name: ref-flat
      - default: .
        name: ribosomal-intervals
      - name: output-metrics
      - default: SECOND_READ_TRANSCRIPTION_STRAND
        name: strand-specificity
    name: picard-collect-rnaseq-metrics
    outputs:
      parameters:
      - name: output-metrics
        value: '{{inputs.parameters.output-metrics}}'
    script:
      command:
      - bash
      image: broadinstitute/gatk:4.6.2.0
      name: picard-collect-rnaseq-metrics
      resources:
        requests:
          cpu: '2'
          memory: 10Gi
      source: "set -euo pipefail\n\nBAM_IN=\"/mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}\"\nREF_FLAT=\"/mnt/ref/refflat/{{=sprig.osBase(inputs.parameters['ref-flat'])}}\"\nMETRICS_OUT=\"\
        /mnt/output/metrics/{{=sprig.osBase(inputs.parameters['output-metrics'])}}\"\n\n# Ribosomal intervals are optional; PCT_RIBOSOMAL_BASES is absent\n# without them. Sentinel \".\" means \"skip\" \u2014\
        \ same convention used\n# by elprep's regions-file param.\nRIBO_ARG=\"\"\nriboFile=\"{{=sprig.osBase(inputs.parameters['ribosomal-intervals'])}}\"\nif [ \".\" != \"${riboFile}\" ]; then\n  RIBO_ARG=\"\
        --RIBOSOMAL_INTERVALS /mnt/ref/ribosomal/${riboFile}\"\nfi\n\n# CollectRnaSeqMetrics calls SamPairUtil.getPairOrientation, which\n# throws on read pairs with mates on different chromosomes (i.e.\n\
        # chimeric/fusion split reads emitted by STAR's --chimOutType\n# WithinBAM). The v2 fusion DAG no longer applies a proper-pair\n# filter at the sort step (the read-extractor needs supplementary\n\
        # + chimeric reads), so we strip those records here as a local\n# filter purely for this QC tool. samtools is bundled in the GATK\n# 4.6 image at /usr/local/bin/samtools.\n# -f 2:    keep only reads\
        \ in proper pairs.\n# -F 3328: drop secondary (256) + supplementary (2048) +\n#          PCR-duplicate-flagged (1024). Dup-flagging is set by\n#          fgbio-mark-duplicates upstream; excluding\
        \ those records\n#          gives an RNA-seq metrics view that reflects unique\n#          molecules only.\nBAM_FILTERED=\"/tmp/proper_pair_only.bam\"\necho \"Pre-filtering BAM to proper pairs only\
        \ (and dropping dups) for CollectRnaSeqMetrics\"\nsamtools view -b -@ 2 -f 2 -F 3328 \"${BAM_IN}\" -o \"${BAM_FILTERED}\"\nsamtools index -@ 2 \"${BAM_FILTERED}\"\n\necho \"Running CollectRnaSeqMetrics\
        \ (via GATK4)\"\necho \"  Input:        ${BAM_FILTERED} (proper-pair-filtered from ${BAM_IN})\"\necho \"  RefFlat:      ${REF_FLAT}\"\necho \"  Ribosomal:    ${RIBO_ARG:-<not provided>}\"\necho\
        \ \"  Strand:       {{inputs.parameters.strand-specificity}}\"\necho \"  Output:       ${METRICS_OUT}\"\n\ngatk --java-options \"-Xmx8G\" CollectRnaSeqMetrics \\\n  -I \"${BAM_FILTERED}\" \\\n \
        \ -O \"${METRICS_OUT}\" \\\n  --REF_FLAT \"${REF_FLAT}\" \\\n  ${RIBO_ARG} \\\n  --STRAND_SPECIFICITY {{inputs.parameters.strand-specificity}} \\\n  --VALIDATION_STRINGENCY LENIENT\n\nrm -f \"${BAM_FILTERED}\"\
        \ \"${BAM_FILTERED}.bai\"\necho \"CollectRnaSeqMetrics completed\"\n"
      volumeMounts:
      - mountPath: /mnt/input/bam/
        name: input-bam
      - mountPath: /mnt/ref/refflat/{{=sprig.osBase(inputs.parameters['ref-flat'])}}
        name: ref-flat
      - mountPath: /mnt/ref/ribosomal/
        name: ribosomal-intervals
      - mountPath: /mnt/output/metrics/
        name: output-metrics
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{inputs.parameters.ref-flat}}'
        type: File
      name: ref-flat
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''ribosomal-intervals''])}}'
        type: Directory
      name: ribosomal-intervals
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-metrics''])}}'
        type: DirectoryOrCreate
      name: output-metrics
