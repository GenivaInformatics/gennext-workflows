apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: arriba-fusion-detection
  namespace: argo
  labels:
    pipeline: fusion-detection
    tool: arriba
spec:
  templates:
  - container:
      args:
      - "set -euo pipefail\n\n# Resolve bundled resource files dynamically (handles v2.5.0 vs v2.5.1)\nARRIBA_DATA=/usr/local/var/lib/arriba\nBLACKLIST=$(ls ${ARRIBA_DATA}/blacklist_hg38_GRCh38_v2.5.*.tsv.gz\
        \ 2>/dev/null | head -1)\nKNOWN_FUSIONS=$(ls ${ARRIBA_DATA}/known_fusions_hg38_GRCh38_v2.5.*.tsv.gz 2>/dev/null | head -1)\nPROTEIN_DOMAINS=$(ls ${ARRIBA_DATA}/protein_domains_hg38_GRCh38_v2.5.*.gff3\
        \ 2>/dev/null | head -1)\n\nif [ -z \"$BLACKLIST\" ] || [ -z \"$KNOWN_FUSIONS\" ] || [ -z \"$PROTEIN_DOMAINS\" ]; then\n  echo \"ERROR: Could not find arriba bundled resource files in ${ARRIBA_DATA}\"\
        \n  ls -la ${ARRIBA_DATA}/ || true\n  exit 1\nfi\n\necho \"Resolved arriba resources:\"\necho \"  Blacklist:        ${BLACKLIST}\"\necho \"  Known fusions:    ${KNOWN_FUSIONS}\"\necho \"  Protein\
        \ domains:  ${PROTEIN_DOMAINS}\"\n\nmkdir -p /mnt/output/arriba\n\nSAMPLE_ID=\"{{inputs.parameters.sample-id}}\"\nSENSITIVITY=\"{{inputs.parameters.sensitivity}}\"\nTHREADS=\"{{inputs.parameters.threads}}\"\
        \n\nBAM=\"/mnt/input/bam/${SAMPLE_ID}_RNA.bam\"\nGENOME=\"/mnt/ref/genome/GCA_000001405.15_GRCh38_full_minus_alt_plus_hs38d1_plus_HLA_analysis_set/GCA_000001405.15_GRCh38_full_minus_alt_plus_hs38d1_plus_HLA_analysis_set.fa\"\
        \nGTF=\"/mnt/ref/gene_annots/gencode.v48.basic.annotation.gtf\"\n\nARRIBA_ARGS=\"-x ${BAM}\"\nARRIBA_ARGS=\"${ARRIBA_ARGS} -o /mnt/output/arriba/${SAMPLE_ID}_fusions.tsv\"\nARRIBA_ARGS=\"${ARRIBA_ARGS}\
        \ -O /mnt/output/arriba/${SAMPLE_ID}_fusions.discarded.tsv\"\nARRIBA_ARGS=\"${ARRIBA_ARGS} -a ${GENOME}\"\nARRIBA_ARGS=\"${ARRIBA_ARGS} -g ${GTF}\"\nARRIBA_ARGS=\"${ARRIBA_ARGS} -b ${BLACKLIST}\"\
        \nARRIBA_ARGS=\"${ARRIBA_ARGS} -k ${KNOWN_FUSIONS}\"\nARRIBA_ARGS=\"${ARRIBA_ARGS} -t ${KNOWN_FUSIONS}\"\nARRIBA_ARGS=\"${ARRIBA_ARGS} -p ${PROTEIN_DOMAINS}\"\n\ncase \"${SENSITIVITY}\" in\n  ultra_sensitivity)\n\
        \    echo \"Using ultra_sensitivity mode\"\n    ARRIBA_ARGS=\"${ARRIBA_ARGS} -f blacklist,duplicates,low_entropy,multimappers,small_insert_size,hairpin,homopolymer,mismatches,relative_support,homologs\"\
        \n    ARRIBA_ARGS=\"${ARRIBA_ARGS} -S 1 -E 5.0 -V 0.2 -A 10 -K 0.95 -R 1000\"\n    ;;\n  max_sensitivity)\n    echo \"Using max_sensitivity mode\"\n    ARRIBA_ARGS=\"${ARRIBA_ARGS} -f blacklist,duplicates,low_entropy,multimappers\"\
        \n    ARRIBA_ARGS=\"${ARRIBA_ARGS} -S 1 -E 1.0 -V 0.05 -A 15 -K 0.8 -R 5000\"\n    ;;\n  *)\n    echo \"ERROR: Unknown arriba sensitivity mode: ${SENSITIVITY}\"\n    echo \"Valid modes: ultra_sensitivity,\
        \ max_sensitivity\"\n    exit 1\n    ;;\nesac\n\n# Use -@ for threads (NOT -T which sets top_viral_contigs)\nARRIBA_ARGS=\"${ARRIBA_ARGS} -@ ${THREADS}\"\n\necho \"Running: arriba ${ARRIBA_ARGS}\"\
        \narriba ${ARRIBA_ARGS}\n\necho \"arriba completed successfully\"\nls -la /mnt/output/arriba/\n"
      command:
      - bash
      - -euo
      - pipefail
      - -c
      image: quay.io/biocontainers/arriba:2.5.1--h87b9561_0
      resources:
        requests:
          cpu: '4'
          memory: 8Gi
      volumeMounts:
      - mountPath: /mnt/input
        name: sample-data
        readOnly: true
      - mountPath: /mnt/ref
        name: ref-data
        readOnly: true
      - mountPath: /mnt/output
        name: output-data
    inputs:
      parameters:
      - name: sample-id
      - default: ultra_sensitivity
        name: sensitivity
      - default: '20'
        name: threads
    name: run-arriba
