apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: get-node-rel-dirs
  namespace: argo
spec:
  arguments:
    parameters:
    - name: node-name
    - name: user-id
    - name: job-id
  entrypoint: get-node-rel-dirs
  serviceAccountName: gennext-workflows
  templates:
  - inputs:
      parameters:
      - name: node-name
      - name: user-id
      - name: job-id
    name: get-node-rel-dirs
    outputs:
      parameters:
      - name: input-rel-dir
        valueFrom:
          path: /tmp/INPUT_REL_DIR
      - name: output-rel-dir
        valueFrom:
          path: /tmp/OUTPUT_REL_DIR
      - name: ref-base-dir
        valueFrom:
          path: /tmp/REF_BASE_DIR
      - name: temp-rel-dir
        valueFrom:
          path: /tmp/TEMP_REL_DIR
      - name: scratch-rel-dir
        valueFrom:
          path: /tmp/SCRATCH_REL_DIR
      - name: thread-count
        valueFrom:
          path: /tmp/THREAD_COUNT
    script:
      command:
      - bash
      image: bitnami/kubectl:latest
      source: "NODE_NAME=\"{{inputs.parameters.node-name}}\"\nclean_path() {\nsed -E 's#/+#/#g; s#([^/])$#\\1/#';\n}\njoin_paths() {\necho \"${1:+$1/}$2\" | clean_path\n}\nkubectl get node $NODE_NAME -o\
        \ jsonpath='\n{\"INPUT_REL_DIR=\"}{.metadata.annotations.gennext\\.bio/input-base-dir}\n{\"\\nOUTPUT_REL_DIR=\"}{.metadata.annotations.gennext\\.bio/output-base-dir}\n{\"\\nREF_BASE_DIR=\"}{.metadata.annotations.gennext\\\
        .bio/ref-base-dir}\n{\"\\nTEMP_REL_DIR=\"}{.metadata.annotations.gennext\\.bio/temp-base-dir}\n{\"\\nSCRATCH_REL_DIR=\"}{.metadata.annotations.gennext\\.bio/scratch-base-dir}\n{\"\\nTHREAD_COUNT=\"\
        }{.metadata.annotations.gennext\\.bio/thread-count}\n' > /tmp/keypaths_tmp0\nwhile IFS='=' read -r key path\ndo\n  if [[ $key = \"REF_BASE_DIR\" ]] || [[ $key = \"THREAD_COUNT\" ]]\n  then\n   \
        \ echo \"$path\" | clean_path > \"/tmp/$key\"\n  else\n    echo \"$(join_paths $path {{inputs.parameters.user-id}}/{{inputs.parameters.job-id}})\" > \"/tmp/$key\"\n  fi\ndone < /tmp/keypaths_tmp0\n"
