apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: parabricks-fastq2bam-template
  namespace: argo
spec:
  templates:
  - inputs:
      parameters:
      - name: genome-ref
      - name: input-fq-r1
      - name: input-fq-r2
      - name: scratch-dir
      - name: read-group-str
      - name: output-bam
      - name: output-dupes
    name: parabricks-fq2bam-no-bqsr
    outputs:
      parameters:
      - name: output-bam
        value: '{{inputs.parameters.output-bam}}'
      - name: output-dupes
        value: '{{inputs.parameters.output-dupes}}'
    script:
      command:
      - sh
      image: nvcr.io/nvidia/clara/clara-parabricks:4.3.1-1
      name: parabricks-germline-fq2bam-no-bqsr-script
      resources:
        limits:
          nvidia.com/gpu: 1
      source: "pbrun fq2bamfast \\\n  --ref /mnt/ref/genome/{{=sprig.osBase(inputs.parameters['genome-ref'])}} \\\n  --in-fq /mnt/input/fq_r1/{{=sprig.osBase(inputs.parameters['input-fq-r1'])}} /mnt/input/fq_r2/{{=sprig.osBase(inputs.parameters['input-fq-r2'])}}\
        \ \\\n  \"{{inputs.parameters.read-group-str}}\" \\\n  --tmp-dir /mnt/scratch/ \\\n  --low-memory \\\n  --out-duplicate-metrics /mnt/output/metrics/{{=sprig.osBase(inputs.parameters['output-dupes'])}}\
        \ \\\n  --out-bam /mnt/output/bam/{{=sprig.osBase(inputs.parameters['output-bam'])}}\n"
      volumeMounts:
      - mountPath: /mnt/input/fq_r1/{{=sprig.osBase(inputs.parameters['input-fq-r1'])}}
        name: input-fq-r1
      - mountPath: /mnt/input/fq_r2/{{=sprig.osBase(inputs.parameters['input-fq-r2'])}}
        name: input-fq-r2
      - mountPath: /mnt/output/bam/
        name: output-bam
      - mountPath: /mnt/scratch/
        name: scratch-dir
      - mountPath: /mnt/ref/genome/
        name: genome-ref
      - mountPath: /mnt/output/metrics/
        name: output-dupes
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - hostPath:
        path: '{{inputs.parameters.input-fq-r1}}'
        type: File
      name: input-fq-r1
    - hostPath:
        path: '{{inputs.parameters.input-fq-r2}}'
        type: File
      name: input-fq-r2
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-bam''])}}'
        type: DirectoryOrCreate
      name: output-bam
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-dupes''])}}'
        type: DirectoryOrCreate
      name: output-dupes
    - hostPath:
        path: '{{inputs.parameters.scratch-dir}}'
        type: Directory
      name: scratch-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''genome-ref''])}}'
        type: Directory
      name: genome-ref
