apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: exomedepth-template
  namespace: argo
spec:
  entrypoint: exomedepth
  templates:
  - inputs:
      parameters:
      - name: sample-id
      - name: input-bam
      - name: ref-regions
      - name: ref-cohort
      - name: ref-fasta
      - name: output-vcf
      - name: min-informative-bins
        value: '500'
    name: exomedepth
    outputs:
      parameters:
      - name: output-vcf
        value: '{{inputs.parameters.output-vcf}}'
    script:
      command:
      - Rscript
      image: quay.io/biocontainers/r-exomedepth:1.1.16--r44h9f7ea62_4
      name: exomedepth
      source: "if (!requireNamespace(\"Rsamtools\", quietly = TRUE)) {\n  install.packages(\"BiocManager\")\n  BiocManager::install(\"Rsamtools\")\n}\nlibrary(ExomeDepth)\nlibrary(Rsamtools)\n\ninput.id\
        \ <- \"{{inputs.parameters.sample-id}}\"\ninput.bam <- \"/mnt/input/{{=sprig.osBase(inputs.parameters['input-bam'])}}\"\nref.regions <- \"/mnt/ref/regions/{{=sprig.osBase(inputs.parameters['ref-regions'])}}\"\
        \nref.cohort <- \"/mnt/ref/cohort/{{=sprig.osBase(inputs.parameters['ref-cohort'])}}\"\nref.fasta <- \"/mnt/ref/genome/{{=sprig.osBase(inputs.parameters['ref-fasta'])}}\"\noutput.vcf <- \"/mnt/output/vcf/{{=sprig.osBase(inputs.parameters['output-vcf'])}}\"\
        \n\nmessage(\"Running ExomeDepth for sample: \", input.id)\n\n# Create VCF header\nvcf_header <- c(\n  \"##fileformat=VCFv4.2\",\n  paste0(\"##fileDate=\", format(Sys.Date(), \"%Y%m%d\")),\n  \"\
        ##INFO=<ID=END,Number=1,Type=Integer,Description=\\\"End position of the variant described in this record\\\">\",\n  \"##INFO=<ID=SVLEN,Number=1,Type=Integer,Description=\\\"Difference in length\
        \ between REF and ALT alleles\\\">\",\n  \"##INFO=<ID=SVTYPE,Number=1,Type=String,Description=\\\"Type of structural variant\\\">\",\n  \"##ALT=<ID=DEL,Description=\\\"Deletion\\\">\",\n  \"##ALT=<ID=DUP,Description=\\\
        \"Duplication\\\">\",\n  \"##FORMAT=<ID=GT,Number=1,Type=String,Description=\\\"Genotype\\\">\",\n  \"##FORMAT=<ID=CN,Number=1,Type=Integer,Description=\\\"Copy number genotype for imprecise events\\\
        \">\",\n  \"##FORMAT=<ID=CNQ,Number=1,Type=Float,Description=\\\"Copy number genotype quality for imprecise events\\\">\",\n  \"##FORMAT=<ID=BF,Number=1,Type=Float,Description=\\\"Bayes Factor from\
        \ ExomeDepth, log10 likelihood ratio supporting CNV\\\">\",\n  sprintf(\"#CHROM\\tPOS\\tID\\tREF\\tALT\\tQUAL\\tFILTER\\tINFO\\tFORMAT\\t%s\", input.id)\n)\n\n# Write the VCF (header plus zero or\
        \ more body lines), bgzip and index\n# it. Always called exactly once so every exit path leaves a valid,\n# indexed output-vcf for the downstream annotsv step.\nwrite_vcf <- function(vcf_body) {\n\
        \  tmp_vcf <- tempfile(fileext = \".vcf\")\n  writeLines(c(vcf_header, vcf_body), con = tmp_vcf)\n  Rsamtools::bgzip(tmp_vcf, dest = output.vcf, overwrite = TRUE)\n  Rsamtools::indexTabix(output.vcf,\
        \ format = \"vcf\")\n}\n\nmap_bam_to_column_names <- function(bam_files, count_data_frame) {\n  # Create a mapping between original BAM filenames and column names in data frame\n  bam_basenames\
        \ <- basename(bam_files)\n  mapping <- list()\n\n  for (bam in bam_basenames) {\n    # Create possible variations of the filename as they might appear in the data frame\n    possible_names <- c(\n\
        \      bam,  # Original name\n      make.names(bam),  # R's standard name conversion\n      paste0(\"X\", gsub(\"-\", \".\", bam)),  # X prefix + dots for hyphens\n      gsub(\"-\", \".\", bam),\
        \  # Just dots for hyphens\n      gsub(\"[^a-zA-Z0-9]\", \".\", bam)  # Any non-alphanumeric to dots\n    )\n    # Find which variation exists in the column names\n    found <- FALSE\n    for (possible_name\
        \ in possible_names) {\n      if (possible_name %in% colnames(count_data_frame)) {\n        mapping[[bam]] <- possible_name\n        found <- TRUE\n        break\n      }\n    }\n    # If none of\
        \ the variations found, look for partial matches\n    if (!found) {\n      for (col in colnames(count_data_frame)) {\n        # Check if the column contains the numeric part of the filename\n  \
        \      numeric_part <- gsub(\"[^0-9]\", \"\", bam)\n        if (grepl(numeric_part, col) && !found) {\n          mapping[[bam]] <- col\n          found <- TRUE\n          break\n        }\n    \
        \  }\n    }\n    # If still not found, warn the user\n    if (!found) {\n      warning(paste(\"Could not find a matching column for BAM file:\", bam))\n    }\n  }\n  return(mapping)\n}\n\nref.counts\
        \ <- readRDS(ref.cohort)\ngencode.hg38 <- read.csv(ref.regions, sep='\\t')\n\nnew.count = getBamCounts(bed.frame = gencode.hg38, referenceFasta = ref.fasta, include.chr = FALSE, bam.files = input.bam)\n\
        \nnew.count.dafr <- as(new.count, 'data.frame')\n# Map the filename to the column name\nfilename_mapping <- map_bam_to_column_names(input.bam, new.count.dafr)\n\n# Now you can access the count data\
        \ using the mapped column name\ntest_column <- filename_mapping[[basename(input.bam)]]\ntest.counts <- new.count.dafr[[test_column]]\n\n# Prepare the reference cohort data\n# Assuming ref.counts\
        \ is a GRanges object with multiple samples\nref.count.dafr <- as(ref.counts, 'data.frame')\nreference.columns <- grep(\".bam\", colnames(ref.count.dafr))\nreference.counts <- as.matrix(ref.count.dafr[,\
        \ reference.columns])\n# Calculate bin length for optimization (or use constant value if all exons are similar size)\nbin.length <- (new.count.dafr$end - new.count.dafr$start)/1000\n\n# Coverage\
        \ pre-flight.\n#\n# ExomeDepth needs usable depth across a decent fraction of the target\n# space. When a targeted panel is run against the exome-wide gencode\n# BED, nearly every bin is empty:\
        \ select.reference.set reports \"the\n# coverage is too small to perform any meaningful inference\", leaves\n# mean.p as NA, and then dies inside its own loop with the opaque\n# \"missing value\
        \ where TRUE/FALSE needed\". Sample 25-115-BAM (a 7-gene\n# lysosomal panel routed as wes) had 88 of 201,809 bins above 5 reads\n# and took an otherwise complete 19/20 workflow down with it.\n#\n\
        # Detect that case up front and skip CNV calling instead of crashing,\n# emitting an empty-but-valid VCF so downstream steps still run.\nmin.informative.bins <- as.integer(\"{{inputs.parameters.min-informative-bins}}\"\
        )\ninformative.bins <- sum(test.counts > 5, na.rm = TRUE)\nmessage(\"Target bins with >5 reads: \", informative.bins, \" of \", length(test.counts),\n        \" (minimum required: \", min.informative.bins,\
        \ \")\")\n\nif (informative.bins < min.informative.bins) {\n  message(\"Coverage over the target regions is too sparse for ExomeDepth; \",\n          \"skipping CNV calling and writing an empty\
        \ VCF. This usually means \",\n          \"the sample is a targeted panel being analysed against an exome-wide \",\n          \"region set, or that overall coverage is too low.\")\n  write_vcf(character(0))\n\
        \  quit(save = \"no\", status = 0)\n}\n\n# Select the optimal reference set for this test sample\nmy.choice <- select.reference.set(\n  test.counts = test.counts,\n  reference.counts = reference.counts,\n\
        \  bin.length = bin.length,\n  n.bins.reduced = 10000  # Using subset of bins for speed\n)\n\n# Create the aggregate reference from the selected samples\nmy.reference.selected <- apply(\nX = reference.counts[,\
        \ my.choice$reference.choice, drop = FALSE],\nMAR = 1,\nFUN = sum\n)\n# Create the ExomeDepth object with the test and optimized reference\nexomeDepth.obj <- new(\n'ExomeDepth',\ntest = test.counts,\n\
        reference = my.reference.selected,\nformula = 'cbind(test, reference) ~ 1'\n)\n\n# Call CNVs\nexomeDepth.obj <- CallCNVs(\n  x = exomeDepth.obj,\n  transition.probability = 10^-4,\n  chromosome\
        \ = new.count.dafr$chromosome,\n  start = new.count.dafr$start,\n  end = new.count.dafr$end,\n  name = new.count.dafr$exon  # Use \"exon\" column for naming\n)\n\n# Assuming `exomeDepth.obj@CNV.calls`\
        \ is your input\ncnvs <- exomeDepth.obj@CNV.calls\n\nmake_vcf_line <- function(row) {\n  chrom <- row[\"chromosome\"]\n  pos <- row[\"start\"]\n  id <- row[\"id\"]\n  ref <- \"N\"  # Placeholder\
        \ since no actual sequence\n  alt <- ifelse(row[\"type\"] == \"deletion\", \"<DEL>\", \"<DUP>\")\n  qual <- round(as.numeric(row[\"BF\"]), 2)\n  filter <- \"PASS\"\n  end <- row[\"end\"]\n  svtype\
        \ <- toupper(row[\"type\"])\n  svlen <- ifelse(svtype == \"DELETION\",\n                  -1 * abs(as.integer(end) - as.integer(pos)),\n                  abs(as.integer(end) - as.integer(pos)))\n\
        \  info <- paste0(\"SVTYPE=\", svtype,\n                \";END=\", end,\n                \";SVLEN=\", svlen)\n  format <- \"GT:CN:CNQ:BF\"\n\n  # Compute CN from reads.ratio\n  ratio <- as.numeric(row[\"\
        reads.ratio\"])\n  cn <- round(ratio * 2)\n  bf <- round(as.numeric(row[\"BF\"]), 2)\n  cnq <- round(10 * bf, 2)  # mock Phred-scaled confidence\n\n  sample <- paste(\"./.\", cn, cnq, bf, sep=\"\
        :\")\n\n  paste(chrom, pos, id, ref, alt, qual, filter, info, format, sample, sep=\"\\t\")\n}\n\n# Create VCF body. apply() over a zero-row matrix returns a list, which\n# writeLines cannot consume,\
        \ so a sample with no calls is handled\n# explicitly rather than failing at the write.\nif (nrow(cnvs) > 0) {\n  vcf_body <- apply(cnvs, 1, make_vcf_line)\n} else {\n  message(\"No CNVs called for\
        \ sample \", input.id, \"; writing an empty VCF.\")\n  vcf_body <- character(0)\n}\n\nwrite_vcf(vcf_body)\n"
      volumeMounts:
      - mountPath: /mnt/input/
        name: input-bam
      - mountPath: /mnt/ref/regions/
        name: ref-regions
      - mountPath: /mnt/ref/cohort/
        name: ref-cohort
      - mountPath: /mnt/ref/genome/
        name: ref-fasta
      - mountPath: /mnt/output/vcf/
        name: output-vcf
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''ref-regions''])}}'
        type: Directory
      name: ref-regions
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''ref-cohort''])}}'
        type: Directory
      name: ref-cohort
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''ref-fasta''])}}'
        type: Directory
      name: ref-fasta
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-vcf''])}}'
        type: DirectoryOrCreate
      name: output-vcf
