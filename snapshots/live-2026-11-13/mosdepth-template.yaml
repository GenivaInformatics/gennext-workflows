apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mosdepth-template
  namespace: argo
spec:
  templates:
  - inputs:
      parameters:
      - name: sample-id
      - name: thresholds
        value: 1,5,10,30,50
      - name: input-bam
      - name: regions-bed-f
      - name: output-dir
    name: mosdepth-exome
    outputs:
      parameters:
      - name: output-dir
        value: '{{inputs.parameters.output-dir}}'
    script:
      command:
      - sh
      image: quay.io/biocontainers/mosdepth:0.3.8--hd299d5a_0
      name: mosdepth-exome-script
      source: 'mosdepth \

        -n --fast-mode \

        --by /mnt/input/bed/{{=sprig.osBase(inputs.parameters[''regions-bed-f''])}} \

        --thresholds {{inputs.parameters.thresholds}} \

        {{inputs.parameters.sample-id}} \

        /mnt/input/bam/{{=sprig.osBase(inputs.parameters[''input-bam''])}}

        '
      volumeMounts:
      - mountPath: /mnt/input/bam/
        name: input-bam
      - mountPath: /mnt/output/
        name: output-dir
      - mountPath: /mnt/input/bed/
        name: regions-bed-f
      workingDir: /mnt/output
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''regions-bed-f''])}}'
        type: Directory
      name: regions-bed-f
  - inputs:
      parameters:
      - name: sample-id
      - name: thresholds
        value: 1,5,10,30,50
      - name: input-bam
      - name: output-dir
    name: mosdepth-genome
    outputs:
      parameters:
      - name: output-dir
        value: '{{inputs.parameters.output-dir}}'
    script:
      command:
      - sh
      image: quay.io/biocontainers/mosdepth:0.3.8--hd299d5a_0
      name: mosdepth-genome-script
      source: 'mosdepth \

        -n --fast-mode \

        --by 500 \

        --thresholds {{inputs.parameters.thresholds}} \

        {{inputs.parameters.sample-id}} \

        /mnt/input/bam/{{=sprig.osBase(inputs.parameters[''input-bam''])}}

        '
      volumeMounts:
      - mountPath: /mnt/input/bam/
        name: input-bam
      - mountPath: /mnt/output/
        name: output-dir
      workingDir: /mnt/output
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
  - inputs:
      parameters:
      - name: sample-id
      - name: input-bam
      - name: regions-bed-f
      - name: output-dir
    name: mosdepth
    steps:
    - - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: input-bam
            value: '{{inputs.parameters.input-bam}}'
          - name: output-dir
            value: '{{inputs.parameters.output-dir}}'
        name: mosdepth-genome
        template: mosdepth-genome
        when: '"{{inputs.parameters.regions-bed-f}}" == "."'
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: input-bam
            value: '{{inputs.parameters.input-bam}}'
          - name: regions-bed-f
            value: '{{inputs.parameters.regions-bed-f}}'
          - name: output-dir
            value: '{{inputs.parameters.output-dir}}'
        name: mosdepth-exome
        template: mosdepth-exome
        when: '"{{inputs.parameters.regions-bed-f}}" != "."'
  - inputs:
      parameters:
      - name: sample-id
      - name: input-bam
      - name: regions-bed-f
      - name: output-dir
      - name: node-name
    name: mosdepth-exome-on-node
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    outputs:
      parameters:
      - name: output-dir
        value: '{{inputs.parameters.output-dir}}'
    script:
      command:
      - sh
      image: quay.io/biocontainers/mosdepth:0.3.8--hd299d5a_0
      name: mosdepth-exome-on-node-script
      source: "regionsFile=\"{{=sprig.osBase(inputs.parameters['regions-bed-f'])}}\";\noptions=\"\";\ncat /mnt/input/bed/$regionsFile | head -n5;\n\nif [ -f  \"/mnt/input/bed/$regionsFile\" ]; then\n  echo\
        \ \"found $regionsFile\";\nelse\n  echo \"did not find $regionsFile\";\n  echo \"/mnt/input/bed/$regionsFile\";\nfi\n\nif [ -f  \"/mnt/input/bed/$regionsFile\" ]; then\n  options+=\" --by /mnt/input/bed/$regionsFile\"\
        \nelse\n  options+=\" --by 500\"\n fi;\necho $options;\nmosdepth \\\n-n --fast-mode \\\n$options \\\n{{inputs.parameters.sample-id}} \\\n/mnt/input/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}\n"
      volumeMounts:
      - mountPath: /mnt/input/bam/
        name: input-bam
      - mountPath: /mnt/output/
        name: output-dir
      - mountPath: /mnt/input/bed/
        name: regions-bed-f
      workingDir: /mnt/output
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''regions-bed-f''])}}'
        type: Directory
      name: regions-bed-f
