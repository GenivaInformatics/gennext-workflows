apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: subtract-test
  namespace: argo
spec:
  arguments:
    parameters:
    - name: number-count
  entrypoint: main
  nodeSelector:
    kubernetes.io/hostname: gorillab-02
  templates:
  - inputs:
      parameters:
      - name: number-count
    name: main
    outputs:
      parameters:
      - name: result
        value: '{{=int(inputs.parameters[''number-count'']) - 2}}'
    script:
      args:
      - echo {{inputs.parameters.number-count}} - 2 | bc
      command:
      - sh
      image: alpine:latest
