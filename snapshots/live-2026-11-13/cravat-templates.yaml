apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cravat-templates
  namespace: argo
spec:
  templates:
  - inputs:
      parameters:
      - name: proband-vcf
      - name: ref-version
        value: hg38
      - name: annotators
        value: intervar cadd omim turkish_variome clinvar clinvar_acmg gme clinpred alphamissense gnomad4
      - default: /runspace/gennext/data/modules/
        name: modules-dir
      - name: output-dir
    name: cravat-solo-template
    script:
      command:
      - sh
      image: bergun/gennext-cravat:0.2.11c-alpha-no_mu
      name: cravat-solo
      source: "#!/bin/sh\nfor ext in crg crm crs crv crx err status.json filter_session.json log sqlite gen var; do\n  echo \"$ext\";\n  rm -f ./*.\"$ext\";\ndone;\n\noc run \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}\"\
        \ \\\n-a {{inputs.parameters.annotators}} \\\n-l {{inputs.parameters.ref-version}} \\\n--skip reporter \\\n--temp-files \\\n--cleanrun \\\n-d \"{{inputs.parameters.output-dir}}\"\n"
      volumeMounts:
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}
        name: proband-vcf
      - mountPath: '{{inputs.parameters.output-dir}}'
        name: output-dir
      - mountPath: /opt/open-cravat/cravat/modules
        name: modules-dir
      workingDir: '{{inputs.parameters.output-dir}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.proband-vcf}}'
        type: File
      name: proband-vcf
    - hostPath:
        path: '{{inputs.parameters.modules-dir}}'
        type: Directory
      name: modules-dir
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
  - inputs:
      parameters:
      - name: proband-vcf
      - name: ref-version
        value: hg38
      - name: annotators
        value: intervar cadd omim turkish_variome clinvar clinvar_acmg gme clinpred alphamissense gnomad4
      - default: /runspace/gennext/data/modules/
        name: modules-dir
      - name: output-dir
      - name: node-name
    name: cravat-solo-template-on-node
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    script:
      command:
      - sh
      image: bergun/gennext-cravat:0.2.11c-alpha-no_mu
      name: cravat-solo
      source: "#!/bin/sh\nfor ext in crg crm crs crv crx err status.json filter_session.json log sqlite gen var; do\n  echo \"$ext\";\n  rm -f ./*.\"$ext\";\ndone;\n\noc run \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}\"\
        \ \\\n-a {{inputs.parameters.annotators}} \\\n-l {{inputs.parameters.ref-version}} \\\n--skip reporter \\\n--temp-files \\\n--cleanrun \\\n-d \"{{inputs.parameters.output-dir}}\"\n"
      volumeMounts:
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}
        name: proband-vcf
      - mountPath: '{{inputs.parameters.output-dir}}'
        name: output-dir
      - mountPath: /opt/open-cravat/cravat/modules
        name: modules-dir
      workingDir: '{{inputs.parameters.output-dir}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.proband-vcf}}'
        type: File
      name: proband-vcf
    - hostPath:
        path: '{{inputs.parameters.modules-dir}}'
        type: Directory
      name: modules-dir
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
  - inputs:
      parameters:
      - name: proband-vcf
      - name: case-vcf
      - name: ref-version
      - name: annotators
      - default: /opt/open-cravat/cravat/modules
        name: modules-dir
      - name: output-dir
    name: cravat-duo-template
    script:
      command:
      - sh
      image: bergun/gennext-cravat:0.2.11c-alpha-no_mu
      name: cravat-duo
      source: "#!/bin/sh\nfor ext in crg crm crs crv crx err status.json filter_session.json log sqlite gen var; do\n  echo \"$ext\";\n  rm -f ./*.\"$ext\";\ndone;\n\nmkdir -p {{inputs.parameters.output-dir}}/temp/;\n\
        oc run \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['case-vcf'])}}\" \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}\" \\\n-a {{inputs.parameters.annotators}} \\\n-l {{inputs.parameters.ref-version}}\
        \ \\\n--skip reporter \\\n--temp-files \\\n--cleanrun \\\n-d \"{{inputs.parameters.output-dir}}/temp/\";\npython - <<EOF\nimport os, json\njob_dir = \"{{inputs.parameters.output-dir}}\"\nos.chdir(f\"\
        {job_dir}/temp/\")\nstatus_json = next(filter(lambda x: x.endswith('.status.json'), os.listdir()))\nwith open(status_json, \"r\") as f:\n  status = json.load(f)\ndb_f = os.path.basename(status[\"\
        db_path\"])\nstatus[\"db_path\"] = os.path.join(job_dir, db_f)\nstatus[\"job_dir\"] = job_dir\nstatus[\"id\"] = os.path.basename(os.path.normpath(job_dir))\nwith open(status_json, 'w') as f:\n \
        \ json.dump(status, f)\nEOF\nmv -f {{inputs.parameters.output-dir}}/temp/* {{inputs.parameters.output-dir}};\nrm -rf {{inputs.parameters.output-dir}}/temp/;\n"
      volumeMounts:
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}
        name: proband-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['case-vcf'])}}
        name: case-vcf
      - mountPath: '{{inputs.parameters.output-dir}}'
        name: output-dir
      - mountPath: /opt/open-cravat/cravat/modules
        name: modules-dir
      workingDir: '{{inputs.parameters.output-dir}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.proband-vcf}}'
        type: File
      name: proband-vcf
    - hostPath:
        path: '{{inputs.parameters.case-vcf}}'
        type: File
      name: case-vcf
    - hostPath:
        path: '{{inputs.parameters.modules-dir}}'
        type: Directory
      name: modules-dir
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
  - inputs:
      parameters:
      - name: proband-vcf
      - name: case-vcf
      - name: ref-version
      - name: annotators
      - default: /opt/open-cravat/cravat/modules
        name: modules-dir
      - name: output-dir
      - name: node-name
    name: cravat-duo-template-on-node
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    script:
      command:
      - sh
      image: bergun/gennext-cravat:0.2.11c-alpha-no_mu
      name: cravat-duo
      source: "#!/bin/sh\nfor ext in crg crm crs crv crx err status.json filter_session.json log sqlite gen var; do\n  echo \"$ext\";\n  rm -f ./*.\"$ext\";\ndone;\n\nmkdir -p {{inputs.parameters.output-dir}}/temp/;\n\
        oc run \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['case-vcf'])}}\" \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}\" \\\n-a {{inputs.parameters.annotators}} \\\n-l {{inputs.parameters.ref-version}}\
        \ \\\n--skip reporter \\\n--temp-files \\\n--cleanrun \\\n-d \"{{inputs.parameters.output-dir}}/temp/\";\npython - <<EOF\nimport os, json\njob_dir = \"{{inputs.parameters.output-dir}}\"\nos.chdir(f\"\
        {job_dir}/temp/\")\nstatus_json = next(filter(lambda x: x.endswith('.status.json'), os.listdir()))\nwith open(status_json, \"r\") as f:\n  status = json.load(f)\ndb_f = os.path.basename(status[\"\
        db_path\"])\nstatus[\"db_path\"] = os.path.join(job_dir, db_f)\nstatus[\"job_dir\"] = job_dir\nstatus[\"id\"] = os.path.basename(os.path.normpath(job_dir))\nwith open(status_json, 'w') as f:\n \
        \ json.dump(status, f)\nEOF\nmv -f {{inputs.parameters.output-dir}}/temp/* {{inputs.parameters.output-dir}};\nrm -rf {{inputs.parameters.output-dir}}/temp/;\n"
      volumeMounts:
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}
        name: proband-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['case-vcf'])}}
        name: case-vcf
      - mountPath: '{{inputs.parameters.output-dir}}'
        name: output-dir
      - mountPath: /opt/open-cravat/cravat/modules
        name: modules-dir
      workingDir: '{{inputs.parameters.output-dir}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.proband-vcf}}'
        type: File
      name: proband-vcf
    - hostPath:
        path: '{{inputs.parameters.case-vcf}}'
        type: File
      name: case-vcf
    - hostPath:
        path: '{{inputs.parameters.modules-dir}}'
        type: Directory
      name: modules-dir
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
  - inputs:
      parameters:
      - name: proband-vcf
      - name: mother-vcf
      - name: father-vcf
      - name: ref-version
      - name: annotators
      - default: /opt/open-cravat/cravat/modules
        name: modules-dir
      - name: output-dir
    name: cravat-trio-template
    script:
      command:
      - sh
      image: bergun/gennext-cravat:0.2.11c-alpha-no_mu
      name: cravat-trio
      source: "#!/bin/sh\nfor ext in crg crm crs crv crx err status.json filter_session.json log sqlite gen var; do\n  echo \"$ext\";\n  rm -f ./*.\"$ext\";\ndone;\n\necho 'oc run \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['father-vcf'])}}\"\
        \ \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['mother-vcf'])}}\" \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}\" \\\n-a {{inputs.parameters.annotators}} \\\n-l {{inputs.parameters.ref-version}}\
        \ \\\n--skip reporter \\\n--temp-files \\\n--cleanrun \\\n-d \"{{inputs.parameters.output-dir}}/temp/\";';\n\nmkdir -p {{inputs.parameters.output-dir}}/temp/;\noc run \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['father-vcf'])}}\"\
        \ \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['mother-vcf'])}}\" \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}\" \\\n-a {{inputs.parameters.annotators}} \\\n-l {{inputs.parameters.ref-version}}\
        \ \\\n--skip reporter \\\n--temp-files \\\n--cleanrun \\\n-d \"{{inputs.parameters.output-dir}}/temp/\";\npython - <<EOF\nimport os, json\njob_dir = \"{{inputs.parameters.output-dir}}\"\nos.chdir(f\"\
        {job_dir}/temp/\")\nstatus_json = next(filter(lambda x: x.endswith('.status.json'), os.listdir()))\nwith open(status_json, \"r\") as f:\n  status = json.load(f)\ndb_f = os.path.basename(status[\"\
        db_path\"])\nstatus[\"db_path\"] = os.path.join(job_dir, db_f)\nstatus[\"job_dir\"] = job_dir\nstatus[\"id\"] = os.path.basename(os.path.normpath(job_dir))\nwith open(status_json, 'w') as f:\n \
        \ json.dump(status, f)\nEOF\nmv -f {{inputs.parameters.output-dir}}/temp/* {{inputs.parameters.output-dir}};\nrm -rf {{inputs.parameters.output-dir}}/temp/;\n"
      volumeMounts:
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}
        name: proband-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['mother-vcf'])}}
        name: mother-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['father-vcf'])}}
        name: father-vcf
      - mountPath: '{{inputs.parameters.output-dir}}'
        name: output-dir
      - mountPath: /opt/open-cravat/cravat/modules
        name: modules-dir
      workingDir: '{{inputs.parameters.output-dir}}'
    volumes:
    - hostPath:
        path: '{{inputs.parameters.proband-vcf}}'
        type: File
      name: proband-vcf
    - hostPath:
        path: '{{inputs.parameters.mother-vcf}}'
        type: File
      name: mother-vcf
    - hostPath:
        path: '{{inputs.parameters.father-vcf}}'
        type: File
      name: father-vcf
    - hostPath:
        path: '{{inputs.parameters.modules-dir}}'
        type: Directory
      name: modules-dir
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
  - inputs:
      parameters:
      - name: proband-vcf
      - name: mother-vcf
      - name: father-vcf
      - name: ref-version
      - name: annotators
      - default: /opt/open-cravat/cravat/modules
        name: modules-dir
      - name: output-dir
      - name: node-name
    name: cravat-trio-template-on-node
    nodeSelector:
      kubernetes.io/hostname: '{{inputs.parameters.node-name}}'
    script:
      command:
      - sh
      image: bergun/gennext-cravat:0.2.11c-alpha-no_mu
      name: cravat-trio
      source: "#!/bin/sh\nfor ext in crg crm crs crv crx err status.json filter_session.json log sqlite gen var; do\n  echo \"$ext\";\n  rm -f ./*.\"$ext\";\ndone;\n\nmkdir -p {{inputs.parameters.output-dir}}/temp/;\n\
        oc run \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['father-vcf'])}}\" \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['mother-vcf'])}}\" \\\n\"/mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}\"\
        \ \\\n-a {{inputs.parameters.annotators}} \\\n-l {{inputs.parameters.ref-version}} \\\n--skip reporter \\\n--temp-files \\\n--cleanrun \\\n-d \"{{inputs.parameters.output-dir}}/temp/\";\npython\
        \ - <<EOF\nimport os, json\njob_dir = \"{{inputs.parameters.output-dir}}\"\nos.chdir(f\"{job_dir}/temp/\")\nstatus_json = next(filter(lambda x: x.endswith('.status.json'), os.listdir()))\nwith open(status_json,\
        \ \"r\") as f:\n  status = json.load(f)\ndb_f = os.path.basename(status[\"db_path\"])\nstatus[\"db_path\"] = os.path.join(job_dir, db_f)\nstatus[\"job_dir\"] = job_dir\nstatus[\"id\"] = os.path.basename(os.path.normpath(job_dir))\n\
        with open(status_json, 'w') as f:\n  json.dump(status, f)\nEOF\nmv -f {{inputs.parameters.output-dir}}/temp/* {{inputs.parameters.output-dir}};\nrm -rf {{inputs.parameters.output-dir}}/temp/;\n"
      volumeMounts:
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['proband-vcf'])}}
        name: proband-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['mother-vcf'])}}
        name: mother-vcf
      - mountPath: /mnt/input/{{=sprig.osBase(inputs.parameters['father-vcf'])}}
        name: father-vcf
      - mountPath: '{{inputs.parameters.output-dir}}'
        name: output-dir
      - mountPath: /opt/open-cravat/cravat/modules
        name: modules-dir
      workingDir: '{{inputs.parameters.output-dir}}'
