    - hostPath:
        path: '{{inputs.parameters.proband-vcf}}'
        type: File
      name: proband-vcf
    - hostPath:
        path: '{{inputs.parameters.mother-vcf}}'
        type: File
      name: mother-vcf
    - hostPath:
        path: '{{inputs.parameters.father-vcf}}'
        type: File
      name: father-vcf
    - hostPath:
        path: '{{inputs.parameters.modules-dir}}'
        type: Directory
      name: modules-dir
    - hostPath:
        path: '{{inputs.parameters.output-dir}}'
        type: DirectoryOrCreate
      name: output-dir
