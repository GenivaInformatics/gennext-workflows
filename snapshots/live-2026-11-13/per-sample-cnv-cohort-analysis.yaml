apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: per-sample-cnv-cohort-analysis
  namespace: argo
spec:
  entrypoint: per-sample-cnv-cohort-pipeline
  serviceAccountName: gennext-workflows
  templates:
  - dag:
      tasks:
      - arguments:
          parameters:
          - name: sample-run-data
            value: '{{inputs.parameters.sample-run-data}}'
          - name: ref-paths
            value: '{{inputs.parameters.ref-paths}}'
          - name: assay-regions-file
            value: '{{inputs.parameters.regions-file}}'
          - name: fallback-ref-flat
            value: '{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/gene_annots/refFlat_mane.txt'
        name: resolve-cnv-reference-inputs
        template: resolve-cnv-reference-inputs
      - arguments:
          parameters:
          - name: ref-base-dir
            value: '{{inputs.parameters.ref-base-dir}}'
          - name: ref-version
            value: '{{inputs.parameters.ref-version}}'
          - name: regions-file
            value: '{{tasks.resolve-cnv-reference-inputs.outputs.parameters.regions-file}}'
          - name: ref-genome
            value: '{{=jsonpath(inputs.parameters[''ref-paths''], ''$.genome'')}}'
          - name: ref-flat
            value: '{{tasks.resolve-cnv-reference-inputs.outputs.parameters.ref-flat}}'
          - name: thread-count
            value: '{{inputs.parameters.thread-count}}'
        depends: resolve-cnv-reference-inputs
        name: ensure-kit-reference
        template: ensure-kit-reference
      - arguments:
          parameters:
          - name: ref-base-dir
            value: '{{inputs.parameters.ref-base-dir}}'
          - name: ref-version
            value: '{{inputs.parameters.ref-version}}'
          - name: regions-file
            value: '{{tasks.resolve-cnv-reference-inputs.outputs.parameters.regions-file}}'
          - name: ref-genome
            value: '{{=jsonpath(inputs.parameters[''ref-paths''], ''$.genome'')}}'
          - name: ref-flat
            value: '{{tasks.resolve-cnv-reference-inputs.outputs.parameters.ref-flat}}'
        depends: ensure-kit-reference
        name: validate-kit-reference
        template: validate-kit-reference
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: ref-base-dir
            value: '{{inputs.parameters.ref-base-dir}}'
          - name: ref-version
            value: '{{inputs.parameters.ref-version}}'
          - name: regions-file
            value: '{{tasks.resolve-cnv-reference-inputs.outputs.parameters.regions-file}}'
          - name: input-bam
            value: '{{inputs.parameters.input-bam}}'
          - name: sample-scratch-dir
            value: '{{inputs.parameters.sample-scratch-dir}}'
        depends: validate-kit-reference
        name: cnvkit-coverage
        template: cnvkit-coverage
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: ref-base-dir
            value: '{{inputs.parameters.ref-base-dir}}'
          - name: ref-version
            value: '{{inputs.parameters.ref-version}}'
          - name: regions-file
            value: '{{tasks.resolve-cnv-reference-inputs.outputs.parameters.regions-file}}'
          - name: sample-scratch-dir
            value: '{{inputs.parameters.sample-scratch-dir}}'
          - name: sample-temp-dir
            value: '{{inputs.parameters.sample-temp-dir}}'
          - name: input-vcf
            value: '{{inputs.parameters.input-vcf}}'
          - name: min-bins-per-chrom
            value: '{{inputs.parameters.min-bins-per-chrom}}'
        depends: cnvkit-coverage
        name: cnvkit-analyze
        template: cnvkit-analyze
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: ref-base-dir
            value: '{{inputs.parameters.ref-base-dir}}'
          - name: ref-version
            value: '{{inputs.parameters.ref-version}}'
          - name: regions-file
            value: '{{tasks.resolve-cnv-reference-inputs.outputs.parameters.regions-file}}'
          - name: sample-temp-dir
            value: '{{inputs.parameters.sample-temp-dir}}'
          - name: ref-flat
            value: '{{tasks.resolve-cnv-reference-inputs.outputs.parameters.ref-flat}}'
        depends: cnvkit-analyze
        name: cnvkit-post-process
        template: cnvkit-post-process
      - arguments:
          parameters:
          - name: input-vcf-f
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/{{inputs.parameters.sample-id}}.cnv.filtered.annotated.vcf'
          - name: annotsv-ref-dir
            value: '{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/other/AnnotSV/'
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: ref-version
            value: '{{inputs.parameters.ref-version}}'
          - name: sv-min-size
            value: '20'
          - name: vcf-pass-only
            value: 'true'
          - name: output-annotsv-tsv-f
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/{{inputs.parameters.sample-id}}_CNV_annot.tsv'
        depends: cnvkit-post-process
        name: annotsv
        templateRef:
          name: annotsv-template
          template: annotsv-with-fallback
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: annotsv-tsv
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/{{inputs.parameters.sample-id}}_CNV_annot.tsv'
          - name: annotsv-filtered-out-tsv
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/{{inputs.parameters.sample-id}}_CNV_annot_filtered.tsv'
          - name: annotsv-oncokb-out-tsv
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/{{inputs.parameters.sample-id}}_CNV_oncokb.tsv'
        depends: annotsv
        name: annotsv-to-oncokb
        templateRef:
          name: filter-annotsv-template
          template: annotsv-to-oncokb-format
      - arguments:
          parameters:
          - name: oncokb-sv-in-f
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/{{inputs.parameters.sample-id}}_CNV_oncokb.tsv'
          - name: oncokb-sv-out-f
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/{{inputs.parameters.sample-id}}_CNV_oncokb_annot.tsv'
          - name: tumor-type
            value: '{{inputs.parameters.tumor-type}}'
          - name: regions-file
            value: '{{inputs.parameters.regions-file}}'
        depends: annotsv-to-oncokb
        name: oncokb-cnv
        templateRef:
          name: oncokb-templates
          template: oncokb-sv
      - arguments:
          parameters:
          - name: oncokb-tsv-f
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/{{inputs.parameters.sample-id}}_CNV_oncokb_annot.tsv'
          - name: annotsv-tsv-f
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/{{inputs.parameters.sample-id}}_CNV_annot_filtered.tsv'
          - name: output-duckdb
            value: '{{inputs.parameters.sample-temp-dir}}results/db/{{inputs.parameters.sample-id}}_results.duckdb'
          - name: table-suffix
            value: _cohort
        depends: oncokb-cnv
        name: duckdb-cnv
        templateRef:
          name: duckdb-template
          template: duckdb-cnv
      - arguments:
          parameters:
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: output-cnv-dir
            value: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/'
          - name: output-hrd-dir
            value: '{{inputs.parameters.sample-temp-dir}}metrics/hrd/cohort_results/'
        depends: cnvkit-analyze
        name: scarhrd
        template: scarhrd
        when: '''{{inputs.parameters.run-hrd}}'' == ''true'''
      - arguments:
          parameters:
          - name: run-id
            value: '{{inputs.parameters.run-id}}'
          - name: sample-id
            value: '{{inputs.parameters.sample-id}}'
          - name: hrd-json-f
            value: '{{inputs.parameters.sample-temp-dir}}metrics/hrd/cohort_results/{{inputs.parameters.sample-id}}_hrd.json'
        depends: scarhrd
        name: collect-hrd-data
        templateRef:
          name: collect-somatic-data-templates
          template: collect-hrd-data
        when: '''{{inputs.parameters.run-hrd}}'' == ''true'''
    inputs:
      parameters:
      - name: sample-id
      - name: sample-uuid
      - name: run-id
      - name: sample-temp-dir
      - name: sample-scratch-dir
      - name: tumor-type
      - name: ref-version
      - name: ref-base-dir
      - name: ref-paths
      - name: sample-run-data
      - name: regions-file
      - name: input-bam
      - name: input-vcf
      - name: run-hrd
      - default: '8'
        name: thread-count
      - default: '20'
        name: min-bins-per-chrom
    name: per-sample-cnv-cohort-pipeline
  - inputs:
      parameters:
      - name: sample-run-data
      - name: ref-paths
      - name: assay-regions-file
      - name: fallback-ref-flat
    name: resolve-cnv-reference-inputs
    outputs:
      parameters:
      - name: regions-file
        valueFrom:
          path: /tmp/cnv_regions_file.txt
      - name: ref-flat
        valueFrom:
          path: /tmp/cnv_ref_flat.txt
      - name: design-id
        valueFrom:
          path: /tmp/cnv_design_id.txt
    script:
      command:
      - python
      env:
      - name: SAMPLE_RUN_DATA
        value: '{{inputs.parameters.sample-run-data}}'
      - name: REF_PATHS
        value: '{{inputs.parameters.ref-paths}}'
      - name: ASSAY_REGIONS_FILE
        value: '{{inputs.parameters.assay-regions-file}}'
      - name: FALLBACK_REF_FLAT
        value: '{{inputs.parameters.fallback-ref-flat}}'
      image: python:3.13-alpine
      source: "import json\nimport os\nfrom pathlib import Path\n\nrun_data = json.loads(os.environ[\"SAMPLE_RUN_DATA\"])\nref_paths = json.loads(os.environ[\"REF_PATHS\"])\nassay_regions = os.environ[\"\
        ASSAY_REGIONS_FILE\"]\nsomtest = ref_paths.get(\"somtest\", {})\n\nkit = run_data.get(\"enrichmentKit\") or {}\nif not kit and run_data.get(\"samples\"):\n    kit = run_data[\"samples\"][0].get(\"\
        enrichmentKit\") or {}\n\ncandidates = []\nif isinstance(kit, dict):\n    candidates.extend(\n        str(kit.get(key, \"\"))\n        for key in (\"filename\", \"name\", \"title\")\n        if\
        \ kit.get(key)\n    )\nelif kit:\n    candidates.append(str(kit))\ncandidates.append(Path(assay_regions).name)\n\ndef design_id(value):\n    value = Path(value.split(\",\")[0].strip()).name\n  \
        \  value = value.split(\" - \")[-1]\n    return value.split(\"_\")[0].split(\".\")[0].strip()\n\ndesign = next(\n    (design_id(value) for value in candidates if design_id(value) in somtest),\n\
        \    \"\",\n)\nif not design:\n    design = next(\n        (\n            key\n            for key in somtest\n            if any(key.lower() in value.lower() for value in candidates)\n        ),\n\
        \        \"\",\n    )\nif design:\n    regions = somtest[design].get(\"regions\", {})\n    cnv_bed = regions.get(\"sv-cnv\", \"\")\n    # A pooled reference can be built with a design-specific refFlat.\n\
        \    # Match that file when present; other kits keep the global hg38 default.\n    ref_flat = (\n        somtest[design].get(\"ref-flat\")\n        or ref_paths.get(\"regions\", {}).get(\"ref-flat\"\
        , \"\")\n    )\nelse:\n    # No CNV design for this kit (e.g. an uploaded BED without an\n    # enrichment kit): run CNV on the sample's own validated BED with\n    # the MANE refFlat. ensure-kit-reference\
        \ builds the pooled\n    # reference from the WGS cohort, and validate-kit-reference\n    # rejects a cached reference built from a different BED.\n    cnv_bed = assay_regions\n    ref_flat = os.environ[\"\
        FALLBACK_REF_FLAT\"]\n    design = Path(assay_regions).name.split(\".\")[0]\n    print(\n        \"No canonical somtest CNV design mapping for enrichment kit \"\n        f\"candidates {candidates!r};\
        \ using the sample BED {cnv_bed} \"\n        f\"and refFlat {ref_flat}\"\n    )\nif not cnv_bed:\n    raise RuntimeError(f\"No CNV BED configured for design {design}\")\nif not ref_flat:\n    raise\
        \ RuntimeError(f\"No refFlat configured for CNV design {design}\")\n\n# The validator writes the assay BED in the sample temp directory. When\n# the canonical CNV BED names that same file, use its\
        \ actual output path.\n# Other designs retain their configured CNV BED.\nif Path(cnv_bed).name == Path(assay_regions).name:\n    cnv_bed = assay_regions\n\nPath(\"/tmp/cnv_regions_file.txt\").write_text(cnv_bed)\n\
        Path(\"/tmp/cnv_ref_flat.txt\").write_text(ref_flat)\nPath(\"/tmp/cnv_design_id.txt\").write_text(design)\nprint(f\"CNV design: {design}\")\nprint(f\"CNV BED: {cnv_bed}\")\nprint(f\"refFlat: {ref_flat}\"\
        )\n"
  - container:
      args:
      - ensure-kit
      - --kit-bed=/ref/regions/{{=sprig.osBase(inputs.parameters['regions-file'])}}
      - --cohort-d4=/cohort/cnv_cohort.d4
      - --ref-fa=/ref/genome/{{=sprig.osBase(inputs.parameters['ref-genome'])}}
      - --ref-flat=/ref/refflat/{{=sprig.osBase(inputs.parameters['ref-flat'])}}
      - --kits-dir=/kits
      - --mode=auto
      - --workers={{inputs.parameters.thread-count}}
      image: bergun/gennext-cnv-cohort-builder:0.1.2-wgs
      volumeMounts:
      - mountPath: /cohort/
        name: cohort-dir
        readOnly: true
      - mountPath: /kits/
        name: kits-dir
      - mountPath: /ref/regions/
        name: regions-dir
        readOnly: true
      - mountPath: /ref/genome/
        name: ref-genome-dir
        readOnly: true
      - mountPath: /ref/refflat/
        name: refflat-dir
        readOnly: true
    inputs:
      parameters:
      - name: ref-base-dir
      - name: ref-version
      - name: regions-file
      - name: ref-genome
      - name: ref-flat
      - name: thread-count
    name: ensure-kit-reference
    volumes:
    - hostPath:
        path: '{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/other/cohorts/'
        type: Directory
      name: cohort-dir
    - hostPath:
        path: '{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/other/cnvkit/'
        type: DirectoryOrCreate
      name: kits-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''regions-file''])}}'
        type: Directory
      name: regions-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''ref-genome''])}}'
        type: Directory
      name: ref-genome-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''ref-flat''])}}'
        type: Directory
      name: refflat-dir
  - inputs:
      parameters:
      - name: ref-base-dir
      - name: ref-version
      - name: regions-file
      - name: ref-genome
      - name: ref-flat
    name: validate-kit-reference
    script:
      command:
      - python
      env:
      - name: REGIONS_BASENAME
        value: '{{=sprig.osBase(inputs.parameters[''regions-file''])}}'
      - name: REF_GENOME_BASENAME
        value: '{{=sprig.osBase(inputs.parameters[''ref-genome''])}}'
      - name: REF_FLAT_BASENAME
        value: '{{=sprig.osBase(inputs.parameters[''ref-flat''])}}'
      image: python:3.13-alpine
      source: "import hashlib\nimport json\nimport os\nfrom pathlib import Path\n\nregions_name = os.environ[\"REGIONS_BASENAME\"]\nkit_name = Path(regions_name).stem\nkit_dir = Path(\"/kits\") / kit_name\n\
        bed = Path(\"/ref/regions\") / regions_name\nmetadata_path = kit_dir / \"build.json\"\npooled_reference = kit_dir / \"pooled_reference.cnn\"\n\nif not metadata_path.is_file() or not pooled_reference.is_file():\n\
        \    raise RuntimeError(f\"Incomplete CNVkit reference cache: {kit_dir}\")\n\nmetadata = json.loads(metadata_path.read_text())\nbed_sha256 = hashlib.sha256(bed.read_bytes()).hexdigest()\nchecks\
        \ = {\n    \"kit BED sha256\": (\n        metadata.get(\"kit_bed_sha256\", \"\"),\n        bed_sha256,\n    ),\n    \"reference FASTA\": (\n        Path(metadata.get(\"ref_fa\", \"\")).name,\n \
        \       os.environ[\"REF_GENOME_BASENAME\"],\n    ),\n    \"refFlat\": (\n        Path(metadata.get(\"ref_flat\", \"\")).name,\n        os.environ[\"REF_FLAT_BASENAME\"],\n    ),\n}\nmismatches\
        \ = [\n    f\"{label}: cached={cached!r}, configured={configured!r}\"\n    for label, (cached, configured) in checks.items()\n    if cached != configured\n]\nif mismatches:\n    raise RuntimeError(\n\
        \        \"Stale CNVkit reference cache; archive and rebuild \"\n        f\"{kit_dir}: \" + \"; \".join(mismatches)\n    )\nprint(f\"Validated CNVkit reference cache: {kit_dir}\")\n"
      volumeMounts:
      - mountPath: /kits/
        name: kits-dir
        readOnly: true
      - mountPath: /ref/regions/
        name: regions-dir
        readOnly: true
    volumes:
    - hostPath:
        path: '{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/other/cnvkit/'
        type: Directory
      name: kits-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''regions-file''])}}'
        type: Directory
      name: regions-dir
  - inputs:
      parameters:
      - name: sample-id
      - name: ref-base-dir
      - name: ref-version
      - name: regions-file
      - name: input-bam
      - name: sample-scratch-dir
    name: cnvkit-coverage
    script:
      command:
      - sh
      image: quay.io/biocontainers/cnvkit:0.9.13--pyhdfd78af_0
      source: "set -e\nSAMPLE_ID=\"{{inputs.parameters.sample-id}}\"\nBAM=\"/bam/{{=sprig.osBase(inputs.parameters['input-bam'])}}\"\n# Kit dir keyed by BED basename sans `.bed`. Matches what\n# cnv-cohort-builder\
        \ writes in ensure-kit-reference.\nKIT_DIR=\"/kits/$(basename {{=sprig.osBase(inputs.parameters['regions-file'])}} .bed)\"\nmkdir -p /scratch/cnv/coverage\n\n# Target coverage\ncnvkit.py coverage\
        \ \\\n  \"$BAM\" \\\n  \"$KIT_DIR/targets.bed\" \\\n  -o /scratch/cnv/coverage/${SAMPLE_ID}.targetcoverage.cnn\n\n# Antitarget coverage \u2014 skip if amplicon (empty antitargets.bed)\nif [ -s \"\
        $KIT_DIR/antitargets.bed\" ]; then\n  cnvkit.py coverage \\\n    \"$BAM\" \\\n    \"$KIT_DIR/antitargets.bed\" \\\n    -o /scratch/cnv/coverage/${SAMPLE_ID}.antitargetcoverage.cnn\nelse\n  printf\
        \ 'chromosome\\tstart\\tend\\tgene\\tdepth\\tlog2\\n' \\\n    > /scratch/cnv/coverage/${SAMPLE_ID}.antitargetcoverage.cnn\nfi\n"
      volumeMounts:
      - mountPath: /kits/
        name: kits-dir
        readOnly: true
      - mountPath: /bam/
        name: bam-dir
        readOnly: true
      - mountPath: /scratch/
        name: scratch
    volumes:
    - hostPath:
        path: '{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/other/cnvkit/'
        type: DirectoryOrCreate
      name: kits-dir
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: bam-dir
    - hostPath:
        path: '{{inputs.parameters.sample-scratch-dir}}'
        type: Directory
      name: scratch
  - inputs:
      parameters:
      - name: sample-id
      - name: ref-base-dir
      - name: ref-version
      - name: regions-file
      - name: sample-scratch-dir
      - name: sample-temp-dir
      - name: input-vcf
      - name: min-bins-per-chrom
    name: cnvkit-analyze
    script:
      command:
      - sh
      image: quay.io/biocontainers/cnvkit:0.9.13--pyhdfd78af_0
      source: "set -e\nSAMPLE_ID=\"{{inputs.parameters.sample-id}}\"\nVCF=\"/vcf/{{=sprig.osBase(inputs.parameters['input-vcf'])}}\"\nKIT_DIR=\"/kits/$(basename {{=sprig.osBase(inputs.parameters['regions-file'])}}\
        \ .bed)\"\nMIN_BINS=\"{{inputs.parameters.min-bins-per-chrom}}\"\nmkdir -p /output\n\n# Fix (normalise) coverage against pooled reference. CNVkit 0.9.13\n# doesn't support --drop-low-coverage on\
        \ fix (the flag applies to\n# segment/call/genemetrics, where the actual filtering matters);\n# low-coverage bins are still emitted to .cnr with log2=-20 sentinel\n# but get excluded downstream\
        \ by the --drop-low-coverage on segment.\nEDGE_FLAG=\"\"\nif [ -f \"$KIT_DIR/cnv-mode.txt\" ] && [ \"$(cat \"$KIT_DIR/cnv-mode.txt\")\" = wgs ]; then\n  EDGE_FLAG=\"--no-edge\"\nfi\ncnvkit.py fix\
        \ $EDGE_FLAG \\\n  /scratch/cnv/coverage/${SAMPLE_ID}.targetcoverage.cnn \\\n  /scratch/cnv/coverage/${SAMPLE_ID}.antitargetcoverage.cnn \\\n  \"$KIT_DIR/pooled_reference.cnn\" \\\n  -o /output/${SAMPLE_ID}.cnr\n\
        \n# Compute per-chromosome bin counts from the .cnr (which already\n# reflects fix's GC/density bin pruning, so it's the right source\n# of truth). Split into passing_chroms.txt (n >= MIN_BINS)\
        \ and\n# dropped_chroms.tsv (audit trail for QC bundle).\nawk -v MIN=\"$MIN_BINS\" '\n  NR == 1 { next }\n  { n[$1]++ }\n  END {\n    for (c in n) {\n      if (n[c] >= MIN) print c > \"/output/'\"\
        ${SAMPLE_ID}\"'.passing_chroms.txt\"\n      else printf \"%s\\t%d\\tbelow_min_bins_%s\\n\", c, n[c], MIN > \"/output/'\"${SAMPLE_ID}\"'.dropped_chroms.tsv\"\n    }\n  }\n' /output/${SAMPLE_ID}.cnr\n\
        touch /output/${SAMPLE_ID}.passing_chroms.txt /output/${SAMPLE_ID}.dropped_chroms.tsv\necho \"passing chroms ($(wc -l < /output/${SAMPLE_ID}.passing_chroms.txt)):\"\ncat /output/${SAMPLE_ID}.passing_chroms.txt\n\
        echo \"dropped chroms ($(wc -l < /output/${SAMPLE_ID}.dropped_chroms.tsv)):\"\ncat /output/${SAMPLE_ID}.dropped_chroms.tsv\n\n# `--smooth-cbs` is hybrid-only: DNAcopy's smooth.CNA computes a\n#\
        \ per-chromosome SD, which is NA for any chrom with 1 bin, and\n# propagates as Fortran \"NA/NaN/Inf in foreign function call\".\n# Amplicon panels (empty antitargets.bed) routinely include such\n\
        # chroms for identity/QC markers, so gate the flag on antitarget\n# presence \u2014 non-empty antitargets \u21D2 hybrid panel \u21D2 smooth safely.\nif [ -s \"$KIT_DIR/antitargets.bed\" ]; then\n\
        \  SMOOTH_FLAG=\"--smooth-cbs\"\n  echo \"panel mode: hybrid (smoothing enabled)\"\nelse\n  SMOOTH_FLAG=\"\"\n  echo \"panel mode: amplicon (smoothing disabled)\"\nfi\n\n# Segment via CBS. Smoothing\
        \ gated above for tumor robustness on\n# hybrid panels; the bundled pomegranate is too old for hmm-*.\ncnvkit.py segment \\\n  --method cbs \\\n  $SMOOTH_FLAG \\\n  --drop-low-coverage \\\n  /output/${SAMPLE_ID}.cnr\
        \ \\\n  -o /output/${SAMPLE_ID}.cns\n\n# cnvkit's -v expects germline HETEROZYGOUS SNPs: their BAF sits at ~0.5,\n# and drift away from it is the allele-imbalance signal that produces\n# cn1/cn2.\
        \ What we pass is the vLoD *somatic* call set, which is the\n# wrong population. cnvkit's own heterozygous() filter reads zygosity\n# from GT, and Mutect2 in tumour-only mode emits 0/1 for every\
        \ call\n# (observed at AF 0.994), so that filter is a no-op: homozygous\n# germline and low-VAF somatic calls both reach the BAF. cnvkit then\n# mirrors BAF about 0.5, so 0.03 and 0.97 both collapse\
        \ to ~0,\n# upper_baf approaches 1, cn2 rounds to 0, and the genome reads as\n# near-universal LOH. Measured across nine TSO500 samples: 80-98% of\n# segments called LOH, median segment BAF 0.025-0.167.\n\
        #\n# Selecting PASS sites with 0.25 <= VAF <= 0.75 restores it: median\n# segment BAF 0.395-0.601, LOH-called segments 32-52%.\nHET_VCF=\"/output/${SAMPLE_ID}.het.vcf\"\ncase \"$VCF\" in *.gz) READ_VCF=\"\
        gzip -dc\";; *) READ_VCF=\"cat\";; esac\n$READ_VCF \"$VCF\" | awk -F'\\t' -v OFS='\\t' '\n  /^#/ { print; next }\n  $7 != \"PASS\" { next }\n  {\n    split($9, k, \":\"); split($10, v, \":\"); af\
        \ = \"\"\n    for (i in k) if (k[i] == \"AF\") { split(v[i], a, \",\"); af = a[1] }\n    if (af == \"\") next\n    if (af + 0 >= 0.25 && af + 0 <= 0.75) print\n  }' > \"$HET_VCF\"\nN_HET=$(grep\
        \ -vc '^#' \"$HET_VCF\" || true)\necho \"BAF sites after germline-heterozygote selection: $N_HET\"\n# Deliberately no fallback to the unfiltered VCF: too few het sites\n# means there is no allelic\
        \ information, and scarhrd-cli's\n# --unsupported-segments balanced handles the resulting empty BAF\n# honestly. Falling back would reinstate the artefact.\nif [ \"$N_HET\" -lt 50 ]; then\n  echo\
        \ \"WARN: only $N_HET heterozygous BAF sites; allele-specific copy number will be sparse\" >&2\nfi\n\n# Call with BAF from the germline-heterozygote subset.\ncnvkit.py call \\\n  --drop-low-coverage\
        \ \\\n  /output/${SAMPLE_ID}.cns \\\n  -v \"$HET_VCF\" \\\n  -i ${SAMPLE_ID} \\\n  --ploidy 2 \\\n  --method threshold \\\n  -o /output/${SAMPLE_ID}.call.cns\n\n# Filter .cns and .call.cns to passing\
        \ chroms only. Done after\n# call (not before segment) so CBS still sees the whole genome\n# for boundary detection. Header (NR==FNR's first row of cns) is\n# always retained; .cnr is left unfiltered\
        \ so scatter/genemetrics\n# can still show underpowered chroms for visual QC review.\nfor F in /output/${SAMPLE_ID}.cns /output/${SAMPLE_ID}.call.cns; do\n  awk 'NR==FNR { ok[$1]=1; next } FNR==1\
        \ || ok[$1]' \\\n    /output/${SAMPLE_ID}.passing_chroms.txt \"$F\" > \"$F.filt\"\n  mv \"$F.filt\" \"$F\"\ndone\n\n# Scatter plot with BAF track. Uses full .cnr + filtered .call.cns\n# so underpowered\
        \ chroms are still visible as raw bins (helpful\n# for QC review) but no spurious segment lines are drawn over\n# them.\ncnvkit.py scatter \\\n  /output/${SAMPLE_ID}.cnr \\\n  -s /output/${SAMPLE_ID}.call.cns\
        \ \\\n  -v \"$HET_VCF\" \\\n  -o /output/${SAMPLE_ID}-scatter.png\n\n# Export to VCF from filtered .call.cns; downstream AnnotSV / OncoKB /\n# DuckDB inherit the chromosome filter via this VCF.\
        \ Must be .call.cns\n# (integer cn calls), not .cns: exporting from .cns loses every CNV\n# because cnvkit re-derives copy number by naive ploidy rounding of the\n# modest log2 values, collapsing\
        \ all segments to neutral \u2192 empty VCF.\ncnvkit.py export vcf \\\n  /output/${SAMPLE_ID}.call.cns \\\n  --cnr /output/${SAMPLE_ID}.cnr \\\n  -i ${SAMPLE_ID} \\\n  -o /output/${SAMPLE_ID}.cnv.vcf\n\
        \n# Per-gene log2/fold summary, computed straight off .cnr so it's\n# robust to segmentation choices (catches focal oncogenic events\n# that get diluted into broader segments). Mirrors cnv-ref-dataset's\n\
        # call_cnv.py step [8]; non-fatal so a genemetrics failure doesn't\n# tank an otherwise-good run. Thresholds: log2 >= 0.3 (~|fold|>1.23),\n# min 1 probe per gene (include all annotated bins). Runs\
        \ on the\n# unfiltered .cnr \u2014 per-gene log2 is honest about its own n_bins,\n# so a 1-bin \"gene\" summary is fine here even though it'd be a\n# misleading segment.\ncnvkit.py genemetrics \\\
        \n  --drop-low-coverage \\\n  /output/${SAMPLE_ID}.cnr \\\n  -t 0.3 \\\n  -m 1 \\\n  -o /output/${SAMPLE_ID}.genemetrics.tsv \\\n  || echo \"genemetrics failed (non-fatal)\" >&2\n"
      volumeMounts:
      - mountPath: /kits/
        name: kits-dir
        readOnly: true
      - mountPath: /scratch/
        name: scratch
        readOnly: true
      - mountPath: /output/
        name: output-cnv
      - mountPath: /vcf/
        name: vcf-dir
        readOnly: true
    volumes:
    - hostPath:
        path: '{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/other/cnvkit/'
        type: DirectoryOrCreate
      name: kits-dir
    - hostPath:
        path: '{{inputs.parameters.sample-scratch-dir}}'
        type: Directory
      name: scratch
    - hostPath:
        path: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/'
        type: DirectoryOrCreate
      name: output-cnv
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-vcf''])}}'
        type: Directory
      name: vcf-dir
  - container:
      args:
      - batch-post-process
      - --vcf=/output/{{inputs.parameters.sample-id}}.cnv.vcf
      - --reference=/kits/{{=sprig.trimSuffix(".bed", sprig.osBase(inputs.parameters['regions-file']))}}/pooled_reference.cnn
      - --refflat=/refflat/{{=sprig.osBase(inputs.parameters['ref-flat'])}}
      - --output-dir=/output/
      - --sample-id={{inputs.parameters.sample-id}}
      - --sigma-source=spread
      - --verbose
      image: bergun/gennext-cnv-analysis:0.4.0
      volumeMounts:
      - mountPath: /kits/
        name: kits-dir
        readOnly: true
      - mountPath: /output/
        name: output-cnv
      - mountPath: /refflat/
        name: refflat-dir
        readOnly: true
    inputs:
      parameters:
      - name: sample-id
      - name: ref-base-dir
      - name: ref-version
      - name: regions-file
      - name: sample-temp-dir
      - name: ref-flat
    name: cnvkit-post-process
    volumes:
    - hostPath:
        path: '{{inputs.parameters.ref-base-dir}}{{inputs.parameters.ref-version}}/other/cnvkit/'
        type: DirectoryOrCreate
      name: kits-dir
    - hostPath:
        path: '{{inputs.parameters.sample-temp-dir}}results/cnv/cohort_results/'
        type: DirectoryOrCreate
      name: output-cnv
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''ref-flat''])}}'
        type: Directory
      name: refflat-dir
  - inputs:
      parameters:
      - name: sample-id
      - name: output-cnv-dir
      - name: output-hrd-dir
    name: scarhrd
    script:
      args:
      - "set -euo pipefail\nmkdir -p /mnt/hrd-output\n\nSAMPLE_ID=\"{{inputs.parameters.sample-id}}\"\nCNS=\"/mnt/output/${SAMPLE_ID}.call.cns\"\nHRD_JSON=\"/mnt/hrd-output/${SAMPLE_ID}_hrd.json\"\n\n#\
        \ scarHRD needs allele-specific copy numbers (cn1/cn2). cnvkit only\n# emits those when there are enough reads/variants to call BAF; a\n# near-empty sample yields a plain call.cns without them.\
        \ In that\n# case emit a zero-filled fallback so collect-hrd-data still runs\n# and the sample completes instead of failing the whole workflow.\nif [[ ! -s \"$CNS\" ]] || ! head -n1 \"$CNS\" | grep\
        \ -qw cn1 || ! head -n1 \"$CNS\" | grep -qw cn2; then\n    echo \"WARN: ${CNS} lacks cn1/cn2 (insufficient reads for allele-specific CN). Writing zero-filled HRD fallback.\" >&2\n    cat > \"$HRD_JSON\"\
        \ <<EOF\n{\"HRD\": 0, \"Telomeric_AI\": 0, \"LST\": 0, \"HRD_sum\": 0}\nEOF\n    exit 0\nfi\n\nscarhrd-cli \\\n    --input \"$CNS\" \\\n    --sample-id \"$SAMPLE_ID\" \\\n    --sequenza-output \"\
        /mnt/hrd-output/${SAMPLE_ID}_sequenza.txt\" \\\n    --hrd-tsv-output \"/mnt/hrd-output/${SAMPLE_ID}_hrd.tsv\" \\\n    --hrd-json-output \"$HRD_JSON\"\n"
      command:
      - bash
      - -euo
      - pipefail
      - -c
      image: bergun/gennext-scarhrd-cli:0.1.0
      resources:
        requests:
          cpu: '1'
          memory: 2Gi
      securityContext:
        runAsUser: 0
      volumeMounts:
      - mountPath: /mnt/output
        name: output-cnv
        readOnly: true
      - mountPath: /mnt/hrd-output
        name: hrd-output
    volumes:
    - hostPath:
        path: '{{inputs.parameters.output-cnv-dir}}'
        type: Directory
      name: output-cnv
    - hostPath:
        path: '{{inputs.parameters.output-hrd-dir}}'
        type: DirectoryOrCreate
      name: hrd-output
