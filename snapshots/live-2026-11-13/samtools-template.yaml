apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: samtools-template
  namespace: argo
spec:
  templates:
  - inputs:
      parameters:
      - name: input-bam
      - name: thread-count
    name: samtools-index
    script:
      command:
      - sh
      image: quay.io/biocontainers/samtools:1.18--h50ea8bc_1
      name: samtools-index-script
      source: 'samtools index \

        -@{{inputs.parameters.thread-count}} \

        /mnt/input/bam/{{=sprig.osBase(inputs.parameters[''input-bam''])}}

        '
      volumeMounts:
      - mountPath: /mnt/input/bam/
        name: input-bam
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
  - inputs:
      parameters:
      - name: input-bam
      - name: output-bam
      - name: thread-count
    name: samtools-sort-index
    outputs:
      parameters:
      - name: output-bam
        value: '{{inputs.parameters.output-bam}}'
    script:
      command:
      - sh
      image: quay.io/biocontainers/samtools:1.18--h50ea8bc_1
      name: samtools-sort-index-script
      source: 'samtools sort \

        -@{{inputs.parameters.thread-count}} \

        /mnt/input/bam/{{=sprig.osBase(inputs.parameters[''input-bam''])}} \

        -o /mnt/output/bam/{{=sprig.osBase(inputs.parameters[''output-bam''])}};

        samtools index \

        -@{{inputs.parameters.thread-count}} \

        /mnt/output/bam/{{=sprig.osBase(inputs.parameters[''output-bam''])}}

        '
      volumeMounts:
      - mountPath: /mnt/input/bam/
        name: input-bam
      - mountPath: /mnt/output/bam/
        name: output-bam
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-bam''])}}'
        type: DirectoryOrCreate
      name: output-bam
  - inputs:
      parameters:
      - name: input-bam
      - name: output-bam
      - name: thread-count
    name: samtools-remove-orphans-sort-index
    outputs:
      parameters:
      - name: output-bam
        value: '{{inputs.parameters.output-bam}}'
    script:
      command:
      - sh
      image: quay.io/biocontainers/samtools:1.18--h50ea8bc_1
      name: samtools-remove-orphans-sort-index-script
      source: 'samtools view -b -f 2 /mnt/input/bam/{{=sprig .osBase(inputs.parameters[''input-bam''])}} |

        samtools sort \

        -@{{inputs.parameters.thread-count}} \

        -o /mnt/output/bam/{{=sprig.osBase(inputs.parameters[''output-bam''])}};

        samtools index \

        -@{{inputs.parameters.thread-count}} \

        /mnt/output/bam/{{=sprig.osBase(inputs.parameters[''output-bam''])}}

        '
      volumeMounts:
      - mountPath: /mnt/input/bam/
        name: input-bam
      - mountPath: /mnt/output/bam/
        name: output-bam
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-bam''])}}'
        type: DirectoryOrCreate
      name: output-bam
  - inputs:
      parameters:
      - name: input-bam
      - name: output-bam
      - name: thread-count
    name: samtools-readname-sort
    outputs:
      parameters:
      - name: output-bam
        value: '{{inputs.parameters.output-bam}}'
    script:
      command:
      - sh
      image: quay.io/biocontainers/samtools:1.18--h50ea8bc_1
      name: samtools-readname-sort-script
      source: 'samtools sort \

        -n \

        -@{{inputs.parameters.thread-count}} \

        /mnt/input/bam/{{=sprig.osBase(inputs.parameters[''input-bam''])}} \

        -o /mnt/output/bam/{{=sprig.osBase(inputs.parameters[''output-bam''])}}

        '
      volumeMounts:
      - mountPath: /mnt/input/bam/
        name: input-bam
      - mountPath: /mnt/output/bam/
        name: output-bam
    volumes:
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''input-bam''])}}'
        type: Directory
      name: input-bam
    - hostPath:
        path: '{{=sprig.osDir(inputs.parameters[''output-bam''])}}'
        type: DirectoryOrCreate
      name: output-bam
