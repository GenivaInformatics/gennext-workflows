      source: ".open \"/mnt/output/{{=sprig.osBase(inputs.parameters['output-duckdb'])}}\"\nCREATE OR REPLACE TABLE oncokb_cnv{{inputs.parameters.table-suffix}} AS FROM read_csv_auto('/mnt/input/oncokb/oncokb_cnv.tsv',\
        \ sample_size=-1, header=True, sep='\\t');\nCREATE OR REPLACE TABLE annotsv_cnv{{inputs.parameters.table-suffix}} AS FROM read_csv_auto('/mnt/input/annotsv/annotsv_cnv.tsv', sample_size=-1, header=True,\
        \ sep='\\t');\nDROP VIEW IF EXISTS combined_cnv{{inputs.parameters.table-suffix}};\nDROP TABLE IF EXISTS combined_cnv{{inputs.parameters.table-suffix}};\nCREATE OR REPLACE VIEW combined_cnv{{inputs.parameters.table-suffix}}\
        \ AS\nWITH annotsv_ordered_cnv AS (\n    SELECT\n        ROW_NUMBER() OVER () AS row_id,  -- Create incrementing unique ID\n        annotsv_cnv{{inputs.parameters.table-suffix}}.SV_chrom,\n    \
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.SV_start,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.SV_end,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.SV_length,\n  \
        \      annotsv_cnv{{inputs.parameters.table-suffix}}.SV_type,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.REF,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.ALT,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.INFO,\n\
        \        annotsv_cnv{{inputs.parameters.table-suffix}}.Paired_Reads,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.CytoBand,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.Gene_name,\n\
        \        annotsv_cnv{{inputs.parameters.table-suffix}}.Annotation_mode,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.Tx,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.Tx_start,\n\
        \        annotsv_cnv{{inputs.parameters.table-suffix}}.Tx_end,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.Overlapped_CDS_length,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.Overlapped_CDS_percent,\n\
        \        CAST(annotsv_cnv{{inputs.parameters.table-suffix}}.OMIM_ID AS VARCHAR) AS OMIM_ID,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.OMIM_phenotype,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.OMIM_inheritance,\n\
        \        annotsv_cnv{{inputs.parameters.table-suffix}}.GnomAD_pLI,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.ExAC_pLI,\n        annotsv_cnv{{inputs.parameters.table-suffix}}.ACMG_class,\n\
        \        annotsv_cnv{{inputs.parameters.table-suffix}}.AnnotSV_ID\n    FROM\n        annotsv_cnv{{inputs.parameters.table-suffix}}\n)\nSELECT\n    annotsv_ordered_cnv.Annotation_mode,\n    annotsv_ordered_cnv.SV_chrom,\n\
        \    annotsv_ordered_cnv.SV_start,\n    annotsv_ordered_cnv.SV_end,\n    annotsv_ordered_cnv.SV_length,\n    annotsv_ordered_cnv.SV_type,\n    annotsv_ordered_cnv.REF,\n    annotsv_ordered_cnv.ALT,\n\
        \    annotsv_ordered_cnv.INFO,\n    -- Extract FOLD_CHANGE value from INFO column\n    CASE\n        WHEN annotsv_ordered_cnv.INFO LIKE '%FOLD_CHANGE=%'\n        THEN TRY_CAST(SPLIT_PART(SPLIT_PART(annotsv_ordered_cnv.INFO,\
        \ 'FOLD_CHANGE=', 2), ';', 1) AS FLOAT)\n        ELSE NULL\n    END AS FOLD_CHANGE,\n    -- Extract FOLD_CHANGE_LOG value from INFO column\n    CASE\n        WHEN annotsv_ordered_cnv.INFO LIKE '%FOLD_CHANGE_LOG=%'\n\
        \        THEN TRY_CAST(SPLIT_PART(SPLIT_PART(annotsv_ordered_cnv.INFO, 'FOLD_CHANGE_LOG=', 2), ';', 1) AS FLOAT)\n        ELSE NULL\n    END AS FOLD_CHANGE_LOG,\n    -- Extract PROBES value from\
        \ INFO column\n    CASE\n        WHEN annotsv_ordered_cnv.INFO LIKE '%PROBES=%'\n        THEN TRY_CAST(SPLIT_PART(SPLIT_PART(annotsv_ordered_cnv.INFO, 'PROBES=', 2), ';', 1) AS INTEGER)\n      \
        \  ELSE NULL\n    END AS PROBES,\n    -- Extract SIGMA_LEVEL value from INFO column (only present when FILTER=PASS)\n    CASE\n        WHEN annotsv_ordered_cnv.INFO LIKE '%SIGMA_LEVEL=%'\n     \
        \   THEN TRY_CAST(SPLIT_PART(SPLIT_PART(annotsv_ordered_cnv.INFO, 'SIGMA_LEVEL=', 2), ';', 1) AS INTEGER)\n        ELSE NULL\n    END AS SIGMA_LEVEL,\n    annotsv_ordered_cnv.Paired_Reads,\n   \
        \ annotsv_ordered_cnv.CytoBand,\n    annotsv_ordered_cnv.Gene_name,\n    annotsv_ordered_cnv.Tx,\n    annotsv_ordered_cnv.Tx_start,\n    annotsv_ordered_cnv.Tx_end,\n    annotsv_ordered_cnv.Overlapped_CDS_length,\n\
        \    annotsv_ordered_cnv.Overlapped_CDS_percent,\n    annotsv_ordered_cnv.OMIM_ID,\n    annotsv_ordered_cnv.OMIM_phenotype,\n    annotsv_ordered_cnv.OMIM_inheritance,\n    annotsv_ordered_cnv.GnomAD_pLI,\n\
        \    annotsv_ordered_cnv.ExAC_pLI,\n    annotsv_ordered_cnv.ACMG_class,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.Sv_Type AS \"ONCOKB_SV_TYPE\",\n    oncokb_cnv{{inputs.parameters.table-suffix}}.GeneA\
        \ AS \"ONCOKB_GENE\",\n    oncokb_cnv{{inputs.parameters.table-suffix}}.MUTATION_EFFECT,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.MUTATION_EFFECT_CITATIONS,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.ONCOGENIC,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.GENE_IN_ONCOKB,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.VARIANT_IN_ONCOKB,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_1,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_2,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_3A,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_3B,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_4,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_R1,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_R2,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.HIGHEST_LEVEL,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.HIGHEST_SENSITIVE_LEVEL,\n\
