        \    annotsv_cnv{{inputs.parameters.table-suffix}}.B_ins_source,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.B_ins_coord,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.B_inv_source,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.B_inv_coord,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.B_inv_AFmax,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.po_B_gain_allG_source,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.po_B_gain_allG_coord,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.po_B_gain_someG_coord,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.po_B_loss_allG_source,\n\
