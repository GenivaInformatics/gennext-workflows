        \    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Dx2,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Dx3,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.HIGHEST_DX_LEVEL,\n  \
        \  CAST(oncokb_cnv{{inputs.parameters.table-suffix}}.DX_CITATIONS AS VARCHAR) AS DX_CITATIONS,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Px1,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Px2,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Px3,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.HIGHEST_PX_LEVEL,\n    CAST(oncokb_cnv{{inputs.parameters.table-suffix}}.PX_CITATIONS\
        \ AS VARCHAR) AS PX_CITATIONS\nFROM\n    annotsv_ordered_cnv\nLEFT JOIN oncokb_cnv{{inputs.parameters.table-suffix}} ON annotsv_ordered_cnv.AnnotSV_ID = oncokb_cnv{{inputs.parameters.table-suffix}}.AnnotSV_ID\n\
        AND annotsv_ordered_cnv.Gene_name = oncokb_cnv{{inputs.parameters.table-suffix}}.GeneA\nORDER BY annotsv_ordered_cnv.row_id;  -- Reorder using the original row order;\nCREATE OR REPLACE VIEW advanced_combined_cnv{{inputs.parameters.table-suffix}}\
        \ AS\nSELECT\n    annotsv_cnv{{inputs.parameters.table-suffix}}.SV_chrom,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.SV_start,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.SV_end,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.SV_length,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.SV_type,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Paired_Reads,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Split_Reads,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.Samples_ID,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.ID,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.REF,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.ALT,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.QUAL,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.FILTER,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.INFO,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.FORMAT,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.SAMPLE_DATA,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Annotation_mode,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.CytoBand,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.Gene_name,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Gene_count,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Tx,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Tx_start,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.Tx_end,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Overlapped_tx_length,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Overlapped_CDS_length,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.Overlapped_CDS_percent,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Frameshift,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Exon_count,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.Location,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Location2,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Dist_nearest_SS,\n \
        \   annotsv_cnv{{inputs.parameters.table-suffix}}.Intersect_start,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Intersect_end,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.RE_gene,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.P_gain_phen,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.P_gain_hpo,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.P_gain_source,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.P_gain_coord,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.P_loss_phen,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.P_loss_hpo,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.P_loss_source,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.P_loss_coord,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.P_ins_phen,\n\
