        \    annotsv_cnv{{inputs.parameters.table-suffix}}.po_P_gain_coord,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.po_P_gain_percent,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.po_P_loss_phen,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.po_P_loss_hpo,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.po_P_loss_source,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.po_P_loss_coord,\n\
