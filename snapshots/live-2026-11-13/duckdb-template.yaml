        \    annotsv_cnv{{inputs.parameters.table-suffix}}.TAD_coordinate,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.ENCODE_experiment,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.GC_content_left,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.GC_content_right,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Repeat_coord_left,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Repeat_type_left,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.Repeat_coord_right,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Repeat_type_right,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Gap_left,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.Gap_right,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.SegDup_left,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.SegDup_right,\n \
        \   annotsv_cnv{{inputs.parameters.table-suffix}}.ENCODE_blacklist_left,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.ENCODE_blacklist_characteristics_left,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.ENCODE_blacklist_right,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.ENCODE_blacklist_characteristics_right,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.ACMG,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.HI,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.TS,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.DDD_HI_percent,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.DDD_status,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.DDD_mode,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.DDD_consequence,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.DDD_disease,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.DDD_pmid,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.ExAC_delZ,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.ExAC_dupZ,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.ExAC_cnvZ,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.ExAC_synZ,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.ExAC_misZ,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.GenCC_disease,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.GenCC_moi,\n  \
        \  annotsv_cnv{{inputs.parameters.table-suffix}}.GenCC_classification,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.GenCC_pmid,\n    CAST(annotsv_cnv{{inputs.parameters.table-suffix}}.OMIM_ID\
        \ AS VARCHAR) AS OMIM_ID,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.OMIM_phenotype,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.OMIM_inheritance,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.OMIM_morbid,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.OMIM_morbid_candidate,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.LOEUF_bin,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.GnomAD_pLI,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.ExAC_pLI,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.AnnotSV_ranking_score,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.AnnotSV_ranking_criteria,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.ACMG_class,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Split_Reads_Mates,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.Nearest_SS_type,\n\
        \    annotsv_cnv{{inputs.parameters.table-suffix}}.B_ins_AFmax,\n    annotsv_cnv{{inputs.parameters.table-suffix}}.po_B_gain_someG_source,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.GeneA\
        \ AS \"ONCOKB_GENE\",\n    oncokb_cnv{{inputs.parameters.table-suffix}}.Sv_Type AS \"ONCOKB_SV_TYPE\",\n    oncokb_cnv{{inputs.parameters.table-suffix}}.ANNOTATED,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.GENE_IN_ONCOKB,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.VARIANT_IN_ONCOKB,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.MUTATION_EFFECT,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.MUTATION_EFFECT_CITATIONS,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.ONCOGENIC,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_1,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_2,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_3A,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_3B,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_4,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_R1,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_R2,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.HIGHEST_LEVEL,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.HIGHEST_SENSITIVE_LEVEL,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.HIGHEST_RESISTANCE_LEVEL,\n\
        \    CAST(oncokb_cnv{{inputs.parameters.table-suffix}}.TX_CITATIONS AS VARCHAR) AS TX_CITATIONS,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Dx1,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Dx2,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Dx3,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.HIGHEST_DX_LEVEL,\n    CAST(oncokb_cnv{{inputs.parameters.table-suffix}}.DX_CITATIONS\
        \ AS VARCHAR) AS DX_CITATIONS,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Px1,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Px2,\n    oncokb_cnv{{inputs.parameters.table-suffix}}.LEVEL_Px3,\n\
        \    oncokb_cnv{{inputs.parameters.table-suffix}}.HIGHEST_PX_LEVEL,\n    CAST(oncokb_cnv{{inputs.parameters.table-suffix}}.PX_CITATIONS AS VARCHAR) AS PX_CITATIONS,\nFROM annotsv_cnv{{inputs.parameters.table-suffix}}\n\
        JOIN oncokb_cnv{{inputs.parameters.table-suffix}} ON annotsv_cnv{{inputs.parameters.table-suffix}}.AnnotSV_ID = oncokb_cnv{{inputs.parameters.table-suffix}}.AnnotSV_ID;\n.exit\n"
