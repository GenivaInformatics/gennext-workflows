        t');\nCREATE TABLE annotsv_sv AS FROM read_csv_auto('/mnt/input/annotsv/annotsv_sv.tsv', sample_size=-1, header=True, sep='\\t');\nDROP VIEW IF EXISTS combined_sv;\nDROP TABLE IF EXISTS combined_sv;\n\
        CREATE OR REPLACE VIEW combined_sv AS\nWITH annotsv_ordered AS (\n    SELECT\n        ROW_NUMBER() OVER () AS row_id,  -- Create incrementing unique ID\n        annotsv_sv.SV_chrom,\n        annotsv_sv.SV_start,\n\
        \        annotsv_sv.SV_end,\n        annotsv_sv.SV_length,\n        annotsv_sv.SV_type,\n        annotsv_sv.REF,\n        annotsv_sv.ALT,\n        annotsv_sv.Paired_Reads,\n        annotsv_sv.CytoBand,\n\
        \        annotsv_sv.Gene_name,\n        annotsv_sv.Annotation_mode,\n        annotsv_sv.Tx,\n        annotsv_sv.Tx_start,\n        annotsv_sv.Tx_end,\n        annotsv_sv.Overlapped_CDS_length,\n\
        \        annotsv_sv.Overlapped_CDS_percent,\n        CAST(annotsv_sv.OMIM_ID AS VARCHAR) AS OMIM_ID,\n        annotsv_sv.OMIM_phenotype,\n        annotsv_sv.OMIM_inheritance,\n        annotsv_sv.GnomAD_pLI,\n\
