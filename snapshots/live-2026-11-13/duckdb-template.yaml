      source: ".open \"/mnt/output/{{=sprig.osBase(inputs.parameters['output-duckdb'])}}\"\nCREATE TABLE fusions_with_oncokb AS FROM read_json_auto('/mnt/input/fusions.json', format='array');\nCREATE VIEW\
