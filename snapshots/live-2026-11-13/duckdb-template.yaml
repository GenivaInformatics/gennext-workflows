        \    annotsv_ordered.CytoBand,\n    annotsv_ordered.Gene_name,\n    annotsv_ordered.Tx,\n    annotsv_ordered.Tx_start,\n    annotsv_ordered.Tx_end,\n    annotsv_ordered.Overlapped_CDS_length,\n\
        \    annotsv_ordered.Overlapped_CDS_percent,\n    annotsv_ordered.OMIM_ID,\n    annotsv_ordered.OMIM_phenotype,\n    annotsv_ordered.OMIM_inheritance,\n    annotsv_ordered.GnomAD_pLI,\n    annotsv_ordered.ExAC_pLI,\n\
        \    annotsv_ordered.ACMG_class,\n    oncokb_sv.Sv_Type AS \"ONCOKB_SV_TYPE\",\n    oncokb_sv.GeneA AS \"ONCOKB_GENE\",\n    oncokb_sv.MUTATION_EFFECT,\n    oncokb_sv.MUTATION_EFFECT_CITATIONS,\n\
        \    oncokb_sv.ONCOGENIC,\n    oncokb_sv.GENE_IN_ONCOKB,\n    oncokb_sv.VARIANT_IN_ONCOKB,\n    oncokb_sv.LEVEL_1,\n    oncokb_sv.LEVEL_2,\n    oncokb_sv.LEVEL_3A,\n    oncokb_sv.LEVEL_3B,\n   \
        \ oncokb_sv.LEVEL_4,\n    oncokb_sv.LEVEL_R1,\n    oncokb_sv.LEVEL_R2,\n    oncokb_sv.HIGHEST_LEVEL,\n    oncokb_sv.HIGHEST_SENSITIVE_LEVEL,\n    oncokb_sv.HIGHEST_RESISTANCE_LEVEL,\n    CAST(oncokb_sv.TX_CITATIONS\
        \ AS VARCHAR) AS TX_CITATIONS,\n    oncokb_sv.LEVEL_Dx1,\n    oncokb_sv.LEVEL_Dx2,\n    oncokb_sv.LEVEL_Dx3,\n    oncokb_sv.HIGHEST_DX_LEVEL,\n    CAST(oncokb_sv.DX_CITATIONS AS VARCHAR) AS DX_CITATIONS,\n\
        \    oncokb_sv.LEVEL_Px1,\n    oncokb_sv.LEVEL_Px2,\n    oncokb_sv.LEVEL_Px3,\n    oncokb_sv.HIGHEST_PX_LEVEL,\n    CAST(oncokb_sv.PX_CITATIONS AS VARCHAR) AS PX_CITATIONS\nFROM\n    annotsv_ordered\n\
        LEFT JOIN oncokb_sv ON annotsv_ordered.AnnotSV_ID = oncokb_sv.AnnotSV_ID\nAND annotsv_ordered.Gene_name = oncokb_sv.GeneA\nORDER BY annotsv_ordered.row_id;  -- Reorder using the original row order;\n\
        CREATE VIEW advanced_combined_sv AS\nSELECT\n    annotsv_sv.SV_chrom,\n    annotsv_sv.SV_start,\n    annotsv_sv.SV_end,\n    annotsv_sv.SV_length,\n    annotsv_sv.SV_type,\n    annotsv_sv.Paired_Reads,\n\
        \    annotsv_sv.Split_Reads,\n    annotsv_sv.Samples_ID,\n    annotsv_sv.ID,\n    annotsv_sv.REF,\n    annotsv_sv.ALT,\n    annotsv_sv.QUAL,\n    annotsv_sv.FILTER,\n    annotsv_sv.INFO,\n    annotsv_sv.FORMAT,\n\
        \    annotsv_sv.SAMPLE_DATA,\n    annotsv_sv.Annotation_mode,\n    annotsv_sv.CytoBand,\n    annotsv_sv.Gene_name,\n    annotsv_sv.Gene_count,\n    annotsv_sv.Tx,\n    annotsv_sv.Tx_start,\n   \
        \ annotsv_sv.Tx_end,\n    annotsv_sv.Overlapped_tx_length,\n    annotsv_sv.Overlapped_CDS_length,\n    annotsv_sv.Overlapped_CDS_percent,\n    annotsv_sv.Frameshift,\n    annotsv_sv.Exon_count,\n\
        \    annotsv_sv.Location,\n    annotsv_sv.Location2,\n    annotsv_sv.Dist_nearest_SS,\n    annotsv_sv.Intersect_start,\n    annotsv_sv.Intersect_end,\n    annotsv_sv.RE_gene,\n    annotsv_sv.P_gain_phen,\n\
        \    annotsv_sv.P_gain_hpo,\n    annotsv_sv.P_gain_source,\n    annotsv_sv.P_gain_coord,\n    annotsv_sv.P_loss_phen,\n    annotsv_sv.P_loss_hpo,\n    annotsv_sv.P_loss_source,\n    annotsv_sv.P_loss_coord,\n\
